,["用意","ようい","准备"],["構成","こうせい","构成"],["避難場所","ひなんばしょ","避难场所"],["防災訓練","ぼうさいくんれん","防灾演练"],["顔見知り","かおみしり","熟人"],["防ぐ","ふせぐ","防止"],["憂い","うれい","忧虑"]],"short":"防災","lv":2,"sum":"地震大国日本，家庭和个人平时该做哪些防灾准备。"},
{"title":"部活動(ぶかつどう)の今(いま)","paras":[{"jp":"日本(にほん)の中学校(ちゅうがっこう)や高校(こうこう)では、{{0:放課後(ほうかご)}}に{{1:部活動(ぶかつどう)}}を行(おこな)うのが一般的(いっぱんてき)だ。野球(やきゅう)やサッカー[[と言(い)った]]運動部(うんどうぶ)の他(ほか)、吹奏楽部(すいそうがくぶ)や美術部(びじゅつぶ)等(など)の文化部(ぶんかぶ)も有(あ)り、多(おお)くの生徒(せいと)が三年間(さんねんかん)[[に亘(わた)って]]活動(かつどう)を続(つづ)ける。","zh":"在日本的初中和高中，放学后参加社团活动很普遍。除了棒球、足球这类运动社团，还有管乐、美术等文化社团，很多学生会坚持活动整整三年。"},{"jp":"部活動(ぶかつどう)は、日本(にほん)の学校文化(がっこうぶんか)その物(もの)だ[[と言(い)っても過言(かごん)ではない]]。{{3:仲間(なかま)}}と一(ひと)つの目標(もくひょう)に向(む)かって努力(どりょく)する経験(けいけん)[[を通(つう)じて]]、{{4:協調性(きょうちょうせい)}}や{{5:忍耐力(にんたいりょく)}}が身(み)に付(つ)くと考(かんが)えられて来(き)た。","zh":"说社团活动就是日本学校文化本身，也毫不夸张。人们一直认为，通过和伙伴朝着同一个目标努力的经历，可以培养协作精神和忍耐力。"},{"jp":"然(しか)し、良(よ)い面(めん)が有(あ)る[[反面(はんめん)]]、問題(もんだい)も指摘(してき)されて居(い)る。{{6:強豪校(きょうごうこう)}}では、平日(へいじつ)は夜(よる)遅(おそ)く迄(まで)、休日(きゅうじつ)も朝(あさ)から夕方(ゆうがた)迄(まで)練習(れんしゅう)する事(こと)も珍(めずら)しくない。生徒(せいと)は何時(いつ)も疲(つか)れ[[気味(ぎみ)]]で、授業中(じゅぎょうちゅう)に{{7:居眠(いねむ)り}}をしたり、勉強(べんきょう)が{{8:疎(おろそ)か}}に成(な)ったりする。","zh":"但是，社团活动有好的一面，另一方面也被指出存在问题。在一些强校，平日练到深夜、休息日从早练到傍晚也不稀奇。学生们总是有点疲惫，上课打瞌睡，学习也被耽误了。"},{"jp":"教師(きょうし)の負担(ふたん)も大(おお)きい。部活動(ぶかつどう)の指導(しどう)は、多(おお)くの場合(ばあい)、略(ほぼ){{9:無償(むしょう)}}のボランティア[[に過(す)ぎない]]。土日(どにち)も試合(しあい)の{{10:引率(いんそつ)}}で休(やす)めず、教師(きょうし)の長時間労働(ちょうじかんろうどう)は深刻(しんこく)に成(な)る[[一方(いっぽう)だ]]。経験(けいけん)の無(な)い競技(きょうぎ)の{{11:顧問(こもん)}}を任(まか)され、困(こま)り果(は)てる先生(せんせい)も居(い)る。","zh":"教师的负担也很重。指导社团活动，很多时候几乎只是无偿的志愿劳动。周末也要带队参加比赛，没法休息，教师长时间劳动的问题越来越严重。还有老师被安排担任自己毫无经验的项目的顾问，十分为难。"},{"jp":"こうした状況(じょうきょう)[[に対(たい)して]]、国(くに)は休日(きゅうじつ)の部活動(ぶかつどう)を地域(ちいき)に任(まか)せる{{12:改革(かいかく)}}を進(すす)めて居(い)る。地域(ちいき)のスポーツクラブの専門家(せんもんか)が教(おし)える事(こと)で、生徒(せいと)はより質(しつ)の高(たか)い指導(しどう)を受(う)けられ、教師(きょうし)の負担(ふたん)も減(へ)らせる筈(はず)だ。","zh":"针对这种情况，国家正在推进把休息日的社团活动交给社区的改革。由社区体育俱乐部的专业人士来教，学生能得到更高质量的指导，教师的负担也能减轻。"},{"jp":"[[とは言(い)え]]、全(すべ)てが順調(じゅんちょう)に進(すす)んで居(い)る[[訳(わけ)ではない]]。地方(ちほう)では指導者(しどうしゃ)が足(た)りず、費用(ひよう)を誰(だれ)が負担(ふたん)するのかと言(い)う問題(もんだい)も残(のこ)って居(い)る。","zh":"话虽如此，并不是一切都进展顺利。地方上指导者不够，由谁来负担费用的问题也还没有解决。"},{"jp":"私(わたし)は高校時代(こうこうじだい)、{{13:陸上部(りくじょうぶ)}}で毎日(まいにち)走(はし)りっ[[放(ぱな)し]]だった。辛(つら)い練習(れんしゅう)の連続(れんぞく)だったが、仲間(なかま)と過(す)ごした時間(じかん)を思(おも)い出(だ)すと、今(いま)でも胸(むね)が熱(あつ)く成(な)ら[[ずにはいられない]]。大切(たいせつ)なのは部活動(ぶかつどう)を無(な)くす事(こと)ではなく、生徒(せいと)も教師(きょうし)も無理(むり)なく続(つづ)けられる形(かたち)に変(か)えて行(い)く事(こと)だろう。","zh":"高中时我在田径队，每天都在不停地跑。虽然是一场接一场的艰苦训练，但一想起和伙伴们度过的时光，至今仍不由得心头一热。重要的不是取消社团活动，而是把它变成学生和老师都能轻松坚持下去的形式吧。"}],"grammar":[["〜と言(い)った","……之类的（列举）","テニスやゴルフ[[と言(い)った]]スポーツが趣味(しゅみ)だ。","我的爱好是网球、高尔夫之类的运动。","地震(じしん)や台風(たいふう)[[と言(い)った]]自然災害(しぜんさいがい)に備(そな)える。","防备地震、台风之类的自然灾害。"],["〜に亘(わた)って","长达……，在……范围内","工事(こうじ)は三年間(さんねんかん)[[に亘(わた)って]]行(おこな)われた。","工程持续进行了三年。","広(ひろ)い範囲(はんい)[[に亘(わた)って]]、停電(ていでん)が発生(はっせい)した。","大范围发生了停电。"],["〜と言(い)っても過言(かごん)ではない","说……也不为过","彼(かれ)は日本一(にほんいち)の料理人(りょうりにん)だ[[と言(い)っても過言(かごん)ではない]]。","说他是日本第一厨师也不为过。","この本(ほん)が私(わたし)の人生(じんせい)を変(か)えた[[と言(い)っても過言(かごん)ではない]]。","说这本书改变了我的人生，也不为过。"],["〜を通(つう)じて","通过……","ボランティア活動(かつどう)[[を通(つう)じて]]、多(おお)くの友人(ゆうじん)が出来(でき)た。","通过志愿活动，交到了很多朋友。","秘書(ひしょ)[[を通(つう)じて]]、社長(しゃちょう)に面会(めんかい)を申(もう)し込(こ)んだ。","通过秘书申请面见社长。"],["〜反面(はんめん)","另一方面……","インターネットは便利(べんり)な[[反面(はんめん)]]、危険(きけん)も多(おお)い。","互联网很方便，另一方面也有很多危险。","一人(ひとり)暮(ぐ)らしは自由(じゆう)な[[反面(はんめん)]]、寂(さび)しい事(こと)も有(あ)る。","一个人生活很自由，但另一方面也会觉得寂寞。"],["〜気味(ぎみ)","有点……","風邪(かぜ)[[気味(ぎみ)]]なので、今日(きょう)は早(はや)く寝(ね)ます。","有点感冒，今天早点睡。","最近(さいきん)、仕事(しごと)が遅(おく)れ[[気味(ぎみ)]]だ。","最近工作有点落后。"],["〜に過(す)ぎない","只不过是……","今(いま)の話(はなし)は、私(わたし)の想像(そうぞう)[[に過(す)ぎない]]。","刚才说的只不过是我的想象。","合格者(ごうかくしゃ)は全体(ぜんたい)の一割(いちわり)[[に過(す)ぎない]]。","合格的人只占全体的一成。"],["〜一方(いっぽう)だ","越来越……","最近(さいきん)、仕事(しごと)が増(ふ)える[[一方(いっぽう)だ]]。","最近工作越来越多。","人口(じんこう)が減(へ)り、町(まち)は寂(さび)れる[[一方(いっぽう)だ]]。","人口减少，镇子越来越萧条。"],["〜に対(たい)して","对……；与……相对","彼(かれ)の意見(いけん)[[に対(たい)して]]、反対(はんたい)する人(ひと)は居(い)なかった。","对他的意见，没有人反对。","都会(とかい)の人口(じんこう)が増(ふ)えるの[[に対(たい)して]]、農村(のうそん)の人口(じんこう)は減(へ)って居(い)る。","城市人口在增加，农村人口却在减少。"],["とは言(い)え","虽说……但是","冬(ふゆ)だ[[とは言(い)え]]、今日(きょう)は暖(あたた)かい。","虽说是冬天，今天却很暖和。","仕事(しごと)が忙(いそが)しい[[とは言(い)え]]、家族(かぞく)との時間(じかん)も大切(たいせつ)にしたい。","虽说工作很忙，也想珍惜和家人在一起的时间。"],["〜訳(わけ)ではない","并不是……","料理(りょうり)が出来(でき)ない[[訳(わけ)ではない]]が、忙(いそが)しくて作(つく)る時間(じかん)が無(な)い。","并不是不会做饭，只是忙得没时间做。","値段(ねだん)が高(たか)い物(もの)が必(かなら)ずしも良(よ)い[[訳(わけ)ではない]]。","价格贵的东西并不一定就好。"],["〜っ放(ぱな)し","一直……；……着不管","電気(でんき)を点(つ)けっ[[放(ぱな)し]]にしないで下(くだ)さい。","请不要一直开着灯。","彼(かれ)には負(ま)けっ[[放(ぱな)し]]だ。","我一直输给他。"],["〜ずにはいられない","忍不住……，不由得……","その話(はなし)を聞(き)いて、笑(わら)わ[[ずにはいられなかった]]。","听了那件事，忍不住笑了。","彼(かれ)の努力(どりょく)には、感心(かんしん)せ[[ずにはいられない]]。","对他的努力，不由得心生钦佩。"]],"vocab":[["放課後","ほうかご","放学后"],["部活動","ぶかつどう","社团活动"],["吹奏楽","すいそうがく","管乐"],["仲間","なかま","伙伴"],["協調性","きょうちょうせい","协作精神"],["忍耐力","にんたいりょく","忍耐力"],["強豪校","きょうごうこう","强校"],["居眠り","いねむり","打瞌睡"],["疎か","おろそか","疏忽，马虎"],["無償","むしょう","无偿"],["引率","いんそつ","带队"],["顧問","こもん","顾问"],["改革","かいかく","改革"],["陸上部","りくじょうぶ","田径队"]],"short":"部活動","lv":2,"sum":"日本学校的社团活动：培养了什么，又给学生和老师带来了什么负担。"},
{"title":"キャッシュレス社会(しゃかい)","paras":[{"jp":"最近(さいきん)、日本(にほん)でも現金(げんきん)を使(つか)わずに買(か)い物(もの)をする人(ひと)が増(ふ)えて居(い)る。クレジットカード[[を始(はじ)め]]、{{0:交通系(こうつうけい)}}ICカードやスマホ{{1:決済(けっさい)}}等(など)、支払(しはら)い方法(ほうほう)は様々(さまざま)だ。","zh":"最近在日本，不用现金购物的人也越来越多。以信用卡为首，还有交通IC卡、手机支付等，付款方式多种多样。"},{"jp":"以前(いぜん)の日本(にほん)は「現金大国(げんきんたいこく)」と呼(よ)ばれ、小(ちい)さな店(みせ)では現金(げんきん)しか使(つか)えない事(こと)も多(おお)かった。然(しか)し、スマホの普及(ふきゅう)[[に従(したが)って]]、キャッシュレス決済(けっさい)は[[次第(しだい)に]]広(ひろ)がって行(い)った。政府(せいふ)がポイント{{2:還元(かんげん)}}を行(おこな)った事(こと)[[に加(くわ)えて]]、感染症(かんせんしょう)の流行(りゅうこう)で現金(げんきん)に触(ふ)れたくないと考(かんが)える人(ひと)が増(ふ)えた事(こと)も大(おお)きい。","zh":"以前日本被称为\"现金大国\"，小店往往只能用现金。但是，随着智能手机的普及，无现金支付逐渐推广开来。除了政府实行积分返还之外，传染病流行导致不想接触现金的人增加，也是一个很大的原因。"},{"jp":"店(みせ)の側(がわ)[[からすると]]、レジ締(じ)めの時間(じかん)が短(みじか)く成(な)り、{{3:釣(つ)り銭(せん)}}の用意(ようい)も要(い)らなく成(な)る。利用者(りようしゃ)に取(と)っても、財布(さいふ)を{{4:持(も)ち歩(ある)}}かずに済(す)むのは楽(らく)だ。予想(よそう)して居(い)た[[以上(いじょう)に]]便利(べんり)だと感(かん)じて居(い)る人(ひと)が多(おお)いだろう。","zh":"从店家的角度看，结账时间缩短了，也不用准备找零。对使用者来说，不用随身带钱包也很轻松。很多人大概都觉得比预想的还要方便吧。"},{"jp":"特(とく)に{{5:都市部(としぶ)}}[[に於(お)いては]]、若者(わかもの)[[を中心(ちゅうしん)に]]、現金(げんきん)を殆(ほとん)ど持(も)たない人(ひと)も珍(めずら)しくない。{{6:自動販売機(じどうはんばいき)}}や病院(びょういん)の{{7:会計(かいけい)}}でも、現金(げんきん)[[に代(か)わって]]スマホで支払(しはら)える所(ところ)が増(ふ)えて来(き)た。","zh":"特别是在城市里，以年轻人为主，几乎不带现金的人也不稀奇。自动售货机、医院结账处等，能用手机代替现金支付的地方也越来越多了。"},{"jp":"然(しか)し、便利(べんり)な物(もの)が誰(だれ)に取(と)っても使(つか)い易(やす)い[[とは限(かぎ)らない]]。スマホの操作(そうさ)に慣(な)れない高齢者(こうれいしゃ)の中(なか)には、店(みせ)で{{8:戸惑(とまど)}}い、結局(けっきょく)現金(げんきん)で払(はら)わ[[ざるを得(え)ない]]人(ひと)も居(い)る。","zh":"但是，方便的东西不一定对每个人都好用。不习惯操作手机的老年人中，也有人在店里不知所措，最后只好用现金付款。"},{"jp":"又(また)、{{9:個人情報(こじんじょうほう)}}の管理(かんり)[[に関(かん)して]]不安(ふあん)を感(かん)じる人(ひと)も少(すく)なくない。スマホを落(お)としたり、{{10:不正利用(ふせいりよう)}}されたりする危険(きけん)も有(あ)る。安全(あんぜん)が十分(じゅうぶん)に{{11:保証(ほしょう)}}され[[ない限(かぎ)り]]キャッシュレスは使(つか)わない、と言(い)う人(ひと)の気持(きも)ちも{{12:理解(りかい)}}出来(でき)る。","zh":"另外，对个人信息管理感到不安的人也不少。还有手机丢失、被盗刷等危险。有人说\"只要安全得不到充分保障，就不用无现金支付\"，这种心情也可以理解。"},{"jp":"大切(たいせつ)なのは、現金(げんきん)とキャッシュレスのどちらかを選(えら)ぶ事(こと)ではなく、誰(だれ)もが自分(じぶん)に合(あ)った方法(ほうほう)で支払(しはら)える社会(しゃかい)を作(つく)る事(こと)だろう。便利(べんり)さと安心(あんしん)、その{{13:両方(りょうほう)}}を大切(たいせつ)にしたい物(もの)だ。","zh":"重要的不是在现金和无现金之间二选一，而是建立一个每个人都能用适合自己的方式付款的社会。便利和安心，两者都应该珍惜。"}],"grammar":[["〜を始(はじ)め","以……为首","寿司(すし)[[を始(はじ)め]]、和食(わしょく)は海外(かいがい)でも人気(にんき)が有(あ)る。","以寿司为首，日本料理在海外也很受欢迎。","校長(こうちょう)[[を始(はじ)め]]、多(おお)くの先生方(せんせいがた)が卒業式(そつぎょうしき)に出席(しゅっせき)した。","以校长为首，很多老师出席了毕业典礼。"],["〜に従(したが)って","随着……；按照……","年(とし)を取(と)る[[に従(したが)って]]、物忘(ものわす)れが多(おお)く成(な)った。","随着年龄增长，越来越健忘了。","先生(せんせい)の指示(しじ)[[に従(したが)って]]、実験(じっけん)を進(すす)めた。","按照老师的指示进行了实验。"],["次第(しだい)に","逐渐","空(そら)が[[次第(しだい)に]]明(あか)るく成(な)って来(き)た。","天空渐渐亮了起来。","日本(にほん)の生活(せいかつ)にも[[次第(しだい)に]]慣(な)れて来(き)た。","渐渐习惯了日本的生活。"],["〜に加(くわ)えて","加上……，除……之外还","物価(ぶっか)の上昇(じょうしょう)[[に加(くわ)えて]]、税金(ぜいきん)も上(あ)がった。","物价上涨之外，税也涨了。","昼間(ひるま)の仕事(しごと)[[に加(くわ)えて]]、夜(よる)はアルバイトもして居(い)る。","除了白天的工作，晚上还在打工。"],["〜からすると","从……来看","彼(かれ)の態度(たいど)[[からすると]]、怒(おこ)って居(い)るらしい。","从他的态度来看，好像生气了。","親(おや)[[からすると]]、子供(こども)の将来(しょうらい)が一番(いちばん)心配(しんぱい)だ。","在父母看来，孩子的将来是最让人担心的。"],["〜以上(いじょう)に","比……更加","日本(にほん)の夏(なつ)は、想像(そうぞう)して居(い)た[[以上(いじょう)に]]蒸(む)し暑(あつ)かった。","日本的夏天比我想象的还要闷热。","彼(かれ)は前回(ぜんかい)[[以上(いじょう)に]]良(よ)い成績(せいせき)を取(と)った。","他取得了比上次更好的成绩。"],["〜に於(お)いては","在……方面；在……（场合）","現代(げんだい)[[に於(お)いては]]、英語(えいご)が話(はな)せる事(こと)は大(おお)きな強(つよ)みだ。","在现代，会说英语是很大的优势。","この点(てん)[[に於(お)いては]]、私(わたし)も彼(かれ)と同(おな)じ意見(いけん)だ。","在这一点上，我和他意见相同。"],["〜を中心(ちゅうしん)に","以……为中心","この町(まち)は駅(えき)[[を中心(ちゅうしん)に]]発展(はってん)して来(き)た。","这个镇子以车站为中心发展起来。","今回(こんかい)の会議(かいぎ)では、予算(よさん)の問題(もんだい)[[を中心(ちゅうしん)に]]話(はな)し合(あ)った。","这次会议以预算问题为中心进行了讨论。"],["〜に代(か)わって","代替……","父(ちち)[[に代(か)わって]]、私(わたし)が挨拶(あいさつ)をした。","我代替父亲致了辞。","最近(さいきん)は人間(にんげん)[[に代(か)わって]]、ロボットが働(はたら)く工場(こうじょう)も多(おお)い。","最近由机器人代替人工作的工厂也很多。"],["〜とは限(かぎ)らない","未必……","有名(ゆうめい)な店(みせ)が美味(おい)しい[[とは限(かぎ)らない]]。","有名的店不一定好吃。","先生(せんせい)の言(い)う事(こと)が何時(いつ)も正(ただ)しい[[とは限(かぎ)らない]]。","老师说的话不一定总是对的。"],["〜ざるを得(え)ない","不得不……","体調(たいちょう)が悪(わる)いので、旅行(りょこう)を諦(あきら)め[[ざるを得(え)ない]]。","身体不舒服，只好放弃旅行。","終電(しゅうでん)を逃(のが)したので、タクシーで帰(かえ)ら[[ざるを得(え)なかった]]。","错过了末班车，只好打车回去。"],["〜に関(かん)して","关于……","新(あたら)しい制度(せいど)[[に関(かん)して]]、説明会(せつめいかい)が開(ひら)かれた。","关于新制度召开了说明会。","この問題(もんだい)[[に関(かん)して]]は、専門家(せんもんか)の意見(いけん)を聞(き)く可(べ)きだ。","关于这个问题，应该听听专家的意见。"],["〜ない限(かぎ)り","只要不……就（不）……","本人(ほんにん)が望(のぞ)ま[[ない限(かぎ)り]]、無理(むり)に勧(すす)める可(べ)きではない。","只要本人不愿意，就不应该强行劝说。","事前(じぜん)に連絡(れんらく)し[[ない限(かぎ)り]]、欠席(けっせき)は認(みと)められない。","只要不事先联系，缺席就不被认可。"]],"vocab":[["交通系","こうつうけい","交通类"],["決済","けっさい","结算，支付"],["還元","かんげん","返还"],["釣り銭","つりせん","找零"],["持ち歩く","もちあるく","随身携带"],["都市部","としぶ","城市地区"],["自動販売機","じどうはんばいき","自动售货机"],["会計","かいけい","结账"],["戸惑う","とまどう","不知所措"],["個人情報","こじんじょうほう","个人信息"],["不正利用","ふせいりよう","盗用，冒用"],["保証","ほしょう","保证"],["理解","りかい","理解"],["両方","りょうほう","双方，两者"]],"short":"キャッシュレス","lv":2,"sum":"日本从\"现金大国\"走向无现金支付：便利在哪里，又给谁带来了困扰。"},
{"title":"リモートワークは定着(ていちゃく)するか","short":"リモートワーク","lv":3,"sum":"不用通勤的自由与看不见的孤独，议论文风格，接近 N2 读解长文。","paras":[{"jp":"{{0:感染症(かんせんしょう)}}の流行(りゅうこう)[[を契機(けいき)に]]、日本(にほん)でもリモートワークが{{1:急速(きゅうそく)}}に広(ひろ)まった。それ迄(まで)「会社(かいしゃ)に行(い)く事(こと)[[こそ]]仕事(しごと)だ」と考(かんが)えて居(い)た人(ひと)に取(と)って、大(おお)きな変化(へんか)だったと言(い)えるだろう。","zh":"以传染病流行为契机，远程办公在日本也迅速普及。对那些一直认为\"去公司才算工作\"的人来说，可以说是很大的变化。"},{"jp":"リモートワークの{{2:利点(りてん)}}として先(ま)ず挙(あ)げられるのは、通勤(つうきん)時間(じかん)が無(な)く成(な)る事(こと)だ。{{3:満員(まんいん)電車(でんしゃ)}}に一時間(いちじかん)以上(いじょう)揺(ゆ)られる[[位(くらい)なら]]、その時間(じかん)を家族(かぞく)や自分(じぶん)の勉強(べんきょう)に使(つか)いたいと言(い)うのが、多(おお)くの人(ひと)の{{4:本音(ほんね)}}だろう。","zh":"远程办公的优点，首先要提的是不用通勤。与其在满员电车里摇晃一个多小时，不如把这些时间用在家人或自己的学习上——这大概是很多人的真心话。"},{"jp":"[[然(しか)しながら]]、良(よ)い事(こと)許(ばか)り[[とは限(かぎ)らない]]。{{5:同僚(どうりょう)}}と顔(かお)を合(あ)わせる機会(きかい)が減(へ)った[[所為(せい)で]]、{{6:孤独(こどく)}}を感(かん)じる人(ひと)も少(すく)なくない。又(また)、仕事(しごと)と私生活(しせいかつ)の{{7:境目(さかいめ)}}が{{8:曖昧(あいまい)}}に成(な)り、夜(よる)遅(おそ)く迄(まで)パソコンに向(む)かい[[勝(が)ちだ]]と言(い)う声(こえ)も有(あ)る。","zh":"然而，并不全是好事。由于和同事见面的机会少了，感到孤独的人不在少数。另外，也有人说工作和私生活的界限变得模糊，容易对着电脑工作到深夜。"},{"jp":"企業(きぎょう)側(がわ)[[からすると]]、社員(しゃいん)の{{9:働(はたら)き振(ぶ)り}}が見(み)え難(にく)い[[丈(だけ)に]]、評価(ひょうか)の方法(ほうほう)を見直(みなお)さ[[ない訳(わけ)には行(い)かない]]。勤務(きんむ)時間(じかん)の長(なが)さではなく、{{10:成果(せいか)}}で判断(はんだん)する仕組(しく)みが求(もと)められて居(い)る。","zh":"从企业的角度来看，正因为很难看到员工的工作状态，所以不得不重新考虑评价方法。现在需要的是不看工作时长、而以成果来判断的机制。"},{"jp":"こうした中(なか)、最近(さいきん)は出社(しゅっしゃ)と{{11:在宅(ざいたく)}}を組(く)み合(あ)わせた「ハイブリッド型(がた)」を{{12:導入(どうにゅう)}}する企業(きぎょう)が増(ふ)えて居(い)る。週(しゅう)に二日(ふつか)は会社(かいしゃ)で打(う)ち合(あ)わせを行(おこな)い、残(のこ)りは自宅(じたく)で集中(しゅうちゅう)して作業(さぎょう)する[[と言(い)う様(よう)に]]、仕事(しごと)の内容(ないよう)[[に応(おう)じて]]場所(ばしょ)を選(えら)ぶ[[訳(わけ)だ]]。","zh":"在这种情况下，最近引入把到公司上班和居家办公结合起来的\"混合型\"的企业越来越多。比如一周两天在公司开会，其余时间在家集中做事，也就是根据工作内容来选择地点。"},{"jp":"結局(けっきょく)の所(ところ)、どちらが優(すぐ)れて居(い)る[[かと言(い)うと]]、{{13:一概(いちがい)に}}は言(い)えない。大切(たいせつ)なのは、働(はたら)く場所(ばしょ)[[に拘(かか)わらず]]、成果(せいか)を{{14:正当(せいとう)}}に評価(ひょうか)する仕組(しく)みを作(つく)る事(こと)ではないだろうか。","zh":"说到底，要问哪种方式更好，是不能一概而论的。重要的难道不是无论在哪里工作，都能建立起公正评价成果的机制吗？"}],"grammar":[["〜を契機(けいき)に","以……为契机（书面）","結婚(けっこん)[[を契機(けいき)に]]、煙草(たばこ)を止(や)めた。","以结婚为契机，戒了烟。","オリンピック[[を契機(けいき)に]]、街(まち)の交通(こうつう)が整備(せいび)された。","借奥运会的契机，城市交通得到了完善。"],["〜こそ","正是……，才是……","今年(ことし)[[こそ]]、N2に合格(ごうかく)して見(み)せる。","今年一定要考过N2给大家看。","失敗(しっぱい)した時(とき)[[こそ]]、冷静(れいせい)に成(な)る事(こと)が大切(たいせつ)だ。","正是失败的时候，保持冷静才最重要。"],["〜位(くらい)なら","与其……不如","あんな会社(かいしゃ)で働(はたら)く[[位(くらい)なら]]、自分(じぶん)で起業(きぎょう)した方(ほう)が良(い)い。","与其在那种公司上班，不如自己创业。","途中(とちゅう)で止(や)める[[位(くらい)なら]]、最初(さいしょ)から始(はじ)めない方(ほう)が良(い)い。","与其半途而废，不如一开始就别做。"],["然(しか)しながら","然而（书面）","計画(けいかく)は順調(じゅんちょう)に進(すす)んで居(い)た。[[然(しか)しながら]]、予算(よさん)の問題(もんだい)が発生(はっせい)した。","计划进展顺利。然而，出现了预算问题。","彼(かれ)の意見(いけん)には一理(いちり)有(あ)る。[[然(しか)しながら]]、全面的(ぜんめんてき)には賛成(さんせい)出来(でき)ない。","他的意见有一定道理。然而，我无法完全赞成。"],["〜とは限(かぎ)らない","未必……","値段(ねだん)が高(たか)い物(もの)が必(かなら)ずしも良(よ)い[[とは限(かぎ)らない]]。","价格贵的东西未必就好。","日本人(にほんじん)だからと言(い)って、敬語(けいご)が上手(じょうず)だ[[とは限(かぎ)らない]]。","虽说是日本人，也未必敬语就说得好。"],["〜所為(せい)で","都怪……，由于……（坏结果）","寝坊(ねぼう)した[[所為(せい)で]]、電車(でんしゃ)に乗(の)り遅(おく)れた。","都怪睡过头，没赶上电车。","台風(たいふう)の[[所為(せい)で]]、飛行機(ひこうき)が欠航(けっこう)に成(な)った。","因为台风，航班取消了。"],["〜勝(が)ちだ","容易……，往往……","冬(ふゆ)は運動(うんどう)不足(ぶそく)に成(な)り[[勝(が)ちだ]]。","冬天容易运动不足。","忙(いそが)しいと、食事(しょくじ)が不規則(ふきそく)に成(な)り[[勝(が)ちだ]]。","一忙起来，吃饭就容易不规律。"],["〜からすると","从……来看","彼(かれ)の話(はな)し方(かた)[[からすると]]、関西(かんさい)出身(しゅっしん)だろう。","从他的说话方式来看，应该是关西人。","親(おや)[[からすると]]、子供(こども)は何時(いつ)迄(まで)も子供(こども)だ。","在父母看来，孩子永远是孩子。"],["〜丈(だけ)に","正因为……","一生(いっしょう)懸命(けんめい)準備(じゅんび)した[[丈(だけ)に]]、落(お)ちた時(とき)のショックは大(おお)きかった。","正因为拼命准备过，落榜时的打击才特别大。","彼(かれ)は日本(にほん)に十年(じゅうねん)住(す)んで居(い)た[[丈(だけ)に]]、日本(にほん)の事情(じじょう)に詳(くわ)しい。","正因为在日本住了十年，他对日本的情况很了解。"],["〜ない訳(わけ)には行(い)かない","不能不……","明日(あした)は大事(だいじ)な会議(かいぎ)が有(あ)るから、出社(しゅっしゃ)し[[ない訳(わけ)には行(い)かない]]。","明天有重要的会，不能不去公司。","親友(しんゆう)の結婚式(けっこんしき)だから、出席(しゅっせき)し[[ない訳(わけ)には行(い)かない]]。","是好朋友的婚礼，不能不去。"],["〜と言(い)う様(よう)に","比如……这样","月曜(げつよう)は英語(えいご)、火曜(かよう)は数学(すうがく)[[と言(い)う様(よう)に]]、毎日(まいにち)科目(かもく)を決(き)めて勉強(べんきょう)して居(い)る。","比如周一英语、周二数学，每天定好科目来学习。","朝(あさ)はパン、夜(よる)は御(ご)飯(はん)[[と言(い)う様(よう)に]]、食事(しょくじ)のパターンが決(き)まって居(い)る。","早上面包、晚上米饭，吃饭的模式是固定的。"],["〜に応(おう)じて","根据……，按照……","料金(りょうきん)は利用(りよう)時間(じかん)[[に応(おう)じて]]変(か)わります。","费用根据使用时间而变化。","御(お)客様(きゃくさま)の要望(ようぼう)[[に応(おう)じて]]、メニューを変更(へんこう)出来(でき)ます。","可以根据顾客的要求更改菜单。"],["〜訳(わけ)だ","也就是说……；怪不得","一日(いちにち)十時間(じゅうじかん)も働(はたら)いて居(い)るのか。疲(つか)れる[[訳(わけ)だ]]。","一天工作十个小时啊，怪不得会累。","時給(じきゅう)千円(せんえん)で五時間(ごじかん)働(はたら)けば、五千円(ごせんえん)貰(もら)える[[訳(わけ)だ]]。","时薪一千日元，干五个小时，也就是能拿到五千日元。"],["〜かと言(い)うと","要说……的话","何故(なぜ)遅刻(ちこく)したの[[かと言(い)うと]]、電車(でんしゃ)が止(と)まったからだ。","要说为什么迟到，是因为电车停了。","彼(かれ)が優秀(ゆうしゅう)[[かと言(い)うと]]、そうとも言(い)えない。","要说他优秀吧，也不能这么说。"],["〜に拘(かか)わらず","不论……","年齢(ねんれい)[[に拘(かか)わらず]]、誰(だれ)でも参加(さんか)出来(でき)ます。","不论年龄，谁都可以参加。","天候(てんこう)[[に拘(かか)わらず]]、試合(しあい)は予定(よてい)通(どお)り行(おこな)われます。","不论天气如何，比赛都会按计划举行。"]],"vocab":[["感染症","かんせんしょう","传染病"],["急速","きゅうそく","迅速"],["利点","りてん","优点"],["満員電車","まんいんでんしゃ","满员电车"],["本音","ほんね","真心话"],["同僚","どうりょう","同事"],["孤独","こどく","孤独"],["境目","さかいめ","界线"],["曖昧","あいまい","模糊"],["働き振り","はたらきぶり","工作表现"],["成果","せいか","成果"],["在宅","ざいたく","在家（办公）"],["導入","どうにゅう","引进，采用"],["一概に","いちがいに","一概"],["正当","せいとう","正当，公正"]]},
{"title":"少子化(しょうしか)と働(はたら)き方(かた)","paras":[{"jp":"日本(にほん)の{{0:出生数(しゅっしょうすう)}}は年々(ねんねん)減(へ)り続(つづ)け、昨年(さくねん)は過去最少(かこさいしょう)を{{1:更新(こうしん)}}した。少子化(しょうしか)は、[[言(い)わば]]日本(にほん)社会(しゃかい)全体(ぜんたい)が抱(かか)える{{2:慢性的(まんせいてき)}}な病(やまい)である。","zh":"日本的出生人数逐年减少，去年创下了历史新低。少子化可以说是整个日本社会患上的慢性病。"},{"jp":"少子化(しょうしか)の原因(げんいん)[[を巡(めぐ)って]]は、様々(さまざま)な議論(ぎろん)が有(あ)る。経済的(けいざいてき)な不安(ふあん)、結婚(けっこん)や出産(しゅっさん)に対(たい)する{{3:価値観(かちかん)}}の変化(へんか)、そして長時間労働(ちょうじかんろうどう)等(など)の働(はたら)き方(かた)の問題(もんだい)が、複雑(ふくざつ)に{{4:絡(から)み合(あ)}}って居(い)ると言(い)われる。","zh":"围绕少子化的原因，有着各种各样的讨论。据说经济上的不安、对结婚生育价值观的变化，以及长时间劳动等工作方式的问题，这些因素复杂地交织在一起。"},{"jp":"特(とく)に、女性(じょせい)の{{5:社会進出(しゃかいしんしゅつ)}}が進(すす)む[[に連(つ)れて]]、仕事(しごと)と子育(こそだ)ての{{6:両立(りょうりつ)}}の難(むずか)しさが{{7:浮(う)き彫(ぼ)り}}に成(な)って来(き)た。出産(しゅっさん)を機(き)に仕事(しごと)を辞(や)める女性(じょせい)は減(へ)り[[つつ有(あ)る]]物(もの)の、未(ま)だ少(すく)なくない。","zh":"特别是随着女性越来越多地走向社会，兼顾工作与育儿的难处日益凸显。因生育而辞职的女性虽然正在减少，但仍然不在少数。"},{"jp":"一方(いっぽう)、男性(だんせい)の{{8:育児休業(いくじきゅうぎょう)}}の取得率(しゅとくりつ)は近年(きんねん)上昇(じょうしょう)して居(い)る。法律(ほうりつ)の改正(かいせい)[[を契機(けいき)に]]、育休(いくきゅう)を取(と)り易(やす)い職場作(しょくばづく)りを進(すす)める企業(きぎょう)が増(ふ)えたのだ。[[その一方(いっぽう)で]]、「育休(いくきゅう)を取(と)ると{{9:出世(しゅっせ)}}に響(ひび)く」と感(かん)じて、取得(しゅとく)を諦(あきら)める男性(だんせい)も居(い)る。","zh":"另一方面，男性育儿假的取得率近年在上升。以法律修订为契机，致力于营造容易休育儿假的职场环境的企业增加了。但另一方面，也有男性觉得\"休育儿假会影响升职\"而放弃申请。"},{"jp":"{{10:管理職(かんりしょく)}}[[ともなると]]、責任(せきにん)の重(おも)さから、長期間(ちょうきかん)職場(しょくば)を離(はな)れる事(こと)は難(むずか)しい。休(やす)みを取(と)れば済(す)む[[と言(い)う物(もの)ではない]]のだ。仕事(しごと)を一人(ひとり)に任(まか)せず、チーム全体(ぜんたい)で{{11:分担(ぶんたん)}}する仕組(しく)みを作(つく)る[[事(こと)に依(よ)って]]、誰(だれ)かが休(やす)んでも業務(ぎょうむ)が回(まわ)る様(よう)に成(な)る。","zh":"一旦到了管理层，由于责任重大，很难长时间离开岗位。这不是请个假就能解决的。通过建立不把工作压在一个人身上、由整个团队分担的机制，即使有人休假，业务也能照常运转。"},{"jp":"或(あ)る企業(きぎょう)では、社員(しゃいん)アンケートの結果(けっか)[[に基(もと)づいて]]、在宅勤務(ざいたくきんむ)や短時間勤務(たんじかんきんむ)の制度(せいど)を整(ととの)えた。子供(こども)の送(おく)り迎(むか)えが有(あ)る日(ひ)は在宅(ざいたく)、会議(かいぎ)の日(ひ)は出社(しゅっしゃ)[[と言(い)う様(よう)に]]{{12:柔軟(じゅうなん)}}に働(はたら)ける様(よう)に成(な)った結果(けっか)、離職率(りしょくりつ)も下(さ)がったと言(い)う。","zh":"有家企业根据员工问卷调查的结果，完善了居家办公和短时工作制度。比如有接送孩子任务的日子在家办公，开会的日子去公司，员工能灵活工作之后，据说离职率也下降了。"},{"jp":"[[然(しか)しながら]]、こうした取(と)り組(く)みは、未(ま)だ一部(いちぶ)の大企業(だいきぎょう)に限(かぎ)られて居(い)る。中小企業(ちゅうしょうきぎょう)は人手(ひとで)が足(た)りない[[ながらも]]、何(なん)とか工夫(くふう)を重(かさ)ねて居(い)るのが現状(げんじょう)だ。","zh":"然而，这样的举措还仅限于部分大企业。中小企业虽然人手不足，也在想方设法不断摸索，这就是现状。"},{"jp":"少子化(しょうしか)は{{13:一朝一夕(いっちょういっせき)}}に解決(かいけつ)出来(でき)る問題(もんだい)ではない。時間(じかん)が掛(か)かる[[にせよ]]、子供(こども)を産(う)み育(そだ)てたいと願(ねが)う人(ひと)が、安心(あんしん)してその願(ねが)いを叶(かな)えられる社会(しゃかい)を作(つく)る事(こと)が、私達(わたしたち)に求(もと)められて居(い)る。","zh":"少子化不是一朝一夕就能解决的问题。即使需要时间，我们也必须建立一个让想生养孩子的人能够安心实现愿望的社会。"}],"grammar":[["言(い)わば","可以说，打个比方说","彼(かれ)はこのチームの、[[言(い)わば]]心臓(しんぞう)の様(よう)な存在(そんざい)だ。","他可以说是这个团队的心脏。","図書館(としょかん)は、[[言(い)わば]]知識(ちしき)の宝庫(ほうこ)だ。","图书馆可以说是知识的宝库。"],["〜を巡(めぐ)って","围绕……","土地(とち)の所有権(しょゆうけん)[[を巡(めぐ)って]]、裁判(さいばん)が続(つづ)いて居(い)る。","围绕土地所有权，官司一直在打。","新(あたら)しい法律(ほうりつ)[[を巡(めぐ)って]]、国会(こっかい)で激(はげ)しい議論(ぎろん)が行(おこな)われた。","围绕新法律，国会进行了激烈的辩论。"],["〜に連(つ)れて","随着……","夜(よる)が更(ふ)ける[[に連(つ)れて]]、気温(きおん)が下(さ)がって来(き)た。","随着夜深，气温下降了。","子供(こども)が成長(せいちょう)する[[に連(つ)れて]]、教育費(きょういくひ)も増(ふ)える。","随着孩子长大，教育费也会增加。"],["〜つつ有(あ)る","正在……（逐渐变化）","日本(にほん)の人口(じんこう)は減(へ)り[[つつ有(あ)る]]。","日本的人口正在减少。","新(あたら)しい技術(ぎじゅつ)が社会(しゃかい)を変(か)え[[つつ有(あ)る]]。","新技术正在改变社会。"],["〜を契機(けいき)に","以……为契机","入院(にゅういん)[[を契機(けいき)に]]、生活習慣(せいかつしゅうかん)を見直(みなお)した。","以住院为契机，重新审视了生活习惯。","震災(しんさい)[[を契機(けいき)に]]、防災(ぼうさい)への関心(かんしん)が高(たか)まった。","以地震灾害为契机，人们对防灾的关注提高了。"],["その一方(いっぽう)で","另一方面","技術(ぎじゅつ)は進歩(しんぽ)した。[[その一方(いっぽう)で]]、新(あたら)しい問題(もんだい)も生(う)まれた。","技术进步了。但另一方面，也产生了新的问题。","収入(しゅうにゅう)は増(ふ)えた。[[その一方(いっぽう)で]]、自由(じゆう)な時間(じかん)は減(へ)った。","收入增加了。另一方面，自由时间减少了。"],["〜ともなると","一旦到了……","社長(しゃちょう)[[ともなると]]、毎日(まいにち)会議(かいぎ)で忙(いそが)しい。","到了社长这个级别，每天都忙于开会。","十二月(じゅうにがつ)[[ともなると]]、町(まち)はクリスマスの飾(かざ)りで華(はな)やかに成(な)る。","一到十二月，街上就因圣诞装饰而热闹起来。"],["〜と言(い)う物(もの)ではない","并不是……","御(お)金(かね)さえ有(あ)れば幸(しあわ)せだ[[と言(い)う物(もの)ではない]]。","并不是只要有钱就幸福。","薬(くすり)は沢山(たくさん)飲(の)めば良(よ)く効(き)く[[と言(い)う物(もの)ではない]]。","药并不是吃得越多就越有效。"],["〜事(こと)に依(よ)って","通过……","運動(うんどう)を続(つづ)ける[[事(こと)に依(よ)って]]、体力(たいりょく)が付(つ)いた。","通过坚持运动，体力增强了。","話(はな)し合(あ)いを重(かさ)ねる[[事(こと)に依(よ)って]]、互(たが)いの理解(りかい)が深(ふか)まった。","通过反复沟通，加深了相互理解。"],["〜に基(もと)づいて","根据……","法律(ほうりつ)[[に基(もと)づいて]]、処分(しょぶん)が決(き)められた。","根据法律决定了处分。","データ[[に基(もと)づいて]]、来年(らいねん)の計画(けいかく)を立(た)てる。","根据数据制定明年的计划。"],["〜と言(い)う様(よう)に","比如……这样","平日(へいじつ)は仕事(しごと)、週末(しゅうまつ)は趣味(しゅみ)[[と言(い)う様(よう)に]]、メリハリの有(あ)る生活(せいかつ)をして居(い)る。","平时工作，周末搞爱好，生活张弛有度。","一階(いっかい)は店(みせ)、二階(にかい)は住居(じゅうきょ)[[と言(い)う様(よう)に]]使(つか)い分(わ)けて居(い)る。","一楼当店铺，二楼当住所，这样分开使用。"],["然(しか)しながら","然而（书面）","計画(けいかく)は素晴(すば)らしい。[[然(しか)しながら]]、実現(じつげん)は難(むずか)しいだろう。","计划很好。然而，实现起来恐怕很难。","彼(かれ)は才能(さいのう)に恵(めぐ)まれて居(い)る。[[然(しか)しながら]]、努力(どりょく)が足(た)りない。","他很有才华。然而，努力还不够。"],["〜ながらも","虽然……但是……","小(ちい)さい[[ながらも]]、この店(みせ)には常連客(じょうれんきゃく)が多(おお)い。","这家店虽然小，常客却很多。","彼女(かのじょ)は不安(ふあん)を感(かん)じ[[ながらも]]、一人(ひとり)で留学(りゅうがく)に出発(しゅっぱつ)した。","她虽然感到不安，还是一个人出发去留学了。"],["〜にせよ","即使……也；无论……","冗談(じょうだん)だった[[にせよ]]、彼(かれ)の言葉(ことば)は人(ひと)を傷付(きずつ)けた。","即使是开玩笑，他的话还是伤了人。","どんな結果(けっか)に成(な)る[[にせよ]]、最後(さいご)迄(まで)遣(や)り抜(ぬ)く積(つ)もりだ。","不管结果如何，我都打算坚持到底。"]],"vocab":[["出生数","しゅっしょうすう","出生人数"],["更新","こうしん","刷新，更新"],["慢性的","まんせいてき","慢性的"],["価値観","かちかん","价值观"],["絡み合う","からみあう","交织"],["社会進出","しゃかいしんしゅつ","（女性等）走向社会"],["両立","りょうりつ","兼顾"],["浮き彫り","うきぼり","凸显"],["育児休業","いくじきゅうぎょう","育儿假"],["出世","しゅっせ","升职，出人头地"],["管理職","かんりしょく","管理层"],["分担","ぶんたん","分担"],["柔軟","じゅうなん","灵活"],["一朝一夕","いっちょういっせき","一朝一夕"]],"short":"少子化","lv":3,"sum":"少子化背后的工作方式问题：育儿假、职场环境和企业的尝试，偏评论文。"},
{"title":"AIと仕事(しごと)の未来(みらい)","paras":[{"jp":"近年(きんねん)、{{0:人工知能(じんこうちのう)}}、{{1:即(すなわ)ち}}AIの技術(ぎじゅつ)が急速(きゅうそく)に進歩(しんぽ)して居(い)る。文章(ぶんしょう)の作成(さくせい)や翻訳(ほんやく)は勿論(もちろん)、画像(がぞう)の{{2:生成(せいせい)}}から病気(びょうき)の{{3:診断(しんだん)}}[[に至(いた)る迄(まで)]]、AIが活躍(かつやく)する場面(ばめん)は広(ひろ)がる一方(いっぽう)だ。","zh":"近年来，人工智能即AI技术迅速发展。写文章、翻译自不必说，从生成图像到诊断疾病，AI大显身手的领域正在不断扩大。"},{"jp":"こうした変化(へんか)を受(う)けて、「将来(しょうらい)、AIに仕事(しごと)を{{4:奪(うば)}}われるのではないか」と不安(ふあん)を感(かん)じる人(ひと)も多(おお)い。実際(じっさい)、単純(たんじゅん)な事務作業(じむさぎょう)[[丈(だけ)でなく]]、高度(こうど)な専門知識(せんもんちしき)が必要(ひつよう)とされる仕事(しごと)の一部(いちぶ)も、AIに{{5:置(お)き換(か)え}}られ始(はじ)めて居(い)る。","zh":"面对这样的变化，很多人感到不安：\"将来工作会不会被AI抢走？\"实际上，不仅是简单的事务性工作，部分需要高度专业知识的工作也开始被AI取代了。"},{"jp":"では、人間(にんげん)の仕事(しごと)は無(な)く成(な)って仕舞(しま)うの[[かと言(い)うと]]、そうとは{{6:言(い)い切(き)}}れない。歴史(れきし)を振(ふ)り返(かえ)ると、新(あたら)しい技術(ぎじゅつ)が{{7:登場(とうじょう)}}する度(たび)に、無(な)く成(な)る仕事(しごと)が有(あ)る一方(いっぽう)で、新(あら)たな仕事(しごと)も生(う)まれて来(き)た。AIの時代(じだい)にも、同(おな)じ事(こと)が起(お)きる[[に違(ちが)いない]]。","zh":"那么，要说人类的工作会不会全部消失，也不能这么断言。回顾历史，每当新技术出现，在一些工作消失的同时，也会诞生新的工作。AI时代一定也会发生同样的事。"},{"jp":"例(たと)えば、AIを使(つか)い熟(こな)す為(ため)の知識(ちしき)を教(おし)える仕事(しごと)や、AIの判断(はんだん)が正(ただ)しいかを確認(かくにん)する仕事(しごと)は、今後(こんご)益々(ますます)必要(ひつよう)と成(な)る。AIが作業(さぎょう)の大部分(だいぶぶん)を{{8:担(にな)}}い、人間(にんげん)は最終的(さいしゅうてき)な判断(はんだん)を下(くだ)す[[訳(わけ)だ]]。","zh":"例如，教人熟练使用AI的工作，以及确认AI的判断是否正确的工作，今后会越来越重要。也就是说，AI承担大部分作业，由人类做出最终判断。"},{"jp":"AIは疲(つか)れる[[事(こと)なく]]、二十四時間(にじゅうよじかん)働(はたら)き続(つづ)けられる。然(しか)し、相手(あいて)の気持(きも)ちを{{9:汲(く)み取(と)}}ったり、{{10:前例(ぜんれい)}}の無(な)い問題(もんだい)に柔軟(じゅうなん)に対応(たいおう)したりする力(ちから)は、人間(にんげん)[[こそ]]が持(も)つ強(つよ)みだ。","zh":"AI可以不知疲倦地连续工作24小时。但是，体察对方心情、灵活应对没有先例的问题的能力，才是人类所拥有的优势。"},{"jp":"気(き)を付(つ)けたいのは、便利(べんり)だからと言(い)ってAIに頼(たよ)り過(す)ぎない事(こと)だ。AIの答(こた)えを{{11:鵜呑(うの)み}}にした[[所為(せい)で]]、誤(あやま)った情報(じょうほう)を広(ひろ)めて仕舞(しま)った例(れい)も有(あ)る。人(ひと)は楽(らく)な方(ほう)に流(なが)され[[勝(が)ちだ]]が、自分(じぶん)の頭(あたま)で考(かんが)える習慣(しゅうかん)を失(うしな)っては意味(いみ)が無(な)い。","zh":"需要注意的是，不能因为方便就过度依赖AI。也有人因为对AI的回答照单全收，结果传播了错误信息。人往往容易图省事，但如果失去了用自己的头脑思考的习惯，就没有意义了。"},{"jp":"AIを恐(おそ)れて何(なに)もしない[[位(くらい)なら]]、積極的(せっきょくてき)に使(つか)って見(み)る方(ほう)が良(よ)い。年齢(ねんれい)や職業(しょくぎょう)[[に拘(かか)わらず]]、新(あたら)しい道具(どうぐ)を学(まな)ぶ{{13:姿勢(しせい)}}が求(もと)められて居(い)る。","zh":"与其因为害怕AI而什么都不做，不如积极地尝试使用。不论年龄和职业，都需要有学习新工具的态度。"},{"jp":"私(わたし)自身(じしん)、最初(さいしょ)はAIに{{12:抵抗(ていこう)}}が有(あ)った[[物(もの)の]]、使(つか)って見(み)るとその便利(べんり)さに驚(おどろ)いた。同時(どうじ)に、この技術(ぎじゅつ)が人間(にんげん)の働(はたら)き方(かた)をどう変(か)えて行(い)くのか、考(かんが)え[[ないではいられない]]。","zh":"我自己一开始对AI也有抵触，但用了之后对它的便利感到惊讶。同时，我也忍不住去思考，这项技术将如何改变人类的工作方式。"}],"grammar":[["〜に至(いた)る迄(まで)","甚至到……，一直到……","この店(みせ)は、文房具(ぶんぼうぐ)から家電(かでん)[[に至(いた)る迄(まで)]]何(なん)でも売(う)って居(い)る。","这家店从文具到家电，什么都卖。","彼(かれ)は子供(こども)から高齢者(こうれいしゃ)[[に至(いた)る迄(まで)]]、誰(だれ)からも好(す)かれて居(い)る。","从小孩到老人，他受到所有人的喜爱。"],["〜丈(だけ)でなく","不仅……","この映画(えいが)は、ストーリー[[丈(だけ)でなく]]音楽(おんがく)も素晴(すば)らしい。","这部电影不仅故事好，音乐也很棒。","彼(かれ)は勉強(べんきょう)[[丈(だけ)でなく]]、家(いえ)の手伝(てつだ)いも良(よ)くする。","他不仅学习，还经常帮家里干活。"],["〜かと言(い)うと","要说……的话","都会(とかい)の生活(せいかつ)が好(す)きなの[[かと言(い)うと]]、そうでもない。","要说喜不喜欢城市生活，倒也不是。","何故(なぜ)彼(かれ)が怒(おこ)ったの[[かと言(い)うと]]、約束(やくそく)を破(やぶ)られたからだ。","要说他为什么生气，是因为被人爽约了。"],["〜に違(ちが)いない","一定是……","彼(かれ)の顔色(かおいろ)を見(み)ると、何(なに)か有(あ)った[[に違(ちが)いない]]。","看他的脸色，一定是出了什么事。","この絵(え)は、有名(ゆうめい)な画家(がか)が描(か)いた物(もの)[[に違(ちが)いない]]。","这幅画一定是有名的画家画的。"],["〜訳(わけ)だ","也就是说……；怪不得","彼(かれ)は毎日(まいにち)三時間(さんじかん)練習(れんしゅう)して居(い)る。上手(じょうず)な[[訳(わけ)だ]]。","他每天练三个小时，怪不得这么拿手。","一時間(いちじかん)に六十(ろくじゅう)キロ走(はし)れば、三時間(さんじかん)で百八十(ひゃくはちじゅう)キロ進(すす)む[[訳(わけ)だ]]。","一小时跑60公里的话，三小时就是180公里。"],["〜事(こと)なく","不……而……","彼女(かのじょ)は諦(あきら)める[[事(こと)なく]]、夢(ゆめ)を追(お)い続(つづ)けた。","她毫不放弃，一直追逐着梦想。","この店(みせ)は創業(そうぎょう)以来(いらい)、一日(いちにち)も休(やす)む[[事(こと)なく]]営業(えいぎょう)して居(い)る。","这家店自创业以来，一天也没休息过。"],["〜こそ","正是……，才是……","これ[[こそ]]、私(わたし)が探(さが)して居(い)た本(ほん)だ。","这才是我一直在找的书。","苦(くる)しい時(とき)[[こそ]]、笑顔(えがお)を忘(わす)れないで居(い)たい。","越是艰难的时候，越想保持笑容。"],["〜所為(せい)で","都怪……，由于……（坏结果）","渋滞(じゅうたい)の[[所為(せい)で]]、約束(やくそく)の時間(じかん)に遅(おく)れた。","都怪堵车，约好的时间迟到了。","彼(かれ)の[[所為(せい)で]]、計画(けいかく)が台無(だいな)しに成(な)った。","都怪他，计划全泡汤了。"],["〜勝(が)ちだ","容易……，往往……","一人(ひとり)暮(ぐ)らしだと、食事(しょくじ)が偏(かたよ)り[[勝(が)ちだ]]。","一个人住，饮食容易不均衡。","冬(ふゆ)は家(いえ)に籠(こ)もり[[勝(が)ちだ]]。","冬天往往容易宅在家里。"],["〜位(くらい)なら","与其……不如……","嘘(うそ)を吐(つ)く[[位(くらい)なら]]、黙(だま)って居(い)た方(ほう)が良(よ)い。","与其撒谎，还不如保持沉默。","毎日(まいにち)残業(ざんぎょう)する[[位(くらい)なら]]、転職(てんしょく)を考(かんが)える。","与其天天加班，不如考虑跳槽。"],["〜に拘(かか)わらず","不论……","経験(けいけん)の有無(うむ)[[に拘(かか)わらず]]、誰(だれ)でも応募(おうぼ)出来(でき)ます。","不论有无经验，谁都可以报名。","天気(てんき)[[に拘(かか)わらず]]、毎朝(まいあさ)散歩(さんぽ)をして居(い)る。","不论天气如何，每天早上都散步。"],["〜物(もの)の","虽然……但是……","頑張(がんば)って書(か)いた[[物(もの)の]]、満足(まんぞく)の行(い)く作品(さくひん)には成(な)らなかった。","虽然努力写了，却没能写出满意的作品。","運動(うんどう)が大切(たいせつ)だと分(わ)かって居(い)る[[物(もの)の]]、中々(なかなか)続(つづ)かない。","虽然知道运动很重要，却总是坚持不下去。"],["〜ないではいられない","忍不住……","彼(かれ)の失敗(しっぱい)を見(み)て、同情(どうじょう)し[[ないではいられなかった]]。","看到他的失败，忍不住同情起来。","困(こま)って居(い)る友人(ゆうじん)を見(み)ると、声(こえ)を掛(か)け[[ないではいられない]]。","看到朋友有困难，就忍不住上前搭话。"]],"vocab":[["人工知能","じんこうちのう","人工智能"],["即ち","すなわち","即，也就是"],["生成","せいせい","生成"],["診断","しんだん","诊断"],["奪う","うばう","夺走"],["置き換える","おきかえる","取代，替换"],["言い切る","いいきる","断言"],["登場","とうじょう","出现，登场"],["担う","になう","承担"],["汲み取る","くみとる","体察，领会"],["前例","ぜんれい","先例"],["鵜呑み","うのみ","照单全收，囫囵吞枣"],["抵抗","ていこう","抵触，抵抗"],["姿勢","しせい","态度，姿态"]],"short":"AIと仕事","lv":3,"sum":"AI会抢走人类的工作吗？回顾历史，思考人和AI各自的长处，偏评论文。"},
{"title":"「失敗(しっぱい)」から学(まな)ぶ","paras":[{"jp":"誰(だれ)でも失敗(しっぱい)はしたくない物(もの)だ。然(しか)し振(ふ)り返(かえ)って見(み)ると、私達(わたしたち)は成功(せいこう)より失敗(しっぱい)から多(おお)くを学(まな)んで来(き)た。私(わたし)自身(じしん)、或(あ)る大(おお)きな失敗(しっぱい)が人生(じんせい)の{{0:転機(てんき)}}と成(な)った。","zh":"谁都不想失败。但回过头看，我们从失败中学到的往往比从成功中学到的更多。我自己也是，一次大失败成了人生的转折点。"},{"jp":"大学(だいがく)三年(さんねん)の時(とき)、私(わたし)は留学生(りゅうがくせい)の{{1:交流(こうりゅう)}}イベントの責任者(せきにんしゃ)を任(まか)された。初(はじ)めての{{2:大役(たいやく)}}に{{3:張(は)り切(き)}}り、半年(はんとし)掛(か)けて準備(じゅんび)した。所(ところ)が当日(とうじつ)、会場(かいじょう)に着(つ)いた[[途端(とたん)]]、予約(よやく)が別(べつ)の日(ひ)に成(な)って居(い)た事(こと)が分(わ)かった。","zh":"大三时，我被任命为留学生交流活动的负责人。第一次担当重任，我干劲十足，花了半年时间准备。可是到了当天，一到会场才发现预约的是另一天。"},{"jp":"頭(あたま)が{{4:真(ま)っ白(しろ)}}に成(な)った。慌(あわ)てて代(か)わりの会場(かいじょう)を探(さが)して居(い)る[[最中(さいちゅう)に]]、参加者(さんかしゃ)が{{5:次々(つぎつぎ)}}と集(あつ)まって来(く)る。謝(あやま)り[[掛(か)けた]]私(わたし)の声(こえ)は震(ふる)えて居(い)た。散々(さんざん)電話(でんわ)を掛(か)けた[[挙句(あげく)]]、結局(けっきょく)イベントは中止(ちゅうし)に成(な)った。","zh":"我脑子一片空白。正慌慌张张地找替代会场时，参加者陆续到了。我刚开口道歉，声音就在发抖。打了一圈电话，最后活动还是取消了。"},{"jp":"寝不足(ねぶそく)が続(つづ)いて居(い)た[[所為(せい)か]]、確認(かくにん)の電話(でんわ)を一本(いっぽん)入(い)れる事(こと)を忘(わす)れて居(い)たのだ。皆(みんな)の期待(きたい)を{{6:裏切(うらぎ)}}った自分(じぶん)が{{7:情(なさ)けな}}く、その夜(よる)は一晩中(ひとばんじゅう)眠(ねむ)れなかった。「二度(にど)とこんな役(やく)を引(ひ)き受(う)ける[[物(もの)か]]」とさえ思(おも)った。","zh":"也许是连续睡眠不足的缘故，我忘了打一个确认电话。辜负了大家的期待，觉得自己很没用，那天晚上一夜没睡着。我甚至想：\"我再也不接这种差事了。\""},{"jp":"所(ところ)が翌日(よくじつ)、仲間達(なかまたち)は私(わたし)を{{8:責(せ)める}}[[どころか]]、「次(つぎ)は皆(みんな)で確認(かくにん)し合(あ)おう」と言(い)って呉(く)れた。その言葉(ことば)は、今(いま)でも忘(わす)れ[[難(がた)い]]。","zh":"可是第二天，伙伴们非但没有责怪我，反而说：\"下次大家一起互相确认吧。\"那句话至今令我难以忘怀。"},{"jp":"何度(なんど)も話(はな)し合(あ)った[[末(すえ)に]]、私達(わたしたち)は三(さん)箇(か)月(げつ)後(ご)にイベントを開(ひら)き直(なお)す事(こと)にした。今度(こんど)は確認(かくにん)の{{9:手順(てじゅん)}}を表(ひょう)に纏(まと)め、一(ひと)つ一(ひと)つ皆(みんな)でチェックした。当日(とうじつ)は前回(ぜんかい)の失敗(しっぱい)が嘘(うそ)の様(よう)に順調(じゅんちょう)に進(すす)み、最後(さいご)迄(まで)遣(や)り[[抜(ぬ)く]]事(こと)が出来(でき)た。","zh":"经过多次讨论，我们决定三个月后重新举办活动。这次把确认步骤整理成表格，大家一项一项地检查。当天进展顺利，上次的失败就像假的一样，我们坚持做到了最后。"},{"jp":"準備(じゅんび)に全力(ぜんりょく)を出(だ)し[[切(き)った]]{{10:御陰(おかげ)}}で、参加者(さんかしゃ)からも「楽(たの)しかった」と言(い)う声(こえ)を沢山(たくさん)貰(もら)った。失敗(しっぱい)した時(とき)の{{11:悔(くや)しさ}}に比(くら)べれば、準備(じゅんび)の苦労(くろう)は思(おも)った[[程(ほど)]]辛(つら)くなかった。","zh":"多亏在准备上全力以赴，我们收到了很多参加者\"很开心\"的反馈。和失败时的懊悔相比，准备的辛苦并没有想象中那么难熬。"},{"jp":"失敗(しっぱい)は辛(つら)い。だが、失敗(しっぱい)した[[からこそ]]、人(ひと)は自分(じぶん)の弱(よわ)さを知(し)り、{{13:他人(たにん)}}の優(やさ)しさに気付(きづ)く事(こと)が出来(でき)る。大切(たいせつ)なのは、失敗(しっぱい)を恐(おそ)れて{{12:挑戦(ちょうせん)}}を止(や)める事(こと)ではなく、失敗(しっぱい)から何(なに)を学(まな)ぶかなのだ。","zh":"失败很痛苦。但正因为失败过，人才能认识到自己的弱点，体会到别人的善意。重要的不是因为害怕失败而停止挑战，而是从失败中学到什么。"}],"grammar":[["〜た途端(とたん)","刚一……就……","窓(まど)を開(あ)けた[[途端(とたん)]]、強(つよ)い風(かぜ)が吹(ふ)き込(こ)んで来(き)た。","刚一开窗，一股强风就吹了进来。","彼(かれ)は社長(しゃちょう)に成(な)った[[途端(とたん)]]、態度(たいど)が大(おお)きく成(な)った。","他一当上社长，态度就变得傲慢了。"],["〜最中(さいちゅう)に","正在……的时候","試験(しけん)の[[最中(さいちゅう)に]]、急(きゅう)に御腹(おなか)が痛(いた)く成(な)った。","考试正进行的时候，突然肚子疼了起来。","スピーチをして居(い)る[[最中(さいちゅう)に]]、マイクが壊(こわ)れた。","正在演讲的时候，麦克风坏了。"],["〜掛(か)ける","刚要……；……到一半","飲(の)み[[掛(か)けた]]コーヒーが、すっかり冷(さ)めて仕舞(しま)った。","喝了一半的咖啡已经完全凉了。","家(いえ)を出(で)[[掛(か)けた]]時(とき)、電話(でんわ)が鳴(な)った。","刚要出门的时候，电话响了。"],["〜挙句(あげく)","……到最后（多为不好的结果）","二時間(にじかん)も待(ま)たされた[[挙句(あげく)]]、会議(かいぎ)は中止(ちゅうし)に成(な)った。","足足等了两个小时，最后会议还取消了。","色々(いろいろ)悩(なや)んだ[[挙句(あげく)]]、結局(けっきょく)一番(いちばん)安(やす)い物(もの)を買(か)った。","犹豫了半天，最后买了最便宜的。"],["〜所為(せい)か","也许是因为……","気(き)の[[所為(せい)か]]、彼(かれ)は最近(さいきん)元気(げんき)が無(な)い様(よう)に見(み)える。","也许是我多心了，他最近好像没什么精神。","昨日(きのう)食(た)べ過(す)ぎた[[所為(せい)か]]、朝(あさ)から胃(い)が重(おも)い。","也许是昨天吃多了，从早上起胃就不舒服。"],["〜物(もの)か","才不……，怎么会……","彼(かれ)の気持(きも)ち等(など)、分(わ)かる[[物(もの)か]]。","他的心情，我怎么可能懂。","こんな不味(まず)い料理(りょうり)、二度(にど)と食(た)べる[[物(もの)か]]。","这么难吃的菜，我再也不吃了。"],["〜どころか","别说……，反而……","雨(あめ)は止(や)む[[どころか]]、益々(ますます)強(つよ)く成(な)って来(き)た。","雨不但没停，反而越下越大。","彼女(かのじょ)は英語(えいご)[[どころか]]、日本語(にほんご)も上手(じょうず)ではない。","她别说英语了，连日语都说不好。"],["〜難(がた)い","难以……","彼(かれ)の話(はなし)は、俄(にわか)には信(しん)じ[[難(がた)い]]。","他的话让人一时难以相信。","それは何物(なにもの)にも代(か)え[[難(がた)い]]経験(けいけん)だった。","那是任何东西都无法替代的经历。"],["〜末(すえ)に","经过……最后","激(はげ)しい議論(ぎろん)の[[末(すえ)に]]、新(あたら)しい案(あん)が採用(さいよう)された。","经过激烈讨论，最终采用了新方案。","三年(さんねん)の研究(けんきゅう)の[[末(すえ)に]]、新薬(しんやく)が完成(かんせい)した。","经过三年的研究，新药终于研制成功。"],["〜抜(ぬ)く","……到底，坚持……","彼(かれ)は四十二(よんじゅうに)キロを走(はし)り[[抜(ぬ)いた]]。","他跑完了全程42公里。","一度(いちど)決(き)めた事(こと)は、最後(さいご)迄(まで)遣(や)り[[抜(ぬ)く]]可(べ)きだ。","一旦决定的事，就应该坚持到底。"],["〜切(き)る","……完；彻底……","給料日(きゅうりょうび)の前(まえ)に、御(お)金(かね)を使(つか)い[[切(き)って]]仕舞(しま)った。","发工资之前，钱已经花光了。","彼(かれ)は疲(つか)れ[[切(き)った]]顔(かお)で帰(かえ)って来(き)た。","他一脸疲惫不堪地回来了。"],["〜程(ほど)〜ない","没有……那么……","この映画(えいが)は、評判(ひょうばん)[[程(ほど)]]面白(おもしろ)くなかった。","这部电影没有传说中那么有趣。","今日(きょう)は昨日(きのう)[[程(ほど)]]忙(いそが)しくない。","今天没有昨天那么忙。"],["〜からこそ","正因为……才……","時間(じかん)が無(な)い[[からこそ]]、計画(けいかく)を立(た)てる事(こと)が大切(たいせつ)だ。","正因为没有时间，制定计划才更重要。","信頼(しんらい)して居(い)る[[からこそ]]、本当(ほんとう)の事(こと)を話(はな)したのだ。","正因为信任你，才跟你说了实话。"]],"vocab":[["転機","てんき","转折点"],["交流","こうりゅう","交流"],["大役","たいやく","重任"],["張り切る","はりきる","干劲十足"],["真っ白","まっしろ","一片空白，雪白"],["次々","つぎつぎ","接连不断"],["裏切る","うらぎる","辜负，背叛"],["情けない","なさけない","没出息，可怜"],["責める","せめる","责备"],["手順","てじゅん","步骤"],["御陰","おかげ","多亏"],["悔しさ","くやしさ","懊悔，不甘心"],["挑戦","ちょうせん","挑战"],["他人","たにん","别人"]],"short":"失敗から学ぶ","lv":3,"sum":"一次搞砸的留学生交流活动，以及之后重新办成的经历，谈失败的意义。"},
{"title":"敬語(けいご)は本当(ほんとう)に必要(ひつよう)か","paras":[{"jp":"日本語(にほんご)を学(まな)ぶ外国人(がいこくじん)[[にしたら]]、敬語(けいご)は最大(さいだい)の{{0:壁(かべ)}}の一(ひと)つだろう。相手(あいて)との関係(かんけい)に依(よ)って言葉(ことば)を{{1:使(つか)い分(わ)け}}なければ成(な)らない[[上(うえ)に]]、尊敬語(そんけいご)や謙譲語(けんじょうご)の形(かたち)も複雑(ふくざつ)だ。","zh":"对学日语的外国人来说，敬语大概是最大的障碍之一。不仅要根据和对方的关系区分用语，尊敬语、自谦语的形式也很复杂。"},{"jp":"実(じつ)は、日本人(にほんじん)に取(と)っても敬語(けいご)は易(やさ)しくない。新入社員(しんにゅうしゃいん)向(む)けの{{2:研修(けんしゅう)}}では、必(かなら)ずと言(い)って良(よ)い程(ほど)敬語(けいご)の練習(れんしゅう)が有(あ)る。若者(わかもの)[[から見(み)ると]]、敬語(けいご)は人間関係(にんげんかんけい)を{{3:円滑(えんかつ)}}にする道具(どうぐ)[[と言(い)うより]]、面倒(めんどう)な決(き)まりに過(す)ぎないのかも知(し)れない。","zh":"其实对日本人来说敬语也不简单。面向新员工的培训中，几乎必定会有敬语练习。在年轻人看来，敬语与其说是让人际关系顺畅的工具，或许不如说只是麻烦的规矩罢了。"},{"jp":"最近(さいきん)では、「敬語(けいご)を無(な)くして、皆(みんな)が{{4:対等(たいとう)}}に話(はな)せる様(よう)にす[[可(べ)きだ]]」と言(い)う意見(いけん)も聞(き)かれる。確(たし)かに、言葉(ことば)の{{13:上下関係(じょうげかんけい)}}が、自由(じゆう)な意見交換(いけんこうかん)を{{5:妨(さまた)げる}}事(こと)も有(あ)る。上司(じょうし)に遠慮(えんりょ)して本音(ほんね)が言(い)えない[[様(よう)では]]、良(よ)い仕事(しごと)は出来(でき)ない。","zh":"最近也能听到这样的意见：\"应该取消敬语，让大家能平等地交流。\"确实，语言上的上下级关系有时会妨碍自由交换意见。如果因为顾忌上司而说不出真心话，是做不好工作的。"},{"jp":"然(しか)し、敬語(けいご)を全(すべ)て無(な)くせば問題(もんだい)が解決(かいけつ)する[[筈(はず)が無(な)い]]。敬語(けいご)は単(たん)なる上下関係(じょうげかんけい)の表(あらわ)れではなく、相手(あいて)への{{6:配慮(はいりょ)}}を示(しめ)す物(もの)でもあるからだ。{{7:初対面(しょたいめん)}}の人(ひと)に丁寧(ていねい)に話(はな)すのは、相手(あいて)を一人(ひとり)の人間(にんげん)として尊重(そんちょう)する[[と言(い)う物(もの)だ]]。","zh":"但是，把敬语全部取消，问题不可能就此解决。因为敬语不只是上下关系的体现，也是表达对对方体贴的方式。对初次见面的人礼貌地说话，这就是把对方当作一个人来尊重。"},{"jp":"敬語(けいご)が{{10:完璧(かんぺき)}}でなくても、気持(きも)ちは伝(つた)わる。外国人(がいこくじん)が{{8:多少(たしょう)}}間違(まちが)った敬語(けいご)を使(つか)った[[としても]]、相手(あいて)を大切(たいせつ)に思(おも)う気持(きも)ちが有(あ)れば、失礼(しつれい)だと感(かん)じる人(ひと)は少(すく)ないだろう。学(まな)び始(はじ)めて{{9:間(ま)も無(な)い}}[[割(わり)に]]、驚(おどろ)く程(ほど)自然(しぜん)な敬語(けいご)を話(はな)す留学生(りゅうがくせい)も居(い)る。","zh":"敬语即使不完美，心意也能传达。即使外国人用的敬语多少有些错误，只要有珍视对方的心意，大概很少有人会觉得失礼吧。也有留学生刚开始学没多久，却能说出自然得令人吃惊的敬语。"},{"jp":"敬語(けいご)が苦手(にがて)な人(ひと)は、先(ま)ず「です・ます」を丁寧(ていねい)に使(つか)う[[事(こと)だ]]。そこから自分(じぶん)[[なりに]]、少(すこ)し宛(ずつ){{11:表現(ひょうげん)}}を増(ふ)やして行(い)けば良(よ)い。","zh":"不擅长敬语的人，首先应该好好地用\"です・ます\"。在此基础上，按自己的方式一点点增加表达就好。"},{"jp":"若(も)し敬語(けいご)が完全(かんぜん)に無(な)く成(な)った[[とすると]]、日本語(にほんご)は便利(べんり)に成(な)るかも知(し)れないが、同時(どうじ)に大切(たいせつ)な何(なに)かを失(うしな)う事(こと)に成(な)るだろう。日本語(にほんご)を使(つか)う[[以上(いじょう)は]]、形(かたち)を守(まも)る事(こと)丈(だけ)に{{12:拘(こだわ)る}}のではなく、敬語(けいご)に込(こ)められた心(こころ)を大切(たいせつ)にす[[可(べ)きではないだろうか]]。","zh":"假如敬语完全消失，日语也许会变得方便，但同时也会失去某种重要的东西吧。既然使用日语，难道不应该不只拘泥于形式，而是珍视敬语中蕴含的心意吗？"}],"grammar":[["〜にしたら","对……来说","毎日(まいにち)残業(ざんぎょう)して居(い)る社員(しゃいん)[[にしたら]]、週末(しゅうまつ)の会議(かいぎ)は迷惑(めいわく)だろう。","对每天加班的员工来说，周末开会很让人头疼吧。","初(はじ)めて日本(にほん)に来(き)た人(ひと)[[にしたら]]、電車(でんしゃ)の乗(の)り換(か)えは難(むずか)しい。","对第一次来日本的人来说，换乘电车很难。"],["〜上(うえ)に","不仅……而且……","彼(かれ)は頭(あたま)が良(よ)い[[上(うえ)に]]、性格(せいかく)も優(やさ)しい。","他不仅聪明，性格也很温柔。","今日(きょう)は寝坊(ねぼう)した[[上(うえ)に]]、財布(さいふ)迄(まで)忘(わす)れた。","今天不但睡过头，连钱包都忘带了。"],["〜から見(み)ると","从……来看，在……看来","日本人(にほんじん)[[から見(み)ると]]当(あ)たり前(まえ)の事(こと)でも、外国人(がいこくじん)には不思議(ふしぎ)に見(み)える事(こと)が有(あ)る。","在日本人看来理所当然的事，在外国人眼里有时也很不可思议。","今(いま)の成績(せいせき)[[から見(み)ると]]、合格(ごうかく)は難(むずか)しいだろう。","从现在的成绩来看，合格恐怕很难。"],["〜と言(い)うより","与其说……不如说……","彼(かれ)の話(はな)し方(かた)は、丁寧(ていねい)[[と言(い)うより]]堅苦(かたくる)しい。","他的说话方式与其说礼貌，不如说生硬。","これは料理(りょうり)[[と言(い)うより]]、芸術作品(げいじゅつさくひん)だ。","这与其说是菜，不如说是艺术品。"],["〜可(べ)きだ","应该……","約束(やくそく)は守(まも)る[[可(べ)きだ]]。","约定应该遵守。","困(こま)った時(とき)は、一人(ひとり)で悩(なや)まずに誰(だれ)かに相談(そうだん)す[[可(べ)きだ]]。","遇到困难时，不该一个人烦恼，应该找人商量。"],["〜様(よう)では","如果……的话（就不行）","自分(じぶん)の部屋(へや)も片付(かたづ)けられない[[様(よう)では]]、一人(ひとり)暮(ぐ)らしは無理(むり)だ。","连自己的房间都收拾不好，一个人生活是不可能的。","小(ちい)さな失敗(しっぱい)で落(お)ち込(こ)む[[様(よう)では]]、この仕事(しごと)は続(つづ)かない。","一点小失败就消沉的话，这份工作是干不长的。"],["〜筈(はず)が無(な)い","不可能……","彼女(かのじょ)がそんな酷(ひど)い事(こと)を言(い)う[[筈(はず)が無(な)い]]。","她不可能说那么过分的话。","鍵(かぎ)を掛(か)けたのだから、泥棒(どろぼう)が入(はい)る[[筈(はず)が無(な)い]]。","已经锁了门，小偷不可能进来。"],["〜と言(い)う物(もの)だ","这才叫……，就是……","相手(あいて)の立場(たちば)に立(た)って考(かんが)えるのが、思(おも)い遣(や)り[[と言(い)う物(もの)だ]]。","站在对方立场上考虑，这才叫体贴。","一生懸命(いっしょうけんめい)頑張(がんば)った人(ひと)を笑(わら)うのは、失礼(しつれい)[[と言(い)う物(もの)だ]]。","嘲笑拼命努力的人，那就是失礼。"],["〜としても","即使……也","雨(あめ)が降(ふ)った[[としても]]、試合(しあい)は行(おこな)われる。","即使下雨，比赛也会照常举行。","反対(はんたい)された[[としても]]、自分(じぶん)の夢(ゆめ)を諦(あきら)めない。","即使被反对，也不放弃自己的梦想。"],["〜割(わり)に","与……相比（却），虽然……但","この部屋(へや)は駅(えき)から近(ちか)い[[割(わり)に]]、家賃(やちん)が安(やす)い。","这个房间离车站近，房租却很便宜。","彼(かれ)は年(とし)の[[割(わり)に]]若(わか)く見(み)える。","他看起来比实际年龄年轻。"],["〜事(こと)だ","应该……，最好……（忠告）","風邪(かぜ)を早(はや)く治(なお)したいなら、ゆっくり休(やす)む[[事(こと)だ]]。","想早点治好感冒，就应该好好休息。","日本語(にほんご)が上手(じょうず)に成(な)りたければ、日本人(にほんじん)と沢山(たくさん)話(はな)す[[事(こと)だ]]。","想把日语说好，就应该多和日本人交谈。"],["〜なりに","按……自己的方式","彼(かれ)は彼(かれ)[[なりに]]頑張(がんば)って居(い)るのだから、責(せ)めないで下(くだ)さい。","他已经在按自己的方式努力了，请别责怪他。","小(ちい)さな会社(かいしゃ)には、小(ちい)さな会社(かいしゃ)[[なりの]]良(よ)さが有(あ)る。","小公司有小公司的好处。"],["〜とすると","假如……的话","会議(かいぎ)が三時(さんじ)に終(お)わる[[とすると]]、四時(よじ)の電車(でんしゃ)には間(ま)に合(あ)う。","假如会议三点结束，就能赶上四点的电车。","彼(かれ)の話(はなし)が本当(ほんとう)だ[[とすると]]、大変(たいへん)な事(こと)に成(な)る。","假如他说的是真的，那就麻烦了。"],["〜以上(いじょう)は","既然……就……","契約(けいやく)した[[以上(いじょう)は]]、規則(きそく)を守(まも)らなければ成(な)らない。","既然签了合同，就必须遵守规定。","代表(だいひょう)に選(えら)ばれた[[以上(いじょう)は]]、皆(みんな)の期待(きたい)に応(こた)えたい。","既然被选为代表，就想不辜负大家的期待。"],["〜可(べ)きではないだろうか","难道不应该……吗","子供(こども)の意見(いけん)にも、もっと耳(みみ)を傾(かたむ)ける[[可(べ)きではないだろうか]]。","难道不应该更多地倾听孩子的意见吗？","高齢者(こうれいしゃ)が安心(あんしん)して暮(く)らせる町作(まちづく)りを、急(いそ)ぐ[[可(べ)きではないだろうか]]。","难道不应该加快建设让老年人安心生活的城市吗？"]],"vocab":[["壁","かべ","墙；障碍"],["使い分ける","つかいわける","区分使用"],["研修","けんしゅう","培训，进修"],["円滑","えんかつ","顺畅"],["対等","たいとう","平等，对等"],["妨げる","さまたげる","妨碍"],["配慮","はいりょ","关怀，照顾"],["初対面","しょたいめん","初次见面"],["多少","たしょう","多少，稍微"],["間も無い","まもない","不久"],["完璧","かんぺき","完美"],["表現","ひょうげん","表达"],["拘る","こだわる","拘泥，讲究"],["上下関係","じょうげかんけい","上下级关系"]],"short":"敬語は必要か","lv":3,"sum":"有人主张取消敬语，也有人认为敬语体现体贴。围绕敬语的意义展开议论。"},
{"title":"プラスチック塵(ごみ)と海(うみ)","paras":[{"jp":"プラスチックは軽(かる)くて丈夫(じょうぶ)で、然(しか)も安(やす)い。二十世紀(にじゅっせいき)に{{0:大量生産(たいりょうせいさん)}}が始(はじ)まって[[以来(いらい)]]、私達(わたしたち)の生活(せいかつ)を大(おお)きく変(か)えて来(き)た。","zh":"塑料又轻又结实，而且便宜。自从二十世纪开始大量生产以来，它极大地改变了我们的生活。"},{"jp":"然(しか)し、便利(べんり)さ[[と共(とも)に]]、深刻(しんこく)な問題(もんだい)も生(う)まれた。毎年(まいとし)、八百万(はっぴゃくまん)トンものプラスチック塵(ごみ)が海(うみ)に流(なが)れ込(こ)んで居(い)ると言(い)う{{1:推計(すいけい)}}が有(あ)る。この儘(まま)では、2050年(ねん)には海(うみ)の中(なか)のプラスチックの量(りょう)が魚(さかな)の量(りょう)を{{2:上回(うわまわ)る}}[[と言(い)う事(こと)だ]]。","zh":"但是，在带来便利的同时，也产生了严重的问题。据推算，每年有多达八百万吨塑料垃圾流入大海。据说照这样下去，到2050年海洋里塑料的量将超过鱼的量。"},{"jp":"海(うみ)に流(なが)れ出(だ)したプラスチックは、波(なみ)や{{3:紫外線(しがいせん)}}に依(よ)って細(こま)かく{{4:砕(くだ)け}}、「マイクロプラスチック」と成(な)る。それを魚(さかな)や貝(かい)が餌(えさ)と間違(まちが)えて食(た)べる[[事(こと)から]]、最終的(さいしゅうてき)には人間(にんげん)の体(からだ)にも入(はい)って来(く)ると考(かんが)えられて居(い)る。","zh":"流入大海的塑料会因海浪和紫外线碎成细小的颗粒，变成\"微塑料\"。鱼和贝类会把它误当作食物吃下去，因此人们认为它最终也会进入人体。"},{"jp":"或(あ)る研究(けんきゅう)チームが、日本(にほん)の{{5:沿岸(えんがん)}}で行(おこな)った調査(ちょうさ)の結果(けっか)[[を元(もと)に]]推計(すいけい)した所(ところ)、マイクロプラスチックは北(きた)の海(うみ)から南(みなみ)の海(うみ)[[に掛(か)けて]]、広(ひろ)い範囲(はんい)で見付(みつ)かった。人(ひと)が殆(ほとん)ど住(す)んで居(い)ない{{6:離島(りとう)}}の{{7:浜辺(はまべ)}}でさえ、大量(たいりょう)のペットボトルが{{8:打(う)ち上(あ)げ}}られて居(い)る。","zh":"某研究小组根据在日本沿岸进行的调查结果推算，从北方海域到南方海域，大范围内都发现了微塑料。就连几乎无人居住的离岛海滩上，也有大量塑料瓶被冲上岸。"},{"jp":"打(う)ち上(あ)げられた塵(ごみ)の量(りょう)[[からして]]、問題(もんだい)の深刻(しんこく)さが分(わ)かるだろう。海岸(かいがん)は、丸(まる)で塵捨(ごみす)て場(ば)である[[かの様(よう)だ]]。","zh":"光从冲上岸的垃圾量，就能看出问题有多严重。海岸简直就像垃圾场一样。"},{"jp":"こうした状況(じょうきょう)を受(う)け、世界各国(せかいかっこく)でプラスチック{{9:削減(さくげん)}}の動(うご)きが広(ひろ)がって居(い)る。日本(にほん)でも、国(くに)の方針(ほうしん)[[に沿(そ)って]]レジ袋(ぶくろ)の{{10:有料化(ゆうりょうか)}}が始(はじ)まった。有料化(ゆうりょうか)[[に先立(さきだ)って]]、多(おお)くの店(みせ)が客(きゃく)にマイバッグの持参(じさん)を呼(よ)び掛(か)けた。","zh":"面对这种状况，世界各国减少塑料的行动正在扩大。在日本，也按照国家方针开始对购物塑料袋收费。在收费之前，很多商店就呼吁顾客自带购物袋。"},{"jp":"然(しか)し、多(おお)くの人(ひと)の予想(よそう)[[に反(はん)して]]、プラスチック塵(ごみ)全体(ぜんたい)の量(りょう)は余(あま)り減(へ)って居(い)ない。レジ袋(ぶくろ)は塵(ごみ)全体(ぜんたい)の僅(わず)か数(すう)パーセントに過(す)ぎないからだ。食品(しょくひん)の{{11:包装(ほうそう)}}や{{12:容器(ようき)}}等(など)、身(み)の回(まわ)りの物(もの)の多(おお)くがプラスチックで出来(でき)て居(い)る[[にも拘(かか)わらず]]、私達(わたしたち)はその事(こと)を殆(ほとん)ど意識(いしき)して居(い)ない。","zh":"然而，与很多人的预想相反，塑料垃圾的总量并没怎么减少。因为购物袋只占垃圾总量的百分之几。尽管食品包装、容器等身边的很多东西都是塑料做的，我们却几乎没有意识到这一点。"},{"jp":"問題(もんだい)の解決(かいけつ)には、企業(きぎょう)[[のみならず]]、消費者(しょうひしゃ)一人(ひとり)一人(ひとり)の行動(こうどう)の変化(へんか)が欠(か)かせない。海(うみ)は日本(にほん)[[に限(かぎ)らず]]、世界中(せかいじゅう)と繋(つな)がって居(い)る。出来(でき)る[[限(かぎ)り]]{{13:使(つか)い捨(す)て}}の物(もの)を減(へ)らし、次(つぎ)の世代(せだい)に綺麗(きれい)な海(うみ)を残(のこ)したい。","zh":"解决这个问题，不仅需要企业，还需要每个消费者改变行动。海洋不只是日本的，它和全世界相连。我想尽可能减少一次性用品，为下一代留下干净的大海。"}],"grammar":[["〜て以来(いらい)","自从……以来","結婚(けっこん)して[[以来(いらい)]]、料理(りょうり)をする様(よう)に成(な)った。","结婚以后，开始做饭了。","引(ひ)っ越(こ)して[[以来(いらい)]]、近所(きんじょ)の人(ひと)とは話(はな)した事(こと)が無(な)い。","搬家以后，还没和邻居说过话。"],["〜と共(とも)に","随着……；和……一起；……的同时","経済(けいざい)の発展(はってん)[[と共(とも)に]]、人々(ひとびと)の生活(せいかつ)も豊(ゆた)かに成(な)った。","随着经济的发展，人们的生活也变得富裕了。","卒業(そつぎょう)[[と共(とも)に]]、故郷(ふるさと)を離(はな)れた。","毕业的同时离开了故乡。"],["〜と言(い)う事(こと)だ","据说……（传闻）","天気予報(てんきよほう)では、明日(あした)は雪(ゆき)が降(ふ)る[[と言(い)う事(こと)だ]]。","天气预报说，明天会下雪。","先生(せんせい)は来月(らいげつ)、大学(だいがく)を辞(や)める[[と言(い)う事(こと)だ]]。","听说老师下个月要离开大学。"],["〜事(こと)から","由于……，从……（判断、命名的根据）","彼(かれ)は何時(いつ)も笑顔(えがお)な[[事(こと)から]]、「スマイル」と呼(よ)ばれて居(い)る。","他总是笑容满面，所以被叫作\"微笑\"。","指紋(しもん)が一致(いっち)した[[事(こと)から]]、犯人(はんにん)が特定(とくてい)された。","由于指纹一致，确定了犯人。"],["〜を元(もと)に","以……为基础、依据","祖母(そぼ)の話(はなし)[[を元(もと)に]]、家族(かぞく)の歴史(れきし)を纏(まと)めた。","根据奶奶讲述的事，整理了家族的历史。","過去(かこ)のデータ[[を元(もと)に]]、売(う)り上(あ)げを予測(よそく)する。","根据过去的数据预测销售额。"],["〜に掛(か)けて","从……到……（范围）","九州(きゅうしゅう)から四国(しこく)[[に掛(か)けて]]、大雨(おおあめ)が降(ふ)って居(い)る。","从九州到四国一带正下着大雨。","年末(ねんまつ)から年始(ねんし)[[に掛(か)けて]]、実家(じっか)に帰(かえ)る予定(よてい)だ。","打算从年底到年初回老家。"],["〜からして","单从……来看就","彼(かれ)は服装(ふくそう)[[からして]]、真面目(まじめ)そうな人(ひと)だ。","单从穿着来看，他就像个认真的人。","このレストランは名前(なまえ)[[からして]]、高(たか)そうだ。","这家餐厅光听名字就觉得很贵。"],["〜かの様(よう)だ","好像……一样","彼女(かのじょ)は全(すべ)てを知(し)って居(い)る[[かの様(よう)な]]顔(かお)をして居(い)た。","她一副什么都知道的样子。","部屋(へや)は誰(だれ)も住(す)んで居(い)ない[[かの様(よう)に]]静(しず)かだった。","房间安静得好像没人住一样。"],["〜に沿(そ)って","沿着……；按照……","道(みち)[[に沿(そ)って]]、小(ちい)さな店(みせ)が並(なら)んで居(い)る。","沿着道路排列着一家家小店。","会社(かいしゃ)の方針(ほうしん)[[に沿(そ)って]]、計画(けいかく)を変更(へんこう)した。","按照公司的方针变更了计划。"],["〜に先立(さきだ)って","在……之前","工事(こうじ)[[に先立(さきだ)って]]、近所(きんじょ)の住民(じゅうみん)に説明(せつめい)が行(おこな)われた。","施工之前，向附近居民做了说明。","映画(えいが)の公開(こうかい)[[に先立(さきだ)って]]、試写会(ししゃかい)が開(ひら)かれた。","电影上映之前举行了试映会。"],["〜に反(はん)して","与……相反，违反……","天気予報(てんきよほう)[[に反(はん)して]]、一日中(いちにちじゅう)晴(は)れて居(い)た。","与天气预报相反，一整天都是晴天。","規則(きそく)[[に反(はん)して]]、彼(かれ)は夜中(よなか)に外出(がいしゅつ)した。","他违反规定，半夜外出了。"],["〜にも拘(かか)わらず","尽管……却……","何度(なんど)も注意(ちゅうい)した[[にも拘(かか)わらず]]、彼(かれ)は又(また)遅刻(ちこく)した。","尽管多次提醒，他还是又迟到了。","平日(へいじつ)[[にも拘(かか)わらず]]、遊園地(ゆうえんち)は混(こ)んで居(い)た。","尽管是工作日，游乐园还是很拥挤。"],["〜のみならず","不仅……而且……","彼(かれ)は国内(こくない)[[のみならず]]、海外(かいがい)でも有名(ゆうめい)だ。","他不仅在国内，在海外也很有名。","地震(じしん)は建物(たてもの)[[のみならず]]、人々(ひとびと)の心(こころ)にも傷(きず)を残(のこ)した。","地震不仅毁坏了建筑，也在人们心里留下了创伤。"],["〜に限(かぎ)らず","不仅限于……","日本(にほん)のアニメは、子供(こども)[[に限(かぎ)らず]]大人(おとな)にも人気(にんき)が有(あ)る。","日本动画不只受孩子欢迎，也很受大人喜爱。","この問題(もんだい)は、都市部(としぶ)[[に限(かぎ)らず]]地方(ちほう)でも起(お)きて居(い)る。","这个问题不只出现在城市，地方上也有。"],["〜限(かぎ)り","尽……；在……范围内","出来(でき)る[[限(かぎ)り]]、早(はや)く御(ご)連絡(れんらく)します。","我会尽快联系您。","時間(じかん)の許(ゆる)す[[限(かぎ)り]]、色々(いろいろ)な所(ところ)を見(み)て回(まわ)りたい。","在时间允许的范围内，想到处看看。"]],"vocab":[["大量生産","たいりょうせいさん","大量生产"],["推計","すいけい","推算"],["上回る","うわまわる","超过"],["紫外線","しがいせん","紫外线"],["砕ける","くだける","粉碎"],["沿岸","えんがん","沿岸"],["離島","りとう","离岛"],["浜辺","はまべ","海滩"],["打ち上げる","うちあげる","冲上岸"],["削減","さくげん","削减"],["有料化","ゆうりょうか","改为收费"],["包装","ほうそう","包装"],["容器","ようき","容器"],["使い捨て","つかいすて","一次性"]],"short":"海洋ごみ","lv":3,"sum":"塑料垃圾如何流入海洋、变成微塑料，以及塑料袋收费之后的现实，偏说明文。"},
{"title":"SNSと人間関係(にんげんかんけい)","paras":[{"jp":"SNSが普及(ふきゅう)した今(いま)、友人(ゆうじん)との連絡(れんらく)は勿論(もちろん)、遠(とお)くに住(す)む家族(かぞく)の{{0:近況(きんきょう)}}も、スマホ一(ひと)つで簡単(かんたん)に分(わ)かる様(よう)に成(な)った。便利(べんり)な時代(じだい)に成(な)った物(もの)だと思(おも)い[[つつ]]、私(わたし)は時々(ときどき)、言(い)い様(よう)の無(な)い疲(つか)れを感(かん)じる。","zh":"社交媒体普及的今天，和朋友联系自不必说，就连住在远方的家人的近况，用一部手机也能轻松知道。我一边感叹时代真方便，一边却时常感到一种说不出的疲惫。"},{"jp":"友人(ゆうじん)の{{1:投稿(とうこう)}}を見(み)ると、旅行(りょこう)やパーティー等(など)、楽(たの)し[[げ]]な写真(しゃしん)許(ばか)りが並(なら)んで居(い)る。それに比(くら)べて自分(じぶん)は、と落(お)ち込(こ)む人(ひと)も多(おお)いだろう。投稿(とうこう)に{{2:反応(はんのう)}}が無(な)いと、自分(じぶん)が嫌(きら)われて居(い)る様(よう)に思(おも)えて[[成(な)らない]]と言(い)う若者(わかもの)も居(い)る。","zh":"看朋友发的动态，全是旅行、聚会之类开心的照片。很多人大概会拿自己比较，然后情绪低落吧。还有年轻人说，帖子一没人回应，就总觉得自己被人讨厌了。"},{"jp":"{{3:通知(つうち)}}が来(く)ると、直(す)ぐに{{4:返信(へんしん)}}しないと失礼(しつれい)だと感(かん)じ、食事中(しょくじちゅう)も落(お)ち着(つ)いて[[は居(い)られない]]。返事(へんじ)が遅(おく)れよう[[物(もの)なら]]、「{{5:無視(むし)}}された」と{{6:誤解(ごかい)}}され兼(か)ねないからだ。","zh":"一有通知，就觉得不马上回复很失礼，连吃饭时都静不下心来。因为回复要是晚了，就可能被误会成\"被无视了\"。"},{"jp":"私(わたし)の妹(いもうと)も、以前(いぜん)はSNSに夢中(むちゅう)だった。「スマホ許(ばか)り見(み)て居(い)ないで」と注意(ちゅうい)すると、「御(お)姉(ねえ)ちゃんだって、何時(いつ)もスマホを触(さわ)って居(い)る[[くせに]]」と{{7:言(い)い返(かえ)}}された。確(たし)かにその通(とお)りで、何(なに)も言(い)い返(かえ)せなかった。","zh":"我妹妹以前也沉迷于社交媒体。我提醒她\"别老看手机\"，她就反驳说：\"姐姐你自己明明也总在摆弄手机。\"确实如此，我一句话也没能回她。"},{"jp":"或(あ)る時(とき)、妹(いもうと)はSNSで友人(ゆうじん)と{{8:喧嘩(けんか)}}に成(な)った。文字(もじ)丈(だけ)の{{9:遣(や)り取(と)り}}では、冗談(じょうだん)の積(つ)もりの一言(ひとこと)が、{{10:皮肉(ひにく)}}[[っぽい]]言葉(ことば)に聞(き)こえて仕舞(しま)う事(こと)が有(あ)る。妹(いもうと)は悲(かな)しみの[[余(あま)り]]、暫(しばら)く部屋(へや)から出(で)て来(こ)なかった。","zh":"有一次，妹妹在社交媒体上和朋友吵了起来。只靠文字交流，本想开玩笑的一句话，听起来却可能像是在讽刺。妹妹伤心极了，好一阵子都没从房间里出来。"},{"jp":"結局(けっきょく)、二人(ふたり)は直接(ちょくせつ)会(あ)って話(はな)し合(あ)い、誤解(ごかい)は直(す)ぐに解(と)けた。「顔(かお)を見(み)て話(はな)せば、喧嘩(けんか)に成(な)る[[訳(わけ)が無(な)い]]のに」と妹(いもうと)は笑(わら)った。この経験(けいけん)の後(あと)、妹(いもうと)は「SNSに{{11:振(ふ)り回(まわ)}}される生活(せいかつ)は二度(にど)とする[[まい]]」と決(き)めたらしい。","zh":"结果两人直接见面谈了谈，误会很快就解开了。妹妹笑着说：\"当面说的话，根本不可能吵起来嘛。\"这件事之后，妹妹好像下定决心：\"再也不过被社交媒体牵着鼻子走的生活了。\""},{"jp":"今(いま)では、夜(よる)九時(くじ)以降(いこう)はスマホの電源(でんげん)を切(き)る様(よう)にして居(い)ると言(い)う。「最初(さいしょ)は不安(ふあん)だったけど、友達(ともだち)も皆(みんな)分(わ)かって呉(く)れた[[物(もの)だから]]、安心(あんしん)した」と妹(いもうと)は話(はな)す。「無理(むり)にSNSを止(や)める必要(ひつよう)は無(な)いけど、{{12:距離(きょり)}}の取(と)り方(かた)を考(かんが)えた方(ほう)が良(よ)い[[に決(き)まって居(い)る]]よ」と言(い)う妹(いもうと)の顔(かお)は、以前(いぜん)より明(あか)るい。","zh":"现在，她说自己晚上九点以后就把手机关机。妹妹说：\"一开始挺不安的，不过朋友们都很理解，所以就放心了。\"她说：\"没必要硬戒社交媒体，但想想怎么保持距离，肯定是更好的。\"她的脸比以前开朗多了。"},{"jp":"SNS自体(じたい)が悪(わる)いとは言(い)い[[兼(か)ねる]]。遠(とお)くの友人(ゆうじん)と繋(つな)がれるのは、どれ程(ほど)有難(ありがた)い[[事(こと)か]]。SNSを上手(じょうず)に使(つか)えば、人間関係(にんげんかんけい)が豊(ゆた)かに成(な)ら[[ないこともない]]と思(おも)う。大切(たいせつ)なのは、{{13:画面(がめん)}}の向(む)こうに居(い)る相手(あいて)も、同(おな)じ人間(にんげん)だと忘(わす)れない事(こと)だろう。","zh":"很难说社交媒体本身是坏的。能和远方的朋友保持联系，是多么难得的事啊。我觉得用得好的话，社交媒体也不是不能让人际关系更丰富。重要的是，不要忘记屏幕另一端的人，也和自己一样是活生生的人。"}],"grammar":[["〜つつ","一边……一边；虽然……却","悪(わる)いと思(おも)い[[つつ]]、つい嘘(うそ)を吐(つ)いて仕舞(しま)った。","明知不对，还是忍不住撒了谎。","景色(けしき)を楽(たの)しみ[[つつ]]、山道(やまみち)をゆっくり歩(ある)いた。","一边欣赏风景，一边慢慢走在山路上。"],["〜げ","好像……的样子","彼(かれ)は寂(さび)し[[げ]]に笑(わら)った。","他寂寞地笑了笑。","子供(こども)は自慢(じまん)[[げ]]に、百点(ひゃくてん)のテストを見(み)せた。","孩子得意洋洋地拿出了一百分的试卷。"],["〜て成(な)らない","……得不得了，总觉得……","一人(ひとり)で旅行(りょこう)して居(い)る娘(むすめ)の事(こと)が、心配(しんぱい)で[[成(な)らない]]。","非常担心一个人在外旅行的女儿。","この町(まち)に来(く)ると、昔(むかし)の事(こと)が懐(なつ)かしく思(おも)い出(だ)されて[[成(な)らない]]。","一来到这个镇子，就不由得怀念起往事。"],["〜ては居(い)られない","不能再……了","締(し)め切(き)りが迫(せま)って居(い)るので、寝(ね)て[[は居(い)られない]]。","截止日期快到了，不能睡觉了。","皆(みんな)が頑張(がんば)って居(い)るのに、私(わたし)丈(だけ)休(やす)んで[[は居(い)られない]]。","大家都在努力，我不能一个人休息。"],["〜物(もの)なら","要是敢……就；如果能……的话","彼(かれ)に秘密(ひみつ)を話(はな)そう[[物(もの)なら]]、直(す)ぐに皆(みんな)に知(し)られて仕舞(しま)う。","要是把秘密告诉他，马上就会被所有人知道。","出来(でき)る[[物(もの)なら]]、空(そら)を飛(と)んで見(み)たい。","如果可以的话，真想在天上飞一飞。"],["〜くせに","明明……却……","子供(こども)の[[くせに]]、大人(おとな)の様(よう)な口(くち)を利(き)く。","明明是个孩子，说话却像大人一样。","自分(じぶん)は遅刻(ちこく)する[[くせに]]、人(ひと)の遅刻(ちこく)には厳(きび)しい。","自己总迟到，对别人迟到却很严格。"],["〜っぽい","有……的感觉；容易……","最近(さいきん)、私(わたし)は忘(わす)れ[[っぽい]]。","我最近很健忘。","彼女(かのじょ)は大人(おとな)[[っぽい]]服(ふく)が似合(にあ)う。","她很适合穿成熟一点的衣服。"],["〜余(あま)り","过于……以至于","嬉(うれ)しさの[[余(あま)り]]、思(おも)わず泣(な)いて仕舞(しま)った。","高兴过了头，不由得哭了出来。","勉強(べんきょう)に集中(しゅうちゅう)する[[余(あま)り]]、時間(じかん)を忘(わす)れて居(い)た。","太专注于学习，忘了时间。"],["〜訳(わけ)が無(な)い","不可能……","一度(いちど)読(よ)んだ丈(だけ)で、全部(ぜんぶ)覚(おぼ)えられる[[訳(わけ)が無(な)い]]。","只读一遍，不可能全部记住。","こんなに安(やす)いのだから、品質(ひんしつ)が良(よ)い[[訳(わけ)が無(な)い]]。","这么便宜，质量不可能好。"],["〜まい","决不……；为了不……","もう二度(にど)とあの人(ひと)には頼(たの)む[[まい]]。","再也不求那个人了。","彼(かれ)は家族(かぞく)を悲(かな)しませ[[まい]]と、病気(びょうき)の事(こと)を隠(かく)して居(い)た。","他为了不让家人难过，一直隐瞒着病情。"],["〜物(もの)だから","因为……（说明理由）","余(あま)りに眠(ねむ)かった[[物(もの)だから]]、授業中(じゅぎょうちゅう)に寝(ね)て仕舞(しま)った。","实在太困了，上课时睡着了。","子供(こども)が泣(な)き止(や)まない[[物(もの)だから]]、仕方(しかた)なく抱(だ)っこした。","孩子一直哭个不停，只好把他抱了起来。"],["〜に決(き)まって居(い)る","肯定……","毎日(まいにち)遊(あそ)んで居(い)たら、試験(しけん)に落(お)ちる[[に決(き)まって居(い)る]]。","每天光玩的话，考试肯定不及格。","こんな雨(あめ)の中(なか)、彼(かれ)は来(こ)ない[[に決(き)まって居(い)る]]。","这么大的雨，他肯定不会来。"],["〜兼(か)ねる","难以……，不便……","申(もう)し訳(わけ)御座(ござ)いませんが、その御(ご)要望(ようぼう)には応(こた)え[[兼(か)ねます]]。","非常抱歉，您的要求我们难以满足。","彼(かれ)の考(かんが)え方(かた)は、理解(りかい)し[[兼(か)ねる]]。","他的想法让人难以理解。"],["〜事(こと)か","多么……啊","子供(こども)の頃(ころ)、この日(ひ)をどれ程(ほど)楽(たの)しみにした[[事(こと)か]]。","小时候，我是多么期待这一天啊。","留学中(りゅうがくちゅう)、何度(なんど)家族(かぞく)に会(あ)いたいと思(おも)った[[事(こと)か]]。","留学期间，不知有多少次想见家人。"],["〜ないこともない","也不是不……","説明(せつめい)を聞(き)けば、分(わ)から[[ないこともない]]。","听了解释的话，也不是不能理解。","頼(たの)まれれば、手伝(てつだ)わ[[ないこともない]]。","如果被拜托的话，也不是不帮忙。"]],"vocab":[["近況","きんきょう","近况"],["投稿","とうこう","发帖，投稿"],["反応","はんのう","反应，回应"],["通知","つうち","通知"],["返信","へんしん","回复"],["無視","むし","无视"],["誤解","ごかい","误会"],["言い返す","いいかえす","反驳，顶嘴"],["喧嘩","けんか","吵架"],["遣り取り","やりとり","往来交流"],["皮肉","ひにく","讽刺"],["振り回す","ふりまわす","摆布，折腾"],["距離","きょり","距离"],["画面","がめん","屏幕"]],"short":"SNSと人間関係","lv":3,"sum":"社交媒体带来的方便与疲惫，从妹妹的一次网上争吵谈怎样与SNS保持距离。"},
{"title":"職人(しょくにん)の技(わざ)を受(う)け継(つ)ぐ","paras":[{"jp":"京都(きょうと)の小(ちい)さな{{0:工房(こうぼう)}}で、七十歳(ななじゅっさい)の田中(たなか)さんは五十年(ごじゅうねん)以上(いじょう){{1:漆器(しっき)}}を作(つく)り続(つづ)けて来(き)た。漆器(しっき)作(づく)り[[に掛(か)けては]]、この町(まち)で田中(たなか)さんの右(みぎ)に出(で)る者(もの)は居(い)ない。","zh":"在京都的一家小作坊里，七十岁的田中先生做漆器已经五十多年了。论做漆器，这个镇上没有人比得上田中先生。"},{"jp":"漆器(しっき)作(づく)りには、木(き)を{{2:削(けず)る}}作業(さぎょう)[[は勿論(もちろん)]]、{{3:漆(うるし)}}を何十回(なんじゅっかい)も塗(ぬ)り重(かさ)ねる{{4:根気(こんき)}}の要(い)る作業(さぎょう)が有(あ)る。一(ひと)つの{{5:器(うつわ)}}が完成(かんせい)する迄(まで)に、半年(はんとし)以上(いじょう)掛(か)かる事(こと)も珍(めずら)しくない。","zh":"做漆器，削木头自不必说，还有把漆反复涂上几十遍这种需要耐心的工序。一个器皿要完成，花上半年以上也不稀奇。"},{"jp":"田中(たなか)さんの作品(さくひん)には、見(み)る人(ひと)の心(こころ)を{{6:惹(ひ)き付(つ)ける}}[[物(もの)が有(あ)る]]。長年(ながねん)経験(けいけん)を積(つ)んだ職人(しょくにん)の手(て)に依(よ)る物(もの)[[丈(だけ)あって]]、形(かたち)も色(いろ)も実(じつ)に美(うつく)しい。使(つか)い手(て)の事(こと)を考(かんが)え、一(ひと)つ一(ひと)つ心(こころ)[[を込(こ)めて]]作(つく)られて居(い)るのだ。","zh":"田中先生的作品有一种吸引人心的力量。不愧是积累了多年经验的匠人亲手制作的，形状和颜色都非常美。每一件都是考虑着使用者，用心制作出来的。"},{"jp":"然(しか)し、{{7:伝統工芸(でんとうこうげい)}}の世界(せかい)は明(あか)るい話(はなし)[[許(ばか)りではない]]。安(やす)い大量生産品(たいりょうせいさんひん)に押(お)されて売(う)り上(あ)げは減(へ)り、{{8:後継者(こうけいしゃ)}}不足(ぶそく)も深刻(しんこく)だ。{{9:弟子(でし)}}に成(な)りたいと言(い)う若者(わかもの)が現(あらわ)れる[[度(たび)に]]、田中(たなか)さんは「{{10:一人前(いちにんまえ)}}に成(な)る迄(まで)、最低(さいてい)十年(じゅうねん)は掛(か)かる」と正直(しょうじき)に伝(つた)えて来(き)た。","zh":"但是，传统工艺的世界并不全是好消息。在廉价量产品的冲击下，销售额不断减少，后继无人的问题也很严重。每当有年轻人说想当徒弟，田中先生都会如实地告诉他们：\"要独当一面，至少得花十年。\""},{"jp":"「技術(ぎじゅつ)は、実際(じっさい)に手(て)を動(うご)かして見(み)[[ない事(こと)には]]身(み)に付(つ)かない。道具(どうぐ)の{{11:手入(てい)れ}}[[さえ]]満足(まんぞく)に出来(でき)ない内(うち)は、器(うつわ)を作(つく)らせる訳(わけ)には行(い)かない」と田中(たなか)さんは言(い)う。","zh":"田中先生说：\"技术这东西，不实际动手是学不会的。连工具保养都还做不好的时候，是不能让他做器皿的。\""},{"jp":"三年前(さんねんまえ)に弟子入(でしい)りした佐藤(さとう)さんは、最初(さいしょ)の一年(いちねん)は掃除(そうじ)と道具(どうぐ)の手入(てい)れ許(ばか)りだったと言(い)う。「基礎(きそ)を固(かた)めて[[からでないと]]、次(つぎ)の段階(だんかい)には進(すす)めません。今(いま)思(おも)えば、厳(きび)しい{{12:師匠(ししょう)}}の[[事(こと)だから]]、私(わたし)の為(ため)を思(おも)ってそうして居(い)たのだと分(わ)かります。」","zh":"三年前拜师的佐藤先生说，第一年全是打扫和保养工具。\"不先打好基础，就进不了下一个阶段。现在想来，师父那么严格，一定是为我着想才那样做的。\""},{"jp":"佐藤(さとう)さんが初(はじ)めて一人(ひとり)で作(つく)った椀(わん)は、地元(じもと)の展示会(てんじかい)で賞(しょう)を取(と)った[[許(ばか)りか]]、海外(かいがい)の店(みせ)からも注文(ちゅうもん)が来(き)た。「三年間(さんねんかん)耐(た)えて来(き)た[[丈(だけ)の事(こと)は有(あ)る]]」と、田中(たなか)さんは目(め)を細(ほそ)める。","zh":"佐藤先生第一次独立制作的碗，不仅在当地的展览会上获了奖，还收到了海外商店的订单。田中先生眯起眼睛说：\"这三年果然没有白熬。\""},{"jp":"伝統(でんとう)を守(まも)る[[にしても]]、昔(むかし)の儘(まま)の遣(や)り方(かた)では{{13:限界(げんかい)}}が有(あ)る。最近(さいきん)はネット販売(はんばい)や、現代(げんだい)の生活(せいかつ)に合(あ)ったデザインにも挑戦(ちょうせん)して居(い)る。伝統(でんとう)が未来(みらい)に残(のこ)るかどうかは、受(う)け継(つ)ぐ人(ひと)の工夫(くふう)[[次第(しだい)で]]大(おお)きく変(か)わるだろう。","zh":"即使要守护传统，完全照搬过去的做法也有局限。最近他们也在尝试网络销售，以及适合现代生活的设计。传统能否流传到未来，会因传承者的用心程度而大不相同吧。"}],"grammar":[["〜に掛(か)けては","在……方面（最拿手）","計算(けいさん)の速(はや)さ[[に掛(か)けては]]、彼女(かのじょ)が一番(いちばん)だ。","论计算速度，她是第一。","歌(うた)[[に掛(か)けては]]、誰(だれ)にも負(ま)けない自信(じしん)が有(あ)る。","论唱歌，我有不输给任何人的自信。"],["〜は勿論(もちろん)","……自不必说","彼(かれ)は英語(えいご)[[は勿論(もちろん)]]、スペイン語(ご)も話(はな)せる。","他英语自不必说，还会西班牙语。","この公園(こうえん)は、春(はる)[[は勿論(もちろん)]]、秋(あき)の紅葉(こうよう)も美(うつく)しい。","这个公园春天自不必说，秋天的红叶也很美。"],["〜物(もの)が有(あ)る","确实有……之处，令人……","彼(かれ)の言葉(ことば)には、人(ひと)を勇気付(ゆうきづ)ける[[物(もの)が有(あ)る]]。","他的话有一种鼓舞人心的力量。","子供(こども)の成長(せいちょう)の速(はや)さには、驚(おどろ)く[[物(もの)が有(あ)る]]。","孩子成长之快，令人吃惊。"],["〜丈(だけ)あって","不愧是……","プロの料理人(りょうりにん)[[丈(だけ)あって]]、包丁(ほうちょう)の使(つか)い方(かた)が上手(うま)い。","不愧是专业厨师，用刀很熟练。","毎日(まいにち)走(はし)って居(い)る[[丈(だけ)あって]]、彼(かれ)は体力(たいりょく)が有(あ)る。","不愧每天跑步，他体力很好。"],["〜を込(こ)めて","满怀……，倾注……","祖父(そふ)の為(ため)に、心(こころ)[[を込(こ)めて]]手紙(てがみ)を書(か)いた。","为爷爷用心写了一封信。","平和(へいわ)への願(ねが)い[[を込(こ)めて]]、鶴(つる)を折(お)った。","怀着对和平的祈愿折了纸鹤。"],["〜許(ばか)りではない","不仅仅是……，并不全是……","人生(じんせい)は楽(たの)しい事(こと)[[許(ばか)りではない]]。","人生并不全是快乐的事。","仕事(しごと)は御(お)金(かね)の為(ため)[[許(ばか)りではない]]。","工作并不仅仅是为了钱。"],["〜度(たび)に","每当……","彼(かれ)は会(あ)う[[度(たび)に]]、違(ちが)う服(ふく)を着(き)て居(い)る。","每次见面，他都穿着不同的衣服。","実家(じっか)に帰(かえ)る[[度(たび)に]]、母(はは)が料理(りょうり)を沢山(たくさん)作(つく)って呉(く)れる。","每次回老家，妈妈都会做很多菜。"],["〜ない事(こと)には","不……的话就（不）……","本人(ほんにん)に会(あ)って見(み)[[ない事(こと)には]]、どんな人(ひと)か分(わ)からない。","不见到本人，就不知道是什么样的人。","予算(よさん)が決(き)まら[[ない事(こと)には]]、計画(けいかく)を立(た)てられない。","预算不定下来，就没法制定计划。"],["〜さえ","连……都","彼(かれ)は忙(いそが)しくて、家族(かぞく)と話(はな)す時間(じかん)[[さえ]]無(な)い。","他忙得连和家人说话的时间都没有。","そんな簡単(かんたん)な事(こと)[[さえ]]知(し)らないのか。","连那么简单的事都不知道吗？"],["〜てからでないと","不先……就不能……","先生(せんせい)に相談(そうだん)して[[からでないと]]、決(き)められない。","不先和老师商量，就决定不了。","雨(あめ)が止(や)んで[[からでないと]]、出掛(でか)けられない。","不等雨停，就没法出门。"],["〜事(こと)だから","因为是……（所以一定会）","忘(わす)れっぽい彼(かれ)の[[事(こと)だから]]、又(また)傘(かさ)を置(お)いて来(き)たのだろう。","他那么健忘，肯定又把伞落下了吧。","料理上手(りょうりじょうず)な母(はは)の[[事(こと)だから]]、今日(きょう)の夕食(ゆうしょく)も楽(たの)しみだ。","妈妈那么会做菜，今天的晚饭也很值得期待。"],["〜許(ばか)りか","不仅……而且……","彼(かれ)は約束(やくそく)を破(やぶ)った[[許(ばか)りか]]、謝(あやま)りもしなかった。","他不仅违约，连道歉都没有。","この本(ほん)は子供(こども)[[許(ばか)りか]]、大人(おとな)が読(よ)んでも面白(おもしろ)い。","这本书不仅孩子，大人读了也觉得有趣。"],["〜丈(だけ)の事(こと)は有(あ)る","不愧是……，没白……","三年(さんねん)も準備(じゅんび)した[[丈(だけ)の事(こと)は有(あ)る]]。素晴(すば)らしい発表(はっぴょう)だった。","准备了三年果然没白费，发表非常精彩。","有名(ゆうめい)な店(みせ)[[丈(だけ)の事(こと)は有(あ)って]]、本当(ほんとう)に美味(おい)しい。","不愧是名店，真的很好吃。"],["〜にしても","即使……也","冗談(じょうだん)だった[[にしても]]、言(い)い過(す)ぎだ。","即使是开玩笑，也说得太过分了。","忙(いそが)しい[[にしても]]、電話(でんわ)位(くらい)は出来(でき)た筈(はず)だ。","即使再忙，至少也能打个电话吧。"],["〜次第(しだい)で","根据……，取决于……","考(かんが)え方(かた)[[次第(しだい)で]]、失敗(しっぱい)も良(よ)い経験(けいけん)に成(な)る。","看你怎么想，失败也能成为好的经验。","練習(れんしゅう)[[次第(しだい)で]]、誰(だれ)でも上手(じょうず)に成(な)れる。","只要肯练习，谁都能变得拿手。"]],"vocab":[["工房","こうぼう","作坊，工作室"],["漆器","しっき","漆器"],["削る","けずる","削"],["漆","うるし","漆"],["根気","こんき","耐心，毅力"],["器","うつわ","器皿"],["惹き付ける","ひきつける","吸引"],["伝統工芸","でんとうこうげい","传统工艺"],["後継者","こうけいしゃ","继承人"],["弟子","でし","徒弟"],["一人前","いちにんまえ","独当一面"],["手入れ","ていれ","保养，修整"],["師匠","ししょう","师父"],["限界","げんかい","极限，局限"]],"short":"職人の技","lv":3,"sum":"京都一位做了五十年漆器的匠人和他的徒弟，谈传统工艺的传承与困境。"},
{"title":"言葉(ことば)は変化(へんか)する","paras":[{"jp":"「最近(さいきん)の若者(わかもの)の言葉(ことば)は乱(みだ)れて居(い)る」[[と言(い)えば]]、何時(いつ)の時代(じだい)にも聞(き)かれる批判(ひはん)だ。千年前(せんねんまえ)の{{0:書物(しょもつ)}}に[[すら]]、若者(わかもの)の{{1:言葉遣(ことばづか)い}}を嘆(なげ)く{{2:記述(きじゅつ)}}が有(あ)ると言(い)う。","zh":"说起\"最近年轻人的语言很混乱\"，这是任何时代都能听到的批评。据说就连一千年前的书里，也有感叹年轻人措辞的记载。"},{"jp":"言葉(ことば)は生(い)き物(もの)で、時代(じだい)と共(とも)に変(か)わって行(い)く[[物(もの)だ]]。例(たと)えば「全然(ぜんぜん)」は、本来(ほんらい)は後(うし)ろに{{3:否定(ひてい)}}の言葉(ことば)を{{4:伴(ともな)う}}と言(い)われて来(き)たが、「全然(ぜんぜん)大丈夫(だいじょうぶ)」と言(い)う使(つか)い方(かた)も、今(いま)では普通(ふつう)に耳(みみ)にする。","zh":"语言是活的，会随着时代变化。比如\"全然\"，一直被认为后面本来要跟否定的词，但如今\"全然大丈夫\"这样的用法也很常听到。"},{"jp":"「ら抜(ぬ)き言葉(ことば)」も代表的(だいひょうてき)な例(れい)だ。「見(み)られる」を「見(み)れる」、「来(こ)られる」を「来(こ)れる」と言(い)う[[と成(な)ると]]、{{5:眉(まゆ)を顰(ひそ)める}}人(ひと)も居(い)るだろう。然(しか)し話(はな)し言葉(ことば)では、既(すで)に多(おお)くの人(ひと)が使(つか)って居(い)る。","zh":"\"省略ら的词\"也是典型的例子。要是把\"見られる\"说成\"見れる\"、\"来られる\"说成\"来れる\"，有人大概会皱眉吧。但在口语中，已经有很多人在用了。"},{"jp":"言葉(ことば)の正(ただ)しさ[[は扨(さ)て置(お)き]]、変化(へんか)には理由(りゆう)が有(あ)る。「ら抜(ぬ)き」は、可能(かのう)の意味(いみ)と尊敬(そんけい)の意味(いみ)を{{6:区別(くべつ)}}し易(やす)くすると言(い)う点(てん)で、{{7:合理的(ごうりてき)}}だと言(い)う見方(みかた)も有(あ)る。","zh":"语言的对错暂且不论，变化总是有原因的。也有观点认为，\"省略ら\"便于区分可能和尊敬两种意思，在这一点上是合理的。"},{"jp":"勿論(もちろん)、場面(ばめん)に依(よ)って言葉(ことば)を使(つか)い分(わ)ける事(こと)は大切(たいせつ)だ。友達(ともだち)との会話(かいわ)なら、多少(たしょう){{8:崩(くず)れ}}た日本語(にほんご)を使(つか)って[[も差(さ)し支(つか)えない]]が、面接(めんせつ)や試験(しけん)の作文(さくぶん)では、{{9:規範的(きはんてき)}}な言葉(ことば)を使(つか)う[[に限(かぎ)る]]。若者(わかもの)[[向(む)き]]の雑誌(ざっし)の言葉(ことば)を、その儘(まま)仕事(しごと)のメールに使(つか)う訳(わけ)には行(い)かない。","zh":"当然，根据场合区分用语很重要。和朋友聊天时，用稍微随意一点的日语也无妨，但面试、考试作文中，最好还是用规范的语言。不能把面向年轻人的杂志上的用语直接用在工作邮件里。"},{"jp":"国語辞典(こくごじてん)の{{10:編集者(へんしゅうしゃ)}}は、「新(あたら)しい言葉(ことば)を辞書(じしょ)に載(の)せるかどうかは、個人(こじん)の好(この)み[[を抜(ぬ)きにして]]、実際(じっさい)の{{11:使用例(しようれい)}}に基(もと)づいて判断(はんだん)する」と話(はな)す。どんな言葉(ことば)[[であれ]]、多(おお)くの人(ひと)に使(つか)われて定着(ていちゃく)すれば、それは「正(ただ)しい日本語(にほんご)」に成(な)って行(い)くのだ。","zh":"国语辞典的编辑说：\"新词收不收进词典，要抛开个人喜好，根据实际用例来判断。\"无论什么词，只要被很多人使用并固定下来，它就会逐渐成为\"正确的日语\"。"},{"jp":"「正(ただ)しい日本語(にほんご)」[[と言(い)うと]]、変(か)わらない物(もの)の様(よう)に思(おも)われ勝(が)ちだが、実際(じっさい)には{{12:揺(ゆ)れ動(うご)}}いて居(い)る。言語学(げんごがく)[[上(じょう)]]、変化(へんか)しない言葉(ことば)は無(な)いとさえ言(い)われる。","zh":"一说到\"正确的日语\"，人们往往以为它是一成不变的，但实际上它一直在变动。从语言学上讲，甚至可以说不存在不变化的语言。"},{"jp":"私(わたし)は日本語(にほんご)を学(まな)ぶ外国人(がいこくじん)な[[物(もの)で]]、教科書(きょうかしょ)と実際(じっさい)の会話(かいわ)の違(ちが)いに戸惑(とまど)う事(こと)も多(おお)い。でも、混乱(こんらん)する事(こと)[[はともかく]]、言葉(ことば)の変化(へんか)を知(し)るのは面白(おもしろ)い。言葉(ことば)の変化(へんか)は、社会(しゃかい)の変化(へんか)を{{13:映(うつ)す}}鏡(かがみ)なのかも知(し)れない。","zh":"我是学日语的外国人，经常会对课本和实际对话的差异感到困惑。不过，混乱归混乱，了解语言的变化还是很有意思的。语言的变化，或许就是映照社会变化的一面镜子。"}],"grammar":[["〜と言(い)えば","说起……，提到……","京都(きょうと)[[と言(い)えば]]、古(ふる)い御(お)寺(てら)が有名(ゆうめい)だ。","说起京都，古老的寺庙很有名。","冬(ふゆ)[[と言(い)えば]]、鍋料理(なべりょうり)が食(た)べたく成(な)る。","说到冬天，就想吃火锅。"],["〜すら","连……都","彼(かれ)は挨拶(あいさつ)[[すら]]しないで帰(かえ)って行(い)った。","他连招呼都没打就回去了。","専門家(せんもんか)で[[すら]]、この問題(もんだい)は解(と)けなかった。","就连专家都没能解开这个问题。"],["〜物(もの)だ","（本性、常理）就是……；（回忆）常常……","人(ひと)は誰(だれ)でも、間違(まちが)いをする[[物(もの)だ]]。","人谁都会犯错。","若(わか)い頃(ころ)は、良(よ)く友達(ともだち)と夜遅(よるおそ)く迄(まで)話(はな)した[[物(もの)だ]]。","年轻时常常和朋友聊到深夜。"],["〜と成(な)ると","一旦……，如果说到……的话","留学(りゅうがく)する[[と成(な)ると]]、色々(いろいろ)な準備(じゅんび)が必要(ひつよう)だ。","一旦要留学，就需要做各种准备。","一人(ひとり)で全部(ぜんぶ)遣(や)る[[と成(な)ると]]、大変(たいへん)だ。","要是一个人全做，就很辛苦了。"],["〜は扨(さ)て置(お)き","……暂且不提","結果(けっか)[[は扨(さ)て置(お)き]]、挑戦(ちょうせん)した事(こと)に意味(いみ)が有(あ)る。","结果暂且不提，挑战本身就有意义。","冗談(じょうだん)[[は扨(さ)て置(お)き]]、来週(らいしゅう)の予定(よてい)を決(き)めよう。","玩笑先放一边，定一下下周的安排吧。"],["〜ても差(さ)し支(つか)えない","……也没关系","この部屋(へや)は自由(じゆう)に使(つか)って[[も差(さ)し支(つか)えありません]]。","这个房间可以随意使用。","答(こた)えは英語(えいご)で書(か)いて[[も差(さ)し支(つか)えない]]。","答案用英语写也没关系。"],["〜に限(かぎ)る","……最好","嫌(いや)な事(こと)が有(あ)った日(ひ)は、早(はや)く寝(ね)る[[に限(かぎ)る]]。","遇到烦心事的日子，最好早点睡。","旅行(りょこう)は平日(へいじつ)[[に限(かぎ)る]]。","旅行最好是挑工作日去。"],["〜向(む)き","适合……；朝向……","この家(いえ)は南(みなみ)[[向(む)き]]で、日当(ひあ)たりが良(よ)い。","这房子朝南，采光很好。","この本(ほん)は初心者(しょしんしゃ)[[向(む)き]]だ。","这本书适合初学者。"],["〜を抜(ぬ)きにして","抛开……，去掉……","朝食(ちょうしょく)[[を抜(ぬ)きにして]]仕事(しごと)に行(い)くのは、体(からだ)に良(よ)くない。","不吃早饭就去上班，对身体不好。","経験(けいけん)[[を抜(ぬ)きにして]]、この仕事(しごと)は語(かた)れない。","离开经验，就谈不了这份工作。"],["〜であれ","无论……都","子供(こども)[[であれ]]大人(おとな)[[であれ]]、ルールは守(まも)らなければ成(な)らない。","不论是孩子还是大人，都必须遵守规则。","仮令(たとえ)冗談(じょうだん)[[であれ]]、人(ひと)を傷付(きずつ)ける言葉(ことば)は良(よ)くない。","即使是开玩笑，伤人的话也不好。"],["〜と言(い)うと","一说起……；你说的……是指","北海道(ほっかいどう)[[と言(い)うと]]、広(ひろ)い大地(だいち)と雪(ゆき)を思(おも)い浮(う)かべる。","一说起北海道，就会想到辽阔的大地和雪。","「例(れい)の件(けん)」[[と言(い)うと]]、昨日(きのう)の話(はなし)の事(こと)ですか。","你说的\"那件事\"，是指昨天说的事吗？"],["〜上(じょう)","在……上，从……方面来看","立場(たちば)[[上(じょう)]]、その質問(しつもん)には答(こた)えられない。","由于立场的关系，没法回答那个问题。","教育(きょういく)[[上(じょう)]]、子供(こども)に見(み)せる可(べ)きではない番組(ばんぐみ)も有(あ)る。","从教育角度来说，有些节目不应该给孩子看。"],["〜物(もの)で","因为……（解释原因）","電車(でんしゃ)が遅(おく)れた[[物(もの)で]]、会議(かいぎ)に間(ま)に合(あ)いませんでした。","因为电车晚点，没赶上会议。","初(はじ)めてな[[物(もの)で]]、色々(いろいろ)教(おし)えて下(くだ)さい。","因为是第一次，请多多指教。"],["〜はともかく","……暂且不论","見(み)た目(め)[[はともかく]]、味(あじ)は最高(さいこう)だ。","外观暂且不说，味道是最棒的。","他(ほか)の人(ひと)[[はともかく]]、私(わたし)は賛成(さんせい)です。","别人怎么样暂且不论，我是赞成的。"]],"vocab":[["書物","しょもつ","书籍"],["言葉遣い","ことばづかい","措辞，说法"],["記述","きじゅつ","记载，描述"],["否定","ひてい","否定"],["伴う","ともなう","伴随"],["眉を顰める","まゆをひそめる","皱眉"],["区別","くべつ","区别"],["合理的","ごうりてき","合理的"],["崩れる","くずれる","走样，崩塌"],["規範的","きはんてき","规范的"],["編集者","へんしゅうしゃ","编辑"],["使用例","しようれい","用例"],["揺れ動く","ゆれうごく","摇摆，变动"],["映す","うつす","映照"]],"short":"言葉の変化","lv":3,"sum":"\"全然大丈夫\"和\"省略ら的词\"，语言是乱了还是在进化？兼谈场合与用语。"},
{"title":"幸福(こうふく)とは何(なに)か","paras":[{"jp":"「幸(しあわ)せとは何(なに)か」と聞(き)かれたら、何(なん)と答(こた)えるだろうか。御(お)金(かね)が有(あ)れば幸(しあわ)せに成(な)れると考(かんが)える人(ひと)も居(い)れば、健康(けんこう)で[[さえ有(あ)れば]]それで十分(じゅうぶん)だと言(い)う人(ひと)も居(い)る。","zh":"如果被问到\"幸福是什么\"，你会怎么回答呢？有人认为有钱就能幸福，也有人说只要身体健康就足够了。"},{"jp":"或(あ)る調査(ちょうさ)に依(よ)ると、収入(しゅうにゅう)が{{0:一定(いってい)}}の{{1:水準(すいじゅん)}}を超(こ)えると、それ以上(いじょう)増(ふ)えても{{2:幸福感(こうふくかん)}}は余(あま)り上(あ)がらないと言(い)う。高(たか)い給料(きゅうりょう)を得(え)る為(ため)に、睡眠時間(すいみんじかん)を削(けず)って[[でも]]働(はたら)く人(ひと)が居(い)るが、それで本当(ほんとう)に幸(しあわ)せに成(な)れるのだろうか。","zh":"根据某项调查，收入一旦超过一定水平，即使再增加，幸福感也不会怎么提高。有人为了高薪，即使削减睡眠时间也要工作，但这样真的能幸福吗？"},{"jp":"私(わたし)の友人(ゆうじん)は、一流企業(いちりゅうきぎょう)に{{4:就職(しゅうしょく)}}した。周(まわ)りからは{{3:羨(うらや)}}ましがられたが、毎晩(まいばん)終電(しゅうでん)迄(まで)働(はたら)き、休日(きゅうじつ)も疲(つか)れて趣味(しゅみ)[[どころではなかった]]と言(い)う。「仕事(しごと)を辞(や)めたくて[[仕方(しかた)が無(な)かった]]けれど、辞(や)めたら負(ま)けだと思(おも)って居(い)た」と彼(かれ)は振(ふ)り返(かえ)る。","zh":"我的一个朋友进了一流企业。周围的人都很羡慕他，但据说他每晚工作到末班车，休息日也累得根本顾不上爱好。他回忆说：\"那时候想辞职想得不得了，可又觉得辞了就是认输。\""},{"jp":"一流企業(いちりゅうきぎょう)に入(はい)った[[許(ばか)りに]]、自分(じぶん)を{{5:追(お)い詰(つ)め}}て仕舞(しま)ったのだ。結局(けっきょく)、彼(かれ)は{{6:体調(たいちょう)を崩(くず)}}して会社(かいしゃ)を辞(や)め、今(いま)は地方(ちほう)の小(ちい)さな会社(かいしゃ)で働(はたら)いて居(い)る。給料(きゅうりょう)は半分(はんぶん)に成(な)ったが、毎日(まいにち)家族(かぞく)と夕食(ゆうしょく)を食(た)べられるのが嬉(うれ)しくて[[堪(たま)らない]]そうだ。","zh":"就因为进了一流企业，他把自己逼得太紧了。最后他搞垮了身体，辞掉了工作，现在在地方上的一家小公司上班。工资减了一半，但据说每天能和家人一起吃晚饭，他高兴得不得了。"},{"jp":"彼(かれ)の話(はなし)を聞(き)く[[につけ]]、幸(しあわ)せは他人(たにん)と比(くら)べる物(もの)ではないと感(かん)じる。周(まわ)りの{{7:評価(ひょうか)}}を気(き)にする[[事(こと)はない]]。大切(たいせつ)なのは、自分(じぶん)が何(なに)に喜(よろこ)びを感(かん)じるかを知(し)る事(こと)だ。","zh":"每当听他讲这些，我都觉得幸福不是拿来和别人比较的。不必在意周围人的评价。重要的是了解自己会因为什么而感到快乐。"},{"jp":"幸福(こうふく)の研究(けんきゅう)では、人(ひと)との{{8:繋(つな)がり}}が幸福感(こうふくかん)に大(おお)きく影響(えいきょう)する[[所(ところ)から]]、孤独(こどく)は健康(けんこう)にも悪(わる)いと指摘(してき)されて居(い)る。社会(しゃかい)の一員(いちいん)[[として]]誰(だれ)かの役(やく)に立(た)って居(い)ると感(かん)じられる時(とき)、人(ひと)は深(ふか)い{{9:満足感(まんぞくかん)}}を得(え)ると言(い)う。","zh":"在幸福研究中，由于人与人之间的联系对幸福感影响很大，所以有人指出孤独对健康也有害。据说当人感到自己作为社会的一员对别人有用时，会获得深深的满足感。"},{"jp":"若(も)し明日(あした)人生(じんせい)が終(お)わる[[としたら]]、何(なに)をしたいだろうか。そう考(かんが)えて見(み)ると、本当(ほんとう)に大切(たいせつ)な物(もの)が見(み)えて来(く)る。幸(しあわ)せは遠(とお)くに有(あ)る物(もの)ではなく、{{10:案外(あんがい)}}{{11:身近(みぢか)}}な所(ところ)に有(あ)るのかも知(し)れない。","zh":"如果明天人生就要结束，你想做什么呢？这样一想，真正重要的东西就会浮现出来。幸福也许不在远方，而意外地就在身边。"},{"jp":"勿論(もちろん)、経済的(けいざいてき)な{{12:安定(あんてい)}}[[を前提(ぜんてい)に]]しなければ、心(こころ)の余裕(よゆう)は生(う)まれ難(にく)い。若(わか)い[[にしては]]苦労(くろう)して来(き)た彼(かれ)の言葉(ことば)だからこそ、{{13:重(おも)み}}が有(あ)る。誰(だれ)もが自分(じぶん)らしい幸(しあわ)せを見付(みつ)けられる社会(しゃかい)を作(つく)る方法(ほうほう)は[[無(な)い物(もの)か]]。皆(みな)が自分(じぶん)なりの幸(しあわ)せに出会(であ)えます[[様(よう)に]]。","zh":"当然，如果不以经济上的稳定为前提，心里就很难有余裕。正因为是年纪轻轻却吃过不少苦的他说的话，才格外有分量。难道就没有办法建设一个每个人都能找到属于自己的幸福的社会吗？愿每个人都能遇见属于自己的幸福。"}],"grammar":[["〜さえ〜ば","只要……就……","時間(じかん)[[さえ有(あ)れば]]、もっと色々(いろいろ)な国(くに)へ行(い)きたい。","只要有时间，想去更多的国家。","この問題(もんだい)[[さえ解(と)ければ]]、合格(ごうかく)出来(でき)る。","只要能解出这道题，就能合格。"],["〜てでも","就算……也要……","無理(むり)をして[[でも]]、今日中(きょうじゅう)に終(お)わらせたい。","就算勉强一点，也想今天之内做完。","借金(しゃっきん)して[[でも]]、その家(いえ)を買(か)いたかった。","就算借钱，也想买下那套房子。"],["〜どころではない","哪里顾得上……","引(ひ)っ越(こ)しの準備(じゅんび)で忙(いそが)しくて、旅行(りょこう)[[どころではない]]。","忙着准备搬家，哪里顾得上旅行。","足(あし)が痛(いた)くて、ダンス[[どころではなかった]]。","脚疼，根本顾不上跳舞。"],["〜て仕方(しかた)が無(な)い","……得不得了","試験(しけん)の結果(けっか)が気(き)に成(な)って[[仕方(しかた)が無(な)い]]。","特别在意考试的结果。","新(あたら)しい仕事(しごと)が楽(たの)しくて[[仕方(しかた)が無(な)い]]。","新工作有意思得不得了。"],["〜許(ばか)りに","就因为……（导致不好的结果）","寝坊(ねぼう)した[[許(ばか)りに]]、大事(だいじ)な面接(めんせつ)に遅(おく)れて仕舞(しま)った。","就因为睡过头，重要的面试迟到了。","正直(しょうじき)に話(はな)した[[許(ばか)りに]]、彼(かれ)を傷付(きずつ)けて仕舞(しま)った。","就因为说了实话，伤害了他。"],["〜て堪(たま)らない","……得受不了","一人(ひとり)で留守番(るすばん)をして居(い)ると、寂(さび)しくて[[堪(たま)らない]]。","一个人看家，寂寞得受不了。","歯(は)が痛(いた)くて[[堪(たま)らない]]。","牙疼得受不了。"],["〜につけ","每当……就……","雨(あめ)の音(おと)を聞(き)く[[につけ]]、故郷(ふるさと)の夏(なつ)を思(おも)い出(だ)す。","每当听到雨声，就会想起故乡的夏天。","ニュースを見(み)る[[につけ]]、平和(へいわ)の大切(たいせつ)さを感(かん)じる。","每当看新闻，都会感到和平的珍贵。"],["〜事(こと)はない","不必……","失敗(しっぱい)しても、落(お)ち込(こ)む[[事(こと)はない]]。","即使失败了，也不必消沉。","未(ま)だ時間(じかん)は有(あ)るから、急(いそ)ぐ[[事(こと)はない]]。","还有时间，不必着急。"],["〜所(ところ)から","因为……，从……来看","声(こえ)が似(に)て居(い)る[[所(ところ)から]]、彼(かれ)は良(よ)く父親(ちちおや)と間違(まちが)えられる。","因为声音很像，他常被误认为是他父亲。","海(うみ)に近(ちか)い[[所(ところ)から]]、この町(まち)は昔(むかし)から漁業(ぎょぎょう)が盛(さか)んだ。","因为靠海，这个镇子自古以来渔业就很兴盛。"],["〜として","作为……","彼女(かのじょ)は医者(いしゃ)[[として]]、多(おお)くの命(いのち)を救(すく)って来(き)た。","她作为医生，挽救了很多生命。","留学生(りゅうがくせい)の代表(だいひょう)[[として]]、スピーチをした。","作为留学生代表做了演讲。"],["〜としたら","如果……的话","一億円(いちおくえん)有(あ)った[[としたら]]、何(なに)に使(つか)いますか。","如果有一亿日元，你会用来做什么？","彼(かれ)が来(こ)ない[[としたら]]、計画(けいかく)を変(か)えなければ成(な)らない。","如果他不来，就得改变计划。"],["〜を前提(ぜんてい)に","以……为前提","長期(ちょうき)の滞在(たいざい)[[を前提(ぜんてい)に]]、部屋(へや)を探(さが)して居(い)る。","以长期居住为前提在找房子。","全員(ぜんいん)が参加(さんか)する事(こと)[[を前提(ぜんてい)に]]、会場(かいじょう)を予約(よやく)した。","以全员参加为前提预订了会场。"],["〜にしては","作为……来说（却）","彼(かれ)は日本(にほん)に来(き)て一年(いちねん)[[にしては]]、日本語(にほんご)が上手(じょうず)だ。","以来日本一年来说，他的日语算很好了。","今日(きょう)は十月(じゅうがつ)[[にしては]]暖(あたた)かい。","以十月来说，今天算暖和的。"],["〜無(な)い物(もの)か","难道没有……吗（愿望）","何(なん)とか、この町(まち)に若者(わかもの)を呼(よ)び戻(もど)す方法(ほうほう)は[[無(な)い物(もの)か]]。","难道就没有什么办法，把年轻人重新吸引回这个镇子吗？","もっと安(やす)く旅行(りょこう)出来(でき)る方法(ほうほう)は[[無(な)い物(もの)か]]。","难道没有更便宜的旅行办法吗？"],["〜様(よう)に","希望……；为了……","子供達(こどもたち)が元気(げんき)に育(そだ)ちます[[様(よう)に]]。","愿孩子们健康成长。","後(うし)ろの席(せき)の人(ひと)にも聞(き)こえる[[様(よう)に]]、大(おお)きな声(こえ)で話(はな)した。","为了让后排的人也能听到，大声地说了话。"]],"vocab":[["一定","いってい","一定"],["水準","すいじゅん","水平"],["幸福感","こうふくかん","幸福感"],["羨む","うらやむ","羡慕"],["就職","しゅうしょく","就业"],["追い詰める","おいつめる","逼入绝境"],["体調を崩す","たいちょうをくずす","搞坏身体"],["評価","ひょうか","评价"],["繋がり","つながり","联系，纽带"],["満足感","まんぞくかん","满足感"],["案外","あんがい","意外"],["身近","みぢか","身边"],["安定","あんてい","稳定"],["重み","おもみ","分量"]],"short":"幸福とは","lv":3,"sum":"收入和幸福有多大关系？从一位辞去大公司工作的朋友谈起，思考什么是幸福。"},
{"title":"観察(かんさつ)する事(こと)","paras":[{"jp":"私(わたし)は大学(だいがく)で{{0:野鳥(やちょう)}}の研究(けんきゅう)をして居(い)る。研究(けんきゅう)と言(い)っても、その殆(ほとん)どは、{{1:只管(ひたすら)}}鳥(とり)を観察(かんさつ)する{{2:地道(じみち)}}な作業(さぎょう)だ。","zh":"我在大学研究野鸟。说是研究，其实大部分都是一心一意观察鸟类的踏实工作。"},{"jp":"毎朝(まいあさ)、散歩(さんぽ)[[がてら]]近(ちか)くの{{3:川原(かわら)}}で鳥(とり)の数(かず)を数(かぞ)える。或(あ)る朝(あさ)、{{4:双眼鏡(そうがんきょう)}}を{{5:覗(のぞ)}}いて居(い)る[[所(ところ)に]]、近所(きんじょ)の小学生(しょうがくせい)が「何(なに)をして居(い)るの」と話(はな)し掛(か)けて来(き)た。","zh":"每天早上，我借散步之机去附近的河滩数鸟。一天早上，我正举着双筒望远镜观察时，附近的一个小学生过来搭话：\"你在干什么呀？\""},{"jp":"私(わたし)が答(こた)える[[か答(こた)えないかのうちに]]、その子(こ)は「あ、カワセミだ」と叫(さけ)んだ。目(め)の前(まえ)を、青(あお)い鳥(とり)が一瞬(いっしゅん)で{{6:横切(よこぎ)}}ったのだ。私(わたし)は、自分(じぶん)より早(はや)く鳥(とり)を見付(みつ)けた子供(こども)の目(め)に驚(おどろ)いた。","zh":"我还没来得及回答，那孩子就喊道：\"啊，是翠鸟！\"一只蓝色的鸟在眼前一闪而过。孩子比我还先发现了鸟，他的眼力让我很惊讶。"},{"jp":"それ以来(いらい)、その子(こ)は時々(ときどき)観察(かんさつ)に付(つ)いて来(く)る様(よう)に成(な)った。母親(ははおや)は「御(お)忙(いそが)しい[[所(ところ)を]]済(す)みません」と{{7:恐縮(きょうしゅく)}}するが、私(わたし)に取(と)っても良(よ)い{{8:刺激(しげき)}}に成(な)って居(い)る。子供(こども)の質問(しつもん)[[に応(こた)えて]]説明(せつめい)する内(うち)に、自分(じぶん)の知識(ちしき)の曖昧(あいまい)な所(ところ)に気付(きづ)かされるのだ。","zh":"从那以后，那孩子时常跟着我去观察。他妈妈很过意不去，说\"在您忙的时候打扰了\"，但对我来说这也是很好的刺激。在回答孩子提问的过程中，我常会发现自己知识里含糊的地方。"},{"jp":"観察(かんさつ)は根気(こんき)の要(い)る仕事(しごと)だ。珍(めずら)しい鳥(とり)が来(く)る季節(きせつ)[[に備(そな)えて]]、何週間(なんしゅうかん)も前(まえ)から準備(じゅんび)をする。然(しか)し、そうした日(ひ)[[に限(かぎ)って]]雨(あめ)が降(ふ)ったり、鳥(とり)が全(まった)く姿(すがた)を見(み)せなかったりする。結局(けっきょく)、一度(いちど)も見(み)られ[[ず仕舞(じま)い]]の年(とし)も有(あ)る。","zh":"观察是需要耐心的工作。为了迎接珍稀鸟类到来的季节，要提前好几周做准备。可偏偏在那种日子会下雨，或者鸟根本不露面。结果也有一整年一次都没见到的时候。"},{"jp":"去年(きょねん)の冬(ふゆ)、雪(ゆき)の積(つ)もった山(やま)で観察(かんさつ)をして居(い)た時(とき)、足(あし)を滑(すべ)らせて{{9:崖(がけ)}}から落(お)ちる[[所(ところ)だった]]。幸(さいわ)い、一緒(いっしょ)に居(い)た仲間(なかま)が腕(うで)を{{10:掴(つか)}}んで呉(く)れたので、怪我(けが)をせ[[ずに済(す)んだ]]。それ以来(いらい)、暗(くら)く成(な)ら[[ないうちに]]山(やま)を下(お)りる事(こと)にして居(い)る。","zh":"去年冬天，在积雪的山上观察时，我脚下一滑，差点从悬崖上摔下去。幸好同行的伙伴抓住了我的胳膊，我才没有受伤。从那以后，我都趁天还没黑就下山。"},{"jp":"寒(さむ)さ[[やら]]{{11:眠気(ねむけ)}}やらと戦(たたか)いながらの観察(かんさつ)は、楽(らく)ではない。正直(しょうじき)、こんな地道(じみち)な作業(さぎょう)を一生(いっしょう)続(つづ)けるのは無理(むり)だと思(おも)う日(ひ)も有(あ)る。新(あたら)しい発見(はっけん)何(なん)て、私(わたし)には出来(でき)[[っこない]]と{{12:弱気(よわき)}}に成(な)る事(こと)も有(あ)る。","zh":"一边和寒冷、困倦作斗争一边观察，一点也不轻松。说实话，有时我也会想，一辈子坚持这么枯燥的工作是不可能的。有时还会泄气，觉得自己根本不可能有什么新发现。"},{"jp":"でも、毎日(まいにち)同(おな)じ場所(ばしょ)を見(み)続(つづ)けて居(い)ると、昨日(きのう)との僅(わず)かな違(ちが)いに気付(きづ)く事(こと)が有(あ)る。その一瞬(いっしゅん)の喜(よろこ)びの為(ため)なら、早起(はやお)き[[位(くらい)]]何(なん)でもない。観察(かんさつ)は特別(とくべつ)な才能(さいのう)が無(な)くても出来(でき)[[ないことはない]]。大切(たいせつ)なのは{{13:好奇心(こうきしん)}}を持(も)って見(み)続(つづ)ける事(こと)なのだと、あの小学生(しょうがくせい)が教(おし)えて呉(く)れた気(き)がする。","zh":"不过，每天持续观察同一个地方，有时会注意到和昨天之间细微的差别。为了那一瞬间的喜悦，早起这点事根本不算什么。观察这件事，即使没有特别的才能也不是做不到。我觉得，是那个小学生让我明白了：重要的是怀着好奇心一直看下去。"}],"grammar":[["〜がてら","顺便……，借……之机","買(か)い物(もの)[[がてら]]、駅前(えきまえ)の新(あたら)しい店(みせ)を覗(のぞ)いて見(み)た。","买东西时顺便去看了看车站前的新店。","友人(ゆうじん)の御(お)見舞(みま)い[[がてら]]、病院(びょういん)の近(ちか)くの公園(こうえん)を散歩(さんぽ)した。","去探望朋友，顺便在医院附近的公园散了散步。"],["〜所(ところ)に","正当……的时候","寝(ね)ようとして居(い)た[[所(ところ)に]]、友達(ともだち)から電話(でんわ)が来(き)た。","正要睡觉的时候，朋友打来了电话。","掃除(そうじ)をして居(い)る[[所(ところ)に]]、突然(とつぜん)客(きゃく)が来(き)た。","正在打扫的时候，突然来了客人。"],["〜か〜ないかのうちに","刚一……就……","電車(でんしゃ)のドアが開(あ)く[[か開(あ)かないかのうちに]]、乗客(じょうきゃく)が降(お)りて来(き)た。","电车门刚一开，乘客就下来了。","試合(しあい)が始(はじ)まる[[か始(はじ)まらないかのうちに]]、雨(あめ)が降(ふ)り出(だ)した。","比赛刚一开始，就下起了雨。"],["〜所(ところ)を","在……的时候（却打扰、麻烦）","御(お)休(やす)みの[[所(ところ)を]]、申(もう)し訳(わけ)御座(ござ)いません。","在您休息的时候打扰，非常抱歉。","危(あぶ)ない[[所(ところ)を]]、通(とお)り掛(か)かった人(ひと)に助(たす)けられた。","正危险的时候，被路过的人救了。"],["〜に応(こた)えて","响应……，不辜负……","視聴者(しちょうしゃ)の声(こえ)[[に応(こた)えて]]、番組(ばんぐみ)が再放送(さいほうそう)された。","应观众的呼声，节目重播了。","ファンの期待(きたい)[[に応(こた)えて]]、彼(かれ)は見事(みごと)に優勝(ゆうしょう)した。","不负粉丝的期待，他漂亮地夺冠了。"],["〜に備(そな)えて","为防备……，为……做准备","台風(たいふう)[[に備(そな)えて]]、窓(まど)にテープを貼(は)った。","为防台风，在窗户上贴了胶带。","面接(めんせつ)[[に備(そな)えて]]、質問(しつもん)への答(こた)え方(かた)を練習(れんしゅう)した。","为准备面试，练习了回答问题的方法。"],["〜に限(かぎ)って","偏偏……","傘(かさ)を持(も)って居(い)ない日(ひ)[[に限(かぎ)って]]、雨(あめ)が降(ふ)る。","偏偏在没带伞的日子下雨。","大事(だいじ)な日(ひ)[[に限(かぎ)って]]、寝坊(ねぼう)して仕舞(しま)う。","偏偏在重要的日子睡过头。"],["〜ず仕舞(じま)い","最终没能……","旅行先(りょこうさき)で、御(お)土産(みやげ)を買(か)わ[[ず仕舞(じま)い]]だった。","在旅行地到最后也没买纪念品。","結局(けっきょく)、彼(かれ)の本当(ほんとう)の名前(なまえ)は分(わ)から[[ず仕舞(じま)い]]だった。","结果，到最后也不知道他的真名。"],["〜所(ところ)だった","差点就……","危(あや)うく財布(さいふ)を落(お)とす[[所(ところ)だった]]。","差点把钱包弄丢了。","確認(かくにん)しなかったら、間違(まちが)った書類(しょるい)を出(だ)す[[所(ところ)だった]]。","要是没确认，就差点交错文件了。"],["〜ずに済(す)む","不用……就解决了","近(ちか)くに住(す)んで居(い)るので、満員電車(まんいんでんしゃ)に乗(の)ら[[ずに済(す)む]]。","住得近，所以不用挤满员电车。","保険(ほけん)に入(はい)って居(い)たので、治療費(ちりょうひ)を払(はら)わ[[ずに済(す)んだ]]。","因为买了保险，所以不用付治疗费。"],["〜ないうちに","趁还没……","暗(くら)く成(な)ら[[ないうちに]]、家(いえ)に帰(かえ)ろう。","趁天还没黑，回家吧。","忘(わす)れ[[ないうちに]]、彼(かれ)に返事(へんじ)をして置(お)こう。","趁还没忘，先给他回复吧。"],["〜やら〜やら","又……又……","宿題(しゅくだい)[[やら]]アルバイト[[やら]]で、遊(あそ)ぶ時間(じかん)が無(な)い。","又是作业又是打工，没时间玩。","部屋(へや)には、本(ほん)[[やら]]服(ふく)[[やら]]が散(ち)らかって居(い)る。","房间里乱七八糟地堆着书啊衣服啊。"],["〜っこない","根本不可能……","こんな難(むずか)しい試験(しけん)、受(う)かり[[っこない]]。","这么难的考试，根本不可能考上。","彼(かれ)が謝(あやま)り[[っこない]]よ。頑固(がんこ)だから。","他根本不可能道歉的，他那么固执。"],["〜位(くらい)","……左右；至少……","一週間(いっしゅうかん)[[位(くらい)]]なら、休(やす)んでも大丈夫(だいじょうぶ)だ。","一周左右的话，休息也没关系。","疲(つか)れたなら、少(すこ)し[[位(くらい)]]休(やす)んでも良(よ)いよ。","累了的话，稍微休息一下也没关系。"],["〜ないことはない","也不是不……","頑張(がんば)れば、一日(いちにち)で読(よ)め[[ないことはない]]。","努力一下的话，一天也不是读不完。","少(すこ)し遠(とお)いが、歩(ある)いて行(い)け[[ないことはない]]。","有点远，但也不是走不过去。"]],"vocab":[["野鳥","やちょう","野鸟"],["只管","ひたすら","一心一意，只顾"],["地道","じみち","踏实"],["川原","かわら","河滩"],["双眼鏡","そうがんきょう","双筒望远镜"],["覗く","のぞく","窥视，往里看"],["横切る","よこぎる","横穿"],["恐縮","きょうしゅく","过意不去，惶恐"],["刺激","しげき","刺激"],["崖","がけ","悬崖"],["掴む","つかむ","抓住"],["眠気","ねむけ","困意"],["弱気","よわき","泄气，胆怯"],["好奇心","こうきしん","好奇心"]],"short":"観察する事","lv":3,"sum":"研究野鸟的大学生和一个爱看鸟的小学生，在日复一日的观察中体会\"看\"的意义。"},
{"title":"文化(ぶんか)の違(ちが)いを越(こ)えて","paras":[{"jp":"私(わたし)が住(す)んで居(い)る国際学生寮(こくさいがくせいりょう)には、二十(にじゅう)以上(いじょう)の国(くに)から来(き)た学生(がくせい)が暮(く)らして居(い)る。今年(ことし)、私(わたし)は{{0:寮長(りょうちょう)}}を任(まか)された。{{1:入寮(にゅうりょう)}}[[に際(さい)して]]新入生(しんにゅうせい)に寮(りょう)の規則(きそく)を説明(せつめい)するのも、私(わたし)の仕事(しごと)だ。","zh":"我住的国际学生宿舍里，生活着来自二十多个国家的学生。今年我被任命为舍长。新生入住时向他们说明宿舍规定，也是我的工作。"},{"jp":"寮(りょう)の{{2:掲示板(けいじばん)}}には、「清掃中(せいそうちゅう)[[に付(つ)き]]立(た)ち入(い)り禁止(きんし)」「日曜日(にちようび)[[を除(のぞ)いて]]、夜(よる)十一時(じゅういちじ)以降(いこう)は静(しず)かに」等(など)の{{3:張(は)り紙(がみ)}}が何枚(なんまい)も貼(は)られて居(い)る。然(しか)し、言葉(ことば)も習慣(しゅうかん)も違(ちが)う学生達(がくせいたち)が、全(すべ)てのルールを直(す)ぐに理解(りかい)出来(でき)る訳(わけ)ではない。","zh":"宿舍公告栏上贴着好几张告示，比如\"清扫中，禁止入内\"\"除周日外，晚上11点以后请保持安静\"等。但是，语言和习惯都不同的学生们，并不能马上理解所有规定。"},{"jp":"或(あ)る日(ひ)、{{4:共用(きょうよう)}}キッチンが油(あぶら)[[だらけ]]に成(な)って居(い)ると{{5:苦情(くじょう)}}が来(き)た。調(しら)べて見(み)ると、{{6:母国(ぼこく)}}では料理(りょうり)の後片付(あとかたづ)けは専門(せんもん)の人(ひと)がすると言(い)う学生(がくせい)が居(い)た。夜中(よなか)に周(まわ)りの迷惑(めいわく)[[も構(かま)わず]]{{7:大音量(だいおんりょう)}}で音楽(おんがく)を聞(き)く学生(がくせい)も居(い)て、私(わたし)は毎日(まいにち)の様(よう)に苦情(くじょう)の対応(たいおう)に追(お)われた。","zh":"有一天，有人投诉公共厨房满是油污。一调查才发现，有个学生说在他的国家，做完饭后的收拾是由专人负责的。还有学生半夜不顾周围人的感受大声放音乐，我几乎每天都忙于处理投诉。"},{"jp":"規則(きそく)を守(まも)らない学生(がくせい)を、{{8:一方的(いっぽうてき)}}に責(せ)める[[可(べ)きではない]]。文化(ぶんか)の違(ちが)いを知(し)ら[[ないことには]]、本当(ほんとう)の解決(かいけつ)には繋(つな)がらないからだ。そこで私(わたし)は、月(つき)に一度(いちど)、全員(ぜんいん)が集(あつ)まる交流会(こうりゅうかい)を開(ひら)く事(こと)にした。","zh":"不应该单方面地责备不守规定的学生。因为不了解文化差异，就无法真正解决问题。于是我决定每月举办一次全员参加的交流会。"},{"jp":"最初(さいしょ)の交流会(こうりゅうかい)は、参加者(さんかしゃ)が十人(じゅうにん)にも満(み)たなかった。然(しか)し、皆(みんな)で母国(ぼこく)の料理(りょうり)を作(つく)る会(かい)を{{9:企画(きかく)}}し、「準備(じゅんび)が出来(でき)[[次第(しだい)]]始(はじ)めるので、気軽(きがる)に来(き)て下(くだ)さい」と呼(よ)び掛(か)けると、当日(とうじつ)は五十人(ごじゅうにん)以上(いじょう)が集(あつ)まった。料理(りょうり)を作(つく)る[[序(つい)でに]]、片付(かたづ)けの仕方(しかた)も一緒(いっしょ)に確認(かくにん)した。","zh":"第一次交流会，参加者还不到十个人。但是，当我们策划了一起做家乡菜的活动，并号召\"准备好了就开始，欢迎随时过来\"后，当天来了五十多个人。做菜时，我们也顺便一起确认了收拾的方法。"},{"jp":"最初(さいしょ)は黙(だま)って居(い)た学生(がくせい)も、料理(りょうり)の話(はなし)に成(な)ると楽(たの)しそうに話(はな)し始(はじ)めた。先(さっ)き迄(まで)笑(わら)って居(い)た[[かと思(おも)うと]]、母国(ぼこく)の家族(かぞく)を思(おも)い出(だ)して{{10:涙(なみだ)ぐむ}}学生(がくせい)も居(い)た。","zh":"一开始沉默的学生，一聊到做菜也开心地说了起来。还有学生刚才还在笑，转眼想起家乡的家人，眼眶就湿润了。"},{"jp":"交流会(こうりゅうかい)の後(あと)、苦情(くじょう)は目(め)に見(み)えて減(へ)った。先日(せんじつ)、大学(だいがく)の{{11:担当者(たんとうしゃ)}}から連絡(れんらく)が有(あ)り、この取(と)り組(く)みを他(ほか)の寮(りょう)でも{{12:参考(さんこう)}}にしたい[[との事(こと)]]だった。来月(らいげつ)からは、希望者(きぼうしゃ)[[に限(かぎ)り]]、地域(ちいき)の祭(まつ)りへの参加(さんか)も計画(けいかく)して居(い)る。","zh":"交流会之后，投诉明显减少了。前几天，大学的负责人联系我，说想让其他宿舍也参考这个做法。从下个月起，我们还计划组织有意愿的人参加当地的祭典。"},{"jp":"寮長(りょうちょう)を引(ひ)き受(う)けた以上(いじょう)、問題(もんだい)から逃(に)げる[[訳(わけ)には行(い)かない]]と思(おも)って頑張(がんば)って来(き)た。文化(ぶんか)の違(ちが)いは、時(とき)に{{13:摩擦(まさつ)}}を生(う)む。だが、相手(あいて)を知(し)ろうとする気持(きも)ちさえ有(あ)れば、違(ちが)いは壁(かべ)ではなく、互(たが)いを豊(ゆた)かにする物(もの)に成(な)るのだと、私(わたし)はこの一年(いちねん)で学(まな)んだ。","zh":"既然接下了舍长的工作，我就觉得不能逃避问题，一直努力到现在。文化差异有时会带来摩擦。但这一年我明白了：只要怀着想去了解对方的心，差异就不再是墙壁，而会成为让彼此更加丰富的东西。"}],"grammar":[["〜に際(さい)して","在……之际","卒業(そつぎょう)[[に際(さい)して]]、恩師(おんし)に記念品(きねんひん)を贈(おく)った。","毕业之际，向恩师赠送了纪念品。","工事(こうじ)の開始(かいし)[[に際(さい)して]]、安全(あんぜん)の確認(かくにん)が行(おこな)われた。","开工之际，进行了安全确认。"],["〜に付(つ)き","因为……（告示）；每……","本日(ほんじつ)は定休日(ていきゅうび)[[に付(つ)き]]、御(お)休(やす)みさせて頂(いただ)きます。","今天是固定休息日，暂停营业。","入場料(にゅうじょうりょう)は、大人(おとな)一人(ひとり)[[に付(つ)き]]千円(せんえん)です。","入场费每位成人一千日元。"],["〜を除(のぞ)いて","除了……","数学(すうがく)[[を除(のぞ)いて]]、全(すべ)ての科目(かもく)が満点(まんてん)だった。","除了数学，所有科目都是满分。","年末年始(ねんまつねんし)[[を除(のぞ)いて]]、毎日(まいにち)営業(えいぎょう)して居(い)ます。","除年末年初外，每天营业。"],["〜だらけ","满是……","雨(あめ)の中(なか)を走(はし)ったので、靴(くつ)が泥(どろ)[[だらけ]]に成(な)った。","在雨里跑过，鞋子上满是泥。","一人(ひとり)暮(ぐ)らしの彼(かれ)の部屋(へや)は、塵(ごみ)[[だらけ]]だった。","他一个人住的房间里到处是垃圾。"],["〜も構(かま)わず","不顾……","彼(かれ)は服(ふく)が汚(よご)れるの[[も構(かま)わず]]、子供(こども)を助(たす)けに川(かわ)に入(はい)った。","他不顾衣服弄脏，跳进河里去救孩子。","夜中(よなか)なの[[も構(かま)わず]]、隣(となり)の部屋(へや)から大(おお)きな声(こえ)が聞(き)こえる。","不管是不是半夜，隔壁房间总传来很大的声音。"],["〜可(べ)きではない","不应该……","他人(たにん)の秘密(ひみつ)を、勝手(かって)に話(はな)す[[可(べ)きではない]]。","不应该擅自说出别人的秘密。","見(み)た目(め)丈(だけ)で人(ひと)を判断(はんだん)す[[可(べ)きではない]]。","不应该只凭外表判断一个人。"],["〜ないことには","不……的话就（不）……","実際(じっさい)に行(い)って見(み)[[ないことには]]、その町(まち)の良(よ)さは分(わ)からない。","不实际去一趟，就不知道那个城镇的好。","熱(ねつ)が下(さ)がら[[ないことには]]、学校(がっこう)には行(い)けない。","烧不退的话，就没法去上学。"],["〜次第(しだい)","一……就马上……","結果(けっか)が分(わ)かり[[次第(しだい)]]、御(ご)報告(ほうこく)します。","一知道结果，就向您报告。","雨(あめ)が止(や)み[[次第(しだい)]]、出発(しゅっぱつ)します。","雨一停就出发。"],["〜序(つい)でに","顺便……","図書館(としょかん)へ行(い)く[[序(つい)でに]]、この本(ほん)を返(かえ)して呉(く)れませんか。","你去图书馆时，能顺便帮我把这本书还了吗？","駅(えき)迄(まで)行(い)った[[序(つい)でに]]、銀行(ぎんこう)にも寄(よ)った。","去车站时，顺便也去了趟银行。"],["〜かと思(おも)うと","刚一……马上就……","赤(あか)ちゃんは泣(な)いて居(い)た[[かと思(おも)うと]]、もう笑(わら)って居(い)る。","婴儿刚才还在哭，转眼又笑了。","晴(は)れた[[かと思(おも)うと]]、又(また)直(す)ぐに曇(くも)って来(き)た。","刚放晴，马上又阴了下来。"],["〜との事(こと)だ","据说……，（某人）说……","先生(せんせい)から連絡(れんらく)が有(あ)り、明日(あした)の授業(じゅぎょう)は休講(きゅうこう)[[との事(こと)だ]]。","老师联系说，明天的课停上。","母(はは)の話(はなし)では、祖父(そふ)は元気(げんき)にして居(い)る[[との事(こと)です]]。","听妈妈说，爷爷身体很好。"],["〜に限(かぎ)り","仅限……","先着(せんちゃく)百名様(ひゃくめいさま)[[に限(かぎ)り]]、プレゼントを差(さ)し上(あ)げます。","仅限前一百名，赠送礼品。","雨天(うてん)の場合(ばあい)[[に限(かぎ)り]]、体育館(たいいくかん)で行(おこな)います。","仅在下雨的情况下，改在体育馆举行。"],["〜訳(わけ)には行(い)かない","（出于情理）不能……","明日(あした)は大事(だいじ)な試験(しけん)なので、遊(あそ)んで居(い)る[[訳(わけ)には行(い)かない]]。","明天有重要的考试，不能再玩了。","友達(ともだち)の頼(たの)みだから、断(ことわ)る[[訳(わけ)には行(い)かない]]。","是朋友的请求，没法拒绝。"]],"vocab":[["寮長","りょうちょう","舍长"],["入寮","にゅうりょう","入住宿舍"],["掲示板","けいじばん","公告栏"],["張り紙","はりがみ","告示，贴的纸"],["共用","きょうよう","共用"],["苦情","くじょう","投诉，抱怨"],["母国","ぼこく","祖国"],["大音量","だいおんりょう","大音量"],["一方的","いっぽうてき","单方面的"],["企画","きかく","策划"],["涙ぐむ","なみだぐむ","眼眶湿润"],["担当者","たんとうしゃ","负责人"],["参考","さんこう","参考"],["摩擦","まさつ","摩擦"]],"short":"文化の違い","lv":3,"sum":"国际学生宿舍的舍长，如何通过一场场交流会化解文化差异带来的摩擦。"}];

"友達に誘われた事を切っ掛けに、ジョギングを始めた。":{"s":[["友達(ともだち)に誘(さそ)われた事(こと)","契机的内容：被朋友邀请这件事"],["を切(き)っ掛(か)けに","本条语法：以……为契机"],["ジョギングを始(はじ)めた","结果：开始了慢跑"]],"n":["「誘(さそ)われた」= 「誘(さそ)う」（邀请）的被动形「誘(さそ)われる」+ 过去「た」，「友達(ともだち)に」的「に」表示动作的发出者：被朋友邀请。","「〜た事(こと)」：用「事(こと)」把前面整个小句变成名词，才能接「を切(き)っ掛(か)けに」。名词可以直接接，例如「入学(にゅうがく)を切(き)っ掛(か)けに」。","「始(はじ)める」是他动词，所以用「ジョギングを始(はじ)める」；自动词「始(はじ)まる」则说「授業(じゅぎょう)が始(はじ)まる」。"],"w":[247,1742,1431,1743,27]},
"引っ越しを切っ掛けに、要らない物を全部捨てた。":{"s":[["引(ひ)っ越(こ)しを切(き)っ掛(か)けに","契机：以搬家为契机"],["要(い)らない物(もの)を","对象：不需要的东西"],["全部(ぜんぶ)捨(す)てた","动作：全部扔掉了"]],"n":["「引(ひ)っ越(こ)し」是「引(ひ)っ越(こ)す」（搬家）的名词形，名词直接接「を切(き)っ掛(か)けに」。","「要(い)らない」=「要(い)る」（需要）的否定，修饰后面的「物(もの)」：不需要的东西。「要(い)る」虽然以「る」结尾，却是五段动词，否定是「要(い)らない」。","「全部(ぜんぶ)」放在动词前作副词：全部（扔掉）。"],"w":[248,1431,419,154,1387]},
"免許は取った物の、一度も運転した事が無い。":{"s":[["免許(めんきょ)は取(と)った物(もの)の","前提：驾照虽然拿到了"],["一度(いちど)も","强调：一次也（不）"],["運転(うんてん)した事(こと)が無(な)い","结果：没有开过车的经历"]],"n":["「〜た物(もの)の」：承认前面的事实，后面接与预期相反的结果，比「けれど」更书面。","「免許(めんきょ)を取(と)る」= 考取驾照，这里把「を」换成「は」，提出话题并带对比语气。","「〜た事(こと)が無(な)い」= 没有做过……的经历；与「一度(いちど)も」搭配，语气更强。"],"w":[1744,522,532,301]},

"試験は思って居た以上に難しかった。":{"s":[["試験(しけん)は","话题：考试"],["思(おも)って居(い)た以上(いじょう)に","比较基准：比（之前）想的更"],["難(むずか)しかった","结果：很难"]],"n":["「思(おも)って居(い)た」= 「思(おも)う」的「て居(い)る」形 + 过去：一直以为的、原先想象的。","「〜以上(いじょう)に」：超过前面的程度。前面常接「思(おも)った・予想(よそう)した・期待(きたい)した」等表示预想的词。","「難(むずか)しかった」是い形容词「難(むずか)しい」的过去形：去掉「い」+「かった」。"],"w":[152,42,902]},

"この店は味は勿論、値段も手頃だ。":{"s":[["この店(みせ)は","大话题：这家店"],["味(あじ)は勿論(もちろん)","理所当然的一项：味道自不必说"],["値段(ねだん)も","追加的一项：价格也"],["手頃(てごろ)だ","评价：实惠"]],"n":["「AはBは勿論(もちろん)、Cも〜」：B 理所当然，C 也……。后半常用「も」呼应。","一句里出现两个「は」：第一个提出大话题（这家店），第二个是「〜は勿論(もちろん)」固定搭配的一部分。","「手頃(てごろ)」是な形容词：价格、大小等正合适。「手頃(てごろ)な値段(ねだん)」= 实惠的价格。"],"w":[39,411,1475,1104,322,1746]},

"冗談にしても、そんな言い方は失礼だ。":{"s":[["冗談(じょうだん)にしても","让步：即使是开玩笑"],["そんな言(い)い方(かた)は","话题：那种说法"],["失礼(しつれい)だ","判断：很失礼"]],"n":["「〜にしても」：就算承认前面的情况，后面的判断也不变。名词直接接。","「言(い)い方(かた)」= 「言(い)う」的ます形「言(い)い」+「方(かた)」：说法。","「失礼(しつれい)だ」是な形容词「失礼(しつれい)」+「だ」：没礼貌、失礼。"],"w":[1749,1231,1750,309]},

"係員の指示に従って、順番に入場して下さい。":{"s":[["係員(かかりいん)の指示(しじ)に従(したが)って","依据：按照工作人员的指示"],["順番(じゅんばん)に","方式：依次"],["入場(にゅうじょう)して下(くだ)さい","请求：请入场"]],"n":["「〜に従(したが)って」（按照）前面接规则、指示、说明等名词。","「順番(じゅんばん)に」：名词「順番(じゅんばん)」+「に」作副词：按顺序地。","「〜て下(くだ)さい」：请求、指示的礼貌说法；广播、告示里很常见。"],"w":[1751,1752,1753,567]},
"説明書に従って組み立てたら、簡単に出来た。":{"s":[["説明書(せつめいしょ)に従(したが)って","依据：按照说明书"],["組(く)み立(た)てたら","条件：组装之后"],["簡単(かんたん)に出来(でき)た","结果：很容易就做好了"]],"n":["「〜たら」后面接过去式，表示“做了……之后，发现/结果……”，不是假设。","「組(く)み立(た)てる」= 组装，复合动词：「組(く)む」+「立(た)てる」。","「簡単(かんたん)に」是な形容词「簡単(かんたん)」的副词形：容易地。「出来(でき)た」：做成了、完成了。"],"w":[128,1754,1039,102]},

"都市の人口は増える一方だ。":{"s":[["都市(とし)の人口(じんこう)は","话题：城市的人口"],["増(ふ)える一方(いっぽう)だ","本条语法：一个劲地增加"]],"n":["「〜一方(いっぽう)だ」：变化只朝一个方向持续，前面接表示变化的动词辞书形（増える・減る・悪く成る等）。","「増(ふ)える」是自动词（人口が増える），他动词是「増(ふ)やす」（人口を増やす）。","这个语法多用于令人担心的变化，带一点无奈的语气。"],"w":[1760,19,17]},
"説明を聞けば聞く程、分からなく成る一方だ。":{"s":[["説明(せつめい)を聞(き)けば聞(き)く程(ほど)","条件：越听解释"],["分(わ)からなく成(な)る一方(いっぽう)だ","结果：就越来越糊涂"]],"n":["「〜ば〜程(ほど)」：越……越……，同一个动词重复：「聞(き)けば聞(き)く程(ほど)」。","「分(わ)からなく成(な)る」= 「分(わ)からない」去「い」+「く成(な)る」：变得不明白。","后面再接「一方(いっぽう)だ」，强调情况只往更糟的方向发展。"],"w":[128,323,131]},
"病気に成って初めて、健康の大切さが分かった。":{"s":[["病気(びょうき)に成(な)って初(はじ)めて","前提：生了病以后才"],["健康(けんこう)の大切(たいせつ)さが","对象：健康的重要性"],["分(わ)かった","结果：明白了"]],"n":["「〜て初(はじ)めて」：经历了前面的事之后，才第一次意识到后面的事。","「病気(びょうき)に成(な)る」= 生病；名词 +「に成(な)る」表示变成某种状态。","「大切(たいせつ)さ」= な形容词「大切(たいせつ)」+「さ」变成名词：重要性。「分(わ)かる」的对象用「が」。"],"w":[713,373,71,141,131]},
"日本に来て初めて、本物の雪を見た。":{"s":[["日本(にほん)に来(き)て初(はじ)めて","前提：来到日本以后才"],["本物(ほんもの)の雪(ゆき)を見(み)た","结果：第一次看到真正的雪"]],"n":["「来(き)て」是「来(く)る」的て形，读「きて」。","「本物(ほんもの)」= 真东西、真正的；「本物(ほんもの)の雪(ゆき)」= 真正的雪。","「〜て初(はじ)めて」后面常接「分(わ)かった・気付(きづ)いた・見(み)た」等第一次经历的过去式。"],"w":[690,472,373,1761,220,583]},
"一人で全部遣ると成ると、一週間は掛かるだろう。":{"s":[["一人(ひとり)で全部(ぜんぶ)遣(や)ると成(な)ると","假设：如果要一个人全部做"],["一週間(いっしゅうかん)は","最少的量：至少一周"],["掛(か)かるだろう","推测：会花费吧"]],"n":["「〜と成(な)ると」：一旦到了……的情况，就会……；前面是比较特别或困难的设定。","「一人(ひとり)で」的「で」表示动作的方式、人数：一个人（做）。「遣(や)る」= 做（口语）。","「一週間(いっしゅうかん)は掛(か)かる」：数量词 +「は」表示最低限度，“少说也要一周”。「だろう」表示推测。"],"w":[154,1069,7]},
"海外に住むと成ると、言葉の問題が出て来る。":{"s":[["海外(かいがい)に住(す)むと成(な)ると","假设：一旦要住到国外"],["言葉(ことば)の問題(もんだい)が","主语：语言问题"],["出(で)て来(く)る","结果：就会出现"]],"n":["「海外(かいがい)に住(す)む」：居住的地点用「に」。","「出(で)て来(く)る」：（问题等）冒出来、出现；「〜て来(く)る」表示事情逐渐浮现。","「と成(な)ると」常引出因新情况而产生的问题或必须面对的事。"],"w":[1421,303,189,499,720]},

"便利に成ったとは言え、手続きは未だ複雑だ。":{"s":[["便利(べんり)に成(な)ったとは言(い)え","让步：虽说变方便了"],["手続(てつづ)きは","话题：手续"],["未(ま)だ複雑(ふくざつ)だ","相反的情况：还是很复杂"]],"n":["这里「とは言(い)え」接在句子（普通形）后面，作用和「けれども」相近，但更书面。","「便利(べんり)に成(な)る」：な形容词 +「に成(な)る」= 变得方便。","「手続(てつづ)き」= 办理的手续，在日本生活中非常常用。"],"w":[1149,1034,92,880,1764]},

"実際に食べて見ない事には、美味しいかどうか分からない。":{"s":[["実際(じっさい)に食(た)べて見(み)ない事(こと)には","条件：不实际尝一尝的话"],["美味(おい)しいかどうか","内容：好吃还是不好吃"],["分(わ)からない","结果：不知道"]],"n":["「〜ない事(こと)には」后面一定接否定或“无法”的意思：不先做前面的事，后面就无从谈起。","「食(た)べて見(み)る」：「〜て見(み)る」表示试着做。","「〜かどうか」：是否……；放在「分(わ)からない・知(し)らない」等前面作宾语。"],"w":[1021,605,583,939,1668,131]},

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ruby = s => s.replace(/([一-鿿々〆ヶ]+)\(([ぁ-ゖー]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
const parse = () => {
  const h = location.hash, m = h.match(/^#\/a\/(\d+)$/);
  if (m) return { route:'a', idx:+m[1] };
  return { route: ({'#/syn':'syn','#/art':'art','#/gram':'gram','#/verb':'verb'})[h] || 'home', idx:0 };
};

/* ---------- 本地词典搜索 ---------- */
let DICT=null, dictP=null, wsN=0;
const bus = Vue.reactive({ text:'', n:0 });   /* 把文字填进当前页面的查词框 */
const fillSearch = t => { bus.text=t; bus.n++; };
const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
const hasKanji = s => /[一-鿿々]/.test(s);
function loadDict(){
  if(!dictP) dictP = fetch('dict.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ DICT = d.map(e=>({e, w:e[0], a:e[1], r:hira(e[2])})); })
    .catch(err=>{ dictP=null; throw err; });
  return dictP;
}
function searchDict(raw){
  const q=raw.trim().replace(/\s+/g,''); if(!q || !DICT) return [];
  const qn=hira(q), hits=[];
  for(const d of DICT){
    let t=-1;
    if(d.w===q||d.a===q||d.r===qn) t=0;
    else if(d.w.startsWith(q)||(d.a&&d.a.startsWith(q))||d.r.startsWith(qn)) t=1;
    else if(q.length>1 && hasKanji(q) && (d.w.includes(q)||d.a.includes(q))) t=2;
    if(t>=0) hits.push([t, d.e[5]?0:1, (d.a||d.w).length, d.e]);
  }
  hits.sort((x,y)=>x[0]-y[0]||x[1]-y[1]||x[2]-y[2]);
  return hits.slice(0,8).map(h=>h[3]);
}

  data(){ return { q:'', open:false, state: DICT?'ready':'idle', uid:'ws-'+(++wsN), bus }; },

  methods:{

      if(this.state==='ready') return;
      if(DICT){ this.state='ready'; return; }

    head(r){ return (!hasKanji(r[0]) && r[1] && hasKanji(r[1])) ? r[1] : r[0]; },
    other(r){ const h=this.head(r); return [r[0],r[1]].find(x=>x && x!==h && x!==r[2]) || ''; }
  },

  unmounted(){ document.removeEventListener('pointerdown',this.onDoc); }

/* 挑设备上最好的日语声音：自然音（Edge）> 增强/高级（Apple）> Google > 其他 */
let VOICE=null;
const bestVoice=()=>{
  if(VOICE) return VOICE;
  const vs=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>/^ja[-_]?/i.test(v.lang)):[];
  if(!vs.length) return null;
  const score=v=>{ const n=v.name;
    if(/Natural|Online/i.test(n)) return 100+(/Nanami/i.test(n)?5:0);
    if(/Premium|Enhanced|拡張|高品質/i.test(n)) return 80;
    if(/Google/i.test(n)) return 60;
    if(/O-?ren|Kyoko|Otoya|Hattori|Haruka|Ayumi|Nanami|Sayaka/i.test(n)) return 40;
    return v.localService?20:10; };
  VOICE=vs.sort((a,b)=>score(b)-score(a))[0]; return VOICE;
};
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.addEventListener?.('voiceschanged',()=>{ VOICE=null; }); }

/* ---------- 动词变形引擎 ----------
   动词：{ w:'書く', r:'かく', g:1|2|'s'|'k', zh:'写' }
   g：1 = 一类（五段），2 = 二类（一段），'s' = サ变（する），'k' = カ变（来る）
   输出带注音标记：漢字(かな)＋假名 */
const VB_ROW = {う:'わいうえお',く:'かきくけこ',ぐ:'がぎぐげご',す:'さしすせそ',つ:'たちつてと',ぬ:'なにぬねの',ぶ:'ばびぶべぼ',む:'まみむめも',る:'らりるれろ'};
const VB_DAN = {a:0,i:1,u:2,e:3,o:4};
const vbK = c => /[一-鿿々〆ヶ]/.test(c);
/* 汉字与读音对齐：受け付ける / うけつける → 受(う)け付(つ)ける */
function vbAlign(w, r){
  const segs = w.match(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g) || [];
  if(!segs.some(s=>vbK(s[0]))) return w;
  const re = new RegExp('^' + segs.map(s => vbK(s[0]) ? '(.+?)' : s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('') + '$');
  const m = r.match(re); if(!m) return w;
  let i = 1; return segs.map(s => vbK(s[0]) ? s + '(' + m[i++] + ')' : s).join('');
}
/* 拆成「前面不变的部分（带注音）」＋「词尾假名」 */
function vbSplit(v){
  if(v.g==='s'){ const p=v.w.slice(0,-2), pr=v.r.slice(0,-2); return { pre: p ? vbAlign(p,pr) : '', tail:'する' }; }
  if(v.g==='k'){ return { pre:'', tail:'くる', kanji: v.w.startsWith('来') }; }
