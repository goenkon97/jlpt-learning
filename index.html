{"title":"引(ひ)っ越(こ)しの手続(てつづ)き","paras":[{"jp":"大学院(だいがくいん)への進学(しんがく)が決(き)まり、四年間(よねんかん)住(す)んだアパートを出(で)る事(こと)に成(な)った。引(ひ)っ越(こ)す[[からには]]、{{0:荷造(にづく)り}}[[に加(くわ)えて]]、{{1:役所(やくしょ)}}の手続(てつづ)きも済(す)ませなければ成(な)らない。","zh":"我考上了研究生，要搬出住了四年的公寓。既然要搬家，除了打包行李，还得把政府机关的手续都办完。"},{"jp":"最初(さいしょ)は「一日(いちにち)有(あ)れば終(お)わる[[に決(き)まって居(い)る]]」と{{2:高(たか)を括(くく)}}って居(い)た。然(しか)し調(しら)べて見(み)ると、{{3:転出届(てんしゅつとどけ)}}、電気(でんき)やガスの{{4:解約(かいやく)}}、郵便物(ゆうびんぶつ)の{{5:転送(てんそう)}}等(など)、遣(や)る事(こと)が山(やま)の様(よう)に有(あ)った。","zh":"一开始我小看了这件事，以为\"一天肯定能搞定\"。可是一查，迁出申报、水电燃气解约、邮件转寄等等，要办的事堆积如山。"},{"jp":"荷造(にづく)りも思(おも)った以上(いじょう)に大変(たいへん)だった。四年間(よねんかん)で物(もの)が[[次第(しだい)に]]増(ふ)えて居(い)たらしく、段(だん)ボール二十箱(にじゅっぱこ)でも足(た)りなかった。本(ほん)を詰(つ)めて居(い)る[[所(ところ)に]]{{6:大家(おおや)}}さんが訪(たず)ねて来(き)て、{{7:退去(たいきょ)}}の日(ひ)を確認(かくにん)された。","zh":"打包也比想象的辛苦。四年里东西好像在不知不觉中越积越多，二十个纸箱都不够装。正在装书的时候，房东来了，跟我确认了退房的日子。"},{"jp":"引(ひ)っ越(こ)しの前日(ぜんじつ)は、疲(つか)れて居(い)ても休(やす)んで[[は居(い)られなかった]]。夜遅(よるおそ)く迄(まで)掃除(そうじ)を続(つづ)け、危(あや)うく大切(たいせつ)な書類(しょるい)を捨(す)てて仕舞(しま)う[[所(ところ)だった]]。","zh":"搬家前一天，再累也不能休息。一直打扫到深夜，差点把重要的文件扔掉。"},{"jp":"当日(とうじつ)は、{{8:業者(ぎょうしゃ)}}の方(かた)が{{9:手際(てぎわ)}}良(よ)く荷物(にもつ)を運(はこ)んで呉(く)れた。忙(いそが)しい[[所(ところ)を]]手伝(てつだ)いに来(き)て呉(く)れた友人(ゆうじん)には、本当(ほんとう)に感謝(かんしゃ)して居(い)る。結局(けっきょく)、前(まえ)から行(い)きたかった近所(きんじょ)のラーメン屋(や)には、行(い)か[[ず仕舞(じま)い]]だった。","zh":"当天，搬家公司的人手脚麻利地把行李运走了。朋友在百忙之中来帮忙，我真的很感激。结果，一直想去的附近那家拉面店，到最后也没去成。"},{"jp":"新(あたら)しい町(まち)に着(つ)いたら、十四日(じゅうよっか)以内(いない)に{{10:転入届(てんにゅうとどけ)}}を出(だ)さなければ成(な)らない。区役所(くやくしょ)の{{11:窓口(まどぐち)}}は混(こ)んで居(い)たが、職員(しょくいん)の方(かた)が丁寧(ていねい)に説明(せつめい)して呉(く)れたので、慌(あわ)てる[[事(こと)はなかった]]。最近(さいきん)は窓口(まどぐち)[[に代(か)わって]]、オンラインで出来(でき)る手続(てつづ)きも増(ふ)えて居(い)るそうだ。","zh":"到了新的城市，必须在14天内提交迁入申报。区政府窗口人很多，但工作人员耐心地给我讲解，所以没什么好慌的。听说最近可以代替窗口、在网上办理的手续也越来越多了。"},{"jp":"一人(ひとり)で全(すべ)てを{{12:遣(や)り遂(と)げ}}られる[[訳(わけ)が無(な)い]]と思(おも)って居(い)たが、周(まわ)りの人(ひと)に助(たす)けられて、何(なん)とか新生活(しんせいかつ)を始(はじ)められた。皆(みんな)の期待(きたい)[[に応(こた)えて]]、大学院(だいがくいん)では確(しっか)り研究(けんきゅう)に{{13:取(と)り組(く)}}もうと思(おも)う。","zh":"我原以为自己一个人不可能全部搞定，但在周围人的帮助下，总算开始了新生活。为了不辜负大家的期待，我打算在研究生院踏踏实实地做研究。"}],"grammar":[["〜からには","既然……就……","約束(やくそく)した[[からには]]、必(かなら)ず守(まも)らなければ成(な)らない。","既然约好了，就一定要遵守。","日本(にほん)に留学(りゅうがく)する[[からには]]、日本語(にほんご)を真剣(しんけん)に勉強(べんきょう)する積(つ)もりだ。","既然来日本留学，我就打算认真学日语。"],["〜に加(くわ)えて","加上……，除……之外还","雨(あめ)[[に加(くわ)えて]]、風(かぜ)も強(つよ)く成(な)って来(き)た。","不但下雨，风也大起来了。","彼(かれ)は英語(えいご)[[に加(くわ)えて]]、韓国語(かんこくご)も勉強(べんきょう)して居(い)る。","他除了英语，还在学韩语。"],["〜に決(き)まって居(い)る","肯定……，一定……","そんな高(たか)い物(もの)、買(か)えない[[に決(き)まって居(い)る]]。","那么贵的东西，肯定买不起。","練習(れんしゅう)しなければ、負(ま)ける[[に決(き)まって居(い)る]]。","不练习的话，肯定会输。"],["次第(しだい)に","逐渐，渐渐","薬(くすり)を飲(の)んだら、熱(ねつ)が[[次第(しだい)に]]下(さ)がって来(き)た。","吃了药以后，烧渐渐退了。","町(まち)の様子(ようす)は[[次第(しだい)に]]変(か)わって行(い)った。","城市的面貌逐渐改变了。"],["〜所(ところ)に","正当……的时候（发生了别的事）","出掛(でか)けようとして居(い)た[[所(ところ)に]]、電話(でんわ)が掛(か)かって来(き)た。","正要出门的时候，电话打来了。","皆(みんな)で彼(かれ)の噂(うわさ)をして居(い)る[[所(ところ)に]]、本人(ほんにん)が現(あらわ)れた。","大家正在议论他的时候，他本人出现了。"],["〜ては居(い)られない","不能再……了，没法……","試験(しけん)迄(まで)後(あと)一週間(いっしゅうかん)だ。遊(あそ)んで[[は居(い)られない]]。","离考试只剩一周了，不能再玩了。","子供(こども)が熱(ねつ)を出(だ)したと聞(き)いて、落(お)ち着(つ)いて[[は居(い)られなかった]]。","听说孩子发烧了，我坐立不安。"],["〜所(ところ)だった","差点就……","もう少(すこ)しで電車(でんしゃ)に乗(の)り遅(おく)れる[[所(ところ)だった]]。","差一点就没赶上电车。","君(きみ)が教(おし)えて呉(く)れなかったら、大変(たいへん)な事(こと)に成(な)る[[所(ところ)だった]]。","要不是你告诉我，事情就严重了。"],["〜所(ところ)を","在……的时候（却打扰、麻烦）","御(お)忙(いそが)しい[[所(ところ)を]]、有難(ありがと)う御座(ござ)います。","在您百忙之中，非常感谢。","寝(ね)て居(い)る[[所(ところ)を]]起(お)こされて、機嫌(きげん)が悪(わる)い。","正睡着被叫醒，心情很差。"],["〜ず仕舞(じま)い","最终没能……","忙(いそが)しくて、結局(けっきょく)その映画(えいが)は見(み)[[ず仕舞(じま)い]]だった。","太忙了，结果那部电影到最后也没看成。","彼女(かのじょ)の本当(ほんとう)の気持(きも)ちは、聞(き)け[[ず仕舞(じま)い]]に成(な)った。","她真正的心意，到最后也没能问出口。"],["〜事(こと)はない","不必……，用不着……","簡単(かんたん)な試験(しけん)だから、心配(しんぱい)する[[事(こと)はない]]。","是很简单的考试，不必担心。","態々(わざわざ)来(く)る[[事(こと)はない]]よ。電話(でんわ)で十分(じゅうぶん)だ。","用不着特地跑一趟，打个电话就够了。"],["〜に代(か)わって","代替……","社長(しゃちょう)[[に代(か)わって]]、副社長(ふくしゃちょう)が挨拶(あいさつ)した。","副社长代替社长致辞。","最近(さいきん)は現金(げんきん)[[に代(か)わって]]、カードで払(はら)う人(ひと)が増(ふ)えた。","最近用卡代替现金付款的人多了。"],["〜訳(わけ)が無(な)い","不可能……","あんなに練習(れんしゅう)したのだから、負(ま)ける[[訳(わけ)が無(な)い]]。","练了那么多，不可能输。","彼(かれ)がそんな嘘(うそ)を吐(つ)く[[訳(わけ)が無(な)い]]。","他不可能撒那种谎。"],["〜に応(こた)えて","响应……，不辜负……","御(お)客様(きゃくさま)の要望(ようぼう)[[に応(こた)えて]]、営業時間(えいぎょうじかん)を延(の)ばした。","应顾客的要求，延长了营业时间。","両親(りょうしん)の期待(きたい)[[に応(こた)えて]]、医者(いしゃ)に成(な)った。","不负父母的期望，当上了医生。"]],"vocab":[["荷造り","にづくり","打包行李"],["役所","やくしょ","政府机关"],["高を括る","たかをくくる","小看，轻视"],["転出届","てんしゅつとどけ","迁出申报"],["解約","かいやく","解约"],["転送","てんそう","转寄，转发"],["大家","おおや","房东"],["退去","たいきょ","退房，搬出"],["業者","ぎょうしゃ","业者，公司"],["手際","てぎわ","手法，本事"],["転入届","てんにゅうとどけ","迁入申报"],["窓口","まどぐち","窗口"],["遣り遂げる","やりとげる","做完，完成"],["取り組む","とりくむ","致力于"]],"short":"引っ越し","lv":1,"sum":"在日本搬家要办的各种手续，一边手忙脚乱一边学到的经验。"},
{"title":"コンビニと日本(にほん)の暮(く)らし","short":"コンビニ","lv":2,"sum":"从生活据点到人手不足，便利店背后折射出的日本社会。","paras":[{"jp":"日本(にほん)の街(まち)を歩(ある)いて居(い)ると、数百(すうひゃく)メートル毎(ごと)にコンビニが有(あ)る[[と言(い)っても過言(かごん)ではない]]。二十四時間(にじゅうよじかん){{1:営業(えいぎょう)}}の店(みせ)がこれ程(ほど)多(おお)い国(くに)は、世界(せかい)でも珍(めずら)しい[[に違(ちが)いない]]。","zh":"走在日本街头，说每隔几百米就有一家便利店也不为过。24小时营业的店这么多的国家，在世界上也一定很少见。"},{"jp":"コンビニは、単(たん)に食品(しょくひん)や日用品(にちようひん)を売(う)る[[丈(だけ)でなく]]、{{2:公共(こうきょう)料金(りょうきん)}}の支払(しはら)いや荷物(にもつ)の受(う)け取(と)り、{{3:住民票(じゅうみんひょう)}}の発行(はっこう)[[に至(いた)る迄(まで)]]、様々(さまざま)なサービスを提供(ていきょう)して居(い)る。[[言(い)わば]]、地域(ちいき)の生活(せいかつ)を支(ささ)える{{4:拠点(きょてん)}}なのだ。","zh":"便利店不只是卖食品和日用品，从缴纳水电费、收取快递，一直到开具居民证明，提供各种各样的服务。可以说，它是支撑地区生活的据点。"},{"jp":"特(とく)に、{{5:高齢(こうれい)化(か)}}が進(すす)む[[に連(つ)れて]]、コンビニの役割(やくわり)は益々(ますます)大(おお)きく成(な)って居(い)る。近所(きんじょ)のスーパーが閉店(へいてん)した地域(ちいき)[[に於(お)いては]]、コンビニが{{6:唯一(ゆいいつ)}}の買(か)い物(もの)の場所(ばしょ)と言(い)う例(れい)も少(すく)なくない。","zh":"尤其是随着老龄化的加剧，便利店的作用越来越大。在附近超市已经关门的地区，便利店成了唯一能买东西的地方，这样的例子并不少。"},{"jp":"[[その一方(いっぽう)で]]、課題(かだい)も多(おお)い。深夜(しんや)営業(えいぎょう)[[を巡(めぐ)って]]は、{{7:人手(ひとで)不足(ぶそく)}}や店主(てんしゅ)の長時間(ちょうじかん)労働(ろうどう)が問題(もんだい)と成(な)り、二十四時間(にじゅうよじかん)営業(えいぎょう)を{{8:見直(みなお)す}}店(みせ)も出(で)て来(き)た。又(また)、{{9:売(う)れ残(のこ)}}った弁当(べんとう)が大量(たいりょう)に捨(す)てられる食品(しょくひん)ロスにも、批判(ひはん)の声(こえ)が上(あ)がって居(い)る。","zh":"另一方面，问题也不少。围绕深夜营业，人手不足和店主长时间劳动成了问题，也出现了重新考虑24小时营业的店。另外，卖剩的便当被大量丢弃的食物浪费问题，也招来了批评。"},{"jp":"便利(べんり)さを{{10:追求(ついきゅう)}}する[[余(あま)り]]、働(はたら)く人(ひと)が疲(つか)れ切(き)って仕舞(しま)う[[様(よう)では]]、{{11:本末転倒(ほんまつてんとう)}}だ。利用者(りようしゃ)[[としても]]、「何時(いつ)でも開(あ)いて居(い)て当然(とうぜん)」と言(い)う考(かんが)え方(かた)を{{12:改(あらた)める}}[[可(べ)きではないだろうか]]。","zh":"如果因为过分追求便利，让工作的人累垮，那就本末倒置了。作为使用者，我们是不是也应该改变\"随时开门是理所当然的\"这种想法呢？"},{"jp":"コンビニの未来(みらい)は、私(わたし)達(たち)一人(ひとり)一人(ひとり)の{{13:意識(いしき)}}[[次第(しだい)だ]]。","zh":"便利店的未来，取决于我们每一个人的意识。"}],"grammar":[["〜と言(い)っても過言(かごん)ではない","说……也不为过","この人(ひと)が居(い)なければ会社(かいしゃ)は無(な)かった[[と言(い)っても過言(かごん)ではない]]。","说没有这个人就没有这家公司，也不为过。","スマホは現代人(げんだいじん)の生活(せいかつ)に欠(か)かせない[[と言(い)っても過言(かごん)ではない]]。","说智能手机是现代人生活中不可缺少的东西，也不为过。"],["〜に違(ちが)いない","一定是……","電気(でんき)が点(つ)いて居(い)るから、彼(かれ)は家(いえ)に居(い)る[[に違(ちが)いない]]。","灯亮着，他一定在家。","あんなに練習(れんしゅう)したのだから、合格(ごうかく)する[[に違(ちが)いない]]。","练了那么多，一定会合格的。"],["〜丈(だけ)でなく","不仅……","彼女(かのじょ)は英語(えいご)[[丈(だけ)でなく]]、中国語(ちゅうごくご)も話(はな)せる。","她不仅会英语，还会说中文。","この映画(えいが)は子供(こども)[[丈(だけ)でなく]]、大人(おとな)も楽(たの)しめる。","这部电影不只孩子，大人也能看得很开心。"],["〜に至(いた)る迄(まで)","甚至到……，一直到……","この店(みせ)では、食器(しょっき)から家具(かぐ)[[に至(いた)る迄(まで)]]何(なん)でも揃(そろ)う。","这家店从餐具到家具，什么都买得到。","社長(しゃちょう)から新入(しんにゅう)社員(しゃいん)[[に至(いた)る迄(まで)]]、全員(ぜんいん)が会議(かいぎ)に参加(さんか)した。","从社长到新员工，全员都参加了会议。"],["言(い)わば","可以说，打个比方说","京都(きょうと)は、[[言(い)わば]]日本(にほん)文化(ぶんか)の故郷(ふるさと)だ。","京都可以说是日本文化的故乡。","彼(かれ)は私(わたし)に取(と)って、[[言(い)わば]]兄(あに)の様(よう)な存在(そんざい)だ。","他对我来说，可以说就像哥哥一样。"],["〜に連(つ)れて","随着……","年(とし)を取(と)る[[に連(つ)れて]]、体力(たいりょく)が落(お)ちて来(き)た。","随着年龄增长，体力下降了。","日本語(にほんご)が上達(じょうたつ)する[[に連(つ)れて]]、日本(にほん)での生活(せいかつ)が楽(たの)しく成(な)った。","随着日语进步，在日本的生活变得开心了。"],["〜に於(お)いては","在……方面；在……（场合）","当(とう)ホテル[[に於(お)いては]]、全室(ぜんしつ)禁煙(きんえん)と成(な)って居(お)ります。","本酒店所有客房均为禁烟房。","現代(げんだい)社会(しゃかい)[[に於(お)いては]]、情報(じょうほう)を選(えら)ぶ力(ちから)が求(もと)められる。","在现代社会，需要具备选择信息的能力。"],["その一方(いっぽう)で","另一方面","ネットは便利(べんり)だ。[[その一方(いっぽう)で]]、個人(こじん)情報(じょうほう)の流出(りゅうしゅつ)も心配(しんぱい)だ。","网络很方便。另一方面，个人信息泄露也令人担心。","都会(とかい)は仕事(しごと)が多(おお)い。[[その一方(いっぽう)で]]、家賃(やちん)が高(たか)い。","大城市工作机会多。但另一方面，房租也贵。"],["〜を巡(めぐ)って","围绕……","遺産(いさん)[[を巡(めぐ)って]]、兄弟(きょうだい)が争(あらそ)って居(い)る。","兄弟几个正为了遗产争执。","新(あたら)しい空港(くうこう)の建設(けんせつ)[[を巡(めぐ)って]]、住民(じゅうみん)の意見(いけん)が分(わ)かれた。","围绕新机场的建设，居民意见出现了分歧。"],["〜余(あま)り","过于……以至于","緊張(きんちょう)の[[余(あま)り]]、言(い)いたい事(こと)が言(い)えなかった。","太紧张了，想说的话没说出来。","子供(こども)を心配(しんぱい)する[[余(あま)り]]、何(なん)でも口(くち)を出(だ)して仕舞(しま)う。","因为太担心孩子，什么事都要插嘴。"],["〜様(よう)では","如果……的话（就不行）","こんな簡単(かんたん)な問題(もんだい)が解(と)けない[[様(よう)では]]、合格(ごうかく)は無理(むり)だ。","连这么简单的题都做不出来，是不可能合格的。","毎朝(まいあさ)遅刻(ちこく)する[[様(よう)では]]、信頼(しんらい)されない。","每天早上都迟到的话，是不会被信任的。"],["〜としても","作为……也；即使……也","親(おや)[[としても]]、子供(こども)の意見(いけん)を尊重(そんちょう)したい。","作为父母，我也想尊重孩子的意见。","今(いま)から急(いそ)いだ[[としても]]、終電(しゅうでん)には間(ま)に合(あ)わないだろう。","即使现在赶过去，大概也赶不上末班车了。"],["〜可(べ)きではないだろうか","难道不应该……吗","若者(わかもの)の声(こえ)を、もっと政治(せいじ)に反映(はんえい)させる[[可(べ)きではないだろうか]]。","难道不应该让年轻人的声音更多地反映到政治中吗？","便利(べんり)さよりも、安全(あんぜん)を優先(ゆうせん)す[[可(べ)きではないだろうか]]。","比起便利，难道不应该把安全放在第一位吗？"],["〜次第(しだい)だ","取决于……","合格(ごうかく)出来(でき)るかどうかは、これからの努力(どりょく)[[次第(しだい)だ]]。","能不能合格，取决于接下来的努力。","旅行(りょこう)に行(い)くかどうかは、天気(てんき)[[次第(しだい)だ]]。","去不去旅行要看天气。"]],"vocab":[["過言","かごん","言过其实"],["営業","えいぎょう","营业"],["公共料金","こうきょうりょうきん","水电煤气等公共费用"],["住民票","じゅうみんひょう","居民证明"],["拠点","きょてん","据点"],["高齢化","こうれいか","老龄化"],["唯一","ゆいいつ","唯一"],["人手不足","ひとでぶそく","人手不足"],["見直す","みなおす","重新审视"],["売れ残る","うれのこる","卖剩下"],["追求","ついきゅう","追求"],["本末転倒","ほんまつてんとう","本末倒置"],["改める","あらためる","改正，改变"],["意識","いしき","意识"]]},
{"title":"スマートフォンと睡眠(すいみん)","paras":[{"jp":"スマートフォンの{{0:普及(ふきゅう)}}に伴(ともな)い、寝(ね)る{{1:直前(ちょくぜん)}}迄(まで)画面(がめん)を見(み)る人(ひと)が増(ふ)え[[つつ有(あ)る]]。","zh":"随着智能手机的普及，直到睡前还在看屏幕的人正在增加。"},{"jp":"或(あ)る調査(ちょうさ)の結果(けっか)[[を元(もと)に]]考(かんが)えると、二十代(にじゅうだい)の約(やく)八割(はちわり)が、ベッドの中(なか)でスマホを使(つか)って居(い)る。ベッドの中(なか)でスマホを{{2:操作(そうさ)}}する時間(じかん)は、平均(へいきん)で三十分(さんじゅっぷん)以上(いじょう)にも成(な)る[[と言(い)う事(こと)だ]]。","zh":"根据某项调查结果来看，二十多岁的人中约有八成会在床上用手机。据说在床上操作手机的时间，平均达三十分钟以上。"},{"jp":"問題(もんだい)は、画面(がめん)から出(で)る光(ひかり)である。スマホの光(ひかり)は、脳(のう)に「今(いま)は昼(ひる)だ」と{{3:勘違(かんちが)い}}させる[[恐(おそ)れが有(あ)る]]。その結果(けっか)、眠(ねむ)りを{{4:促(うなが)す}}ホルモンが出(で)難(にく)く成(な)り、{{5:寝付(ねつ)き}}が悪(わる)く成(な)る[[上(うえ)に]]、眠(ねむ)りも{{6:浅(あさ)}}く成(な)ると言(い)われて居(い)る。","zh":"问题在于屏幕发出的光。手机的光可能会让大脑误以为\"现在是白天\"。结果，促进睡眠的激素难以分泌，不但难以入睡，睡眠也会变浅。"},{"jp":"「少(すこ)し丈(だけ)」の積(つ)もりでSNSを開(ひら)いても、次(つぎ)から次(つぎ)へと新(あたら)しい情報(じょうほう)が現(あらわ)れ、{{7:気付(きづ)}}けば一時間(いちじかん)も経(た)って居(い)た。そんな経験(けいけん)は誰(だれ)にでも有(あ)り[[得(う)る]]。丸(まる)で時間(じかん)が消(き)えて仕舞(しま)った[[かの様(よう)だ]]。","zh":"本想\"就看一会儿\"才打开社交软件，新信息却一条接一条冒出来，回过神来已经过去一个小时了。这样的经历谁都可能有过。时间就好像凭空消失了一样。"},{"jp":"睡眠不足(すいみんぶそく)は単(たん)なる疲(つか)れの問題(もんだい)[[に過(す)ぎない]]と考(かんが)える人(ひと)も居(い)るが、そうではない。集中力(しゅうちゅうりょく)の低下(ていか)や気分(きぶん)の{{8:落(お)ち込(こ)み}}に繋(つな)がる事(こと)も分(わ)かって来(き)た。睡眠時間(すいみんじかん)が毎日(まいにち)一時間(いちじかん)短(みじか)い[[とすると]]、一年(いちねん)で三百六十五時間(さんびゃくろくじゅうごじかん)、約(やく)十五日分(じゅうごにちぶん)の睡眠(すいみん)を失(うしな)う計算(けいさん)に成(な)る。","zh":"有人认为睡眠不足只不过是累一点而已，其实不然。研究已经发现，它还会导致注意力下降、情绪低落。假如每天少睡一个小时，一年就会失去365个小时，相当于约15天的睡眠。"},{"jp":"特(とく)に受験生(じゅけんせい)[[ともなると]]、夜遅(よるおそ)く迄(まで)勉強(べんきょう)した後(あと)、{{9:息抜(いきぬ)き}}にスマホを見(み)る事(こと)が多(おお)い。親(おや)の注意(ちゅうい)[[に反(はん)して]]、{{10:布団(ふとん)}}の中(なか)でこっそり使(つか)う子供(こども)も少(すく)なくない。","zh":"特别是到了考生阶段，深夜学习之后常会看看手机放松一下。不听父母劝告、躲在被窝里偷偷用手机的孩子也不少。"},{"jp":"子供(こども)[[に対(たい)して]]「スマホを止(や)めなさい」と言(い)う丈(だけ)では、問題(もんだい)は解決(かいけつ)しない。{{12:抑(そもそ)も}}親(おや)自身(じしん)が夜中(よなか)迄(まで)スマホを{{11:手放(てばな)}}さないのだから、大人(おとな)の態度(たいど)[[からして]]改(あらた)める必要(ひつよう)が有(あ)る。寝室(しんしつ)にスマホを持(も)ち込(こ)まない、寝(ね)る一時間前(いちじかんまえ)には電源(でんげん)を切(き)る等(など)、家族(かぞく)全員(ぜんいん)で取(と)り組(く)める良(よ)い方法(ほうほう)は[[無(な)い物(もの)か]]。","zh":"光对孩子说\"别玩手机了\"，问题是解决不了的。说到底，父母自己就半夜还手机不离手，首先就得从大人的态度改起。比如不把手机带进卧室、睡前一小时关机等等，难道就没有全家人能一起实践的好办法吗？"},{"jp":"良(よ)い睡眠(すいみん)は、健康(けんこう)な生活(せいかつ)の{{13:土台(どだい)}}だ。便利(べんり)な道具(どうぐ)に使(つか)われるのではなく、上手(じょうず)に使(つか)い熟(こな)したい物(もの)である。","zh":"良好的睡眠是健康生活的基础。我们不该被方便的工具所支配，而应该好好地驾驭它。"}],"grammar":[["〜つつ有(あ)る","正在……（逐渐变化）","地球(ちきゅう)の気温(きおん)は年々(ねんねん)上(あ)がり[[つつ有(あ)る]]。","地球的气温正在逐年上升。","怪我(けが)は順調(じゅんちょう)に回復(かいふく)し[[つつ有(あ)る]]。","伤势正在顺利恢复。"],["〜を元(もと)に","以……为基础、依据","実際(じっさい)の事件(じけん)[[を元(もと)に]]、小説(しょうせつ)を書(か)いた。","以真实事件为原型写了小说。","アンケートの結果(けっか)[[を元(もと)に]]、新(あたら)しい商品(しょうひん)を開発(かいはつ)した。","以问卷调查的结果为依据开发了新产品。"],["〜と言(い)う事(こと)だ","据说……（传闻）","ニュースに依(よ)ると、来月(らいげつ)から電気代(でんきだい)が上(あ)がる[[と言(い)う事(こと)だ]]。","据新闻报道，从下个月起电费要涨了。","田中(たなか)さんは来年(らいねん)結婚(けっこん)する[[と言(い)う事(こと)だ]]。","听说田中明年要结婚。"],["〜恐(おそ)れが有(あ)る","有……的危险，恐怕会……","台風(たいふう)の影響(えいきょう)で、川(かわ)が氾濫(はんらん)する[[恐(おそ)れが有(あ)る]]。","受台风影响，河水有泛滥的危险。","この儘(まま)では、会社(かいしゃ)が倒産(とうさん)する[[恐(おそ)れが有(あ)る]]。","照这样下去，公司恐怕会倒闭。"],["〜上(うえ)に","不仅……而且……","この部屋(へや)は広(ひろ)い[[上(うえ)に]]、駅(えき)からも近(ちか)い。","这个房间不仅宽敞，离车站也近。","道(みち)に迷(まよ)った[[上(うえ)に]]、雨(あめ)迄(まで)降(ふ)って来(き)た。","不但迷了路，还下起雨来了。"],["〜得(う)る","有可能……","地震(じしん)は何時(いつ)でも起(お)こり[[得(う)る]]。","地震随时都可能发生。","それは誰(だれ)にでも有(あ)り[[得(う)る]]失敗(しっぱい)だ。","那是谁都可能犯的错误。"],["〜かの様(よう)だ","好像……一样（实际并非如此）","彼(かれ)は何(なに)も知(し)らない[[かの様(よう)に]]振(ふ)る舞(ま)った。","他表现得好像什么都不知道。","今日(きょう)は暖(あたた)かくて、春(はる)が来(き)た[[かの様(よう)だ]]。","今天很暖和，好像春天来了一样。"],["〜に過(す)ぎない","只不过是……","それは噂(うわさ)[[に過(す)ぎない]]。","那只不过是传闻而已。","私(わたし)は一(いち)社員(しゃいん)[[に過(す)ぎない]]ので、決(き)める権限(けんげん)は無(な)い。","我只不过是个普通员工，没有决定权。"],["〜とすると","假如……的话","毎月(まいつき)三万円(さんまんえん)貯金(ちょきん)する[[とすると]]、一年(いちねん)で三十六万円(さんじゅうろくまんえん)に成(な)る。","假如每月存三万日元，一年就是三十六万日元。","彼(かれ)が犯人(はんにん)でない[[とすると]]、一体(いったい)誰(だれ)が遣(や)ったのだろう。","假如他不是犯人，那到底是谁干的呢？"],["〜ともなると","一旦到了……（的程度、阶段）","大学生(だいがくせい)[[ともなると]]、自分(じぶん)の事(こと)は自分(じぶん)で決(き)めなければ成(な)らない。","到了大学生的年纪，自己的事就得自己决定。","年末(ねんまつ)[[ともなると]]、どこの店(みせ)も混(こ)み合(あ)う。","一到年底，哪家店都很拥挤。"],["〜に反(はん)して","与……相反，违反……","予想(よそう)[[に反(はん)して]]、試験(しけん)は易(やさ)しかった。","与预想相反，考试很简单。","親(おや)の期待(きたい)[[に反(はん)して]]、彼(かれ)は大学(だいがく)を辞(や)めた。","他违背父母的期望，退学了。"],["〜に対(たい)して","对……；与……相对","先生(せんせい)[[に対(たい)して]]、そんな言(い)い方(かた)は失礼(しつれい)だ。","对老师那样说话很失礼。","兄(あに)が活発(かっぱつ)なの[[に対(たい)して]]、弟(おとうと)は大人(おとな)しい。","哥哥很活泼，弟弟却很文静。"],["〜からして","单从……来看就，首先……就","彼(かれ)は話(はな)し方(かた)[[からして]]、自信(じしん)が無(な)さそうだ。","单从他说话的样子来看，就好像没什么自信。","この店(みせ)は入口(いりぐち)[[からして]]高級(こうきゅう)な感(かん)じがする。","这家店光看门口就很高档。"],["〜無(な)い物(もの)か","难道没有……吗，能不能……呢（愿望）","毎日(まいにち)の通勤(つうきん)をもっと楽(らく)にする方法(ほうほう)は[[無(な)い物(もの)か]]。","难道没有让每天通勤更轻松的办法吗？","何(なん)とかして、彼女(かのじょ)を元気付(げんきづ)けられ[[ない物(もの)か]]。","能不能想办法让她振作起来呢？"]],"vocab":[["普及","ふきゅう","普及"],["直前","ちょくぜん","即将……之前"],["操作","そうさ","操作"],["勘違い","かんちがい","误会，误以为"],["促す","うながす","促进，催促"],["寝付き","ねつき","入睡"],["浅い","あさい","浅"],["気付く","きづく","察觉"],["落ち込み","おちこみ","低落，消沉"],["息抜き","いきぬき","放松，休息"],["布団","ふとん","被褥"],["手放す","てばなす","放手"],["抑も","そもそも","说到底，本来"],["土台","どだい","基础"]],"short":"スマホと睡眠","lv":2,"sum":"睡前玩手机为什么影响睡眠？结合调查结果说明问题并提出建议，偏说明文。"},
{"title":"食品(しょくひん)ロスを減(へ)らすには","paras":[{"jp":"未(ま)だ食(た)べられるのに捨(す)てられて仕舞(しま)う食品(しょくひん)を「食品(しょくひん)ロス」と言(い)う。日本(にほん)では、年間(ねんかん)約(やく)五百万(ごひゃくまん)トンもの食品(しょくひん)ロスが{{0:発生(はっせい)}}して居(い)る。これは、国民(こくみん)一人(ひとり)一人(ひとり)が毎日(まいにち)、御(お){{1:茶碗(ちゃわん)}}一杯分(いっぱいぶん)の御飯(ごはん)を捨(す)てて居(い)るのと同(おな)じ量(りょう)だ。","zh":"明明还能吃却被扔掉的食物，叫作\"食品浪费\"。日本每年产生的食品浪费约有五百万吨，相当于每个国民每天都扔掉一碗米饭。"},{"jp":"食品(しょくひん)ロスは、家庭(かてい)[[は元(もと)より]]、スーパーやコンビニ、飲食店(いんしょくてん)等(など)、{{2:有(あ)らゆる}}場所(ばしょ)で生(う)まれて居(い)る。そして、この問題(もんだい)は環境(かんきょう)に{{3:悪影響(あくえいきょう)}}を与(あた)える[[のみならず]]、処理(しょり)に{{4:多額(たがく)}}の税金(ぜいきん)が使(つか)われると言(い)う点(てん)でも{{5:見過(みす)ご}}せない。","zh":"食品浪费不只发生在家庭，超市、便利店、餐馆等各种地方都会产生。这个问题不仅对环境造成不良影响，处理时还要花掉大量税金，这一点也不容忽视。"},{"jp":"店(みせ)が多(おお)くの食品(しょくひん)を捨(す)てるのは、{{6:消費者(しょうひしゃ)}}が少(すこ)しでも新(あたら)しい物(もの)を求(もと)めるからでもある。棚(たな)の奥(おく)から日付(ひづけ)の新(あたら)しい牛乳(ぎゅうにゅう)を取(と)る人(ひと)を見掛(みか)けた事(こと)が有(あ)るだろう。良(よ)くないと知(し)り[[ながらも]]、つい遣(や)って仕舞(しま)う人(ひと)は多(おお)い。","zh":"商店扔掉大量食品，也是因为消费者总想要更新鲜一点的东西。大家应该都见过从货架深处拿日期更新的牛奶的人吧。明知不好，却还是忍不住这么做的人很多。"},{"jp":"家庭(かてい)では、買(か)い物(もの)の前(まえ)に{{7:冷蔵庫(れいぞうこ)}}の中(なか)を確認(かくにん)し[[さえすれば]]、同(おな)じ物(もの)を二度(にど)買(か)う事(こと)は無(な)く成(な)る。又(また)、味(あじ)[[はともかく]]、{{8:残(のこ)り物(もの)}}を工夫(くふう)して別(べつ)の料理(りょうり)に作(つく)り変(か)えるのも一(ひと)つの方法(ほうほう)だ。","zh":"在家里，只要买东西前看一下冰箱，就不会重复买同样的东西。另外，先不说味道如何，花点心思把剩菜做成别的菜，也是一个办法。"},{"jp":"最近(さいきん)では、{{9:賞味期限(しょうみきげん)}}が近(ちか)い商品(しょうひん)を安(やす)く売(う)る店(みせ)や、子供食堂(こどもしょくどう)[[向(む)け]]に余(あま)った食品(しょくひん)を{{10:寄付(きふ)}}する企業(きぎょう)も増(ふ)えて来(き)た。賞味期限(しょうみきげん)は「美味(おい)しく食(た)べられる期限(きげん)」であり、過(す)ぎたら直(す)ぐに食(た)べられなく成(な)る[[と言(い)う物(もの)ではない]]。","zh":"最近，把临近赏味期限的商品便宜出售的商店，以及把多余食品捐给儿童食堂的企业也多了起来。赏味期限是\"能好吃地吃完的期限\"，并不是一过期就马上不能吃了。"},{"jp":"勿論(もちろん)、安全(あんぜん)[[を抜(ぬ)きにして]]食品(しょくひん)ロスの問題(もんだい)を語(かた)る事(こと)は出来(でき)ない。{{11:消費期限(しょうひきげん)}}の過(す)ぎた物(もの)を無理(むり)に食(た)べる必要(ひつよう)は無(な)い。小(ちい)さな工夫(くふう)である[[にせよ]]、一人(ひとり)一人(ひとり)が意識(いしき)を変(か)え[[つつ]]、出来(でき)る事(こと)を続(つづ)けて行(い)く事(こと)が大切(たいせつ)だ。","zh":"当然，抛开安全来谈食品浪费问题是不行的。过了消费期限的东西，没必要硬着头皮吃。即使只是小小的努力，每个人一边转变意识，一边坚持做力所能及的事，这才是最重要的。"},{"jp":"食(た)べ物(もの)を大切(たいせつ)にする事(こと)は、それを作(つく)った人(ひと)への感謝(かんしゃ)[[に他(ほか)ならない]]。{{13:豊(ゆた)か}}な時代(じだい)だ[[からこそ]]、「{{12:勿体無(もったいな)い}}」と言(い)う言葉(ことば)の意味(いみ)を、改(あらた)めて考(かんが)えて見(み)たい。","zh":"珍惜食物，正是对生产者的感谢。正因为生活在富足的时代，我们更应该重新思考\"可惜\"这个词的含义。"}],"grammar":[["〜は元(もと)より","……自不必说，……就更不用提","この店(みせ)は味(あじ)[[は元(もと)より]]、サービスも素晴(すば)らしい。","这家店味道自不必说，服务也很棒。","彼(かれ)は英語(えいご)[[は元(もと)より]]、中国語(ちゅうごくご)も話(はな)せる。","他英语自不用说，还会说中文。"],["〜のみならず","不仅……而且……（书面）","この問題(もんだい)は若者(わかもの)[[のみならず]]、高齢者(こうれいしゃ)にも関係(かんけい)が有(あ)る。","这个问题不仅关系到年轻人，也关系到老年人。","彼(かれ)は勉強(べんきょう)が出来(でき)る[[のみならず]]、スポーツも得意(とくい)だ。","他不仅学习好，还擅长运动。"],["〜ながらも","虽然……但是……","狭(せま)い[[ながらも]]、自分(じぶん)の家(いえ)を持(も)てて嬉(うれ)しい。","虽然小，但有了自己的房子很高兴。","彼(かれ)は貧(まず)しい[[ながらも]]、幸(しあわ)せな生活(せいかつ)を送(おく)って居(い)る。","他虽然贫穷，却过着幸福的生活。"],["〜さえ〜ば","只要……就……","住所(じゅうしょ)[[さえ分(わ)かれば]]、荷物(にもつ)を送(おく)れます。","只要知道地址，就能寄东西。","この薬(くすり)を飲(の)み[[さえすれば]]、直(す)ぐに治(なお)りますよ。","只要吃了这个药，马上就会好的。"],["〜はともかく","……暂且不论","値段(ねだん)[[はともかく]]、デザインは素晴(すば)らしい。","价格暂且不论，设计非常棒。","結果(けっか)[[はともかく]]、最後(さいご)迄(まで)頑張(がんば)った事(こと)が大切(たいせつ)だ。","结果如何暂且不论，坚持到最后才最重要。"],["〜向(む)け","面向……，以……为对象","これは子供(こども)[[向(む)け]]の番組(ばんぐみ)だ。","这是面向儿童的节目。","外国人(がいこくじん)[[向(む)け]]の日本語(にほんご)講座(こうざ)に申(もう)し込(こ)んだ。","报名参加了面向外国人的日语讲座。"],["〜と言(い)う物(もの)ではない","并不是……，未必……","値段(ねだん)が高(たか)ければ良(よ)い[[と言(い)う物(もの)ではない]]。","并不是价格越高就越好。","長(なが)く勉強(べんきょう)すれば成績(せいせき)が上(あ)がる[[と言(い)う物(もの)ではない]]。","并不是学得时间长，成绩就一定会提高。"],["〜を抜(ぬ)きにして","抛开……，去掉……","彼(かれ)の協力(きょうりょく)[[を抜(ぬ)きにして]]、この計画(けいかく)は成功(せいこう)しなかった。","没有他的协助，这个计划就不会成功。","冗談(じょうだん)[[を抜(ぬ)きにして]]、真面目(まじめ)に話(はな)し合(あ)おう。","不开玩笑了，认真谈谈吧。"],["〜にせよ","即使……也；无论……","理由(りゆう)が有(あ)った[[にせよ]]、約束(やくそく)を破(やぶ)るのは良(よ)くない。","即使有理由，违背约定也是不对的。","行(い)く[[にせよ]]行(い)かない[[にせよ]]、早(はや)めに連絡(れんらく)して下(くだ)さい。","不管去不去，请早点联系。"],["〜つつ","一边……一边；虽然……却","音楽(おんがく)を聞(き)き[[つつ]]、勉強(べんきょう)する。","一边听音乐一边学习。","体(からだ)に悪(わる)いと知(し)り[[つつ]]、煙草(たばこ)を止(や)められない。","明知对身体不好，却戒不掉烟。"],["〜に他(ほか)ならない","正是……，无非是……","今回(こんかい)の成功(せいこう)は、皆(みな)さんの努力(どりょく)の結果(けっか)[[に他(ほか)ならない]]。","这次的成功完全是大家努力的结果。","親(おや)が厳(きび)しいのは、子供(こども)を愛(あい)して居(い)るから[[に他(ほか)ならない]]。","父母严格，正是因为爱孩子。"],["〜からこそ","正因为……才……","好(す)きだ[[からこそ]]、厳(きび)しく言(い)うのだ。","正因为喜欢，才说得严厉。","失敗(しっぱい)した[[からこそ]]、学(まな)べた事(こと)も多(おお)い。","正因为失败过，才学到了很多东西。"]],"vocab":[["発生","はっせい","发生，产生"],["茶碗","ちゃわん","饭碗"],["有らゆる","あらゆる","所有的，一切"],["悪影響","あくえいきょう","不良影响"],["多額","たがく","巨额"],["見過ごす","みすごす","忽视，放过"],["消費者","しょうひしゃ","消费者"],["冷蔵庫","れいぞうこ","冰箱"],["残り物","のこりもの","剩菜，剩余的东西"],["賞味期限","しょうみきげん","赏味期限（最佳食用期）"],["寄付","きふ","捐赠"],["消費期限","しょうひきげん","消费期限（安全食用期）"],["勿体無い","もったいない","可惜，浪费"],["豊か","ゆたか","富足，丰富"]],"short":"食品ロス","lv":2,"sum":"日本每年扔掉大量还能吃的食物，从商店、家庭、个人几个角度讨论对策。"},
{"title":"外国人観光客(がいこくじんかんこうきゃく)と地域(ちいき)","paras":[{"jp":"ここ十年(じゅうねん)程(ほど)で、日本(にほん)を訪(おとず)れる外国人観光客(がいこくじんかんこうきゃく)は{{0:大幅(おおはば)}}に増(ふ)えた。{{1:円安(えんやす)}}の影響(えいきょう)も有(あ)り、今(いま)や観光(かんこう)は日本(にほん)経済(けいざい)を支(ささ)える産業(さんぎょう)の一(ひと)つ[[と言(い)うより]]、地方(ちほう)に取(と)っては欠(か)かせない{{2:柱(はしら)}}と成(な)って居(い)る。","zh":"近十年来，访日外国游客大幅增加。再加上日元贬值的影响，如今旅游业与其说是支撑日本经济的产业之一，不如说对地方而言已经成了不可或缺的支柱。"},{"jp":"観光客(かんこうきゃく)の増加(ぞうか)[[に関(かん)して]]は、{{3:地元(じもと)}}の住民(じゅうみん)の間(あいだ)でも意見(いけん)が分(わ)かれて居(い)る。店(みせ)の売(う)り上(あ)げが伸(の)びたと喜(よろこ)ぶ人(ひと)が居(い)る一方(いっぽう)、バスや電車(でんしゃ)が{{4:混雑(こんざつ)}}して生活(せいかつ)に{{5:支障(ししょう)}}が出(で)て居(い)ると{{6:訴(うった)える}}声(こえ)も少(すく)なくない。","zh":"关于游客增加这件事，当地居民之间也意见分歧。有人为店铺营业额增长而高兴，也有不少人抱怨公交、电车拥挤，影响了日常生活。"},{"jp":"京都(きょうと)では、人気(にんき)の観光地(かんこうち)が朝(あさ)から人(ひと)[[だらけ]]で、住民(じゅうみん)が買(か)い物(もの)に行(い)くのにも苦労(くろう)する程(ほど)だ。中(なか)には、{{7:私有地(しゆうち)}}に入(はい)ったり、周囲(しゅうい)の迷惑(めいわく)[[も構(かま)わず]]大声(おおごえ)で話(はな)したりする観光客(かんこうきゃく)も居(い)る。","zh":"在京都，热门景点从早上起就到处是人，当地居民连去买东西都很费劲。其中还有闯进私人土地、不顾周围人感受大声喧哗的游客。"},{"jp":"然(しか)し、彼(かれ)らも{{8:悪気(わるぎ)}}が有(あ)って遣(や)って居(い)る[[筈(はず)が無(な)い]]。文化(ぶんか)や習慣(しゅうかん)の違(ちが)いを知(し)らない丈(だけ)の場合(ばあい)が殆(ほとん)どだ。観光客(かんこうきゃく)を{{9:受(う)け入(い)れる}}[[以上(いじょう)は]]、地域(ちいき)の側(がわ)も、マナーを分(わ)かり易(やす)く伝(つた)える工夫(くふう)をす[[可(べ)きだ]]。","zh":"不过，他们不可能是故意这么做的。大多只是不了解文化和习惯上的差异。既然要接待游客，当地也应该想办法把礼仪规矩简明易懂地传达出去。"},{"jp":"例(たと)えば或(あ)る町(まち)では、{{10:多言語(たげんご)}}の案内板(あんないばん)や動画(どうが)[[を通(つう)じて]]、塵(ごみ)の捨(す)て方(かた)や写真(しゃしん){{11:撮影(さつえい)}}のルールを紹介(しょうかい)して居(い)る。又(また)、安全(あんぜん)[[上(じょう)]]の理由(りゆう)から、一部(いちぶ)の道(みち)は夜間(やかん)の立(た)ち入(い)りが禁止(きんし)された。","zh":"例如，有个城镇通过多语言指示牌和视频，介绍扔垃圾的方法和拍照规则。另外，出于安全上的考虑，部分道路禁止夜间进入。"},{"jp":"観光客(かんこうきゃく)の数(かず)の問題(もんだい)[[は扨(さ)て置(お)き]]、大切(たいせつ)なのは、訪(おとず)れる人(ひと)と住(す)む人(ひと)が互(たが)いを{{12:尊重(そんちょう)}}する事(こと)だ。旅行者(りょこうしゃ)[[にしろ]]住民(じゅうみん)にしろ、同(おな)じ町(まち)を大切(たいせつ)に思(おも)う気持(きも)ちは変(か)わらない筈(はず)だ。","zh":"游客数量的问题暂且不论，重要的是来访者和居民相互尊重。无论是旅行者还是居民，珍惜同一座城市的心情应该是一样的。"},{"jp":"国籍(こくせき)が何(なん)[[であれ]]、旅(たび)の思(おも)い出(で)を良(よ)い物(もの)にしたいと願(ねが)う気持(きも)ちは同(おな)じだ。混雑(こんざつ)が更(さら)に酷(ひど)く成(な)ら[[ないうちに]]、国(くに)と地域(ちいき)が協力(きょうりょく)して対策(たいさく)を進(すす)める必要(ひつよう)が有(あ)る。来年(らいねん)の大型(おおがた)イベント[[に際(さい)して]]は、観光客(かんこうきゃく)の{{13:分散(ぶんさん)}}を図(はか)る新(あたら)しい仕組(しく)みも導入(どうにゅう)される予定(よてい)だ。","zh":"无论国籍是什么，希望旅行留下美好回忆的心情都是一样的。必须趁拥挤还没进一步恶化，由国家和地方合作推进对策。在明年举办大型活动之际，还计划引入分流游客的新机制。"}],"grammar":[["〜と言(い)うより","与其说……不如说……","今日(きょう)は暖(あたた)かい[[と言(い)うより]]、暑(あつ)い位(くらい)だ。","今天与其说暖和，不如说有点热了。","彼(かれ)は友達(ともだち)[[と言(い)うより]]、家族(かぞく)の様(よう)な存在(そんざい)だ。","他与其说是朋友，不如说更像家人。"],["〜に関(かん)して","关于……","この件(けん)[[に関(かん)して]]、何(なに)か質問(しつもん)は有(あ)りますか。","关于这件事，有什么问题吗？","日本(にほん)の歴史(れきし)[[に関(かん)して]]論文(ろんぶん)を書(か)いて居(い)る。","正在写关于日本历史的论文。"],["〜だらけ","满是……，全是……","子供達(こどもたち)は泥(どろ)[[だらけ]]に成(な)って遊(あそ)んで居(い)た。","孩子们玩得满身是泥。","彼(かれ)の作文(さくぶん)は間違(まちが)い[[だらけ]]だ。","他的作文错误百出。"],["〜も構(かま)わず","不顾……，不在乎……","彼女(かのじょ)は人目(ひとめ)[[も構(かま)わず]]泣(な)き出(だ)した。","她不顾旁人的目光哭了起来。","雨(あめ)に濡(ぬ)れるの[[も構(かま)わず]]、子供達(こどもたち)は外(そと)で遊(あそ)んで居(い)る。","孩子们不顾淋雨，在外面玩。"],["〜筈(はず)が無(な)い","不可能……","真面目(まじめ)な彼(かれ)が、約束(やくそく)を忘(わす)れる[[筈(はず)が無(な)い]]。","认真的他不可能忘记约定。","こんな難(むずか)しい問題(もんだい)、子供(こども)に解(と)ける[[筈(はず)が無(な)い]]。","这么难的题，孩子不可能解得出来。"],["〜以上(いじょう)は","既然……就……","引(ひ)き受(う)けた[[以上(いじょう)は]]、最後(さいご)迄(まで)責任(せきにん)を持(も)つ。","既然接下了，就负责到底。","試合(しあい)に出(で)る[[以上(いじょう)は]]、勝(か)ちたい。","既然要上场比赛，就想赢。"],["〜可(べ)きだ","应该……","自分(じぶん)の間違(まちが)いは、素直(すなお)に認(みと)める[[可(べ)きだ]]。","自己的错误应该坦率承认。","若(わか)いうちに、色々(いろいろ)な経験(けいけん)をす[[可(べ)きだ]]。","应该趁年轻多积累各种经验。"],["〜を通(つう)じて","通过……；在整个……期间","友人(ゆうじん)[[を通(つう)じて]]、彼女(かのじょ)と知(し)り合(あ)った。","通过朋友认识了她。","この地域(ちいき)は一年(いちねん)[[を通(つう)じて]]暖(あたた)かい。","这个地区一年到头都很暖和。"],["〜上(じょう)","在……上，从……方面来看","健康(けんこう)[[上(じょう)]]の理由(りゆう)で、会社(かいしゃ)を辞(や)めた。","因为健康上的原因辞职了。","この話(はなし)は、法律(ほうりつ)[[上(じょう)]]問題(もんだい)が有(あ)る。","这件事在法律上有问题。"],["〜は扨(さ)て置(お)き","……暂且不提","冗談(じょうだん)[[は扨(さ)て置(お)き]]、本題(ほんだい)に入(はい)りましょう。","玩笑先放一边，进入正题吧。","費用(ひよう)の事(こと)[[は扨(さ)て置(お)き]]、先(ま)ず計画(けいかく)を立(た)てよう。","费用的事暂且不提，先订计划吧。"],["〜にしろ〜にしろ","无论……还是……","行(い)く[[にしろ]]行(い)かない[[にしろ]]、返事(へんじ)を下(くだ)さい。","不管去不去，请给个答复。","冗談(じょうだん)だった[[にしろ]]、言(い)って良(よ)い事(こと)と悪(わる)い事(こと)が有(あ)る。","即使是开玩笑，话也有能说和不能说的。"],["〜であれ","无论……都","理由(りゆう)が何(なん)[[であれ]]、暴力(ぼうりょく)は許(ゆる)されない。","不管理由是什么，暴力都不能被原谅。","どんな仕事(しごと)[[であれ]]、真剣(しんけん)に取(と)り組(く)む可(べ)きだ。","无论什么工作，都应该认真对待。"],["〜ないうちに","趁还没……","雨(あめ)が降(ふ)ら[[ないうちに]]、帰(かえ)りましょう。","趁还没下雨，回去吧。","冷(さ)め[[ないうちに]]、召(め)し上(あ)がって下(くだ)さい。","请趁热吃。"],["〜に際(さい)して","在……之际","入学(にゅうがく)[[に際(さい)して]]、必要(ひつよう)な書類(しょるい)を提出(ていしゅつ)して下(くだ)さい。","入学时请提交所需材料。","海外旅行(かいがいりょこう)[[に際(さい)して]]、保険(ほけん)に加入(かにゅう)した。","出国旅行之际买了保险。"]],"vocab":[["大幅","おおはば","大幅度"],["円安","えんやす","日元贬值"],["柱","はしら","支柱"],["地元","じもと","当地"],["混雑","こんざつ","拥挤"],["支障","ししょう","障碍，妨碍"],["訴える","うったえる","申诉，诉说"],["私有地","しゆうち","私人土地"],["悪気","わるぎ","恶意"],["受け入れる","うけいれる","接受，接纳"],["多言語","たげんご","多语言"],["撮影","さつえい","拍摄"],["尊重","そんちょう","尊重"],["分散","ぶんさん","分散"]],"short":"外国人観光客","lv":2,"sum":"访日游客大幅增加带来的好处和烦恼，以及当地居民与游客如何共处。"},
{"title":"地方移住(ちほういじゅう)と言(い)う選択(せんたく)","paras":[{"jp":"東京(とうきょう)で十年(じゅうねん)働(はたら)いた山本(やまもと)さんは、三年前(さんねんまえ)に長野県(ながのけん)の小(ちい)さな村(むら)に{{0:移住(いじゅう)}}した。切(き)っ掛(か)けは、毎日(まいにち)の満員電車(まんいんでんしゃ)と長時間労働(ちょうじかんろうどう)に{{1:疲(つか)れ果(は)て}}た事(こと)だった。「この儘(まま)では、自分(じぶん)の時間(じかん)を楽(たの)しむ[[どころではない]]と思(おも)ったんです」と山本(やまもと)さんは{{2:振(ふ)り返(かえ)る}}。","zh":"在东京工作了十年的山本先生，三年前移居到了长野县的一个小村子。起因是他被每天的满员电车和长时间工作弄得筋疲力尽。山本先生回忆说：\"那时我觉得照这样下去，根本谈不上享受自己的时间。\""},{"jp":"移住(いじゅう)を決(き)めた{{3:当初(とうしょ)}}、家族(かぞく)は反対(はんたい)した。都会(とかい)育(そだ)ちの妻(つま)[[から見(み)ると]]、田舎(いなか)暮(ぐ)らしは不便(ふべん)その物(もの)だったのだろう。然(しか)し山本(やまもと)さんの{{4:決意(けつい)}}は固(かた)く、「借金(しゃっきん)をして[[でも]]、新(あたら)しい生活(せいかつ)を始(はじ)めたい」と家族(かぞく)を{{5:説得(せっとく)}}した。","zh":"刚决定移居时，家人表示反对。在城里长大的妻子看来，乡下生活大概就是不方便的代名词吧。但山本先生决心很坚定，他说服家人：\"就算借钱，我也想开始新的生活。\""},{"jp":"村(むら)には、{{6:空(あ)き家(や)}}を安(やす)く借(か)りられる制度(せいど)が有(あ)った。五年(ごねん)以上(いじょう)住(す)む事(こと)[[を前提(ぜんてい)に]]、家賃(やちん)の一部(いちぶ)を村(むら)が{{7:負担(ふたん)}}して呉(く)れるのだ。山本(やまもと)さんは元々(もともと)パソコン[[に掛(か)けては]]詳(くわ)しかったので、東京(とうきょう)の会社(かいしゃ)の仕事(しごと)をリモートで続(つづ)ける事(こと)にした。","zh":"村里有一项可以低价租用空房的制度。以居住五年以上为前提，村里会负担一部分房租。山本先生原本就精通电脑，于是决定远程继续做东京公司的工作。"},{"jp":"実際(じっさい)に暮(く)らして見(み)ると、不便(ふべん)な事(こと)も多(おお)かった。冬(ふゆ)は雪(ゆき)が深(ふか)く、一番(いちばん)近(ちか)いスーパー迄(まで)車(くるま)で三十分(さんじゅっぷん)掛(か)かる。都会(とかい)の便利(べんり)さに慣(な)れて居(い)た[[許(ばか)りに]]、最初(さいしょ)の冬(ふゆ)は食料(しょくりょう)の{{8:買(か)い置(お)き}}を忘(わす)れて困(こま)った事(こと)も有(あ)ったと言(い)う。","zh":"实际住下来，不方便的地方也很多。冬天积雪很深，开车到最近的超市也要三十分钟。就因为习惯了城市的便利，第一个冬天还曾因忘了囤粮而犯愁。"},{"jp":"それでも山本(やまもと)さんは、「野菜(やさい)は採(と)れ立(た)てを食(た)べる[[に限(かぎ)る]]」と笑(わら)う。今(いま)では近所(きんじょ)の農家(のうか)から畑(はたけ)を借(か)りて、家族(かぞく)で野菜(やさい)を育(そだ)てて居(い)る。山(やま)に囲(かこ)まれて居(い)る[[所(ところ)から]]、この村(むら)の水(みず)は特(とく)に美味(おい)しいと{{9:評判(ひょうばん)}}だそうだ。","zh":"尽管如此，山本先生还是笑着说：\"蔬菜还得吃刚摘的。\"现在他从附近农户那里租了块地，和家人一起种菜。据说因为四面环山，这个村子的水以特别好喝而闻名。"},{"jp":"最初(さいしょ)は反対(はんたい)して居(い)た妻(つま)も、今(いま)では村(むら)の料理教室(りょうりきょうしつ)の{{10:講師(こうし)}}[[として]]{{11:活躍(かつやく)}}して居(い)る。元々(もともと)レストランで働(はたら)いて居(い)た[[丈(だけ)あって]]、彼女(かのじょ)の料理(りょうり)は村人(むらびと)にも大人気(だいにんき)だ。","zh":"当初反对的妻子，现在也作为村里料理教室的讲师大显身手。不愧是在餐厅工作过的人，她做的菜在村民中也大受欢迎。"},{"jp":"勿論(もちろん)、誰(だれ)もが地方移住(ちほういじゅう)に向(む)いて居(い)る訳(わけ)ではない。若(も)し自分(じぶん)が移住(いじゅう)する[[としたら]]、仕事(しごと)や医療(いりょう)、子供(こども)の教育(きょういく)に就(つ)いて良(よ)く調(しら)べて置(お)く必要(ひつよう)が有(あ)るだろう。","zh":"当然，并不是每个人都适合移居地方。如果自己要移居的话，就有必要事先好好调查工作、医疗和孩子的教育等问题。"},{"jp":"「真面目(まじめ)な山本(やまもと)さんの[[事(こと)だから]]、必(かなら)ず上手(うま)く行(い)くと思(おも)って居(い)ました」と村長(そんちょう)は言(い)う。三年(さんねん)で村(むら)に{{12:溶(と)け込(こ)}}んだのは、{{13:流石(さすが)}}努力家(どりょくか)の彼(かれ)[[丈(だけ)の事(こと)は有(あ)る]]。「健康(けんこう)な[[限(かぎ)り]]、ここで暮(く)らし続(つづ)けたい」と語(かた)る山本(やまもと)さんの顔(かお)は、東京(とうきょう)に居(い)た頃(ころ)よりずっと明(あか)るかった。","zh":"村长说：\"认真的山本先生，我就知道他一定会顺利的。\"三年就融入了村子，真不愧是个肯努力的人。山本先生说：\"只要身体健康，我想一直在这里生活下去。\"他的脸比在东京时开朗多了。"}],"grammar":[["〜どころではない","哪里顾得上……，根本谈不上……","仕事(しごと)が忙(いそが)しくて、旅行(りょこう)[[どころではない]]。","工作太忙，哪里顾得上旅行。","熱(ねつ)が有(あ)って、勉強(べんきょう)する[[どころではなかった]]。","发烧了，根本没法学习。"],["〜から見(み)ると","从……来看，在……看来","子供(こども)[[から見(み)ると]]、大人(おとな)の世界(せかい)は不思議(ふしぎ)な物(もの)だ。","在孩子看来，大人的世界很不可思议。","外国人(がいこくじん)[[から見(み)ると]]、日本(にほん)の習慣(しゅうかん)は珍(めずら)しいらしい。","在外国人看来，日本的习惯好像很新奇。"],["〜てでも","就算……也要……","徹夜(てつや)して[[でも]]、明日(あした)迄(まで)にこの仕事(しごと)を終(お)わらせる。","就算熬夜，也要在明天之前把这份工作做完。","どんな手段(しゅだん)を使(つか)って[[でも]]、彼(かれ)を助(たす)けたい。","不管用什么办法，都想救他。"],["〜を前提(ぜんてい)に","以……为前提","結婚(けっこん)[[を前提(ぜんてい)に]]、付(つ)き合(あ)って下(くだ)さい。","请以结婚为前提和我交往。","この計画(けいかく)は、予算(よさん)が通(とお)る事(こと)[[を前提(ぜんてい)に]]進(すす)めて居(い)る。","这个计划是以预算获批为前提推进的。"],["〜に掛(か)けては","在……方面（最拿手）","料理(りょうり)[[に掛(か)けては]]、彼(かれ)の右(みぎ)に出(で)る者(もの)は居(い)ない。","论做菜，没有人比得上他。","足(あし)の速(はや)さ[[に掛(か)けては]]、誰(だれ)にも負(ま)けない。","论跑得快，我不输给任何人。"],["〜許(ばか)りに","就因为……（导致不好的结果）","一言(ひとこと)余計(よけい)な事(こと)を言(い)った[[許(ばか)りに]]、彼女(かのじょ)を怒(おこ)らせて仕舞(しま)った。","就因为多说了一句，惹她生气了。","地図(ちず)を持(も)って行(い)かなかった[[許(ばか)りに]]、道(みち)に迷(まよ)った。","就因为没带地图，迷路了。"],["〜に限(かぎ)る","……最好","疲(つか)れた時(とき)は、寝(ね)る[[に限(かぎ)る]]。","累的时候，最好就是睡觉。","夏(なつ)はビール[[に限(かぎ)る]]。","夏天就得喝啤酒。"],["〜所(ところ)から","从……来看，因为……","駅(えき)に近(ちか)い[[所(ところ)から]]、この辺(あた)りは家賃(やちん)が高(たか)い。","因为离车站近，这一带房租很贵。","形(かたち)が富士山(ふじさん)に似(に)て居(い)る[[所(ところ)から]]、「〜富士(ふじ)」と呼(よ)ばれる山(やま)は多(おお)い。","因为形状像富士山，被称作\"某某富士\"的山很多。"],["〜として","作为……","彼(かれ)は通訳(つうやく)[[として]]会議(かいぎ)に参加(さんか)した。","他作为翻译参加了会议。","この寺(てら)は世界遺産(せかいいさん)[[として]]登録(とうろく)されて居(い)る。","这座寺庙被登录为世界遗产。"],["〜丈(だけ)あって","不愧是……，正因为……","十年(じゅうねん)も日本(にほん)に住(す)んで居(い)る[[丈(だけ)あって]]、彼(かれ)の日本語(にほんご)は完璧(かんぺき)だ。","不愧在日本住了十年，他的日语非常完美。","高(たか)かった[[丈(だけ)あって]]、この鞄(かばん)は丈夫(じょうぶ)だ。","不愧是贵的，这个包很结实。"],["〜としたら","如果……的话","若(も)し宝(たから)くじが当(あ)たった[[としたら]]、何(なに)を買(か)いますか。","如果中了彩票，你会买什么？","明日(あした)晴(は)れた[[としたら]]、海(うみ)へ行(い)こう。","如果明天晴了，就去海边吧。"],["〜事(こと)だから","因为是……（所以一定会）","時間(じかん)に厳(きび)しい彼(かれ)の[[事(こと)だから]]、もう着(つ)いて居(い)るだろう。","他那么守时，应该已经到了吧。","優(やさ)しい母(はは)の[[事(こと)だから]]、必(かなら)ず許(ゆる)して呉(く)れる。","妈妈那么温柔，一定会原谅我的。"],["〜丈(だけ)の事(こと)は有(あ)る","不愧是……，没白……","一流(いちりゅう)のホテル[[丈(だけ)の事(こと)は有(あ)って]]、サービスが素晴(すば)らしい。","不愧是一流酒店，服务非常好。","毎日(まいにち)練習(れんしゅう)して居(い)た[[丈(だけ)の事(こと)は有(あ)る]]。見事(みごと)な演奏(えんそう)だった。","每天练习果然没白练，演奏得真精彩。"],["〜限(かぎ)り","只要……；在……范围内","体(からだ)が動(うご)く[[限(かぎ)り]]、働(はたら)き続(つづ)けたい。","只要身体还能动，就想一直工作下去。","私(わたし)の知(し)って居(い)る[[限(かぎ)り]]、彼(かれ)は嘘(うそ)を吐(つ)かない人(ひと)だ。","就我所知，他是个不撒谎的人。"]],"vocab":[["移住","いじゅう","移居"],["疲れ果てる","つかれはてる","筋疲力尽"],["振り返る","ふりかえる","回顾"],["当初","とうしょ","当初"],["決意","けつい","决心"],["説得","せっとく","说服"],["空き家","あきや","空房子"],["負担","ふたん","负担"],["買い置き","かいおき","囤货"],["評判","ひょうばん","名声，口碑"],["講師","こうし","讲师"],["活躍","かつやく","活跃，大显身手"],["溶け込む","とけこむ","融入"],["流石","さすが","不愧，果然"]],"short":"地方移住","lv":2,"sum":"一位上班族从东京搬到长野的小村子，三年来的辛苦与收获。"},
{"title":"読書離(どくしょばな)れは本当(ほんとう)か","paras":[{"jp":"「若者(わかもの)の{{0:読書離(どくしょばな)れ}}」[[と言(い)うと]]、本(ほん)を全(まった)く読(よ)まない若者(わかもの)の姿(すがた)を{{1:思(おも)い浮(う)かべる}}人(ひと)が多(おお)いだろう。確(たし)かに、一(いっ)箇(か)月(げつ)に一冊(いっさつ)も本(ほん)を読(よ)まない大学生(だいがくせい)は{{2:半数(はんすう)}}を超(こ)えると言(い)う調査(ちょうさ)も有(あ)る。","zh":"一说起\"年轻人远离读书\"，很多人脑海里会浮现出完全不看书的年轻人的样子吧。确实，也有调查显示，一个月连一本书都不读的大学生超过了半数。"},{"jp":"中(なか)には教科書(きょうかしょ)[[すら]]読(よ)まない学生(がくせい)も居(い)ると、或(あ)る大学(だいがく)の教授(きょうじゅ)は{{3:嘆(なげ)く}}。授業(じゅぎょう)のレポートも、インターネットで調(しら)べた情報(じょうほう)を{{4:纏(まと)め}}た丈(だけ)の物(もの)が{{5:目立(めだ)つ}}と言(い)う。","zh":"某大学的一位教授感叹说，有的学生甚至连教科书都不读。课堂报告也大多只是把网上查到的信息汇总一下而已。"},{"jp":"然(しか)し、読書離(どくしょばな)れが{{6:叫(さけ)}}ばれて居(い)る[[にも拘(かか)わらず]]、若者(わかもの)が文字(もじ)を読(よ)む量(りょう)は昔(むかし)より増(ふ)えて居(い)ると言(い)う見方(みかた)も有(あ)る。SNSやネットの記事(きじ)、電子書籍(でんししょせき)等(など)、スマホ[[を通(つう)じて]]毎日(まいにち)大量(たいりょう)の文章(ぶんしょう)に{{7:触(ふ)れ}}て居(い)るからだ。","zh":"然而，尽管人们都在说远离读书，也有观点认为，年轻人阅读文字的量比过去还要多。因为他们每天都通过手机接触社交媒体、网络文章、电子书等大量文字。"},{"jp":"本屋(ほんや)の店員(てんいん)に聞(き)くと、若(わか)い人(ひと)[[向(む)き]]の小説(しょうせつ)や漫画(まんが)は、今(いま)でも良(よ)く売(う)れて居(い)るそうだ。人気(にんき)作家(さっか)の{{8:新刊(しんかん)}}が出(で)ると、発売日(はつばいび)の朝(あさ)、店(みせ)が開(ひら)く[[か開(ひら)かないかのうちに]]{{9:行列(ぎょうれつ)}}が出来(でき)る事(こと)も有(あ)る。","zh":"问了书店店员，据说适合年轻人的小说和漫画现在依然很畅销。人气作家的新书一出，发售日早上书店刚一开门，就会排起长队。"},{"jp":"但(ただ)し、長(なが)い文章(ぶんしょう)をじっくり読(よ)む力(ちから)が弱(よわ)く成(な)って居(い)ると{{10:指摘(してき)}}する専門家(せんもんか)も居(い)る。短(みじか)い文章(ぶんしょう)許(ばか)り読(よ)んで居(い)ると、難(むずか)しい本(ほん)を一冊(いっさつ)読(よ)み切(き)る何(なん)て出来(でき)[[っこない]]と感(かん)じて仕舞(しま)うのだ。","zh":"不过，也有专家指出，静下心来读长篇文章的能力正在减弱。总读短文的话，就会觉得自己根本不可能读完一整本难懂的书。"},{"jp":"私(わたし)自身(じしん)、忙(いそが)しい時(とき)[[に限(かぎ)って]]本(ほん)を読(よ)みたく成(な)る物(もの)だが、スマホを手(て)に取(と)ると、何時(いつ)の間(ま)にか動画(どうが)を見(み)て居(い)る。時間(じかん)が作(つく)れ[[ないことはない]]のだから、{{12:言(い)い訳(わけ)}}は出来(でき)ない。","zh":"我自己也是，偏偏在忙的时候想看书，可一拿起手机，不知不觉就在看视频了。时间也不是挤不出来，所以没法找借口。"},{"jp":"読書(どくしょ)の良(よ)さは、一冊(いっさつ)の本(ほん)と{{11:向(む)き合(あ)}}い、自分(じぶん)で考(かんが)える時間(じかん)を持(も)てる事(こと)だ。一日(いちにち)十分(じゅっぷん)[[位(くらい)]]なら、誰(だれ)でも本(ほん)を読(よ)む時間(じかん)は作(つく)れる筈(はず)だ。私(わたし)は読(よ)むのが遅(おそ)い[[物(もの)で]]、一冊(いっさつ)に一週間(いっしゅうかん)は掛(か)かるが、それも又(また)楽(たの)しい。仕事(しごと)[[やら]]{{13:家事(かじ)}}やらで忙(いそが)しい毎日(まいにち)だからこそ、紙(かみ)の本(ほん)を開(ひら)く時間(じかん)を大切(たいせつ)にしたい。","zh":"读书的好处，在于能面对一本书，拥有自己思考的时间。一天十分钟左右的话，谁都能挤出读书的时间。我读得慢，一本书要花上一周，但这也是一种乐趣。正因为每天被工作、家务等忙得团团转，我更想珍惜翻开纸质书的时间。"}],"grammar":[["〜と言(い)うと","一说起……；你说的……是指","日本料理(にほんりょうり)[[と言(い)うと]]、寿司(すし)や天麩羅(てんぷら)を思(おも)い浮(う)かべる人(ひと)が多(おお)い。","一说起日本料理，很多人会想到寿司和天妇罗。","「来週(らいしゅう)の会議(かいぎ)」[[と言(い)うと]]、何曜日(なんようび)の事(こと)ですか。","你说的\"下周的会议\"，是指星期几？"],["〜すら","连……都（书面）","疲(つか)れ過(す)ぎて、立(た)つ事(こと)[[すら]]出来(でき)なかった。","累得连站都站不起来。","彼(かれ)は自分(じぶん)の名前(なまえ)[[すら]]漢字(かんじ)で書(か)けない。","他连自己的名字都不会用汉字写。"],["〜にも拘(かか)わらず","尽管……却……","雨(あめ)[[にも拘(かか)わらず]]、大勢(おおぜい)の人(ひと)が集(あつ)まった。","尽管下着雨，还是来了很多人。","彼(かれ)は熱(ねつ)が有(あ)る[[にも拘(かか)わらず]]、会社(かいしゃ)に来(き)た。","他尽管发着烧，还是来了公司。"],["〜を通(つう)じて","通过……","インターネット[[を通(つう)じて]]、世界中(せかいじゅう)の人(ひと)と話(はな)せる。","通过互联网，可以和世界各地的人交谈。","留学(りゅうがく)[[を通(つう)じて]]、多(おお)くの事(こと)を学(まな)んだ。","通过留学学到了很多东西。"],["〜向(む)き","适合……","この料理(りょうり)は辛(から)くないので、子供(こども)[[向(む)き]]だ。","这道菜不辣，适合孩子吃。","この仕事(しごと)は、人(ひと)と話(はな)すのが好(す)きな人(ひと)[[向(む)き]]だ。","这份工作适合喜欢和人打交道的人。"],["〜か〜ないかのうちに","刚一……就……","ベルが鳴(な)る[[か鳴(な)らないかのうちに]]、学生達(がくせいたち)は教室(きょうしつ)を飛(と)び出(だ)した。","铃声刚一响，学生们就冲出了教室。","彼(かれ)は布団(ふとん)に入(はい)る[[か入(はい)らないかのうちに]]、眠(ねむ)って仕舞(しま)った。","他刚钻进被窝就睡着了。"],["〜っこない","根本不可能……（口语）","こんな量(りょう)の仕事(しごと)、一日(いちにち)で終(お)わり[[っこない]]。","这么多工作，一天根本做不完。","宝(たから)くじ何(なん)て、当(あ)たり[[っこない]]よ。","彩票什么的，根本不可能中。"],["〜に限(かぎ)って","偏偏……；唯独……","急(いそ)いで居(い)る時(とき)[[に限(かぎ)って]]、電車(でんしゃ)が遅(おく)れる。","偏偏在着急的时候，电车晚点。","内(うち)の子(こ)[[に限(かぎ)って]]、そんな事(こと)をする筈(はず)が無(な)い。","唯独我家孩子，不可能做那种事。"],["〜ないことはない","也不是不……","辛(から)い物(もの)も、食(た)べられ[[ないことはない]]。","辣的东西也不是不能吃。","一人(ひとり)で行(い)け[[ないことはない]]が、誰(だれ)かと一緒(いっしょ)の方(ほう)が安心(あんしん)だ。","也不是不能一个人去，但和别人一起更放心。"],["〜位(くらい)","至少……，……左右；……那样的程度","自分(じぶん)の部屋(へや)[[位(くらい)]]、自分(じぶん)で掃除(そうじ)しなさい。","至少自己的房间要自己打扫。","挨拶(あいさつ)[[位(くらい)]]は、日本語(にほんご)で出来(でき)る様(よう)に成(な)りたい。","至少打招呼，想能用日语说。"],["〜物(もの)で","因为……（解释原因，口语）","子供(こども)が熱(ねつ)を出(だ)した[[物(もの)で]]、今日(きょう)は休(やす)ませて下(くだ)さい。","因为孩子发烧了，今天请让我休息。","慣(な)れない[[物(もの)で]]、時間(じかん)が掛(か)かって仕舞(しま)いました。","因为不熟悉，花了不少时间。"],["〜やら〜やら","又……又……（列举）","引(ひ)っ越(こ)しの準備(じゅんび)[[やら]]手続(てつづ)き[[やら]]で、目(め)が回(まわ)る程(ほど)忙(いそが)しい。","又是准备搬家又是办手续，忙得团团转。","嬉(うれ)しい[[やら]]恥(は)ずかしい[[やら]]で、言葉(ことば)が出(で)なかった。","又高兴又害羞，说不出话来。"]],"vocab":[["読書離れ","どくしょばなれ","远离读书"],["思い浮かべる","おもいうかべる","想起，浮现"],["半数","はんすう","半数"],["嘆く","なげく","叹息，感叹"],["纏める","まとめる","汇总，整理"],["目立つ","めだつ","显眼"],["叫ぶ","さけぶ","呼喊，大声疾呼"],["触れる","ふれる","接触"],["新刊","しんかん","新书"],["行列","ぎょうれつ","队伍，排队"],["指摘","してき","指出"],["向き合う","むきあう","面对"],["言い訳","いいわけ","借口"],["家事","かじ","家务"]],"short":"読書離れ","lv":2,"sum":"\"年轻人不读书\"是真的吗？从调查、书店和自己的经历来看读书的变化。"},
{"title":"ペットと暮(く)らす責任(せきにん)","paras":[{"jp":"日本(にほん)では、犬(いぬ)や猫(ねこ)を飼(か)って居(い)る{{0:世帯(せたい)}}は全体(ぜんたい)の三割(さんわり)近(ちか)くに上(のぼ)る。一人(ひとり)暮(ぐ)らしの増加(ぞうか)[[に伴(ともな)って]]、ペットを「家族(かぞく)の{{1:一員(いちいん)}}」と考(かんが)える人(ひと)も増(ふ)えて来(き)た。","zh":"在日本，养狗或养猫的家庭接近总数的三成。随着独居人数的增加，把宠物当作\"家庭一员\"的人也多了起来。"},{"jp":"然(しか)し、ペットを飼(か)う[[からには]]、最後(さいご)迄(まで)責任(せきにん)を持(も)たなければ成(な)らない。犬(いぬ)の{{2:寿命(じゅみょう)}}は十五年(じゅうごねん)前後(ぜんご)で、猫(ねこ)は二十年(にじゅうねん)近(ちか)く生(い)きる事(こと)も有(あ)る。可愛(かわい)い[[からと言(い)って]]、軽(かる)い気持(きも)ちで飼(か)い始(はじ)める[[可(べ)きではない]]。","zh":"但是，既然养了宠物，就必须负责到最后。狗的寿命在十五年左右，猫有时能活将近二十年。不能因为可爱，就抱着随便的心态开始养。"},{"jp":"実際(じっさい)、引(ひ)っ越(こ)しや{{3:飼(か)い主(ぬし)}}の高齢化(こうれいか)等(など)を理由(りゆう)に、ペットを手放(てばな)す人(ひと)は{{4:後(あと)を絶(た)たない}}。飼(か)い主(ぬし)の{{5:勝手(かって)}}な都合(つごう)で捨(す)てられる動物(どうぶつ)が居(い)る[[一方(いっぽう)で]]、{{6:保護施設(ほごしせつ)}}はどこも満員(まんいん)の状態(じょうたい)だ。","zh":"实际上，以搬家、主人年老等为理由放弃宠物的人接连不断。一边是因主人自私的理由被抛弃的动物，另一边是各地的收容机构都已满员。"},{"jp":"飼(か)う前(まえ)には、住(す)まいがペット可(か)かどうか[[は元(もと)より]]、毎月(まいつき)の{{7:餌代(えさだい)}}や病院代(びょういんだい)も確認(かくにん)して置(お)く必要(ひつよう)が有(あ)る。病気(びょうき)に成(な)れば、{{8:治療費(ちりょうひ)}}が数十万円(すうじゅうまんえん)に成(な)る事(こと)も珍(めずら)しくない。実際(じっさい)に一緒(いっしょ)に暮(く)らして見(み)[[ないことには]]、どれ程(ほど)御(お)金(かね)と時間(じかん)が掛(か)かるのか分(わ)からない物(もの)だ。","zh":"养之前，住处能不能养宠物自不必说，每月的饲料费、看病费也得事先确认。一旦生病，治疗费达到几十万日元也不稀奇。不真正一起生活，就不知道要花多少钱和时间。"},{"jp":"又(また)、ペットは飼(か)い主(ぬし)の生活(せいかつ)リズム[[に応(おう)じて]]健康状態(けんこうじょうたい)も変(か)わる。散歩(さんぽ)を{{9:怠(おこた)る}}と、犬(いぬ)はストレスで{{10:無駄吠(むだぼ)え}}をする様(よう)に成(な)り、近所(きんじょ)とのトラブルに成(な)り[[兼(か)ねない]]。","zh":"另外，宠物的健康状况也会随主人的生活节奏而变化。如果偷懒不遛狗，狗会因为压力而乱叫，可能会和邻居闹出矛盾。"},{"jp":"最近(さいきん)では、ペットと一緒(いっしょ)に泊(と)まれるホテルや、ペット[[向(む)け]]の保険(ほけん)も増(ふ)えて居(い)る。こうしたサービスを上手(じょうず)に利用(りよう)した[[上(うえ)で]]、自分(じぶん)の生活(せいかつ)に無理(むり)が無(な)いかを考(かんが)える事(こと)が大切(たいせつ)だ。","zh":"最近，能和宠物一起入住的酒店以及面向宠物的保险也在增加。在好好利用这些服务的基础上，考虑自己的生活是否勉强，这一点很重要。"},{"jp":"私(わたし)自身(じしん)、猫(ねこ)を飼(か)っ[[て初(はじ)めて]]、命(いのち)を{{11:預(あず)かる}}事(こと)の重(おも)さを知(し)った。言葉(ことば)が通(つう)じない[[丈(だけ)に]]、小(ちい)さな変化(へんか)を{{12:見逃(みのが)}}さない様(よう)に気(き)を付(つ)けて居(い)る。ペットとの暮(く)らしが幸(しあわ)せな物(もの)に成(な)るかどうかは、飼(か)い主(ぬし)の{{13:心構(こころがま)え}}[[次第(しだい)だ]]。","zh":"我自己也是养了猫之后，才知道照顾一条生命的分量有多重。正因为语言不通，我一直留心不放过它细小的变化。和宠物的生活能否幸福，取决于主人的心态。"}],"grammar":[["〜に伴(ともな)って","随着……","人口(じんこう)の増加(ぞうか)[[に伴(ともな)って]]、住宅(じゅうたく)が不足(ふそく)して居(い)る。","随着人口增加，住房出现了短缺。","引(ひ)っ越(こ)し[[に伴(ともな)って]]、子供達(こどもたち)も転校(てんこう)する事(こと)に成(な)った。","因为搬家，孩子们也要转学了。"],["〜からには","既然……就……","選手(せんしゅ)に選(えら)ばれた[[からには]]、全力(ぜんりょく)を尽(つ)くしたい。","既然被选为选手，就想全力以赴。","自分(じぶん)で決(き)めた[[からには]]、後悔(こうかい)はしない。","既然是自己决定的，就不后悔。"],["〜からと言(い)って","虽说……但（不能因此就……）","日本人(にほんじん)だ[[からと言(い)って]]、皆(みんな)寿司(すし)が好(す)きな訳(わけ)ではない。","虽说是日本人，并不是人人都喜欢寿司。","一度(いちど)失敗(しっぱい)した[[からと言(い)って]]、諦(あきら)める必要(ひつよう)は無(な)い。","虽然失败了一次，也没必要放弃。"],["〜可(べ)きではない","不应该……","人(ひと)の悪口(わるくち)は言(い)う[[可(べ)きではない]]。","不应该说别人的坏话。","体調(たいちょう)が悪(わる)い時(とき)は、無理(むり)をす[[可(べ)きではない]]。","身体不舒服的时候，不应该勉强。"],["〜一方(いっぽう)で","一方面……另一方面……","都市(とし)に人口(じんこう)が集中(しゅうちゅう)する[[一方(いっぽう)で]]、地方(ちほう)の過疎化(かそか)が進(すす)んで居(い)る。","人口向城市集中的同时，地方的人口稀疏化也在加剧。","彼(かれ)は仕事(しごと)に厳(きび)しい[[一方(いっぽう)で]]、部下(ぶか)の面倒(めんどう)も良(よ)く見(み)る。","他对工作很严格，另一方面也很照顾下属。"],["〜は元(もと)より","……自不必说","この祭(まつ)りには、地元(じもと)の人(ひと)[[は元(もと)より]]、遠(とお)くからも観光客(かんこうきゃく)が来(く)る。","这个祭典，当地人自不必说，还有远道而来的游客。","健康(けんこう)の為(ため)には、食事(しょくじ)[[は元(もと)より]]、睡眠(すいみん)も大切(たいせつ)だ。","为了健康，饮食自不用说，睡眠也很重要。"],["〜ないことには","不……的话就（不）……","遣(や)って見(み)[[ないことには]]、出来(でき)るかどうか分(わ)からない。","不试一试，就不知道能不能做到。","全員(ぜんいん)が揃(そろ)わ[[ないことには]]、会議(かいぎ)を始(はじ)められない。","人不到齐，会议就没法开始。"],["〜に応(おう)じて","根据……，随着……","年齢(ねんれい)[[に応(おう)じて]]、運動(うんどう)の量(りょう)を調整(ちょうせい)しましょう。","根据年龄调整运动量吧。","成績(せいせき)[[に応(おう)じて]]、奨学金(しょうがくきん)が支給(しきゅう)される。","根据成绩发放奖学金。"],["〜兼(か)ねない","很可能会……（不好的结果）","この儘(まま)放(ほう)って置(お)くと、大(おお)きな問題(もんだい)に成(な)り[[兼(か)ねない]]。","就这样放着不管，很可能变成大问题。","睡眠不足(すいみんぶそく)は、事故(じこ)の原因(げんいん)に成(な)り[[兼(か)ねない]]。","睡眠不足很可能成为事故的原因。"],["〜向(む)け","面向……","初心者(しょしんしゃ)[[向(む)け]]の料理教室(りょうりきょうしつ)に通(かよ)って居(い)る。","在上面向初学者的烹饪班。","この雑誌(ざっし)は、二十代(にじゅうだい)の女性(じょせい)[[向(む)け]]に作(つく)られて居(い)る。","这本杂志是面向二十多岁的女性做的。"],["〜た上(うえ)で","在……之后（再做）","良(よ)く考(かんが)えた[[上(うえ)で]]、返事(へんじ)をします。","好好考虑之后再给您答复。","内容(ないよう)を確認(かくにん)した[[上(うえ)で]]、印鑑(いんかん)を押(お)して下(くだ)さい。","请确认内容之后再盖章。"],["〜て初(はじ)めて","……之后才（第一次）","親(おや)に成(な)っ[[て初(はじ)めて]]、親(おや)の苦労(くろう)が分(わ)かった。","自己当了父母，才明白父母的辛苦。","失(うしな)っ[[て初(はじ)めて]]、その大切(たいせつ)さに気付(きづ)く物(もの)だ。","人往往失去之后，才意识到它的珍贵。"],["〜丈(だけ)に","正因为……","期待(きたい)して居(い)た[[丈(だけ)に]]、負(ま)けた時(とき)のショックは大(おお)きかった。","正因为抱着期待，输的时候打击才特别大。","彼(かれ)は苦労人(くろうにん)な[[丈(だけ)に]]、人(ひと)の痛(いた)みが良(よ)く分(わ)かる。","正因为他吃过苦，才很能体会别人的痛苦。"],["〜次第(しだい)だ","取决于……","計画(けいかく)が成功(せいこう)するかどうかは、皆(みな)さんの協力(きょうりょく)[[次第(しだい)だ]]。","计划能否成功，取决于大家的配合。","人生(じんせい)は考(かんが)え方(かた)[[次第(しだい)だ]]。","人生取决于你怎么看待它。"]],"vocab":[["世帯","せたい","家庭，户"],["一員","いちいん","一员"],["寿命","じゅみょう","寿命"],["飼い主","かいぬし","（宠物的）主人"],["後を絶たない","あとをたたない","接连不断"],["勝手","かって","任性，自私"],["保護施設","ほごしせつ","收容机构"],["餌代","えさだい","饲料费"],["治療費","ちりょうひ","治疗费"],["怠る","おこたる","懈怠，偷懒"],["無駄吠え","むだぼえ","（狗）乱叫"],["預かる","あずかる","照看，保管"],["見逃す","みのがす","放过，看漏"],["心構え","こころがまえ","心理准备，心态"]],"short":"ペット","lv":2,"sum":"养宠物前要考虑哪些现实问题？从寿命、费用到被抛弃的动物，谈主人的责任。"},
{"title":"防災(ぼうさい)の備(そな)え","paras":[{"jp":"日本(にほん)は世界(せかい)でも{{0:有数(ゆうすう)}}の地震大国(じしんたいこく)だ。専門家(せんもんか)に依(よ)ると、近(ちか)い将来(しょうらい)大(おお)きな地震(じしん)が起(お)こる{{1:確率(かくりつ)}}は高(たか)く、誰(だれ)もが{{2:被害(ひがい)}}に遭(あ)い[[得(う)る]]と言(い)う。","zh":"日本是世界上屈指可数的地震大国。据专家说，近期发生大地震的概率很高，任何人都有可能受灾。"},{"jp":"地震(じしん)の[[際(さい)に]]最(もっと)も怖(こわ)いのは、家具(かぐ)の{{3:転倒(てんとう)}}や火災(かさい)だ。過去(かこ)の大地震(だいじしん)では、倒(たお)れた家具(かぐ)の{{4:下敷(したじ)き}}に成(な)って怪我(けが)をした人(ひと)が多(おお)かった。家具(かぐ)を壁(かべ)に{{5:固定(こてい)}}して置(お)かないと、大(おお)きな事故(じこ)に繋(つな)がる[[恐(おそ)れが有(あ)る]]。","zh":"地震时最可怕的是家具倒下和火灾。在过去的大地震中，很多人被倒下的家具压住而受伤。如果不把家具固定在墙上，可能会导致严重的事故。"},{"jp":"又(また)、大地震(だいじしん)が発生(はっせい)した場合(ばあい)、電気(でんき)や水道(すいどう)、ガスが止(と)まる可能性(かのうせい)が高(たか)い。災害(さいがい)[[に備(そな)えて]]、最低(さいてい)三日分(みっかぶん)の水(みず)と食料(しょくりょう)を{{7:用意(ようい)}}して置(お)く[[に越(こ)した事(こと)はない]]。","zh":"另外，发生大地震时，水电燃气很可能会中断。为了防备灾害，最好事先准备至少三天的水和食物。"},{"jp":"防災用品(ぼうさいようひん)を揃(そろ)える[[に当(あ)たって]]は、家族(かぞく)の{{8:構成(こうせい)}}も考(かんが)える可(べ)きだ。小(ちい)さな子供(こども)が居(い)る家庭(かてい)[[にしろ]]、高齢者(こうれいしゃ)が居(い)る家庭(かてい)にしろ、必要(ひつよう)な物(もの)はそれぞれ違(ちが)う。","zh":"准备防灾用品时，也应该考虑家庭成员的构成。无论是有小孩的家庭还是有老人的家庭，需要的东西都各不相同。"},{"jp":"{{9:避難場所(ひなんばしょ)}}や家族(かぞく)との連絡方法(れんらくほうほう)も、何(なに)も起(お)きて居(い)ない[[うちに]]話(はな)し合(あ)って置(お)く可(べ)きだ。災害(さいがい)が起(お)きてから慌(あわ)てた[[所(ところ)で]]、冷静(れいせい)な判断(はんだん)は出来(でき)ない。","zh":"避难场所和与家人的联系方式，也应该趁什么都还没发生的时候商量好。灾害发生后再慌也没用，没法冷静判断。"},{"jp":"最近(さいきん)では、地域(ちいき)の{{10:防災訓練(ぼうさいくんれん)}}に参加(さんか)する若者(わかもの)も増(ふ)えて来(き)た。年齢(ねんれい)[[を問(と)わず]]誰(だれ)でも参加(さんか)出来(でき)るので、近所(きんじょ)の人(ひと)と{{11:顔見知(かおみし)り}}に成(な)る良(よ)い機会(きかい)にも成(な)る。災害時(さいがいじ)に助(たす)け合(あ)えるのは、近(ちか)くに住(す)む人(ひと)[[に他(ほか)ならない]]。","zh":"最近，参加社区防灾演练的年轻人也多了起来。不论年龄，谁都可以参加，所以也是和邻居混熟的好机会。灾害发生时能互相帮助的，正是住在附近的人。"},{"jp":"地震(じしん)その物(もの)は{{12:防(ふせ)}}ぎ[[様(よう)が無(な)い]]が、被害(ひがい)を小(ちい)さくする事(こと)は出来(でき)る。「{{6:備(そな)え}}有(あ)れば{{13:憂(うれ)い}}無(な)し」と言(い)う言葉(ことば)も有(あ)る。今日(きょう)出来(でき)る事(こと)から、早速(さっそく)始(はじ)め[[ようではないか]]。","zh":"地震本身是无法阻止的，但可以把损失降到最小。俗话说\"有备无患\"。让我们从今天能做的事开始，马上行动起来吧。"}],"grammar":[["〜得(う)る","有可能……","その可能性(かのうせい)は十分(じゅうぶん)有(あ)り[[得(う)る]]。","那种可能性完全存在。","考(かんが)え[[得(う)る]]方法(ほうほう)は全(すべ)て試(ため)した。","能想到的方法全都试过了。"],["〜際(さい)に","在……的时候（正式）","地震(じしん)
