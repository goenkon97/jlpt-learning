        <div><b>能吃（可能）</b><span v-html="rb('私(わたし)は納豆(なっとう)<em>が</em>食(た)べられる。')"></span><small>对象用「が」，主语自己有能力</small></div>
        <div><b>被吃（被动）</b><span v-html="rb('ケーキを妹(いもうと)<em>に</em>食(た)べられた。')"></span><small>有「〜に」表示吃的人，主语受了影响</small></div>
      </div>
      <p class="vb-note" v-html="rb('一类动词不会混：飲(の)める（能喝）≠ 飲(の)まれる（被喝）。')"></p>
    </div>
    <div class="card">
      <h3 v-html="rb('一类对照：「飲(の)む」')"></h3>
      <div class="vb-drink"><div v-for="d in drink" :key="d[0]"><span v-html="rb(d[0])"></span><button class="play lt" @click="say(kana(d[0]))" aria-label="朗读">▶</button><small>{{ d[1] }}</small></div></div>
      <p class="vb-note">规律：一类是 あ段 ＋ れる／せる／される，二类是 去掉「る」＋ られる／させる／させられる。</p>
    </div>
  </template>

  <!-- ===== ④ 查变形 ===== -->
  <template v-else>
    <div class="card">
      <h3>输入任意动词，查全部变形</h3>
      <input class="search vb-in" v-model="q" placeholder="例如：食べる / たべる / 勉強 / かえる">
      <div class="vb-cands" v-if="cands.length>1">
        <span class="vb-small">找到 {{ cands.length }} 个，选一个：</span>
        <button v-for="(c,i) in cands" :key="c.w+c.r+i" :class="{on:sel===c}" @click="sel=c"><span v-html="rb(align(c.w,c.r))"></span> <small>{{ short(c.zh) }}</small></button>
      </div>
      <p class="vb-small" v-else-if="q.trim() && !cands.length && loading">词典加载中…</p>
      <p class="vb-small" v-else-if="q.trim() && !cands.length">没找到这个动词。请输入辞书形（る、う、く… 结尾），或者「名词 ＋ する」。</p>
      <div class="vb-quick"><span class="vb-small">常用：</span><button v-for="v in list" :key="v.w" :class="{on:cur===v&&!q.trim()}" @click="q=''; pickV(v)" v-html="rb(align(v.w,v.r))"></button></div>
    </div>
    <div class="card" v-if="cur">
      <div class="vb-vh">
        <span class="vb-vw" v-html="rb(align(cur.w,cur.r))"></span><button class="play lt" @click="say(cur.r)" aria-label="朗读">▶</button>
        <span class="vb-tag" :class="'g'+(cur.g===1?1:cur.g===2?2:3)">{{ gn[cur.g] }}</span><span class="vb-small">{{ gj[cur.g] }}</span>
        <span class="vb-vz">{{ cur.zh }}</span>
      </div>
      <p class="vb-note" v-if="cur.x">{{ cur.x }}</p>
      <p class="vb-note" v-if="cur.g===2">二类动词的可能形和被动形相同（〜られる），看语境区分。</p>
      <div class="vb-tbl" v-for="grp in table" :key="grp[0]">
        <div class="vb-th">{{ grp[0] }}</div>
        <div class="vb-tr" v-for="f in grp[1]" :key="f[0]">
          <span class="vb-tn" v-html="rb(f[1])"></span>
          <span class="vb-tv" v-html="rb(conj(cur,f[0]).mk)"></span>
          <button class="play lt" @click="say(conj(cur,f[0]).kana)" aria-label="朗读">▶</button>
          <span class="vb-tz">{{ f[2].replace(/\\{v\\}/g, short(cur.zh)) }}</span>
        </div>
      </div>
    </div>
  </template>
</div>`,
  emits:['home'],
  data(){ let t='kind'; try{ t=localStorage.getItem('vbTab')||'kind'; }catch(_){}
    return { tab:t, tabs:[['kind','三类怎么分'],['rule','变形规则'],['voice','被动 · 使役'],['look','查变形']],
      rows:VB_ROWS, row:VB_ROWS[0], danuse:VB_DANUSE, forms:VB_FORMS, teRows:VB_TE, eat:VB_EAT, drink:VB_DRINK, list:VB_LIST, table:VB_TABLE, gn:VB_GN, gj:VB_GJ,
      suru:{w:'する',r:'する',g:'s'}, kuru:{w:'来る',r:'くる',g:'k'},
      threeForms:[['dict','辞书形'],['masu','ます形'],['te','て形'],['nai','ない形'],['pot','可能形'],['pass','受身形'],['caus','使役形'],['vol','意向形'],['imp','命令形'],['ba','ば']],
      oneEnds:[['る','辞书形'],['ます','礼貌'],['ない','否定'],['て','て形'],['た','过去'],['たい','想'],['られる','可能／被动'],['させる','使役'],['よう','意向'],['ろ','命令'],['れば','假定']],
      excs:[['帰(かえ)る','かえる'],['入(はい)る','はいる'],['走(はし)る','はしる'],['知(し)る','しる'],['要(い)る','いる'],['切(き)る','きる'],['減(へ)る','へる'],['限(かぎ)る','かぎる'],['喋(しゃべ)る','しゃべる'],['滑(すべ)る','すべる'],['握(にぎ)る','にぎる'],['蹴(け)る','ける'],['焦(あせ)る','あせる'],['参(まい)る','まいる']],
      q:'', sel:null, cur:VB_LIST[16], loading:false, dictOK:false };
  },
  computed:{
    cands(){
      const raw=this.q.trim().replace(/\s+/g,''); if(!raw) return [];
      const q=hira(raw), qs=q.replace(/する$/,''), rs=raw.replace(/する$/,''), out=[], seen=new Set();
      const add=v=>{ const k=v.w+'|'+v.r; if(!seen.has(k)){ seen.add(k); out.push(v); } };
      this.list.forEach(v=>{ if(v.w===raw||v.r===q) add(v); });
      if(this.dictOK && DICT){
        for(const d of DICT){ const p=d.e[4]||''; if(!/五段|一段|カ变|サ变/.test(p)) continue;
          const zh=d.e[6]||d.e[3].split(';')[0].replace(/^to /,'');
          if(/サ变/.test(p) && /名|副/.test(p)){ if(d.w===rs||d.a===rs||d.r===qs) add({w:d.w+'する',r:d.r+'する',g:'s',zh}); continue; }
          if(!(d.w===raw||d.a===raw||d.r===q)) continue;
          const g=/カ变/.test(p)?'k':/サ变/.test(p)?'s':/一段/.test(p)?2:1;
          if(g==='s' && !/する$/.test(d.r)) continue;
          add({w:d.w, r:d.r, g, zh});
        }
      }
      return out.slice(0,8);
    }
  },
  watch:{
    q(v){ if(v.trim() && !this.dictOK){ this.loading=true; loadDict().then(()=>{ this.dictOK=true; this.loading=false; }).catch(()=>{ this.loading=false; }); } },
    cands(c){ if(c.length){ this.sel=c[0]; } },
    sel(v){ if(v) this.cur=v; }
  },
  methods:{
    rb(s){ return ruby(esc(s).replace(/&lt;(\/?)(em|span)(?: class=&quot;([\w-]+)&quot;)?&gt;/g,(m,sl,t,cl)=>'<'+sl+t+(cl?' class="'+cl+'"':'')+'>')); },
    conj(v,f){ return vbConj(v,f); },
    align(w,r){ return vbAlign(w,r); },
    kana(mk){ return vbKana(mk); },
    short(z){ return (z||'').split(/[；;，,、（(]/)[0]; },
    setTab(t){ this.tab=t; try{ localStorage.setItem('vbTab',t); }catch(_){} window.scrollTo(0,0); },
    toForm(k){ const el=document.getElementById('vf-'+k); if(!el) return; const y=el.getBoundingClientRect().top+window.scrollY-(document.querySelector('.vb .sticky')?.offsetHeight||0)-8; window.scrollTo({top:y,behavior:'auto'}); },
    pickV(v){ this.sel=null; this.cur=v; this.say(v.r); },
    danKana(i){ const r=vbRow(this.row[1]); return r[i]; },
    danEx(i){ const v={w:this.row[0],r:this.row[1],g:1}; return vbConj(v, this.danuse[i][2]).mk; },
    kuruCls(f){ const r=vbConj(this.kuru,f).mk.match(/来\((.)\)/); return r?{く:'kc-ku',き:'kc-ki',こ:'kc-ko'}[r[1]]:''; },
    say(t){
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95; u.pitch=1;
      const v=bestVoice(); if(v) u.voice=v; speechSynthesis.speak(u);
    }
  }
};

Vue.createApp({
  data(){ const p=parse(); return { route:p.route, idx:p.idx, q:'', furi:true, showZh:false, hiGram:true, hiVoc:true, flashG:null, flashV:null, openAna:{}, synonyms, synCats, synCat:'all', synPage:1, sel:{}, grammar, gramCats, gramTag:{n2:'N2',n3:'N3',talk:'口语'}, gramCat:'all', gramPage:1, gq:'', articles }; },
  computed:{
    art(){ return this.articles[this.idx]; },
    coveredGrammar(){ return new Set(this.articles.flatMap(a=>a.grammar.map(g=>g[0]))).size; },
    catCounts(){ const c={}; Object.keys(this.synCats).forEach(k=>{ const n=this.synonyms.filter(g=>g.c===k).length; if(n) c[k]=n; }); return c; },
    filteredSyn(){
      const q=this.q.trim(), cat=this.synCat;
      return this.synonyms.filter(g=>(cat==='all'||g.c===cat) && (!q || g.title.includes(q) || g.words.some(w=>w.k.includes(q)||w.r.includes(q)||w.zh.includes(q))));
    },
    synPages(){ return Math.max(1, Math.ceil(this.filteredSyn.length/10)); },
    pageList(){ const n=this.synPages, c=this.synPage; if(n<=7) return Array.from({length:n},(_,i)=>i+1);
      let a=Math.max(2,c-1), b=Math.min(n-1,c+1); if(c<=3){a=2;b=4;} if(c>=n-2){a=n-3;b=n-1;}
      const out=[1]; if(a>2) out.push(0); for(let i=a;i<=b;i++) out.push(i); if(b<n-1) out.push(0); out.push(n); return out; },
    gramCounts(){ const c={}; Object.keys(this.gramCats).forEach(k=>{ const n=this.grammar.filter(g=>g.c===k).length; if(n) c[k]=n; }); return c; },
    filteredGram(){ const q=this.gq.trim(), cat=this.gramCat;
      return this.grammar.filter(g=>(cat==='all'||g.c===cat) && (!q || this.plain(g.p).includes(q) || g.p.includes(q) || g.zh.includes(q) || g.note.includes(q))); },
    gramPages(){ return Math.max(1, Math.ceil(this.filteredGram.length/10)); },
    pagedGram(){ const p=Math.min(this.gramPage,this.gramPages); return this.filteredGram.slice((p-1)*10, p*10); },
    pagedSyn(){ const p=Math.min(this.synPage,this.synPages); return this.filteredSyn.slice((p-1)*10, p*10); }
  },
  watch:{ q(){ this.synPage=1; }, synCat(){ this.synPage=1; }, gq(){ this.gramPage=1; }, gramCat(){ this.gramPage=1; } },
  methods:{
    rb(s){ return ruby(esc(s)); },
    setPage(p){ if(!p||p<1||p>this.synPages) return; this.synPage=p; window.scrollTo({top:0,behavior:this.smooth()}); },
    setGPage(p){ if(!p||p<1||p>this.gramPages) return; this.gramPage=p; window.scrollTo({top:0,behavior:this.smooth()}); },
    selIdx(g){ return this.sel[g.title]||0; },
    cur(g){ return g.words[this.selIdx(g)]||g.words[0]; },
    pick(g,j){ this.sel[g.title]=j; const w=g.words[j]; this.say(w.r||w.k); },
    /* 朗读用假名读音：网站里居る・有る・御等写成汉字，直接交给语音引擎容易读错 */
    sayEx(ex){ this.say(ex.replace(/[一-鿿々〆ヶ]+\(([ぁ-ゖー]+)\)/g,'$1').replace(/\[\[|\]\]|\{\{\d+:|\}\}/g,'')); },
    plain(s){ return s.replace(/\([\u3041-\u3096ー]+\)|\[\[|\]\]|\{\{\d+:|\}\}/g,''); },
    /* base = 本段第一个语法的编号；不传则是例句（不可跳转） */
    /* kind='v'：词汇例句，[[ ]] 用词汇样式；正文里 {{i:词}} 是第 i 个重点词汇 */
    render(s, base, kind){
      const cls=kind==='v'?'vx':(this.hiGram?'gp':'gq'); let n=0;
      const vm=t=>ruby(t.replace(/\{\{(\d+):([\s\S]*?)\}\}/g,(m,i,w)=>'<span class="'+(this.hiVoc?'vw':'vq')+'" data-v="'+i+'">'+ruby(w)+'</span>'));
      return esc(s).split(/\[\[|\]\]/).map((part,i)=>{
        if(!(i%2)) return vm(part);
        const attr = base==null ? '' : ' data-g="'+(base+n++)+'"';
        return '<span class="'+cls+'"'+attr+'>'+ruby(part)+'</span>';
      }).join('');
    },
    gBase(pi){ return this.art.paras.slice(0,pi).reduce((n,p)=>n+(p.jp.match(/\[\[/g)||[]).length,0); },
    /* 单击 = 填入查词框（等 450ms 确认不是双击）；双击 = 跳到讲解；拖选文字时不触发 */
    tapGram(e){
      const el=e.target.closest('[data-g],[data-v]'); if(!el) return;
      const isV=el.dataset.v!=null, i=+(isV?el.dataset.v:el.dataset.g), key=(isV?'v':'g')+i, now=Date.now();
      clearTimeout(this.tapT);
      if(this.lastTap && this.lastTap.k===key && now-this.lastTap.t<450){
        this.lastTap=null; try{ getSelection().removeAllRanges(); }catch(_){}
        isV?this.jumpV(i):this.jump(i); return;
      }
      this.lastTap={k:key,t:now};
      this.tapT=setTimeout(()=>{
        this.lastTap=null;
        if(String(getSelection()||'').trim()) return;
        if(isV){ fillSearch(this.art.vocab[i][0]); return; }
        const c=el.cloneNode(true); c.querySelectorAll('rt').forEach(r=>r.remove());
        fillSearch(c.textContent.trim());
      },450);
    },
    smooth(){ return 'auto'; },  /* 跳转直接到位，不做滚动动画 */
    jump(i){
      const t=document.getElementById('g-'+i); if(!t) return;
      t.scrollIntoView({behavior:this.smooth(),block:'center'});
      this.flashG=null; this.$nextTick(()=>{ this.flashG=i; clearTimeout(this.ft); this.ft=setTimeout(()=>this.flashG=null,1800); });
    },
    jumpV(i){
      const t=document.getElementById('v-'+i); if(!t) return;
      t.scrollIntoView({behavior:this.smooth(),block:'center'});
      this.flashV=null; this.$nextTick(()=>{ this.flashV=i; clearTimeout(this.fv); this.fv=setTimeout(()=>this.flashV=null,1800); });
    },
    anaOf(ex){ return analyses[this.plain(ex)]; },
    toggleAna(ex){ const k=this.plain(ex); this.openAna[k]=!this.openAna[k]; },
    vMarked(i){ return this.art.paras.some(p=>p.jp.includes('{{'+i+':')); },
    toTextV(i){ this.flashText('.reader [data-v="'+i+'"]'); },
    toText(i){ this.flashText('.reader [data-g="'+i+'"]'); },
    flashText(sel){
      const el=document.querySelector(sel); if(!el) return;
      el.scrollIntoView({behavior:this.smooth(),block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'),1800);
    },
    charCount(a){ return a.paras.reduce((n,p)=>n+p.jp.replace(/\([ぁ-ゖー]+\)|\[\[|\]\]|\{\{\d+:|\}\}/g,'').length,0); },
    stars(n){ return ['入门','标准','偏难'][n-1]+' '+'★'.repeat(n)+'☆'.repeat(3-n); },
    go(r){
      const h = r==='home' ? '#/' : '#/'+r;
      if(location.hash!==h){ history.pushState(null,'',h); }
      const p=parse(); this.route=p.route; this.idx=p.idx; window.scrollTo(0,0);
    },
    say(t){
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95; u.pitch=1;
      const v=bestVoice(); if(v) u.voice=v;
      speechSynthesis.speak(u);
    }
  },
  mounted(){ window.addEventListener('popstate',()=>{ const p=parse(); this.route=p.route; this.idx=p.idx; }); }
}).component('word-search', WordSearch).component('ana-panel', AnaPanel).component('verb-page', VerbPage).mount('#app');
</script>
