const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ruby = s => s.replace(/([一-鿿々〆ヶ]+)\(([ぁ-ゖー]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
const parse = () => {
  const h = location.hash, m = h.match(/^#\/a\/(\d+)$/);
  if (m) return { route:'a', idx:+m[1] };
  return { route: ({'#/syn':'syn','#/art':'art','#/gram':'gram'})[h] || 'home', idx:0 };
};

/* ---------- 本地词典搜索 ---------- */
let DICT=null, dictP=null, wsN=0;
const bus = Vue.reactive({ text:'', n:0 });   /* 把文字填进当前页面的查词框 */
const fillSearch = t => { bus.text=t; bus.n++; };
const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
const hasKanji = s => /[一-鿿々]/.test(s);
function loadDict(){
  if(!dictP) dictP = fetch('dict.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ DICT = d.map(e=>({e, w:e[0], a:e[1], r:hira(e[2])})); })
    .catch(err=>{ dictP=null; throw err; });
  return dictP;
}
function searchDict(raw){
  const q=raw.trim().replace(/\s+/g,''); if(!q || !DICT) return [];
  const qn=hira(q), hits=[];
  for(const d of DICT){
    let t=-1;
    if(d.w===q||d.a===q||d.r===qn) t=0;
    else if(d.w.startsWith(q)||(d.a&&d.a.startsWith(q))||d.r.startsWith(qn)) t=1;
    else if(q.length>1 && hasKanji(q) && (d.w.includes(q)||d.a.includes(q))) t=2;
    if(t>=0) hits.push([t, d.e[5]?0:1, (d.a||d.w).length, d.e]);
  }
  hits.sort((x,y)=>x[0]-y[0]||x[1]-y[1]||x[2]-y[2]);
  return hits.slice(0,8).map(h=>h[3]);
}
const WordSearch = {
  template:`<div class="ws">
    <div class="ws-box">
      <input :id="uid" class="search ws-in" v-model="q" placeholder="Search 単語" autocomplete="off" lang="ja"
             @focus="open=true; load()" @input="open=true; load()" @keydown.esc="clear">
      <button v-if="q" class="ws-x" type="button" @click="clear" aria-label="清空">×</button>
    </div>
    <div class="ws-pop" v-if="open && q.trim()">
      <div v-if="state==='loading'" class="ws-msg">词典加载中…</div>
      <div v-else-if="state==='error'" class="ws-msg">词典没加载出来，请刷新页面再试。</div>
      <template v-else>
        <div class="ws-item" v-for="r in results" :key="r[0]+r[1]+r[2]">
          <div class="ws-h">
            <span class="ws-w">{{ head(r) }}</span><span class="ws-r">{{ r[2] }}</span>
            <span v-if="other(r)" class="ws-o">{{ other(r) }}</span>
            <span class="ws-tags"><span v-if="r[5]" class="ws-lv">{{ r[5] }}</span><span v-if="r[4]" class="pos">{{ r[4] }}</span></span>
          </div>
          <div v-if="r[6]" class="ws-zh">{{ r[6] }}</div>
          <div class="ws-m" :class="{en:r[6]}">{{ r[3] }}</div>
        </div>
        <div v-if="!results.length" class="ws-msg">本地词库没有收录「{{ q.trim() }}」。动词、形容词请输入原形，或者在线查：</div>
        <div class="ws-net">
          <span v-if="results.length">本地词典 · 在线查</span>
          <a v-for="l in links" :key="l[0]" :href="l[1]" target="_blank" rel="noopener">{{ l[0] }} ↗</a>
        </div>
      </template>
    </div>
  </div>`,
  data(){ return { q:'', open:false, state: DICT?'ready':'idle', uid:'ws-'+(++wsN), bus }; },
  computed:{
    results(){ return this.state==='ready' ? searchDict(this.q) : []; },
    links(){ const k=encodeURIComponent(this.q.trim().replace(/^〜/,''));
      return [['Weblio 日中','https://cjjc.weblio.jp/content/'+k],['Weblio 国語','https://www.weblio.jp/content/'+k],['Jisho','https://jisho.org/search/'+k]]; }
  },
  watch:{ 'bus.n'(){ this.q=bus.text; this.open=true; this.load(); } },
  methods:{
    load(){
      if(this.state==='ready') return;
      if(DICT){ this.state='ready'; return; }
      this.state='loading';
      loadDict().then(()=>{ this.state='ready'; }, ()=>{ this.state='error'; });
    },
    clear(){ this.q=''; const i=this.$el.querySelector('input'); i && i.focus(); },
    head(r){ return (!hasKanji(r[0]) && r[1] && hasKanji(r[1])) ? r[1] : r[0]; },
    other(r){ const h=this.head(r); return [r[0],r[1]].find(x=>x && x!==h && x!==r[2]) || ''; }
  },
  mounted(){ this.onDoc=e=>{ if(!this.$el.contains(e.target)) this.open=false; }; document.addEventListener('pointerdown',this.onDoc); },
  unmounted(){ document.removeEventListener('pointerdown',this.onDoc); }
};

/* 挑设备上最好的日语声音：自然音（Edge）> 增强/高级（Apple）> Google > 其他 */
let VOICE=null;
const bestVoice=()=>{
  if(VOICE) return VOICE;
  const vs=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>/^ja[-_]?/i.test(v.lang)):[];
  if(!vs.length) return null;
  const score=v=>{ const n=v.name;
    if(/Natural|Online/i.test(n)) return 100+(/Nanami/i.test(n)?5:0);
    if(/Premium|Enhanced|拡張|高品質/i.test(n)) return 80;
    if(/Google/i.test(n)) return 60;
    if(/O-?ren|Kyoko|Otoya|Hattori|Haruka|Ayumi|Nanami|Sayaka/i.test(n)) return 40;
    return v.localService?20:10; };
  VOICE=vs.sort((a,b)=>score(b)-score(a))[0]; return VOICE;
};
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.addEventListener?.('voiceschanged',()=>{ VOICE=null; }); }

Vue.createApp({
  data(){ const p=parse(); return { route:p.route, idx:p.idx, q:'', furi:true, showZh:false, hiGram:true, flashG:null, synonyms, synCats, synCat:'all', synPage:1, sel:{}, grammar, gramCats, gramTag:{n2:'N2',n3:'N3',talk:'口语'}, gramCat:'all', gramPage:1, gq:'', articles }; },
  computed:{
    art(){ return this.articles[this.idx]; },
    coveredGrammar(){ return new Set(this.articles.flatMap(a=>a.grammar.map(g=>g[0]))).size; },
    catCounts(){ const c={}; Object.keys(this.synCats).forEach(k=>{ const n=this.synonyms.filter(g=>g.c===k).length; if(n) c[k]=n; }); return c; },
    filteredSyn(){
      const q=this.q.trim(), cat=this.synCat;
      return this.synonyms.filter(g=>(cat==='all'||g.c===cat) && (!q || g.title.includes(q) || g.words.some(w=>w.k.includes(q)||w.r.includes(q)||w.zh.includes(q))));
    },
    synPages(){ return Math.max(1, Math.ceil(this.filteredSyn.length/10)); },
    pageList(){ const n=this.synPages, c=this.synPage; if(n<=7) return Array.from({length:n},(_,i)=>i+1);
      let a=Math.max(2,c-1), b=Math.min(n-1,c+1); if(c<=3){a=2;b=4;} if(c>=n-2){a=n-3;b=n-1;}
      const out=[1]; if(a>2) out.push(0); for(let i=a;i<=b;i++) out.push(i); if(b<n-1) out.push(0); out.push(n); return out; },
    gramCounts(){ const c={}; Object.keys(this.gramCats).forEach(k=>{ const n=this.grammar.filter(g=>g.c===k).length; if(n) c[k]=n; }); return c; },
    filteredGram(){ const q=this.gq.trim(), cat=this.gramCat;
      return this.grammar.filter(g=>(cat==='all'||g.c===cat) && (!q || this.plain(g.p).includes(q) || g.p.includes(q) || g.zh.includes(q) || g.note.includes(q))); },
    gramPages(){ return Math.max(1, Math.ceil(this.filteredGram.length/10)); },
    pagedGram(){ const p=Math.min(this.gramPage,this.gramPages); return this.filteredGram.slice((p-1)*10, p*10); },
    pagedSyn(){ const p=Math.min(this.synPage,this.synPages); return this.filteredSyn.slice((p-1)*10, p*10); }
  },
  watch:{ q(){ this.synPage=1; }, synCat(){ this.synPage=1; }, gq(){ this.gramPage=1; }, gramCat(){ this.gramPage=1; } },
  methods:{
    rb(s){ return ruby(esc(s)); },
    setPage(p){ if(!p||p<1||p>this.synPages) return; this.synPage=p; window.scrollTo({top:0,behavior:this.smooth()}); },
    setGPage(p){ if(!p||p<1||p>this.gramPages) return; this.gramPage=p; window.scrollTo({top:0,behavior:this.smooth()}); },
    selIdx(g){ return this.sel[g.title]||0; },
    cur(g){ return g.words[this.selIdx(g)]||g.words[0]; },
    pick(g,j){ this.sel[g.title]=j; const w=g.words[j]; this.say(w.r||w.k); },
    /* 朗读用假名读音：网站里居る・有る・御等写成汉字，直接交给语音引擎容易读错 */
    sayEx(ex){ this.say(ex.replace(/[一-鿿々〆ヶ]+\(([ぁ-ゖー]+)\)/g,'$1').replace(/\[\[|\]\]/g,'')); },
    plain(s){ return s.replace(/\([\u3041-\u3096ー]+\)|\[\[|\]\]/g,''); },
    /* base = 本段第一个语法的编号；不传则是例句（不可跳转） */
    render(s, base){
      const cls=this.hiGram?'gp':'gq'; let n=0;
      return esc(s).split(/\[\[|\]\]/).map((part,i)=>{
        if(!(i%2)) return ruby(part);
        const attr = base==null ? '' : ' data-g="'+(base+n++)+'"';
        return '<span class="'+cls+'"'+attr+'>'+ruby(part)+'</span>';
      }).join('');
    },
    gBase(pi){ return this.art.paras.slice(0,pi).reduce((n,p)=>n+(p.jp.match(/\[\[/g)||[]).length,0); },
    /* 单击 = 填入查词框（等 450ms 确认不是双击）；双击 = 跳到讲解；拖选文字时不触发 */
    tapGram(e){
      const el=e.target.closest('[data-g]'); if(!el) return;
      const i=+el.dataset.g, now=Date.now();
      clearTimeout(this.tapT);
      if(this.lastTap && this.lastTap.i===i && now-this.lastTap.t<450){
        this.lastTap=null; try{ getSelection().removeAllRanges(); }catch(_){}
        this.jump(i); return;
      }
      this.lastTap={i,t:now};
      this.tapT=setTimeout(()=>{
        this.lastTap=null;
        if(String(getSelection()||'').trim()) return;
        const c=el.cloneNode(true); c.querySelectorAll('rt').forEach(r=>r.remove());
        fillSearch(c.textContent.trim());
      },450);
    },
    smooth(){ return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'; },
    jump(i){
      const t=document.getElementById('g-'+i); if(!t) return;
      t.scrollIntoView({behavior:this.smooth(),block:'center'});
      this.flashG=null; this.$nextTick(()=>{ this.flashG=i; clearTimeout(this.ft); this.ft=setTimeout(()=>this.flashG=null,1800); });
    },
    toText(i){
      const el=document.querySelector('.reader [data-g="'+i+'"]'); if(!el) return;
      el.scrollIntoView({behavior:this.smooth(),block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'),1800);
    },
    charCount(a){ return a.paras.reduce((n,p)=>n+p.jp.replace(/\([ぁ-ゖー]+\)|\[\[|\]\]/g,'').length,0); },
    stars(n){ return ['入门','标准','偏难'][n-1]+' '+'★'.repeat(n)+'☆'.repeat(3-n); },
    go(r){
      const h = r==='home' ? '#/' : '#/'+r;
      if(location.hash!==h){ history.pushState(null,'',h); }
      const p=parse(); this.route=p.route; this.idx=p.idx; window.scrollTo(0,0);
    },
    say(t){
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.95; u.pitch=1;
      const v=bestVoice(); if(v) u.voice=v;
      speechSynthesis.speak(u);
    }
  },
  mounted(){ window.addEventListener('popstate',()=>{ const p=parse(); this.route=p.route; this.idx=p.idx; }); }
}).component('word-search', WordSearch).mount('#app');
</script>
