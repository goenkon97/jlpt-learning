<style>
/* Layout: same as IELTS site — 720px centered column, name left / search right, tile grid, sticky sub-page header */
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;
  --blue:#8a6414;            /* bronze accent (named --blue as in IELTS site) */
  --chip:#f4ecd9;--greige:#ece6dc;--pager-t:#6b4a0e;
  --gold:#f0cf8a;--tab:#1d1d1f;
  --t1:#f4ecd9;--t2:#ece6dc;--t3:#f6e4d0;
  --cp-bg:#f3dcc3;--cp-t:#8f3f0f;   /* copper: key grammar in articles */
  --px:20px;
  --font:-apple-system,"SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:#2c2c2e;
  --blue:#e8c27a;--chip:#2e2616;--greige:#2a2622;--pager-t:#d9c28f;--tab:#3a3a3c;
  --t1:#2e2616;--t2:#2a2622;--t3:#33241a;--cp-bg:#3a2414;--cp-t:#f0b98a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:#2c2c2e;
  --blue:#e8c27a;--chip:#2e2616;--greige:#2a2622;--pager-t:#d9c28f;--tab:#3a3a3c;
  --t1:#2e2616;--t2:#2a2622;--t3:#33241a;--cp-bg:#3a2414;--cp-t:#f0b98a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(var(--px),env(safe-area-inset-left,0px));padding-right:max(var(--px),env(safe-area-inset-right,0px));padding-block:28px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- home header ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.hero .name{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
.hero h1{font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0;font-weight:700;text-wrap:balance}
.hero .goal{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:linear-gradient(#34343a,#0e0e10);color:var(--gold);letter-spacing:.02em}
.search{width:180px;max-width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;font-size:14px;font-family:inherit}
@media (pointer:coarse){.search,input{font-size:16px}}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:0;border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.tile.wide{grid-column:1/-1}
.tile h2{font-size:22px;margin:0;letter-spacing:-.01em}
.tile .jp{font-size:12.5px;color:var(--blue);font-weight:600}
.tile .desc{font-size:13px;color:var(--sub);margin:0}
.peek{display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.peek .chip{white-space:nowrap;flex:none}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--blue)}
.count{margin-top:auto;padding-top:10px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
@media (max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.search{width:100%}}

/* ---------- sub pages ---------- */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-bottom:6px}
.back{border:0;background:none;color:var(--blue);font-size:17px;padding:0;margin-bottom:6px}
.sticky h1{font-size:26px;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.card{position:relative;background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;overflow:hidden}
.num{position:absolute;top:0;left:0;background:var(--tab);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:0 0 10px 0;font-variant-numeric:tabular-nums}
.card h3{font-size:17px;margin:6px 0 10px}
.words{display:flex;flex-direction:column;gap:10px}
.w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.w .k{font-size:17px;font-weight:600;cursor:pointer;border:0;background:none;padding:0}
.w .k:hover{color:var(--blue)}
.w .r{font-size:13px;color:var(--sub)}
.pos{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--t2);color:var(--sub)}
.w .zh{font-size:15px;color:var(--sub);flex-basis:100%}
.ex{margin-top:14px;padding:12px 14px;background:var(--t1);border-radius:12px;font-size:15px}
.ex .jp2{line-height:2.1}
.ex .t{color:var(--sub);font-size:13px;margin-top:4px}

/* ---------- article list ---------- */
.alist{display:block;width:100%;border:0;text-align:left;cursor:pointer;transition:transform .15s ease}
.alist:hover{transform:translateY(-2px)}
.alist h3{font-size:19px;margin:8px 0 4px}
.alist .sum{font-size:14px;color:var(--sub);margin:0 0 12px}
.alist .stat{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.alist .stat span{background:var(--greige);color:var(--pager-t);border-radius:999px;padding:2px 9px;font-weight:600}
.plan{font-size:12px;color:var(--sub);text-align:center;margin-top:18px}

/* ---------- article reader ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:0;font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--greige);color:var(--pager-t)}
.tog.on{background:linear-gradient(#34343a,#0e0e10);color:var(--gold)}
.reader p.jp{font-size:18px;line-height:2.2;margin:0;letter-spacing:.02em}
.reader .para + .para{margin-top:22px}
.reader .zh{font-size:15px;color:var(--sub);margin:8px 0 0;line-height:1.6;padding-left:12px;border-left:2px solid var(--line)}

.vb-cmp span{font-size:16px;line-height:2.1}
.vb-cmp small{font-size:12.5px;color:var(--sub)}
.vb-drink{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.vb-drink div{display:flex;align-items:center;gap:8px;font-size:16px;line-height:2.1;border-bottom:1px dashed var(--line)}
.vb-drink small{font-size:13px;color:var(--sub);margin-left:auto}
@media (max-width:520px){.vb-two,.vb-cmp,.vb-drink{grid-template-columns:1fr}}
/* 查变形 */
.vb-in{width:100%;margin-bottom:10px}
.vb-cands,.vb-quick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.vb-cands small{font-size:11.5px;font-weight:500;opacity:.8}
.vb-vh{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vb-vw{font-size:26px;font-weight:700;line-height:2}
.vb-vz{font-size:15px;color:var(--sub);flex-basis:100%}
.vb-tbl{margin-top:12px}
.vb-th{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.04em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.vb-tr{display:grid;grid-template-columns:96px minmax(0,1fr) 24px minmax(0,1fr);align-items:center;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.vb-tn{font-size:12.5px;color:var(--sub);line-height:1.9}
.vb-tv{font-size:17px;font-weight:600;line-height:2.1}
.vb-tz{font-size:13.5px;color:var(--sub)}
@media (max-width:520px){.vb-tr{grid-template-columns:78px minmax(0,1fr) 24px}.vb-tz{grid-column:2/-1;margin-top:-6px;padding-bottom:4px}}
</style>
</head>
<body>
<div id="app" class="wrap">

  <!-- ===== HOME ===== -->
  <template v-if="route==='home'">
    <div class="hero">
      <div>
        <div class="name">Goen Kon <span class="namev">（Vue 3）</span></div>
        <h1>Japanese Learning</h1>
        <div class="goal">目标 <span class="badge">JLPT N2</span></div>
      </div>
      <word-search></word-search>
    </div>

    <div class="grid">
      <button class="tile" @click="go('syn')">
        <h2>同义词</h2>
        <span class="jp">類義語</span>
        <p class="desc">意思相近的词放在一起，分清细微差别和用法。</p>
        <div class="peek"><span class="chip" v-for="g in synonyms.slice(0,3)" :key="g.title">{{ g.words[0].k }}</span></div>
        <span class="count">{{ synonyms.length }} 组 · 6 个分类</span>
      </button>
      <button class="tile" @click="go('art')">
        <h2>文章</h2>
        <span class="jp">読解</span>
        <p class="desc">N2 读解文章，汉字上方注假名，读着读着把语法和词汇连起来。</p>
        <div class="peek"><span class="chip" v-for="a in articles.slice(0,4)" :key="a.title">{{ a.short }}</span></div>
        <span class="count">{{ articles.length }} 篇 · 覆盖 N2 语法 {{ coveredGrammar }} 条</span>
      </button>
      <button class="tile" @click="go('gram')">
        <h2>语法<span class="h1sub">（N2 ＋ N3 ＋ 口语）</span></h2>
        <span class="jp">文法</span>
        <p class="desc">N2、N3 重点文型加生活口语：接续、意思、两个例句，附注意点。</p>
        <div class="peek"><span class="chip" v-for="(n,c) in gramCounts" :key="c">{{ gramCats[c] }}</span></div>
        <span class="count">{{ grammar.length }} 条 · N2 {{ gramCounts.n2 }} · N3 {{ gramCounts.n3 }} · 口语 {{ gramCounts.talk }}</span>
      </button>
      <button class="tile" @click="go('verb')">
        <h2>动词变形</h2>
        <span class="jp">動詞の活用</span>
        <p class="desc">一类、二类、三类动词怎么变：て形、ない形、可能、被动、使役……图解加例句，还能查任意动词。</p>
        <div class="peek"><span class="chip">三类怎么分</span><span class="chip">て形音便</span><span class="chip">被动 · 使役</span><span class="chip">查变形</span></div>
        <span class="count">15 种变形 · 一类 / 二类 / 三类</span>
      </button>
    </div>
    <p class="credit">词典数据：JMdict（EDRDG）· CC BY-SA 4.0</p>
  </template>

  <!-- ===== SYNONYMS ===== -->
  <template v-else-if="route==='syn'">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('home')">‹ 返回</button><word-search></word-search></div>
      <h1>同义词 · 類義語</h1>
      <input id="q2" class="search" style="width:100%" v-model="q" placeholder="筛选同义词（单词 / 读音 / 中文）">
      <div class="seg" role="tablist">
        <button role="tab" :aria-selected="synCat==='all'" :class="{on:synCat==='all'}" @click="synCat='all'">全部<span class="n">{{ synonyms.length }}</span></button>
        <button role="tab" v-for="(n,c) in catCounts" :key="c" :aria-selected="synCat===c" :class="{on:synCat===c}" @click="synCat=c">{{ synCats[c] }}<span class="n">{{ n }}</span></button>
      </div>
      <div class="pagerow">
        <span class="meta">{{ filteredSyn.length }} 组 · 点击单词切换例句</span>
      <div class="pager" v-if="synPages>1">
        <button class="pg arrow" :disabled="synPage===1" @click="setPage(synPage-1)" aria-label="上一页">‹</button>
        <label class="pick"><span>{{ synPage }} / {{ synPages }}</span><span class="caret">▾</span>
          <select :value="synPage" @change="setPage(+$event.target.value)" aria-label="选择页码"><option v-for="p in synPages" :key="p" :value="p">第 {{ p }} 页 · {{ (p-1)*10+1 }}–{{ Math.min(p*10, filteredSyn.length) }}</option></select></label>
        <button class="pg arrow" :disabled="synPage===synPages" @click="setPage(synPage+1)" aria-label="下一页">›</button>
      </div>
      </div>
    </div>
    <div class="card" v-for="(g,i) in pagedSyn" :key="g.title">
      <span class="num">{{ (synPage-1)*10+i+1 }}</span>
      <h3>{{ g.title }}</h3>
      <div class="words">
        <button class="wrow" v-for="(w,j) in g.words" :key="w.k" :class="{on:selIdx(g)===j}" @click="pick(g,j)">
          <span class="w"><span class="k">{{ w.k }}</span><span class="r">{{ w.r }}</span><span class="pos">{{ w.pos }}</span></span>
          <span class="wz">{{ w.zh }}</span>
        </button>
      </div>
      <div class="ex">
        <div class="exh"><span class="exl">例句 · {{ cur(g).k }}</span><button class="play" @click="sayEx(cur(g).ex)" aria-label="朗读例句">▶</button></div>
        <div class="jp2" v-html="render(cur(g).ex)"></div><div class="t">{{ cur(g).exZh }}</div>
        <ana-panel :ex="cur(g).ex" :key="cur(g).ex"></ana-panel>
      </div>
    </div>
    <p class="plan" v-if="!filteredSyn.length">没有找到相关的同义词。</p>
    <div class="pagerow bottom" v-if="synPages>1"><div class="pager" v-if="synPages>1">
        <button class="pg arrow" :disabled="synPage===1" @click="setPage(synPage-1)" aria-label="上一页">‹</button>
        <label class="pick"><span>{{ synPage }} / {{ synPages }}</span><span class="caret">▾</span>
          <select :value="synPage" @change="setPage(+$event.target.value)" aria-label="选择页码"><option v-for="p in synPages" :key="p" :value="p">第 {{ p }} 页 · {{ (p-1)*10+1 }}–{{ Math.min(p*10, filteredSyn.length) }}</option></select></label>
        <button class="pg arrow" :disabled="synPage===synPages" @click="setPage(synPage+1)" aria-label="下一页">›</button>
      </div></div>
  </template>

  <!-- ===== ARTICLE LIST ===== -->
  <template v-else-if="route==='art'">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('home')">‹ 返回</button><word-search></word-search></div>
      <h1>文章 · 読解</h1>
      <div class="meta">{{ articles.length }} 篇 · 已覆盖 {{ coveredGrammar }} 条 N2 语法</div>
    </div>
    <button class="card alist" v-for="(a,i) in articles" :key="a.title" @click="go('a/'+i)">
      <span class="num">{{ i+1 }}</span>
      <h3 v-html="rb(a.title)"></h3>
      <p class="sum">{{ a.sum }}</p>
      <div class="stat">
        <span>{{ stars(a.lv) }}</span>
        <span>约 {{ charCount(a) }} 字</span>
        <span>语法 {{ a.grammar.length }} 条</span>
        <span>词汇 {{ a.vocab.length }} 个</span>
      </div>
    </button>
    <p class="plan">从易到难排列：入门 → 标准 → 偏难。每条 N2 语法至少在两篇文章里出现。</p>
  </template>

  <!-- ===== ARTICLE READER ===== -->
  <template v-else-if="route==='a' && art">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('art')">‹ 返回</button><word-search></word-search></div>
      <h1 v-html="rb(art.title)"></h1>
      <div class="tools">
        <button class="tog" :class="{on:furi}" @click="furi=!furi">假名</button>
        <button class="tog" :class="{on:showZh}" @click="showZh=!showZh">中文翻译</button>
        <button class="tog" :class="{on:hiGram}" @click="hiGram=!hiGram">标出语法</button>
        <button class="tog" :class="{on:hiVoc}" @click="hiVoc=!hiVoc">标出词汇</button>
      </div>
      <div class="meta">单击语法 / 词汇：填入查词框 · 双击：跳到下方讲解</div>
    </div>

    <div class="card reader" :class="{nofuri:!furi}" @click="tapGram">
      <div class="para" v-for="(p,i) in art.paras" :key="i">
        <p class="jp" v-html="render(p.jp, gBase(i))"></p>
        <p class="zh" v-if="showZh">{{ p.zh }}</p>
      </div>
    </div>

    <div class="card" :class="{nofuri:!furi}">
      <p class="sec">本文 N2 语法 · {{ art.grammar.length }}</p>
      <div class="gitem" v-for="(g,i) in art.grammar" :key="g[0]" :id="'g-'+i" :class="{flash:flashG===i}">
        <div class="ghead">
          <span class="gnum">{{ i+1 }}</span>
          <span class="gpat" v-html="rb(g[0])"></span>
          <button class="play lt" @click="sayEx(g[0].replace(/〜/g,''))" aria-label="朗读语法">▶</button>
          <span class="gm">{{ g[1] }}</span>
          <button class="gback" @click="toText(i)">回到原文 ↑</button>
        </div>
        <ul class="gex">
          <li v-for="k in [2,4]" :key="k" class="exrow"><div><div class="jp" v-html="render(g[k])"></div><div class="z">{{ g[k+1] }}</div>
          <ana-panel :ex="g[k]" :key="g[k]"></ana-panel>
          </div><button class="play" @click="sayEx(g[k])" aria-label="朗读例句">▶</button></li>
        </ul>
      </div>
    </div>

    <div class="card" :class="{nofuri:!furi}">
      <p class="sec">重点词汇 · {{ art.vocab.length }}</p>
      <div class="gitem vitem" v-for="(v,i) in art.vocab" :key="v[0]" :id="'v-'+i" :class="{flash:flashV===i}">
        <div class="ghead">
          <span class="gnum">{{ i+1 }}</span>
          <b class="vk">{{ v[0] }}</b>
          <button class="play lt" @click="say(v[1])" aria-label="朗读单词">▶</button>
          <span class="vr">{{ v[1] }}</span>
          <span class="gm">{{ v[2] }}</span>
          <button class="gback" v-if="vMarked(i)" @click="toTextV(i)">回到原文 ↑</button>
        </div>
        <ul class="gex" v-if="v[3]"><li class="exrow"><div><div class="jp" v-html="render(v[3],null,'v')"></div><div class="z">{{ v[4] }}</div>
          <ana-panel :ex="v[3]" :key="v[3]"></ana-panel>
          </div><button class="play" @click="sayEx(v[3])" aria-label="朗读例句">▶</button></li></ul>
      </div>
    </div>

    <div class="next">
      <button :disabled="idx===0" @click="go('a/'+(idx-1))">‹ 上一篇</button>
      <button :disabled="idx===articles.length-1" @click="go('a/'+(idx+1))">下一篇 ›</button>
    </div>
  </template>

  <!-- ===== GRAMMAR ===== -->
  <template v-else-if="route==='gram'">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('home')">‹ 返回</button><word-search></word-search></div>
      <h1>语法 · 文法<span class="h1sub">（N2 ＋ N3 ＋ 口语）</span></h1>
      <input class="search" style="width:100%" v-model="gq" placeholder="筛选语法（文型 / 中文意思）">
      <div class="seg" role="tablist">
        <button role="tab" :aria-selected="gramCat==='all'" :class="{on:gramCat==='all'}" @click="gramCat='all'">全部<span class="n">{{ grammar.length }}</span></button>
        <button role="tab" v-for="(n,c) in gramCounts" :key="c" :aria-selected="gramCat===c" :class="{on:gramCat===c}" @click="gramCat=c">{{ gramCats[c] }}<span class="n">{{ n }}</span></button>
      </div>
      <div class="pagerow">
        <span class="meta">{{ filteredGram.length }} 条 · ▶ 朗读例句</span>
      <div class="pager" v-if="gramPages>1">
        <button class="pg arrow" :disabled="gramPage===1" @click="setGPage(gramPage-1)" aria-label="上一页">‹</button>
        <label class="pick"><span>{{ gramPage }} / {{ gramPages }}</span><span class="caret">▾</span>
          <select :value="gramPage" @change="setGPage(+$event.target.value)" aria-label="选择页码"><option v-for="p in gramPages" :key="p" :value="p">第 {{ p }} 页 · {{ (p-1)*10+1 }}–{{ Math.min(p*10, filteredGram.length) }}</option></select></label>
        <button class="pg arrow" :disabled="gramPage===gramPages" @click="setGPage(gramPage+1)" aria-label="下一页">›</button>
      </div>
      </div>
    </div>
    <div class="card gcard" v-for="(g,i) in pagedGram" :key="g.p">
      <span class="num">{{ (gramPage-1)*10+i+1 }}</span>
      <div class="gh"><h3 v-html="rb(g.p)"></h3><span class="glv" :class="g.c">{{ gramTag[g.c] }}</span></div>
      <div class="gzh">{{ g.zh }}</div>
      <div class="grow"><span class="pos">接续</span><span class="gtx" v-html="rb(g.conn)"></span></div>
      <div class="grow" v-if="g.note"><span class="pos">注意</span><span class="gtx" v-html="rb(g.note)"></span></div>
      <div class="ex">
        <div class="gxr" v-for="(e,k) in g.ex" :key="k">
          <div class="gexb"><div class="jp2" v-html="render(e[0])"></div><div class="t">{{ e[1] }}</div></div>
          <button class="play" @click="sayEx(e[0])" aria-label="朗读例句">▶</button>
        </div>
      </div>
      <div class="garts" v-if="g.arts && g.arts.length"><span>文章中出现</span><button v-for="n in g.arts" :key="n" @click="go('a/'+(n-1))">{{ n }}. {{ articles[n-1].short }}</button></div>
    </div>
    <p class="plan" v-if="!filteredGram.length">没有找到相关的语法。</p>
    <div class="pagerow bottom" v-if="gramPages>1"><div class="pager" v-if="gramPages>1">
        <button class="pg arrow" :disabled="gramPage===1" @click="setGPage(gramPage-1)" aria-label="上一页">‹</button>
        <label class="pick"><span>{{ gramPage }} / {{ gramPages }}</span><span class="caret">▾</span>
          <select :value="gramPage" @change="setGPage(+$event.target.value)" aria-label="选择页码"><option v-for="p in gramPages" :key="p" :value="p">第 {{ p }} 页 · {{ (p-1)*10+1 }}–{{ Math.min(p*10, filteredGram.length) }}</option></select></label>
        <button class="pg arrow" :disabled="gramPage===gramPages" @click="setGPage(gramPage+1)" aria-label="下一页">›</button>
      </div></div>
  </template>

  <!-- ===== VERB ===== -->
  <template v-else-if="route==='verb'">
    <verb-page @home="go('home')"></verb-page>
  </template>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script>
/* 文章写法：漢字(かな) → 注音；[[ ]] → 本文的 N2 语法 */
const articles = [{"title":"一人(ひとり)暮(ぐ)らしを始(はじ)めて分(わ)かった事(こと)","short":"一人暮らし","lv":1,"sum":"离开老家独自生活一年，从倒垃圾到记账，写下这一年学到的事。","paras":[{"jp":"去年(きょねん)の春(はる)、私(わたし)は大学(だいがく)入学(にゅうがく)[[を切(き)っ掛(か)けに]]、{{0:実家(じっか)}}を出(で)て一人(ひとり)暮(ぐ)らしを始(はじ)めた。両親(りょうしん)は心配(しんぱい)して居(い)た[[物(もの)の]]、最後(さいご)には「自分(じぶん)で決(き)めた事(こと)なら」と{{1:賛成(さんせい)}}して呉(く)れた。","zh":"去年春天，我以上大学为契机，离开老家开始一个人生活。父母虽然很担心，但最后还是说\"既然是你自己决定的事\"，同意了。"},{"jp":"実際(じっさい)に生活(せいかつ)して見(み)ると、予想(よそう)して居(い)た[[以上(いじょう)に]]大変(たいへん)だった。料理(りょうり)や洗濯(せんたく)[[は勿論(もちろん)]]、塵(ごみ)の出(だ)し方(かた)[[一(ひと)つにしても]]、地域(ちいき)の{{3:規則(きそく)}}[[に従(したが)って]]細(こま)かく{{2:分別(ぶんべつ)}}せ[[ざるを得(え)ない]]。","zh":"实际生活起来，比预想的还要辛苦。做饭、洗衣服自不必说，就连扔垃圾这一件事，也不得不按照地区的规定仔细分类。"},{"jp":"特(とく)に困(こま)ったのは御(お)金(かね)の管理(かんり)だ。初(はじ)めの頃(ころ)は、欲(ほ)しい物(もの)を見付(みつ)ける[[度(たび)に]]買(か)って仕舞(しま)い、{{4:貯金(ちょきん)}}は減(へ)る[[一方(いっぽう)だった]]。月末(げつまつ)に成(な)ると財布(さいふ)が空(から)っぽで、カップ麺(めん)で{{5:我慢(がまん)}}する日(ひ)が続(つづ)いた。","zh":"最让我头疼的是管钱。刚开始的时候，每次看到想要的东西就忍不住买下来，存款一个劲地减少。一到月底钱包就空了，接连好几天只能靠泡面凑合。"},{"jp":"そこで{{6:家計簿(かけいぼ)}}を付(つ)け始(はじ)めた。付(つ)け[[て初(はじ)めて]]、自分(じぶん)が如何(いか)に{{7:無駄(むだ)遣(づか)い}}をして居(い)たかが分(わ)かった。コンビニで{{8:何気(なにげ)なく}}買(か)う飲(の)み物(もの)も、毎日(まいにち)[[と成(な)ると]]一(いっ)箇(か)月(げつ)で数千円(すうせんえん)に成(な)るのだ。","zh":"于是我开始记账。记了之后才第一次知道自己浪费了多少钱。在便利店随手买的饮料，如果每天都买，一个月就是好几千日元。"},{"jp":"一人(ひとり)暮(ぐ)らしは楽(たの)しい事(こと)[[許(ばか)りではない]]。風邪(かぜ)を引(ひ)いて{{9:寝込(ねこ)}}んだ時(とき)は、{{10:看病(かんびょう)}}して呉(く)れる人(ひと)が居(い)ない寂(さび)しさを{{11:痛感(つうかん)}}した。[[とは言(い)え]]、自分(じぶん)の生活(せいかつ)に責任(せきにん)を持(も)つ[[事(こと)に依(よ)って]]、以前(いぜん)より自信(じしん)が付(つ)いたのも確(たし)かだ。","zh":"一个人生活并不全是开心的事。感冒卧床的时候，我深深体会到没有人照顾的孤单。尽管如此，通过对自己的生活负责，我确实比以前更有自信了。"},{"jp":"親(おや)の{{12:有難(ありがた)さ}}は、実際(じっさい)に離(はな)れて暮(く)らして見(み)[[ない事(こと)には]]分(わ)からない[[物(もの)だ]]。今度(こんど)の休(やす)みには、感謝(かんしゃ)の気持(きも)ちを{{13:込(こ)め}}て、実家(じっか)に御(お)土産(みやげ)を持(も)って帰(かえ)る積(つ)もりだ。","zh":"父母的可贵，不真正离开他们生活是体会不到的。下次放假，我打算怀着感激的心情，带些礼物回老家。"}],"grammar":[["〜を切(き)っ掛(か)けに","以……为契机","友達(ともだち)に誘(さそ)われた事(こと)[[を切(き)っ掛(か)けに]]、ジョギングを始(はじ)めた。","以被朋友邀请为契机，我开始了慢跑。","引(ひ)っ越(こ)し[[を切(き)っ掛(か)けに]]、要(い)らない物(もの)を全部(ぜんぶ)捨(す)てた。","趁着搬家，把不要的东西全扔了。"],["〜物(もの)の","虽然……但是……（书面）","免許(めんきょ)は取(と)った[[物(もの {"title":"市立図書館(しりつとしょかん)の利用案内(りようあんない)","paras":[{"jp":"当館(とうかん)は、市民(しみん)[[を始(はじ)め]]、市内(しない)に{{1:通勤(つうきん)}}・通学(つうがく)して居(い)る方(かた)であれば、年齢(ねんれい)[[を問(と)わず]]、どなたでも御(ご)利用(りよう)頂(いただ)けます。","zh":"本馆面向本市市民，以及在市内上班、上学的人，不论年龄，任何人都可以使用。"},{"jp":"図書(としょ)の{{2:貸(か)し出(だ)し}}には利用者(りようしゃ)カードが必要(ひつよう)です。カードを作成(さくせい)する[[に当(あ)たって]]は、住所(じゅうしょ)を確認(かくにん)出来(でき)る書類(しょるい)を御(ご){{3:持参(じさん)}}下(くだ)さい。","zh":"借书需要借书卡。办理借书卡时，请携带能确认住址的证件。"},{"jp":"開館(かいかん)時間(じかん)は午前(ごぜん)九時(くじ)から午後(ごご)八時(はちじ)迄(まで)です。月曜日(げつようび)[[を除(のぞ)いて]]毎日(まいにち)開館(かいかん)して居(お)りますが、月曜日(げつようび)が{{4:祝日(しゅくじつ)}}の場合(ばあい)は開館(かいかん)し、{{5:翌日(よくじつ)}}を休館日(きゅうかんび)と致(いた)します。","zh":"开馆时间为上午9点到晚上8点。除周一外每天开馆；周一若是节假日则照常开馆，改为次日闭馆。"},{"jp":"一度(いちど)に借(か)りられるのは一人(ひとり)[[に付(つ)き]]十冊(じゅっさつ)迄(まで)、期間(きかん)は二週間(にしゅうかん)です。{{6:返却(へんきゃく)}}{{7:期限(きげん)}}を過(す)ぎた場合(ばあい)、本(ほん)が返(かえ)され[[ない限(かぎ)り]]、新(あら)たに借(か)りる事(こと)は出来(でき)ません。","zh":"每人每次最多借10本，借期两周。超过归还期限时，只要书没有还回来，就不能再借新书。"},{"jp":"予約(よやく)した本(ほん)が届(とど)き[[次第(しだい)]]、メールで御(ご)連絡(れんらく)致(いた)します。連絡(れんらく)を受(う)けてから一週間(いっしゅうかん)以内(いない)に御(お)受(う)け取(と)り下(くだ)さい。","zh":"预约的书一到，我们会马上发邮件通知您。请在收到通知后一周内来取。"},{"jp":"館内(かんない)での飲食(いんしょく)は禁止(きんし)されて居(い)ますが、{{9:蓋(ふた)}}の付(つ)いた飲(の)み物(もの)であれば、休憩室(きゅうけいしつ)で飲(の)んで[[も差(さ)し支(つか)えありません]]。携帯電話(けいたいでんわ)は、マナーモードに設定(せってい)した[[上(うえ)で]]御(ご)使用(しよう)下(くだ)さい。","zh":"馆内禁止饮食，但带盖的饮料可以在休息室饮用。手机请调成静音模式后再使用。"},{"jp":"尚(なお)、{{10:蔵書(ぞうしょ)}}{{11:点検(てんけん)}}[[に先立(さきだ)って]]、年末(ねんまつ)は一週間(いっしゅうかん)程(ほど)休館(きゅうかん)致(いた)します。又(また)、今月(こんげつ)[[に限(かぎ)り]]、新(あら)たにカードを作(つく)った方(かた)には、記念(きねん)の栞(しおり)を差(さ)し上(あ)げて居(お)ります。","zh":"另外，在藏书清点之前，年底将闭馆一周左右。此外，仅限本月，新办卡的读者可获赠纪念书签。"},{"jp":"当館(とうかん)は、市(し)の{{12:方針(ほうしん)}}[[に沿(そ)って]]、来年度(らいねんど)から電子書籍(でんししょせき)の貸(か)し出(だ)しも始(はじ)める予定(よてい)です。皆様(みなさま)の御(ご)意見(いけん)[[に基(もと)づいて]]、サービスを更(さら)に{{13:充実(じゅうじつ)}}させて行(い)きたいと考(かんが)えて居(お)ります。","zh":"本馆将按照市里的方针，从下一年度开始提供电子书借阅。我们希望根据大家的意见，进一步充实各项服务。"}],"grammar":[["〜を始(はじ)め","以……为首，……以及","東京(とうきょう)[[を始(はじ)め]]、大阪(おおさか)や名古屋(なごや)等(など)の大都市(だいとし)でも家賃(やちん)が上(あ)がって居(い)る。","以东京为首，大阪、名古屋等大城市的房租也在上涨。","社長(しゃちょう)[[を始(はじ)め]]、社員(しゃいん)全員(ぜんいん)が式(しき)に出席(しゅっせき)した。","以社长为首，全体员工都出席了仪式。"],["〜を問(と) {"title":"アルバイト先(さき)で学(まな)んだ敬語(けいご)","paras":[{"jp":"日本(にほん)に来(き)て半年(はんとし)程(ほど)経(た)った頃(ころ)、私(わたし)は駅前(えきまえ)のカフェでアルバイトを始(はじ)めた。日本語学校(にほんごがっこう)で敬語(けいご)を習(なら)って居(い)たので、少(すこ)しは自信(じしん)が有(あ)った。然(しか)し、教科書(きょうかしょ)で覚(おぼ)えた[[からと言(い)って]]、実際(じっさい)に{{0:使(つか)い熟(こな)}}せる[[訳(わけ)ではない]]。","zh":"来日本大约半年时，我开始在车站前的咖啡店打工。在日语学校学过敬语，所以多少有点自信。但是，课本上背过，并不代表实际中就能运用自如。"},{"jp":"初日(しょにち)は緊張(きんちょう)の余(あま)り、「いらっしゃいませ」[[さえ]]上手(うま)く言(い)えなかった。御(お)客様(きゃくさま)に「こちらで{{1:召(め)し上(あ)が}}りますか」と聞(き)く積(つ)もりが、「こちらで頂(いただ)きますか」と言(い)って仕舞(しま)い、店長(てんちょう)に注意(ちゅうい)された。{{2:尊敬語(そんけいご)}}と{{3:謙譲語(けんじょうご)}}を間違(まちが)えたのだ。恥(は)ずかしくて[[堪(たま)らなかった]]。","zh":"第一天太紧张，连\"欢迎光临\"都说不好。我本想问客人\"您在这里用餐吗\"，结果却说成了\"我在这里吃吗\"，被店长提醒了。我把尊敬语和自谦语弄混了。真是羞得不行。"},{"jp":"店長(てんちょう)は厳(きび)しい[[反面(はんめん)]]、{{4:面倒見(めんどうみ)}}の良(よ)い人(ひと)で、仕事(しごと)が終(お)わった後(あと)、毎日(まいにち)の様(よう)に敬語(けいご)の練習(れんしゅう)に{{5:付(つ)き合(あ)}}って呉(く)れた。「実際(じっさい)に口(くち)に出(だ)して練習(れんしゅう)して[[からでないと]]、{{6:身(み)に付(つ)}}かないよ」と店長(てんちょう)は言(い)った。","zh":"店长很严格，但另一方面又很会照顾人，下班后几乎每天都陪我练习敬语。\"不实际说出口练习，是学不会的哦。\"店长这样说。"},{"jp":"練習(れんしゅう)を続(つづ)けて居(い)る[[うちに]]、少(すこ)し宛(ずつ)自然(しぜん)な敬語(けいご)が口(くち)から出(で)る様(よう)に成(な)った。三(さん)箇(か)月(げつ)後(ご)には、{{7:常連(じょうれん)}}の御(お)客様(きゃくさま)から「日本語(にほんご)、上手(じょうず)に成(な)ったね」と{{8:褒(ほ)め}}られ、思(おも)わず笑顔(えがお)に成(な)ら[[ずにはいられなかった]]。","zh":"坚持练习的过程中，自然的敬语渐渐能脱口而出了。三个月后，常来的客人夸我\"日语变好了呢\"，我忍不住露出了笑容。"},{"jp":"或(あ)る日(ひ)、{{9:年配(ねんぱい)}}の女性(じょせい)が道(みち)に迷(まよ)って店(みせ)に入(はい)って来(き)た。私(わたし)が{{10:丁寧(ていねい)}}に道(みち)を説明(せつめい)した[[許(ばか)りか]]、地図(ちず)迄(まで)書(か)いて渡(わた)すと、その方(かた)は「外国(がいこく)の方(かた)[[にしては]]、本当(ほんとう)に綺麗(きれい)な日本語(にほんご)ね」と言(い)って下(くだ)さった。","zh":"有一天，一位年长的女士迷了路走进店里。我不仅仔细地给她指了路，还画了地图交给她，她说：\"作为外国人，你的日语说得真漂亮啊。\""},{"jp":"嬉(うれ)しい[[事(こと)に]]、その方(かた)はその後(ご)も時々(ときどき)店(みせ)に来(き)て下(くだ)さる様(よう)に成(な)った。敬語(けいご)が{{11:苦手(にがて)}}だった私(わたし)だが、今(いま)では苦手(にがて)[[どころか]]、敬語(けいご)を使(つか)うのが楽(たの)しくて[[仕方(しかた)が無(な)い]]。","zh":"令人高兴的是，那位女士之后也时常来店里。我曾经很不擅长敬语，现在别说怕了，反而觉得用敬语特别有意思。"},{"jp":"今(いま)でも、{{12:新人(しんじん)}}のアルバイトが敬語(けいご)で失敗(しっぱい)するのを見(み)る[[につけ]]、あの頃(ころ)の自分(じぶん)を思(おも)い出(だ)す。敬語(けいご)は相手(あいて)を大切(たいせつ)に思(おも)う気持(きも)ちの{{13:表(あらわ)れ}}なのだと、今(いま)なら分(わ)かる。","zh":"现在，每当看到新来的打工者在敬语上出错，就会想起当时的自己。如今我明白了，敬语是珍视对方这份心意的体现。"}],"grammar":[["〜からと言(い)って","虽说……但（不能因此就……）","値段(ねだん)が安(やす)い[[からと言(い)って]]、質(しつ)が悪(わる)いとは限(かぎ)らない。","不能因为价格便宜，就说质量一定差。","忙(いそが)しい[[からと言(い)って]]、食事(しょくじ)を抜(ぬ)くのは良(よ)くない。","虽说很忙，也不该不吃饭。"],["〜訳(わけ)ではない","并不是……","肉(にく)が嫌(きら)いな[[訳(わけ)ではない]]が、毎日(まいにち)は食(た)べたくない。","并不是讨厌吃肉，只是不想每天都吃。","日本(にほん)に住(す)んで居(い)れば、誰(だれ)でも日本語(にほんご)が話(はな)せる[[訳(わけ)ではない]]。","并不是住在日本，谁都会说日语。"],["〜さえ","连……都","忙(いそが)しくて、昼御飯(ひるごはん)を食(た)べる時間(じかん)[[さえ]]無(な)い。","忙得连吃午饭的时间都没有。","子供(こども)で[[さえ]]知(し)って居(い)る事(こと)を、大人(おとな)が知(し)らないのは恥(は)ずかしい。","连小孩都知道的事，大人却不知道，真丢人。"],["〜て堪(たま)らない","……得受不了，非常……","試験(しけん)の結果(けっか)が気(き)に成(な)って[[堪(たま)らない]]。","特别在意考试的结果。","今日(きょう)は暑(あつ)くて[[堪(たま)らない]]。","今天热得受不了。"],["〜反面(はんめん)","另一方面……（同一事物的两面）","都会(とかい)の生活(せいかつ)は便利(べんり)な[[反面(はんめん)]]、物価(ぶっか)が高(たか)い。","城市生活很方便，但另一方面物价高。","彼(かれ)は仕事(しごと)には厳(きび)しい[[反面(はんめん)]]、家庭(かてい)では優(やさ)しい父親(ちちおや)だ。","他对工作很严格，但在家里是个温柔的父亲。"],["〜てからでないと","不先……就不能……","説明書(せつめいしょ)を読(よ)んで[[からでないと]]、この機械(きかい)は使(つか)えない。","不先看说明书，就用不了这台机器。","実物(じつぶつ)を見(み)て[[からでないと]]、買(か)うかどうか決(き)められない。","不先看到实物，就没法决定买不买。"],["〜うちに","趁……；在……的过程中","若(わか)い[[うちに]]、色々(いろいろ)な国(くに)へ行(い)って見(み)たい。","想趁年轻去各种国家看看。","話(はな)して居(い)る[[うちに]]、彼(かれ)の事(こと)が好(す)きに成(な)った。","聊着聊着就喜欢上他了。"],["〜ずにはいられない","忍不住……，不由得……","その映画(えいが)を見(み)て、泣(な)か[[ずにはいられなかった]]。","看了那部电影，忍不住哭了。","困(こま)って居(い)る人(ひと)を見(み)ると、助(たす)け[[ずにはいられない]]。","看到有困难的人，就忍不住要帮忙。"],["〜許(ばか)りか","不仅……而且……","彼(かれ)は英語(えいご)[[許(ばか)りか]]、フランス語(ご)も話(はな)せる。","他不仅会英语，还会说法语。","薬(くすり)を飲(の)んだが、治(なお)らない[[許(ばか)りか]]、更(さら)に悪(わる)く成(な)った。","吃了药，不但没好，反而更严重了。"],["〜にしては","作为……来说（却）","初(はじ)めて作(つく)った[[にしては]]、良(よ)く出来(でき)て居(い)る。","作为第一次做的来说，做得相当好。","彼(かれ)は小学生(しょうがくせい)[[にしては]]背(せ)が高(たか)い。","作为小学生，他个子算高的。"],["〜事(こと)に","令人……的是","驚(おどろ)いた[[事(こと)に]]、彼(かれ)は一人(ひとり)で全部(ぜんぶ)片付(かたづ)けて仕舞(しま)った。","令人吃惊的是，他一个人全都收拾完了。","残念(ざんねん)な[[事(こと)に]]、雨(あめ)で花火大会(はなびたいかい)は中止(ちゅうし)に成(な)った。","遗憾的是，烟花大会因为下雨取消了。"],["〜どころか","别说……，反而……","貯金(ちょきん)する[[どころか]]、借金(しゃっきん)が増(ふ)えて仕舞(しま)った。","别说存钱了，反而欠了更多债。","彼(かれ)は謝(あやま)る[[どころか]]、怒(おこ)り出(だ)した。","他不但不道歉，反而发起火来。"],["〜て仕方(しかた)が無(な)い","……得不得了","一人(ひとり)暮(ぐ)らしを始(はじ)めた頃(ころ)は、寂(さび)しくて[[仕方(しかた)が無(な)かった]]。","刚开始一个人生活时，寂寞得不得了。","明日(あした)の旅行(りょこう)が楽(たの)しみで[[仕方(しかた)が無(な)い]]。","特别期待明天的旅行。"],["〜につけ","每当……就……","この写真(しゃしん)を見(み)る[[につけ]]、学生(がくせい)時代(じだい)を思(おも)い出(だ)す。","每当看到这张照片，就会想起学生时代。","祖母(そぼ)の料理(りょうり)を食(た)べる[[につけ]]、故郷(ふるさと)が懐(なつ)かしく成(な)る。","每次吃奶奶做的菜，都会怀念故乡。"]],"vocab":[["使い熟す","つかいこなす","运用自如","新(あたら)しいソフトを[[使(つか)い熟(こな)す]]迄(まで)に、一ヶ月(いっかげつ)掛(か)かった。","花了一个月才把新软件用熟。"],["召し上がる","めしあがる","吃，喝（尊敬语）","冷(さ)めないうちに、どうぞ[[召(め)し上(あ)がって]]下(くだ)さい。","请趁热享用。"],["尊敬語","そんけいご","尊敬语","「言(い)う」の[[尊敬語(そんけいご)]]は「仰(おっしゃ)る」だ。","“言う”的尊敬语是“仰る”。"],["謙譲語","けんじょうご","自谦语","目上(めうえ)の人(ひと)に自分(じぶん)の動作(どうさ)を言(い)う時(とき)は、[[謙譲語(けんじょうご)]]を使(つか)う。","对长辈说自己的动作时要用自谦语。"],["面倒見","めんどうみ","照顾人","佐藤(さとう)先輩(せんぱい)は[[面倒見(めんどうみ)]]が良(よ)くて、後輩(こうはい)に人気(にんき)が有(あ)る。","佐藤前辈很会照顾人，在后辈中很受欢迎。"],["付き合う","つきあう","陪伴，交往","買(か)い物(もの)に[[付(つ)き合(あ)って]]呉(く)れて、有難(ありがと)う。","谢谢你陪我去购物。"],["身に付く","みにつく","掌握，学到手","毎日(まいにち)少(すこ)し宛(ずつ)練習(れんしゅう)すれば、正(ただ)しい発音(はつおん)が[[身(み)に付(つ)く]]。","每天练一点，就能掌握正确的发音。"],["常連","じょうれん","常客","彼(かれ)はこの喫茶店(きっさてん)の[[常連(じょうれん)]]で、毎朝(まいあさ)同(おな)じ席(せき)に座(すわ)る。","他是这家咖啡店的常客，每天早上坐同一个位子。"],["褒める","ほめる","表扬，夸奖","店長(てんちょう)に接客(せっきゃく)を[[褒(ほ)められて]]、とても嬉(うれ)しかった。","被店长夸了接待做得好，非常开心。"],["年配","ねんぱい","年长","[[年配(ねんぱい)]]の御客様(おきゃくさま)には、ゆっくり話(はな)す様(よう)にして居(い)る。","对年长的客人，我会尽量放慢语速。"],["丁寧","ていねい","礼貌；仔细","道(みち)を聞(き)いたら、駅(えき)迄(まで)[[丁寧(ていねい)]]に案内(あんない)して呉(く)れた。","我问路，对方很耐心地把我带到了车站。"],["苦手","にがて","不擅长","人前(ひとまえ)で話(はな)すのは、未(ま)だ[[苦手(にがて)]]だ。","在人前说话我还是不太擅长。"],["新人","しんじん","新人","四月(しがつ)に成(な)ると、どの会社(かいしゃ)にも[[新人(しんじん)]]が入(はい)って来(く)る。","一到四月，每家公司都会进来新人。"],["表れ","あらわれ","体现，表现","彼(かれ)の丁寧(ていねい)な言葉遣(ことばづか)いは、相手(あいて)への敬意(けいい)の[[表(あらわ)れ]]だ。","他用词礼貌，是对对方尊重的体现。"]],"short":"敬語","lv":1,"sum":"在咖啡店打工的留学生，从说错敬语被提醒，到被客人夸奖的经历。"},
{"title":"初(はじ)めての富士登山(ふじとざん)","paras":[{"jp":"去年(きょねん)の夏(なつ)、友人(ゆうじん)三人(さんにん)と富士山(ふじさん)に登(のぼ)った。日本一(にほんいち)高(たか)い山(やま)だから、準備(じゅんび)は{{0:念入(ねんい)り}}にする[[に越(こ)した事(こと)はない]]と思(おも)い、一(いっ)箇(か)月(げつ)前(まえ)から毎朝(まいあさ)走(はし)って{{1:体力(たいりょく)}}を付(つ)けた。","zh":"去年夏天，我和三个朋友一起爬了富士山。因为是日本最高的山，我想准备得越充分越好，就从一个月前开始每天早上跑步锻炼体力。"},{"jp":"五合目(ごごうめ)でバスを降(お)りた[[途端(とたん)]]、空気(くうき)の冷(つめ)たさに驚(おどろ)いた。{{11:麓(ふもと)}}は三十度(さんじゅうど)を超(こ)える暑(あつ)さだったのに、ここでは{{2:上着(うわぎ)}}が必要(ひつよう)な程(ほど)だ。","zh":"在五合目一下巴士，就被冷空气吓了一跳。山脚明明是超过30度的高温，这里却冷到需要穿外套。"},{"jp":"登(のぼ)り始(はじ)めて暫(しばら)くは景色(けしき)を楽(たの)しむ{{3:余裕(よゆう)}}も有(あ)ったが、七合目(ななごうめ)を過(す)ぎた頃(ころ)から、空気(くうき)が{{4:薄(うす)い}}[[所為(せい)か]]、頭(あたま)が痛(いた)く成(な)って来(き)た。少(すこ)し歩(ある)いては休(やす)み、休(やす)んだ[[かと思(おも)うと]]又(また)歩(ある)き出(だ)す、その{{5:繰(く)り返(かえ)し}}だった。","zh":"刚开始的一段时间还有余裕欣赏风景，过了七合目以后，也许是空气稀薄的缘故，头开始疼起来。走一会儿就休息，刚休息了一下又接着走，就这样反反复复。"},{"jp":"八合目(はちごうめ)の山小屋(やまごや)で休(やす)んで居(い)る[[最中(さいちゅう)に]]、急(きゅう)に雨(あめ)が降(ふ)り出(だ)した。友人(ゆうじん)の一人(ひとり)は「もう無理(むり)だ」と言(い)い[[掛(か)けた]]が、皆(みんな)で{{6:励(はげ)まし合(あ)}}って、何(なん)とか頑張(がんば)った。","zh":"正在八合目的山间小屋休息时，突然下起雨来。一个朋友刚要说\"我不行了\"，大家互相鼓励，总算坚持了下来。"},{"jp":"夜中(よなか)に出発(しゅっぱつ)し、何度(なんど)も足(あし)を止(と)めた[[末(すえ)に]]、遂(つい)に{{7:山頂(さんちょう)}}に{{8:辿(たど)り着(つ)}}いた。雲(くも)の上(うえ)から昇(のぼ)る朝日(あさひ)は、言葉(ことば)では表現(ひょうげん)し[[様(よう)が無(な)い]]程(ほど)美(うつく)しかった。皆(みんな)、暫(しばら)く黙(だま)ってその{{9:光景(こうけい)}}を見詰(みつ)めて居(い)た。","zh":"半夜出发，几次停下脚步之后，终于到达了山顶。从云海上升起的朝阳美得无法用语言形容。大家都沉默着，凝视了那景色好一会儿。"},{"jp":"下山(げざん)は登(のぼ)り[[程(ほど)]]辛(つら)くないだろうと思(おも)って居(い)たが、大間違(おおまちが)いだった。三時間(さんじかん)も{{10:砂利道(じゃりみち)}}を下(くだ)り続(つづ)け、膝(ひざ)は震(ふる)えっ[[放(ぱな)し]]だった。道(みち)を間違(まちが)えて散々(さんざん)歩(ある)いた[[挙句(あげく)]]、元(もと)の場所(ばしょ)に戻(もど)って仕舞(しま)う一幕(ひとまく)も有(あ)った。","zh":"我原以为下山不像上山那么辛苦，结果大错特错。在砂石路上连续下了三个小时，膝盖一直在发抖。还发生了走错路、绕了半天最后又回到原地的插曲。"},{"jp":"麓(ふもと)に着(つ)いた時(とき)、体(からだ)は疲(つか)れ[[切(き)って]]居(い)たが、最後(さいご)迄(まで)歩(ある)き[[抜(ぬ)いた]]と言(い)う{{12:達成感(たっせいかん)}}で一杯(いっぱい)だった。「二度(にど)と登(のぼ)る[[物(もの)か]]」と言(い)って居(い)た友人(ゆうじん)も、今(いま)では「来年(らいねん)も行(い)こう」と言(い)って居(い)る。あの朝日(あさひ)は、{{13:一生(いっしょう)}}忘(わす)れ[[難(がた)い]]思(おも)い出(で)に成(な)った。","zh":"回到山脚时，身体已经筋疲力尽，心里却满是坚持走到最后的成就感。那个曾说\"再也不爬了\"的朋友，现在也说\"明年还去吧\"。那轮朝阳成了我一生难忘的回忆。"}],"grammar":[["〜に越(こ)した事(こと)はない","……最好不过","健康(けんこう)の為(ため)には、早寝(はやね)早起(はやお)き[[に越(こ)した事(こと)はない]]。","为了健康，早睡早起是最好的。","安(やす)い[[に越(こ)した事(こと)はない]]が、品質(ひんしつ)も大切(たいせつ)だ。","便宜当然最好，但质量也很重要。"],["〜た途端(とたん)","刚一……就……","家(いえ)を出(で)た[[途端(とたん)]]、雨(あめ)が降(ふ)り出(だ)した。","刚一出家门就下起雨来。","ベッドに横(よこ)に成(な)った[[途端(とたん)]]、眠(ねむ)って仕舞(しま)った。","一躺到床上就睡着了。"],["〜所為(せい)か","也许是因为……","年(とし)の[[所為(せい)か]]、最近(さいきん)疲(つか)れ易(やす)い。","也许是上了年纪，最近容易累。","寝不足(ねぶそく)の[[所為(せい)か]]、今日(きょう)は集中(しゅうちゅう)出来(でき)ない。","也许是睡眠不足，今天没法集中注意力。"],["〜かと思(おも)うと","刚一……马上就……","空(そら)が暗(くら)く成(な)った[[かと思(おも)うと]]、激(はげ)しい雨(あめ)が降(ふ)って来(き)た。","天刚一暗下来，就下起了大雨。","弟(おとうと)は帰(かえ)って来(き)た[[かと思(おも)うと]]、又(また)直(す)ぐに出掛(でか)けた。","弟弟刚回来，马上又出去了。"],["〜最中(さいちゅう)に","正在……的时候","会議(かいぎ)の[[最中(さいちゅう)に]]、携帯電話(けいたいでんわ)が鳴(な)った。","正开会时，手机响了。","食事(しょくじ)をして居(い)る[[最中(さいちゅう)に]]、地震(じしん)が起(お)きた。","正在吃饭的时候发生了地震。"],["〜掛(か)ける","刚要……；……到一半","読(よ)み[[掛(か)けた]]本(ほん)が机(つくえ)の上(うえ)に置(お)いて有(あ)る。","读了一半的书放在桌子上。","何(なに)か言(い)い[[掛(か)けて]]、彼(かれ)は黙(だま)って仕舞(しま)った。","他刚要说什么，又沉默了。"],["〜末(すえ)に","经过……最后","長(なが)い間(あいだ)悩(なや)んだ[[末(すえ)に]]、会社(かいしゃ)を辞(や)める事(こと)にした。","苦恼了很长时间，最后决定辞职。","話(はな)し合(あ)いの[[末(すえ)に]]、計画(けいかく)は中止(ちゅうし)に成(な)った。","经过商讨，计划最终取消了。"],["〜様(よう)が無(な)い","没法……，无从……","連絡先(れんらくさき)が分(わ)からないので、知(し)らせ[[様(よう)が無(な)い]]。","不知道联系方式，没法通知。","こんなに壊(こわ)れて居(い)ては、直(なお)し[[様(よう)が無(な)い]]。","坏成这样，没法修了。"],["〜程(ほど)〜ない","没有……那么……","今年(ことし)の冬(ふゆ)は去年(きょねん)[[程(ほど)]]寒(さむ)くない。","今年冬天没有去年那么冷。","試験(しけん)は思(おも)った[[程(ほど)]]難(むずか)しくなかった。","考试没有想象的那么难。"],["〜っ放(ぱな)し","一直……；……着不管","窓(まど)を開(あ)けっ[[放(ぱな)し]]にして出掛(でか)けて仕舞(しま)った。","窗户开着没关就出门了。","今日(きょう)は一日中(いちにちじゅう)立(た)ちっ[[放(ぱな)し]]で、足(あし)が痛(いた)い。","今天站了一整天，腿很疼。"],["〜挙句(あげく)","……到最后（多为不好的结果）","散々(さんざん)迷(まよ)った[[挙句(あげく)]]、何(なに)も買(か)わずに帰(かえ)った。","犹豫了半天，结果什么也没买就回来了。","彼(かれ)は遅刻(ちこく)を繰(く)り返(かえ)した[[挙句(あげく)]]、会社(かいしゃ)を首(くび)に成(な)った。","他反复迟到，最后被公司开除了。"],["〜切(き)る","……完；彻底……","一晩(ひとばん)で小説(しょうせつ)を読(よ)み[[切(き)った]]。","一个晚上就把小说读完了。","マラソンで四十二(よんじゅうに)キロを走(はし)り[[切(き)った]]。","跑完了马拉松全程42公里。"],["〜抜(ぬ)く","……到底，坚持……","苦(くる)しい練習(れんしゅう)に最後(さいご)迄(まで)耐(た)え[[抜(ぬ)いた]]。","艰苦的训练一直坚持到了最后。","何度(なんど)も考(かんが)え[[抜(ぬ)いて]]出(だ)した答(こた)えだ。","这是反复深思熟虑后得出的答案。"],["〜物(もの)か","才不……，怎么会……","あんな店(みせ)には二度(にど)と行(い)く[[物(もの)か]]。","那种店我再也不去了。","こんな所(ところ)で諦(あきら)める[[物(もの)か]]。","怎么能在这种地方放弃！"],["〜難(がた)い","难以……","彼(かれ)がそんな事(こと)をしたとは、信(しん)じ[[難(がた)い]]。","很难相信他会做那种事。","子供(こども)の頃(ころ)の思(おも)い出(で)は、忘(わす)れ[[難(がた)い]]物(もの)だ。","儿时的回忆是难以忘怀的。"]],"vocab":[["念入り","ねんいり","仔细，周到"],["体力","たいりょく","体力"],["上着","うわぎ","外套"],["余裕","よゆう","余裕，从容"],["薄い","うすい","稀薄；薄"],["繰り返し","くりかえし","反复"],["励まし合う","はげましあう","互相鼓励"],["山頂","さんちょう","山顶"],["辿り着く","たどりつく","好不容易到达"],["光景","こうけい","景象"],["砂利道","じゃりみち","砂石路"],["麓","ふもと","山脚"],["達成感","たっせいかん","成就感"],["一生","いっしょう","一生"]],"short":"富士登山","lv":1,"sum":"和朋友第一次爬富士山，从头疼、淋雨到看见山顶日出的游记。"},
{"title":"祖母(そぼ)からの手紙(てがみ)","paras":[{"jp":"拓也(たくや)へ。元気(げんき)にして居(い)ますか。東京(とうきょう)はもう寒(さむ)く成(な)ったでしょう。御(お)母(かあ)さんの話(はなし)では、毎日(まいにち)アルバイトと勉強(べんきょう)で忙(いそが)しくして居(い)る[[との事(こと)]]ですね。","zh":"拓也：你好吗？东京应该已经冷了吧。听你妈妈说，你每天又打工又学习，忙得很。"},{"jp":"貴方(あなた)が東京(とうきょう)へ行(い)ってから、もう一年(いちねん)に成(な)ります。駅(えき)で{{0:見送(みおく)}}った日(ひ)の事(こと)を思(おも)い出(だ)すと、今(いま)でも胸(むね)に{{1:込(こ)み上(あ)げ}}て来(く)る[[物(もの)が有(あ)ります]]。小(ちい)さい頃(ころ)は{{2:泣(な)き虫(むし)}}だった[[くせに]]、あの日(ひ)は涙(なみだ)一(ひと)つ見(み)せずに、笑(わら)って手(て)を振(ふ)って居(い)ましたね。","zh":"你去东京已经一年了。一想起在车站送你的那天，至今心头还会涌起一股感情。你小时候明明是个爱哭鬼，那天却一滴眼泪也没掉，笑着向我挥手。"},{"jp":"一人(ひとり)で頑張(がんば)って居(い)る貴方(あなた)の事(こと)を思(おも)うと、心配(しんぱい)で[[成(な)らない]]のです。無理(むり)をし過(す)ぎると、{{3:体(からだ)を壊(こわ)}}し[[兼(か)ねません]]。若(わか)い時(とき)こそ、体(からだ)を大切(たいせつ)にする[[事(こと)です]]。","zh":"一想到你一个人在拼命，我就担心得不得了。太勉强自己，可能会把身体搞垮。正因为年轻，更要爱惜身体。"},{"jp":"先日(せんじつ)は誕生日(たんじょうび)のプレゼントを有難(ありがと)う。貴方(あなた)が初(はじ)めてのアルバイト代(だい)で選(えら)んで呉(く)れたと聞(き)いて、どれ程(ほど)嬉(うれ)しかった[[事(こと)か]]。毎日(まいにち)そのストールを巻(ま)いて散歩(さんぽ)に出掛(でか)けて居(い)ます。近所(きんじょ)の人(ひと)に褒(ほ)められると、{{5:孫(まご)}}の{{4:自慢(じまん)}}をし[[ないではいられません]]。","zh":"前几天谢谢你的生日礼物。听说是你用第一次打工的工资挑的，我不知有多高兴。我每天都围着那条披肩出去散步。邻居一夸，我就忍不住炫耀起孙子来。"},{"jp":"こちらは皆(みんな)元気(げんき)です。御(お)爺(じい)さんは{{6:相変(あいか)わらず}}{{7:畑仕事(はたけしごと)}}に{{8:夢中(むちゅう)}}で、雨(あめ)の日(ひ)も休(やす)む[[事(こと)なく]]畑(はたけ)に出(で)て居(い)ます。今年(ことし)は大根(だいこん)が良(よ)く出来(でき)た[[物(もの)だから]]、近所中(きんじょじゅう)に{{9:配(くば)}}って歩(ある)いて居(い)ます。","zh":"我们这边大家都很好。你爷爷还是一心扑在地里，下雨天也不休息，照样下地干活。今年萝卜长得特别好，他就挨家挨户分给邻居们。"},{"jp":"町(まち)は若(わか)い人(ひと)が減(へ)る[[一方(いっぽう)で]]、最近(さいきん)は都会(とかい)から{{10:移(うつ)り住(す)む}}家族(かぞく)も増(ふ)えて来(き)ました。寂(さび)しく[[ないこともない]]けれど、新(あたら)しい顔(かお)を見(み)るのは楽(たの)しい物(もの)です。","zh":"镇上的年轻人在减少，另一方面，最近从城市搬来的家庭也多了起来。也不是不觉得寂寞，但看到新面孔还是很开心的。"},{"jp":"正月(しょうがつ)には帰(かえ)って来(こ)られますか。若(も)し帰(かえ)って来(く)るなら、貴方(あなた)の好(す)きな{{13:栗御飯(くりごはん)}}を作(つく)って待(ま)って居(い)ます。電話(でんわ)では心配(しんぱい)を掛(か)ける[[まい]]と、何時(いつ)も「大丈夫(だいじょうぶ)」と言(い)う貴方(あなた)ですから、顔(かお)を見(み)る迄(まで)は{{12:安心(あんしん)}}出来(でき)ません。","zh":"过年能回来吗？如果回来，我做你最爱吃的栗子饭等你。你在电话里为了不让我担心，总是说\"没事\"，所以不亲眼见到你，我就放不下心。"},{"jp":"これから寒(さむ)さが厳(きび)しく成(な)ります。風邪(かぜ)を引(ひ)きません[[様(よう)に]]。祖母(そぼ)より。","zh":"天气会越来越冷，千万别感冒了。奶奶字。"}],"grammar":[["〜との事(こと)だ","据说……，（某人）说……（转述）","天気予報(てんきよほう)に依(よ)ると、明日(あした)は大雪(おおゆき)に成(な)る[[との事(こと)だ]]。","据天气预报说，明天会下大雪。","部長(ぶちょう)は今日(きょう)の会議(かいぎ)に遅(おく)れる[[との事(こと)です]]。","部长说今天的会议他会迟到。"],["〜物(もの)が有(あ)る","确实有……之处，令人……","彼(かれ)の演奏(えんそう)には、人(ひと)の心(こころ)を動(うご)かす[[物(もの)が有(あ)る]]。","他的演奏有一种打动人心的力量。","一人(ひとり)で外国(がいこく)に住(す)むのは、大変(たいへん)な[[物(もの)が有(あ)る]]。","一个人在国外生活，确实有它的不易。"],["〜くせに","明明……却……（责备）","知(し)って居(い)る[[くせに]]、教(おし)えて呉(く)れない。","明明知道，却不告诉我。","自分(じぶん)では何(なに)もしない[[くせに]]、文句(もんく)許(ばか)り言(い)う。","自己什么都不做，却光会抱怨。"],["〜て成(な)らない","……得不得了，总觉得……","故郷(ふるさと)の家族(かぞく)の事(こと)が気(き)に成(な)って[[成(な)らない]]。","非常惦记老家的家人。","彼(かれ)の話(はなし)は嘘(うそ)の様(よう)に思(おも)えて[[成(な)らない]]。","总觉得他的话像是假的。"],["〜兼(か)ねない","很可能会……（不好的结果）","そんな運転(うんてん)をしたら、事故(じこ)を起(お)こし[[兼(か)ねない]]。","那样开车，很可能会出事故。","彼(かれ)なら、約束(やくそく)を忘(わす)れ[[兼(か)ねない]]。","他的话，很可能会忘记约定。"],["〜事(こと)だ","应该……，最好……（忠告）","上手(じょうず)に成(な)りたければ、毎日(まいにち)練習(れんしゅう)する[[事(こと)だ]]。","想变得拿手，就应该每天练习。","分(わ)からない時(とき)は、遠慮(えんりょ)せずに聞(き)く[[事(こと)だ]]。","不懂的时候，最好不要客气，直接问。"],["〜事(こと)か","多么……啊","合格(ごうかく)の知(し)らせを聞(き)いて、どれ程(ほど)嬉(うれ)しかった[[事(こと)か]]。","听到合格的消息，不知有多高兴。","同(おな)じ事(こと)を何度(なんど)注意(ちゅうい)した[[事(こと)か]]。","同样的事不知提醒了多少遍。"],["〜ないではいられない","忍不住……","彼(かれ)の失礼(しつれい)な態度(たいど)には、一言(ひとこと)言(い)わ[[ないではいられなかった]]。","对他无礼的态度，我忍不住说了一句。","美味(おい)しそうなケーキを見(み)ると、買(か)わ[[ないではいられない]]。","看到好吃的蛋糕，就忍不住要买。"],["〜事(こと)なく","不……而……，没有……","彼(かれ)は一日(いちにち)も休(やす)む[[事(こと)なく]]、三年間(さんねんかん)働(はたら)き続(つづ)けた。","他一天也没休息，连续工作了三年。","迷(まよ)う[[事(こと)なく]]、自分(じぶん)の道(みち)を選(えら)んだ。","毫不犹豫地选择了自己的路。"],["〜物(もの)だから","因为……（辩解、说明理由）","道(みち)が混(こ)んで居(い)た[[物(もの)だから]]、遅(おく)れて仕舞(しま)いました。","因为路上堵车，所以迟到了。","余(あま)りに安(やす)かった[[物(もの)だから]]、三(みっ)つも買(か)って仕舞(しま)った。","因为实在太便宜，一下子买了三个。"],["〜一方(いっぽう)で","一方面……另一方面……","仕事(しごと)が忙(いそが)しい[[一方(いっぽう)で]]、趣味(しゅみ)の時間(じかん)も大切(たいせつ)にして居(い)る。","工作很忙，同时也很重视爱好的时间。","便利(べんり)な機械(きかい)が増(ふ)える[[一方(いっぽう)で]]、使(つか)い方(かた)が分(わ)からない人(ひと)も居(い)る。","方便的机器越来越多，另一方面也有人不会用。"],["〜ないこともない","也不是不……","少(すこ)し高(たか)いが、買(か)え[[ないこともない]]。","有点贵，但也不是买不起。","急(いそ)げば、間(ま)に合(あ)わ[[ないこともない]]。","赶一赶的话，也不是来不及。"],["〜まい","决不……；为了不……","二度(にど)と同(おな)じ失敗(しっぱい)はする[[まい]]と心(こころ)に決(き)めた。","下定决心，再也不犯同样的错误。","親(おや)に心配(しんぱい)を掛(か)ける[[まい]]と、病気(びょうき)の事(こと)は黙(だま)って居(い)た。","为了不让父母担心，生病的事一直没说。"],["〜様(よう)に","希望……；为了……","明日(あした)、晴(は)れます[[様(よう)に]]。","希望明天放晴。","忘(わす)れない[[様(よう)に]]、手帳(てちょう)にメモして置(お)いた。","为了不忘记，记在了记事本上。"]],"vocab":[["見送る","みおくる","送行"],["込み上げる","こみあげる","（感情）涌上来"],["泣き虫","なきむし","爱哭鬼"],["体を壊す","からだをこわす","搞垮身体"],["自慢","じまん","炫耀，自豪"],["孫","まご","孙子，孙女"],["相変わらず","あいかわらず","照旧，依然"],["畑仕事","はたけしごと","农活"],["夢中","むちゅう","热衷，入迷"],["配る","くばる","分发"],["移り住む","うつりすむ","迁居"],["遠慮","えんりょ","客气，顾虑"],["安心","あんしん","放心"],["栗御飯","くりごはん","栗子饭"]],"short":"祖母の手紙","lv":1,"sum":"奶奶写给在东京的孙子的一封信，练习书信体和表达心情的语法。"},
{"title":"日本(にほん)の四季(しき)と年中行事(ねんじゅうぎょうじ)","paras":[{"jp":"日本(にほん)には春夏秋冬(しゅんかしゅうとう)の四季(しき)が有(あ)り、季節(きせつ)の変化(へんか)[[と共(とも)に]]、様々(さまざま)な{{0:年中行事(ねんじゅうぎょうじ)}}が行(おこな)われる。","zh":"日本有春夏秋冬四季，随着季节的变化，会举行各种各样的传统节庆活动。"},{"jp":"日本(にほん)の春(はる)[[と言(い)えば]]、何(なん)と言(い)っても{{1:花見(はなみ)}}だろう。三月(さんがつ)の終(お)わりから四月(しがつ)の初(はじ)め[[に掛(か)けて]]、全国(ぜんこく){{2:各地(かくち)}}で桜(さくら)が咲(さ)き、公園(こうえん)は花見(はなみ)をする人(ひと)で一杯(いっぱい)に成(な)る。","zh":"说起日本的春天，最有代表性的还是赏花吧。从三月底到四月初，全国各地樱花盛开，公园里挤满了赏花的人。"},{"jp":"夏(なつ)は祭(まつ)りの季節(きせつ)である。京都(きょうと)の祇園祭(ぎおんまつり)は七月(しちがつ)の一(いっ)箇(か)月(げつ)[[に亘(わた)って]]行(おこな)われ、千年(せんねん)以上(いじょう)の歴史(れきし)を持(も)つ。又(また)、各地(かくち)で開(ひら)かれる花火大会(はなびたいかい)には、浴衣姿(ゆかたすがた)の若者(わかもの)[[を中心(ちゅうしん)に]]{{4:大勢(おおぜい)}}の人(ひと)が集(あつ)まる。","zh":"夏天是祭典的季节。京都的祇园祭贯穿整个七月，已有一千多年的历史。各地举办的烟花大会，则聚集了以穿浴衣的年轻人为主的大批人群。"},{"jp":"秋(あき)は「{{5:食欲(しょくよく)}}の秋(あき)」「読書(どくしょ)の秋(あき)」等(など)と言(い)われる。秋(あき)の夜(よる)に月(つき)を{{6:眺(なが)める}}「月見(つきみ)」は、平安時代(へいあんじだい)に中国(ちゅうごく)から伝(つた)わって[[以来(いらい)]]、長(なが)く親(した)しまれて来(き)た。団子(だんご)や芒(すすき)を飾(かざ)り、{{7:収穫(しゅうかく)}}への感謝(かんしゃ)[[を込(こ)めて]]月(つき)を{{8:拝(おが)む}}のである。","zh":"秋天被称为\"食欲之秋\"\"读书之秋\"。秋夜赏月的\"月见\"，自平安时代从中国传来之后，长久以来深受人们喜爱。人们摆上团子和芒草，怀着对丰收的感激之情拜月。"},{"jp":"冬(ふゆ)の最大(さいだい)の行事(ぎょうじ)は正月(しょうがつ)だ。人間(にんげん)の{{10:煩悩(ぼんのう)}}は百八(ひゃくはち)有(あ)るとされる[[事(こと)から]]、{{9:大晦日(おおみそか)}}には寺(てら)の鐘(かね)が百八回(ひゃくはちかい)鳴(な)らされる。元日(がんじつ)には家族(かぞく)が揃(そろ)って御節料理(おせちりょうり)を食(た)べ、{{11:初詣(はつもうで)}}に出掛(でか)ける。散歩(さんぽ)[[がてら]]近所(きんじょ)の神社(じんじゃ)に{{12:参拝(さんぱい)}}する人(ひと)も多(おお)い。","zh":"冬天最大的节日是新年。据说人有108种烦恼，所以除夕夜寺院会敲钟108下。元旦这天，一家人团聚吃年菜，再去新年参拜。也有很多人散步时顺便去附近的神社参拜。"},{"jp":"最近(さいきん)では、ハロウィンやクリスマス[[と言(い)った]]海外(かいがい)の行事(ぎょうじ)も{{13:定着(ていちゃく)}}して来(き)た。生活(せいかつ)スタイルの変化(へんか)[[に伴(ともな)って]]、伝統的(でんとうてき)な行事(ぎょうじ)を家庭(かてい)で行(おこな)う事(こと)は少(すく)なく成(な)ったが、子供(こども)[[に限(かぎ)らず]]大人(おとな)も、季節(きせつ)の行事(ぎょうじ)を楽(たの)しむ気持(きも)ちは変(か)わらない。","zh":"最近，万圣节、圣诞节这类海外节日也扎下了根。随着生活方式的变化，在家里过传统节日的少了，但不只是孩子，大人享受节令活动的心情也没有改变。"},{"jp":"日本(にほん)を訪(おとず)れる[[際(さい)には]]、その季節(きせつ)ならではの行事(ぎょうじ)に参加(さんか)して見(み)ては如何(いかが)だろうか。","zh":"来日本的时候，不妨参加一下那个季节特有的节庆活动吧。"}],"grammar":[["〜と共(とも)に","随着……；和……一起","年(とし)を取(と)る[[と共(とも)に]]、記憶力(きおくりょく)が衰(おとろ)えて来(く)る。","随着年龄增长，记忆力会衰退。","家族(かぞく)[[と共(とも)に]]新年(しんねん)を迎(むか)えた。","和家人一起迎接了新年。"],["〜と言(い)えば","说起……，提到……","夏(なつ)[[と言(い)えば]]、矢張(やは)り西瓜(すいか)だ。","说到夏天，还得是西瓜。","北海道(ほっかいどう)[[と言(い)えば]]、雪(ゆき)と美味(おい)しい海鮮(かいせん)が有名(ゆうめい)だ。","说起北海道，雪和美味的海鲜很有名。"],["〜に掛(か)けて","从……到……（时间、地点的范围）","今夜(こんや)から明日(あした)の朝(あさ)[[に掛(か)けて]]、強(つよ)い雨(あめ)が降(ふ)るでしょう。","从今晚到明天早上会下大雨。","関東(かんとう)から東北(とうほく)[[に掛(か)けて]]、雪(ゆき)が降(ふ)って居(い)る。","从关东到东北一带都在下雪。"],["〜に亘(わた)って","在……范围内，长达……","会議(かいぎ)は五時間(ごじかん)[[に亘(わた)って]]続(つづ)いた。","会议持续了五个小时。","彼(かれ)は十年(じゅうねん)[[に亘(わた)って]]この研究(けんきゅう)を続(つづ)けて来(き)た。","他持续这项研究长达十年。"],["〜を中心(ちゅうしん)に","以……为中心","地球(ちきゅう)は太陽(たいよう)[[を中心(ちゅうしん)に]]回(まわ)って居(い)る。","地球围绕着太阳转。","この店(みせ)は若(わか)い女性(じょせい)[[を中心(ちゅうしん)に]]人気(にんき)が有(あ)る。","这家店主要受年轻女性欢迎。"],["〜て以来(いらい)","自从……以来","日本(にほん)に来(き)て[[以来(いらい)]]、一度(いちど)も国(くに)に帰(かえ)って居(い)ない。","自从来日本以后，一次也没回过国。","卒業(そつぎょう)[[以来(いらい)]]、彼(かれ)とは会(あ)って居(い)ない。","毕业以后就没见过他。"],["〜を込(こ)めて","满怀……，倾注……","母(はは)の日(ひ)に、感謝(かんしゃ)[[を込(こ)めて]]花(はな)を贈(おく)った。","母亲节那天，满怀感激地送了花。","心(こころ)[[を込(こ)めて]]作(つく)った料理(りょうり)は美味(おい)しい。","用心做的菜就是好吃。"],["〜事(こと)から","由于……，从……（判断、命名的根据）","この辺(あた)りは桜(さくら)が多(おお)い[[事(こと)から]]、「桜町(さくらまち)」と呼(よ)ばれて居(い)る。","这一带樱花多，所以被叫作\"樱町\"。","足跡(あしあと)が残(のこ)って居(い)た[[事(こと)から]]、犯人(はんにん)が分(わ)かった。","根据留下的脚印查出了犯人。"],["〜がてら","顺便……，借……之机","散歩(さんぽ)[[がてら]]、パンを買(か)いに行(い)った。","散步时顺便去买了面包。","駅(えき)迄(まで)友達(ともだち)を送(おく)り[[がてら]]、本屋(ほんや)に寄(よ)った。","送朋友去车站，顺便去了趟书店。"],["〜と言(い)った","……之类的，……等（列举）","京都(きょうと)や奈良(なら)[[と言(い)った]]古(ふる)い町(まち)には、外国人(がいこくじん)観光客(かんこうきゃく)が多(おお)い。","京都、奈良这样的古城，外国游客很多。","野菜(やさい)や果物(くだもの)[[と言(い)った]]食品(しょくひん)の値段(ねだん)が上(あ)がって居(い)る。","蔬菜、水果之类的食品价格在上涨。"],["〜に伴(ともな)って","随着……，伴随……","気温(きおん)の上昇(じょうしょう)[[に伴(ともな)って]]、冷房(れいぼう)の使用量(しようりょう)が増(ふ)えた。","随着气温上升，空调的使用量增加了。","会社(かいしゃ)の成長(せいちょう)[[に伴(ともな)って]]、社員(しゃいん)の数(かず)も増(ふ)えた。","随着公司的发展，员工人数也增加了。"],["〜に限(かぎ)らず","不仅限于……","この問題(もんだい)は日本(にほん)[[に限(かぎ)らず]]、多(おお)くの国(くに)が抱(かか)えて居(い)る。","这个问题不只是日本，很多国家都存在。","週末(しゅうまつ)[[に限(かぎ)らず]]、平日(へいじつ)も店(みせ)は混(こ)んで居(い)る。","不只是周末，平时店里也很挤。"],["〜際(さい)に","在……的时候（正式）","御(お)帰(かえ)りの[[際(さい)には]]、忘(わす)れ物(もの)に御(ご)注意(ちゅうい)下(くだ)さい。","离开时请注意不要遗忘物品。","引(ひ)っ越(こ)しの[[際(さい)に]]、古(ふる)い家具(かぐ)を処分(しょぶん)した。","搬家的时候处理掉了旧家具。"]],"vocab":[["年中行事","ねんじゅうぎょうじ","一年中的例行节庆"],["花見","はなみ","赏花"],["各地","かくち","各地"],["浴衣","ゆかた","夏季单和服"],["大勢","おおぜい","许多人"],["食欲","しょくよく","食欲"],["眺める","ながめる","眺望，凝视"],["収穫","しゅうかく","收获"],["拝む","おがむ","拜，合掌祈祷"],["大晦日","おおみそか","除夕"],["煩悩","ぼんのう","烦恼"],["初詣","はつもうで","新年第一次参拜"],["参拝","さんぱい","参拜"],["定着","ていちゃく","扎根，固定下来"]],"short":"四季と行事","lv":1,"sum":"按春夏秋冬介绍日本的传统节庆，赏花、祇园祭、赏月、新年参拜。"},
{"title":"早起(はやお)きは三文(さんもん)の徳(とく)","paras":[{"jp":"私(わたし)は昔(むかし)から{{0:夜型(よるがた)}}の人間(にんげん)で、夜中(よなか)の二時(にじ)、三時(さんじ)迄(まで)起(お)きて居(い)るのが当(あ)たり前(まえ)だった。その為(ため)、朝(あさ)は何時(いつ)も{{1:寝坊(ねぼう)}}[[気味(ぎみ)]]で、授業(じゅぎょう)に遅刻(ちこく)する事(こと)も少(すく)なくなかった。","zh":"我一直是个夜猫子，熬到半夜两三点是家常便饭。因此早上总有点睡过头，上课迟到也是常有的事。"},{"jp":"最近(さいきん)、何(なん)となく体(からだ)が{{2:怠(だる)}}く、風邪(かぜ)[[っぽい]]日(ひ)が続(つづ)いた。病院(びょういん)で相談(そうだん)すると、医者(いしゃ)は「若(わか)い[[割(わり)に]]、生活(せいかつ)のリズムが{{3:乱(みだ)れ}}て居(い)ますね」と言(い)った。","zh":"最近总觉得身体乏力，好几天都像感冒了似的。去医院咨询，医生说：\"你年纪轻轻，生活节奏却这么乱啊。\""},{"jp":"医者(いしゃ)に{{4:勧(すす)め}}られて、早起(はやお)きを始(はじ)める事(こと)にした。最初(さいしょ)は「早起(はやお)き出来(でき)る[[物(もの)なら]]、{{13:疾(と)っくに}}して居(い)る」と思(おも)った。然(しか)し、医者(いしゃ)の言葉(ことば)を{{5:聞(き)き流(なが)す}}のは、自分(じぶん)の体(からだ)に対(たい)して{{6:無責任(むせきにん)}}[[と言(い)う物(もの)だ]]。","zh":"在医生的建议下，我决定开始早起。一开始我想：\"要是能早起，我早就做了。\"可是，把医生的话当耳旁风，那就是对自己的身体不负责任。"},{"jp":"先(ま)ず、寝(ね)る一時間前(いちじかんまえ)にはスマホを見(み)ない事(こと)にした。今更(いまさら){{7:夜更(よふ)かし}}を止(や)めた[[所(ところ)で]]、直(す)ぐには変(か)わらないだろうと思(おも)って居(い)たが、一週間(いっしゅうかん)程(ほど)で自然(しぜん)に{{8:目(め)が覚(さ)める}}様(よう)に成(な)った。","zh":"首先，我规定自己睡前一小时不看手机。我原以为事到如今才不熬夜，也不会马上有变化，没想到一周左右就能自然醒了。"},{"jp":"朝(あさ)の時間(じかん)が出来(でき)ると、朝食(ちょうしょく)をゆっくり食(た)べられる。散歩(さんぽ)の[[序(つい)でに]]、近所(きんじょ)のパン屋(や)で{{9:焼(や)き立(た)て}}のパンを買(か)うのが楽(たの)しみに成(な)った。以前(いぜん)は朝(あさ){{10:慌(あわ)て}}て家(いえ)を出(で)て、タクシーに乗(の)る事(こと)も有(あ)ったが、今(いま)はタクシーを使(つか)わ[[ずに済(す)む]]。","zh":"早上有了时间，就能慢慢吃早饭了。散步时顺便去附近的面包店买刚出炉的面包，成了一件乐事。以前早上慌慌张张出门，有时还得打车，现在不用再打车了。"},{"jp":"夜型(よるがた)だった私(わたし)[[にしたら]]、これは大(おお)きな変化(へんか)だ。友人(ゆうじん)にも「最近(さいきん)、何(なん)だか楽(たの)し[[げ]]だね」と言(い)われる。","zh":"对曾经是夜猫子的我来说，这是很大的变化。朋友也说：\"你最近看起来挺开心的嘛。\""},{"jp":"勿論(もちろん)、早起(はやお)きが誰(だれ)にでも合(あ)うとは言(い)い[[兼(か)ねる]]。仕事(しごと)の都合(つごう)で夜(よる)働(はたら)く人(ひと)も居(い)るだろう。でも、自分(じぶん)[[なりに]]生活(せいかつ)のリズムを{{11:整(ととの)える}}事(こと)は出来(でき)る筈(はず)だ。毎日(まいにち)の小(ちい)さな{{12:工夫(くふう)}}[[次第(しだい)で]]、体(からだ)も心(こころ)も変(か)わって行(い)く。皆(みな)さんも、明日(あした)から少(すこ)し早(はや)く起(お)きて見(み)[[ようではないか]]。","zh":"当然，很难说早起适合每一个人。也有人因为工作要在夜里上班。但每个人都应该能按自己的方式调整生活节奏。凭着每天的小小用心，身体和心情都会慢慢改变。大家也从明天开始，试着早起一点吧。"}],"grammar":[["〜気味(ぎみ)","有点……，稍微有……的倾向","最近(さいきん)、少(すこ)し太(ふと)り[[気味(ぎみ)]]だ。","最近有点发胖。","仕事(しごと)が忙(いそが)しくて、
