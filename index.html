<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>日语学习 (Vue 3 版本)</title>
<style>
/* Layout: same as IELTS site — 720px centered column, name left / search right, tile grid, sticky sub-page header */
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;
  --blue:#8a6414;            /* bronze accent (named --blue as in IELTS site) */
  --chip:#f4ecd9;--greige:#ece6dc;--pager-t:#6b4a0e;
  --gold:#f0cf8a;--tab:#1d1d1f;
  --t1:#f4ecd9;--t2:#ece6dc;--t3:#f6e4d0;
  --cp-bg:#f3dcc3;--cp-t:#8f3f0f;   /* copper: key grammar in articles */
  --px:20px;
  --font:-apple-system,"SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:#2c2c2e;
  --blue:#e8c27a;--chip:#2e2616;--greige:#2a2622;--pager-t:#d9c28f;--tab:#3a3a3c;
  --t1:#2e2616;--t2:#2a2622;--t3:#33241a;--cp-bg:#3a2414;--cp-t:#f0b98a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:#2c2c2e;
  --blue:#e8c27a;--chip:#2e2616;--greige:#2a2622;--pager-t:#d9c28f;--tab:#3a3a3c;
  --t1:#2e2616;--t2:#2a2622;--t3:#33241a;--cp-bg:#3a2414;--cp-t:#f0b98a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(var(--px),env(safe-area-inset-left,0px));padding-right:max(var(--px),env(safe-area-inset-right,0px));padding-block:28px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- home header ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.hero .name{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
.hero h1{font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0;font-weight:700;text-wrap:balance}
.hero .goal{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--sub)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:linear-gradient(#34343a,#0e0e10);color:var(--gold);letter-spacing:.02em}
.search{width:180px;max-width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;font-size:14px;font-family:inherit}
@media (pointer:coarse){.search,input{font-size:16px}}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:0;border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.tile.wide{grid-column:1/-1}
.tile h2{font-size:22px;margin:0;letter-spacing:-.01em}
.tile .jp{font-size:12.5px;color:var(--blue);font-weight:600}
.tile .desc{font-size:13px;color:var(--sub);margin:0}
.peek{display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.peek .chip{white-space:nowrap;flex:none}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--blue)}
.count{margin-top:auto;padding-top:10px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
@media (max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.search{width:100%}}

/* ---------- sub pages ---------- */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-bottom:6px}
.back{border:0;background:none;color:var(--blue);font-size:17px;padding:0;margin-bottom:6px}
.sticky h1{font-size:26px;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.card{position:relative;background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;overflow:hidden}
.num{position:absolute;top:0;left:0;background:var(--tab);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:0 0 10px 0;font-variant-numeric:tabular-nums}
.card h3{font-size:17px;margin:6px 0 10px}
.words{display:flex;flex-direction:column;gap:10px}
.w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.w .k{font-size:17px;font-weight:600;cursor:pointer;border:0;background:none;padding:0}
.w .k:hover{color:var(--blue)}
.w .r{font-size:13px;color:var(--sub)}
.pos{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--t2);color:var(--sub)}
.w .zh{font-size:15px;color:var(--sub);flex-basis:100%}
.ex{margin-top:14px;padding:12px 14px;background:var(--t1);border-radius:12px;font-size:15px}
.ex .jp2{line-height:2.1}
.ex .t{color:var(--sub);font-size:13px;margin-top:4px}

/* ---------- article list ---------- */
.alist{display:block;width:100%;border:0;text-align:left;cursor:pointer;transition:transform .15s ease}
.alist:hover{transform:translateY(-2px)}
.alist h3{font-size:19px;margin:8px 0 4px}
.alist .sum{font-size:14px;color:var(--sub);margin:0 0 12px}
.alist .stat{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.alist .stat span{background:var(--greige);color:var(--pager-t);border-radius:999px;padding:2px 9px;font-weight:600}
.plan{font-size:12px;color:var(--sub);text-align:center;margin-top:18px}

/* ---------- article reader ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:0;font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--greige);color:var(--pager-t)}
.tog.on{background:linear-gradient(#34343a,#0e0e10);color:var(--gold)}
.reader p.jp{font-size:18px;line-height:2.2;margin:0;letter-spacing:.02em}
.reader .para + .para{margin-top:22px}
.reader .zh{font-size:15px;color:var(--sub);margin:8px 0 0;line-height:1.6;padding-left:12px;border-left:2px solid var(--line)}
ruby rt{font-size:.52em;color:var(--sub);letter-spacing:0;font-weight:400}
.nofuri ruby rt{visibility:hidden}
.gp{background:var(--cp-bg);color:var(--cp-t);border-radius:4px;padding:1px 2px}
.gp rt{color:var(--cp-t);opacity:.8}
[data-g]{cursor:pointer}
.gq{border-radius:4px;padding:1px 2px}
.gp.flash,.gq.flash{animation:flashT 1.8s ease}
@keyframes flashT{0%,40%{box-shadow:0 0 0 2px var(--blue)}100%{box-shadow:0 0 0 2px transparent}}
.gitem{border-radius:14px;padding:4px 8px;margin:0 -8px}
.gitem + .gitem{margin-top:14px;padding-top:16px;border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.gitem.flash{animation:flashBg 1.8s ease}
@keyframes flashBg{0%,40%{background:var(--chip)}100%{background:transparent}}
.ghead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gnum{font-size:12px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;min-width:1.4em}
.gpat{font-size:18px;font-weight:600;color:var(--cp-t);line-height:2}
.gm{font-size:14px;color:var(--sub);min-width:0}
.gback{margin-left:auto;border:0;background:var(--greige);color:var(--pager-t);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.gex{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gex li{background:var(--t1);border-radius:12px;padding:8px 14px}
.gex .jp{font-size:16px;line-height:2.1}
.gex .z{font-size:13px;color:var(--sub);line-height:1.5;padding-bottom:2px}
@media (prefers-reduced-motion:reduce){.gitem.flash,.gp.flash,.gq.flash{animation:none}}
.sec{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:0 0 12px}
.glist{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;align-items:baseline}
.glist dt{font-weight:600;color:var(--cp-t);white-space:nowrap}
.glist dd{margin:0;color:var(--sub);min-width:0}
.vlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
@media (max-width:520px){.vlist{grid-template-columns:1fr}}
.vlist div{font-size:15px}
.vlist b{font-weight:600}
.vlist .r{font-size:12.5px;color:var(--sub);margin-left:6px}
.vlist .z{display:block;font-size:13px;color:var(--sub)}
.next{display:flex;justify-content:space-between;gap:10px}
.next button{border:0;background:var(--greige);color:var(--pager-t);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.next button:disabled{opacity:.4;cursor:default}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.bar .back{margin:0;flex:none}
.ws{position:relative;flex:0 1 220px;min-width:0}
.ws-box{position:relative}
.ws-in{width:100%;padding-right:32px}
.ws-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:var(--chip);color:var(--blue);font-size:15px;line-height:22px;padding:0}
.ws-pop{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));max-height:min(60vh,460px);overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:30;padding:6px 0;text-align:left}
.ws-item{padding:10px 16px}
.ws-item + .ws-item{border-top:1px solid var(--line)}
.ws-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ws-w{font-size:17px;font-weight:600}
.ws-r{font-size:13px;color:var(--sub)}
.ws-o{font-size:12px;color:var(--sub)}
.ws-tags{margin-left:auto;display:flex;gap:4px}
.ws-lv{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--greige);color:var(--pager-t)}
.ws-m{font-size:14px;color:var(--sub);margin-top:2px;line-height:1.45}
.ws-msg{padding:12px 16px;font-size:13px;color:var(--sub)}
.ws-net{padding:8px 16px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
.ws-net a{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--blue);text-decoration:none}
.ws-net a:hover{background:var(--greige)}
.syn-chips{margin-top:10px}
.pagerow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.pagerow .meta{margin:0}
.pagerow.bottom{margin:4px 0 0}
.pager{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--pager-t);font-variant-numeric:tabular-nums;flex:none}
.pager button{border:0;background:var(--greige);color:var(--pager-t);border-radius:999px;width:32px;height:28px;font-weight:700;font-size:15px;line-height:1}
.pager button:disabled{opacity:.35;cursor:default}
.wrow{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px 10px;margin:0 -10px;width:calc(100% + 20px)}
.wrow:hover{background:var(--t2)}
.wrow.on{background:var(--chip)}
.wrow.on .k{color:var(--blue)}
.wrow .wz{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.words{gap:2px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.exl{font-size:12px;font-weight:600;color:var(--blue)}
.play{width:28px;height:28px;border-radius:50%;border:0;background:linear-gradient(#34343a,#0e0e10);color:var(--gold);font-size:10px;flex:none}
.credit{margin-top:28px;font-size:11px;color:var(--sub);text-align:center}
@media (max-width:520px){.hero .ws{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.tile,.alist{transition:none}.tile:hover,.alist:hover{transform:none}}
</style>

</head>
<body>
<div id="app" class="wrap">

  <!-- ===== HOME ===== -->
  <template v-if="route==='home'">
    <div class="hero">
      <div>
        <div class="name">Goen Kon</div>
        <h1>Japanese Learning</h1>
        <div class="goal">目标 <span class="badge">JLPT N2</span></div>
      </div>
      <word-search></word-search>
    </div>

    <div class="grid">
      <button class="tile" @click="go('syn')">
        <h2>同义词</h2>
        <span class="jp">類義語</span>
        <p class="desc">意思相近的词放在一起，分清细微差别和用法。</p>
        <div class="peek"><span class="chip" v-for="g in synonyms.slice(0,3)" :key="g.title">{{ g.words[0].k }}</span></div>
        <span class="count">{{ synonyms.length }} 组 · 持续更新中</span>
      </button>
      <button class="tile" @click="go('art')">
        <h2>文章</h2>
        <span class="jp">読解</span>
        <p class="desc">N2 读解文章，汉字上方注假名，读着读着把语法和词汇连起来。</p>
        <div class="peek"><span class="chip" v-for="a in articles.slice(0,4)" :key="a.title">{{ a.short }}</span></div>
        <span class="count">{{ articles.length }} 篇 · 覆盖 N2 语法 {{ coveredGrammar }} 条</span>
      </button>
      <button class="tile wide" @click="go('gram')">
        <h2>语法</h2>
        <span class="jp">文法</span>
        <p class="desc">N2 文型：接续、意思、例句，附易混辨析。</p>
        <div class="peek"><span class="chip" v-for="g in grammar.slice(0,4)" :key="g.p">{{ plain(g.p) }}</span></div>
        <span class="count">{{ grammar.length }} 条 N2 文型 · 示例</span>
      </button>
    </div>
    <p class="credit">词典数据：JMdict（EDRDG）· CC BY-SA 4.0</p>
  </template>

  <!-- ===== SYNONYMS ===== -->
  <template v-else-if="route==='syn'">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('home')">‹ 返回</button><word-search></word-search></div>
      <h1>同义词 · 類義語</h1>
      <input id="q2" class="search" style="width:100%" v-model="q" placeholder="筛选同义词（单词 / 读音 / 中文）">
      <div class="chips syn-chips">
        <button :class="{on:synCat==='all'}" @click="synCat='all'">全部 {{ synonyms.length }}</button>
        <button v-for="(n,c) in catCounts" :key="c" :class="{on:synCat===c}" @click="synCat=c">{{ synCats[c] }} {{ n }}</button>
      </div>
      <div class="pagerow">
        <span class="meta">{{ filteredSyn.length }} 组 · 点击单词切换例句</span>
      <div class="pager" v-if="synPages>1">
        <button :disabled="synPage===1" @click="setPage(synPage-1)" aria-label="上一页">‹</button>
        <span>{{ synPage }} / {{ synPages }}</span>
        <button :disabled="synPage===synPages" @click="setPage(synPage+1)" aria-label="下一页">›</button>
      </div>
      </div>
    </div>
    <div class="card" v-for="(g,i) in pagedSyn" :key="g.title">
      <span class="num">{{ (synPage-1)*10+i+1 }}</span>
      <h3>{{ g.title }}</h3>
      <div class="words">
        <button class="wrow" v-for="(w,j) in g.words" :key="w.k" :class="{on:selIdx(g)===j}" @click="pick(g,j)">
          <span class="w"><span class="k">{{ w.k }}</span><span class="r">{{ w.r }}</span><span class="pos">{{ w.pos }}</span></span>
          <span class="wz">{{ w.zh }}</span>
        </button>
      </div>
      <div class="ex">
        <div class="exh"><span class="exl">例句 · {{ cur(g).k }}</span><button class="play" @click="sayEx(cur(g).ex)" aria-label="朗读例句">▶</button></div>
        <div class="jp2" v-html="render(cur(g).ex)"></div><div class="t">{{ cur(g).exZh }}</div>
      </div>
    </div>
    <p class="plan" v-if="!filteredSyn.length">没有找到相关的同义词。</p>
    <div class="pagerow bottom" v-if="synPages>1"><span></span><div class="pager" v-if="synPages>1">
        <button :disabled="synPage===1" @click="setPage(synPage-1)" aria-label="上一页">‹</button>
        <span>{{ synPage }} / {{ synPages }}</span>
        <button :disabled="synPage===synPages" @click="setPage(synPage+1)" aria-label="下一页">›</button>
      </div></div>
  </template>

  <!-- ===== ARTICLE LIST ===== -->
  <template v-else-if="route==='art'">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('home')">‹ 返回</button><word-search></word-search></div>
      <h1>文章 · 読解</h1>
      <div class="meta">{{ articles.length }} 篇 · 已覆盖 {{ coveredGrammar }} 条 N2 语法</div>
    </div>
    <button class="card alist" v-for="(a,i) in articles" :key="a.title" @click="go('a/'+i)">
      <span class="num">{{ i+1 }}</span>
      <h3 v-html="rb(a.title)"></h3>
      <p class="sum">{{ a.sum }}</p>
      <div class="stat">
        <span>{{ stars(a.lv) }}</span>
        <span>约 {{ charCount(a) }} 字</span>
        <span>语法 {{ a.grammar.length }} 条</span>
        <span>词汇 {{ a.vocab.length }} 个</span>
      </div>
    </button>
    <p class="plan">从易到难排列：入门 → 标准 → 偏难。每条 N2 语法至少在两篇文章里出现。</p>
  </template>

  <!-- ===== ARTICLE READER ===== -->
  <template v-else-if="route==='a' && art">
    <div class="sticky">
      <div class="bar"><button class="back" @click="go('art')">‹ 返回</button><word-search></word-search></div>
      <h1 v-html="rb(art.title)"></h1>
      <div class="tools">
        <button class="tog" :class="{on:furi}" @click="furi=!furi">假名</button>
        <button class="tog" :class="{on:showZh}" @click="showZh=!showZh">中文翻译</button>
        <button class="tog" :class="{on:hiGram}" @click="hiGram=!hiGram">标出语法</button>
      </div>
      <div class="meta">单击语法：填入查词框 · 双击语法：跳到下方讲解</div>
    </div>

    <div class="card reader" :class="{nofuri:!furi}" @click="tapGram">
      <div class="para" v-for="(p,i) in art.paras" :key="i">
        <p class="jp" v-html="render(p.jp, gBase(i))"></p>
        <p class="zh" v-if="showZh">{{ p.zh }}</p>
      </div>
    </div>

    <div class="card" :class="{nofuri:!furi}">
      <p class="sec">本文 N2 语法 · {{ art.grammar.length }}</p>
      <div class="gitem" v-for="(g,i) in art.grammar" :key="g[0]" :id="'g-'+i" :class="{flash:flashG===i}">
        <div class="ghead">
          <span class="gnum">{{ i+1 }}</span>
          <span class="gpat" v-html="rb(g[0])"></span>
          <span class="gm">{{ g[1] }}</span>
          <button class="gback" @click="toText(i)">回到原文 ↑</button>
        </div>
        <ul class="gex">
          <li><div class="jp" v-html="render(g[2])"></div><div class="z">{{ g[3] }}</div></li>
          <li><div class="jp" v-html="render(g[4])"></div><div class="z">{{ g[5] }}</div></li>
        </ul>
      </div>
    </div>

    <div class="card">
      <p class="sec">重点词汇 · {{ art.vocab.length }}</p>
      <div class="vlist">
        <div v-for="v in art.vocab" :key="v[0]"><b>{{ v[0] }}</b><span class="r">{{ v[1] }}</span><span class="z">{{ v[2] }}</span></div>
      </div>
    </div>

    <div class="next">

{"title":"市立図書館(しりつとしょかん)の利用案内(りようあんない)","paras":[{"jp":"当館(とうかん)は、市民(しみん)[[を始(はじ)め]]、市内(しない)に通勤(つうきん)・通学(つうがく)して居(い)る方(かた)であれば、年齢(ねんれい)[[を問(と)わず]]、どなたでも御(ご)利用(りよう)頂(いただ)けます。","zh":"本馆面向本市市民，以及在市内上班、上学的人，不论年龄，任何人都可以使用。"},{"jp":"図書(としょ)の貸(か)し出(だ)しには利用者(りようしゃ)カードが必要(ひつよう)です。カードを作成(さくせい)する[[に当(あ)たって]]は、住所(じゅうしょ)を確認(かくにん)出来(でき)る書類(しょるい)を御(ご)持参(じさん)下(くだ)さい。","zh":"借书需要借书卡。办理借书卡时，请携带能确认住址的证件。"},{"jp":"開館(かいかん)時間(じかん)は午前(ごぜん)九時(くじ)から午後(ごご)八時(はちじ)迄(まで)です。月曜日(げつようび)[[を除(のぞ)いて]]毎日(まいにち)開館(かいかん)して居(お)りますが、月曜日(げつようび)が祝日(しゅくじつ)の場合(ばあい)は開館(かいかん)し、翌日(よくじつ)を休館日(きゅうかんび)と致(いた)します。","zh":"开馆时间为上午9点到晚上8点。除周一外每天开馆；周一若是节假日则照常开馆，改为次日闭馆。"},{"jp":"一度(いちど)に借(か)りられるのは一人(ひとり)[[に付(つ)き]]十冊(じゅっさつ)迄(まで)、期間(きかん)は二週間(にしゅうかん)です。返却(へんきゃく)期限(きげん)を過(す)ぎた場合(ばあい)、本(ほん)が返(かえ)され[[ない限(かぎ)り]]、新(あら)たに借(か)りる事(こと)は出来(でき)ません。","zh":"每人每次最多借10本，借期两周。超过归还期限时，只要书没有还回来，就不能再借新书。"},{"jp":"予約(よやく)した本(ほん)が届(とど)き[[次第(しだい)]]、メールで御(ご)連絡(れんらく)致(いた)します。連絡(れんらく)を受(う)けてから一週間(いっしゅうかん)以内(いない)に御(お)受(う)け取(と)り下(くだ)さい。","zh":"预约的书一到，我们会马上发邮件通知您。请在收到通知后一周内来取。"},{"jp":"館内(かんない)での飲食(いんしょく)は禁止(きんし)されて居(い)ますが、蓋(ふた)の付(つ)いた飲(の)み物(もの)であれば、休憩室(きゅうけいしつ)で飲(の)んで[[も差(さ)し支(つか)えありません]]。携帯電話(けいたいでんわ)は、マナーモードに設定(せってい)した[[上(うえ)で]]御(ご)使用(しよう)下(くだ)さい。","zh":"馆内禁止饮食，但带盖的饮料可以在休息室饮用。手机请调成静音模式后再使用。"},{"jp":"尚(なお)、蔵書(ぞうしょ)点検(てんけん)[[に先立(さきだ)って]]、年末(ねんまつ)は一週間(いっしゅうかん)程(ほど)休館(きゅうかん)致(いた)します。又(また)、今月(こんげつ)[[に限(かぎ)り]]、新(あら)たにカードを作(つく)った方(かた)には、記念(きねん)の栞(しおり)を差(さ)し上(あ)げて居(お)ります。","zh":"另外，在藏书清点之前，年底将闭馆一周左右。此外，仅限本月，新办卡的读者可获赠纪念书签。"},{"jp":"当館(とうかん)は、市(し)の方針(ほうしん)[[に沿(そ)って]]、来年度(らいねんど)から電子書籍(でんししょせき)の貸(か)し出(だ)しも始(はじ)める予定(よてい)です。皆様(みなさま)の御(ご)意見(いけん)[[に基(もと)づいて]]、サービスを更(さら)に充実(じゅうじつ)させて行(い)きたいと考(かんが)えて居(お)ります。","zh":"本馆将按照市里的方针，从下一年度开始提供电子书借阅。我们希望根据大家的意见，进一步充实各项服务。"}],"grammar":[["〜を始(はじ)め","以……为首，……以及","東京(とうきょう)[[を始(はじ)め]]、大阪(おおさか)や名古屋(なごや)等(など)の大都市(だいとし)でも家賃(やちん)が上(あ)がって居(い)る。","以东京为首，大阪、名古屋等大城市的房租也在上涨。","社長(しゃちょう)[[を始(はじ)め]]、社員(しゃいん)全員(ぜんいん)が式(しき)に出席(しゅっせき)した。","以社长为首，全体员工都出席了仪式。"],["〜を問(と)わず","不论……，不管……","この仕事(しごと)は経験(けいけん)の有無(うむ)[[を問(と)わず]]、誰(だれ)でも応募(おうぼ)出来(でき)ます。","这份工作不论有无经验，谁都可以应聘。","この公園(こうえん)は、季節(きせつ)[[を問(と)わず]]多(おお)くの人(ひと)で賑(にぎ)わう。","这个公园不论什么季节都很热闹。"],["〜に当(あ)たって","在……之际（郑重的场合）","新(あたら)しい生活(せいかつ)を始(はじ)める[[に当(あ)たって]]、必要(ひつよう)な物(もの)を揃(そろ)えた。","开始新生活之际，把需要的东西都备齐了。","卒業(そつぎょう)[[に当(あ)たって]]、先生方(せんせいがた)に感謝(かんしゃ)の手紙(てがみ)を書(か)いた。","毕业之际，给老师们写了感谢信。"],["〜を除(のぞ)いて","除了……","日曜日(にちようび)[[を除(のぞ)いて]]、毎日(まいにち)アルバイトをして居(い)る。","除了周日，我每天都在打工。","一人(ひとり)[[を除(のぞ)いて]]、全員(ぜんいん)が試験(しけん)に合格(ごうかく)した。","除了一个人，大家都通过了考试。"],["〜に付(つ)き","每……；因为……（告示用语）","駐車料金(ちゅうしゃりょうきん)は一時間(いちじかん)[[に付(つ)き]]三百円(さんびゃくえん)です。","停车费每小时300日元。","工事中(こうじちゅう)[[に付(つ)き]]、この入口(いりぐち)は御(ご)利用(りよう)頂(いただ)けません。","因正在施工，此入口暂停使用。"],["〜ない限(かぎ)り","只要不……就（不）……","雨(あめ)が降(ふ)ら[[ない限(かぎ)り]]、試合(しあい)は予定(よてい)通(どお)り行(おこな)います。","只要不下雨，比赛就按计划进行。","自分(じぶん)で努力(どりょく)し[[ない限(かぎ)り]]、日本語(にほんご)は上達(じょうたつ)しない。","只要自己不努力，日语就不会进步。"],["〜次第(しだい)","一……就马上……","荷物(にもつ)が届(とど)き[[次第(しだい)]]、御(ご)連絡(れんらく)します。","货一到就联系您。","準備(じゅんび)が出来(でき)[[次第(しだい)]]、出発(しゅっぱつ)しましょう。","准备好了就出发吧。"],["〜ても差(さ)し支(つか)えない","……也没关系，可以……","用事(ようじ)が済(す)んだら、帰(かえ)って[[も差(さ)し支(つか)えありません]]。","事情办完的话，可以回去了。","申込書(もうしこみしょ)は鉛筆(えんぴつ)で書(か)いて[[も差(さ)し支(つか)えない]]そうだ。","听说申请表用铅笔写也没关系。"],["〜た上(うえ)で","在……之后（再做）","両親(りょうしん)と相談(そうだん)した[[上(うえ)で]]、進学先(しんがくさき)を決(き)めます。","和父母商量之后再决定升学去向。","契約書(けいやくしょ)を良(よ)く読(よ)んだ[[上(うえ)で]]、署名(しょめい)して下(くだ)さい。","请仔细阅读合同之后再签名。"],["〜に先立(さきだ)って","在……之前（先做）","試合(しあい)[[に先立(さきだ)って]]、開会式(かいかいしき)が行(おこな)われた。","比赛之前举行了开幕式。","新製品(しんせいひん)の発売(はつばい)[[に先立(さきだ)って]]、説明会(せつめいかい)を開(ひら)く。","新产品发售之前先举办说明会。"],["〜に限(かぎ)り","仅限……","本日(ほんじつ)[[に限(かぎ)り]]、全品(ぜんぴん)二割引(にわりびき)です。","仅限今天，全部商品打八折。","学生証(がくせいしょう)を持(も)って居(い)る方(かた)[[に限(かぎ)り]]、入場(にゅうじょう)無料(むりょう)です。","仅限持学生证者免费入场。"],["〜に沿(そ)って","沿着……；按照……","川(かわ)[[に沿(そ)って]]桜(さくら)の木(き)が植(う)えられて居(い)る。","沿着河边种着樱花树。","マニュアル[[に沿(そ)って]]作業(さぎょう)を進(すす)めて下(くだ)さい。","请按照操作手册进行作业。"],["〜に基(もと)づいて","根据……，基于……","調査(ちょうさ)の結果(けっか)[[に基(もと)づいて]]、報告書(ほうこくしょ)を作成(さくせい)した。","根据调查结果写了报告。","この映画(えいが)は実話(じつわ)[[に基(もと)づいて]]作(つく)られた。","这部电影是根据真实故事拍摄的。"]],"vocab":[["利用案内","りようあんない","使用须知"],["通勤","つうきん","上下班"],["貸し出し","かしだし","出借"],["持参","じさん","带来，自带"],["祝日","しゅくじつ","节日，法定假日"],["翌日","よくじつ","第二天"],["返却","へんきゃく","归还"],["期限","きげん","期限"],["迷惑","めいわく","麻烦，打扰"],["蓋","ふた","盖子"],["蔵書","ぞうしょ","藏书"],["点検","てんけん","检查，清点"],["方針","ほうしん","方针"],["充実","じゅうじつ","充实"]],"short":"図書館","lv":1,"sum":"一份图书馆使用须知，练习告示、通知类文章里常见的正式表达。"},
{"title":"アルバイト先(さき)で学(まな)んだ敬語(けいご)","paras":[{"jp":"日本(にほん)に来(き)て半年(はんとし)程(ほど)経(た)った頃(ころ)、私(わたし)は駅前(えきまえ)のカフェでアルバイトを始(はじ)めた。日本語学校(にほんごがっこう)で敬語(けいご)を習(なら)って居(い)たので、少(すこ)しは自信(じしん)が有(あ)った。然(しか)し、教科書(きょうかしょ)で覚(おぼ)えた[[からと言(い)って]]、実際(じっさい)に使(つか)い熟(こな)せる[[訳(わけ)ではない]]。","zh":"来日本大约半年时，我开始在车站前的咖啡店打工。在日语学校学过敬语，所以多少有点自信。但是，课本上背过，并不代表实际中就能运用自如。"},{"jp":"初日(しょにち)は緊張(きんちょう)の余(あま)り、「いらっしゃいませ」[[さえ]]上手(うま)く言(い)えなかった。御(お)客様(きゃくさま)に「こちらで召(め)し上(あ)がりますか」と聞(き)く積(つ)もりが、「こちらで頂(いただ)きますか」と言(い)って仕舞(しま)い、店長(てんちょう)に注意(ちゅうい)された。尊敬語(そんけいご)と謙譲語(けんじょうご)を間違(まちが)えたのだ。恥(は)ずかしくて[[堪(たま)らなかった]]。","zh":"第一天太紧张，连\"欢迎光临\"都说不好。我本想问客人\"您在这里用餐吗\"，结果却说成了\"我在这里吃吗\"，被店长提醒了。我把尊敬语和自谦语弄混了。真是羞得不行。"},{"jp":"店長(てんちょう)は厳(きび)しい[[反面(はんめん)]]、面倒見(めんどうみ)の良(よ)い人(ひと)で、仕事(しごと)が終(お)わった後(あと)、毎日(まいにち)の様(よう)に敬語(けいご)の練習(れんしゅう)に付(つ)き合(あ)って呉(く)れた。「実際(じっさい)に口(くち)に出(だ)して練習(れんしゅう)して[[からでないと]]、身(み)に付(つ)かないよ」と店長(てんちょう)は言(い)った。","zh":"店长很严格，但另一方面又很会照顾人，下班后几乎每天都陪我练习敬语。\"不实际说出口练习，是学不会的哦。\"店长这样说。"},{"jp":"練習(れんしゅう)を続(つづ)けて居(い)る[[うちに]]、少(すこ)し宛(ずつ)自然(しぜん)な敬語(けいご)が口(くち)から出(で)る様(よう)に成(な)った。三(さん)箇(か)月(げつ)後(ご)には、常連(じょうれん)の御(お)客様(きゃくさま)から「日本語(にほんご)、上手(じょうず)に成(な)ったね」と褒(ほ)められ、思(おも)わず笑顔(えがお)に成(な)ら[[ずにはいられなかった]]。","zh":"坚持练习的过程中，自然的敬语渐渐能脱口而出了。三个月后，常来的客人夸我\"日语变好了呢\"，我忍不住露出了笑容。"},{"jp":"或(あ)る日(ひ)、年配(ねんぱい)の女性(じょせい)が道(みち)に迷(まよ)って店(みせ)に入(はい)って来(き)た。私(わたし)が丁寧(ていねい)に道(みち)を説明(せつめい)した[[許(ばか)りか]]、地図(ちず)迄(まで)書(か)いて渡(わた)すと、その方(かた)は「外国(がいこく)の方(かた)[[にしては]]、本当(ほんとう)に綺麗(きれい)な日本語(にほんご)ね」と言(い)って下(くだ)さった。","zh":"有一天，一位年长的女士迷了路走进店里。我不仅仔细地给她指了路，还画了地图交给她，她说：\"作为外国人，你的日语说得真漂亮啊。\""},{"jp":"嬉(うれ)しい[[事(こと)に]]、その方(かた)はその後(ご)も時々(ときどき)店(みせ)に来(き)て下(くだ)さる様(よう)に成(な)った。敬語(けいご)が苦手(にがて)だった私(わたし)だが、今(いま)では苦手(にがて)[[どころか]]、敬語(けいご)を使(つか)うのが楽(たの)しくて[[仕方(しかた)が無(な)い]]。","zh":"令人高兴的是，那位女士之后也时常来店里。我曾经很不擅长敬语，现在别说怕了，反而觉得用敬语特别有意思。"},{"jp":"今(いま)でも、新人(しんじん)のアルバイトが敬語(けいご)で失敗(しっぱい)するのを見(み)る[[につけ]]、あの頃(ころ)の自分(じぶん)を思(おも)い出(だ)す。敬語(けいご)は相手(あいて)を大切(たいせつ)に思(おも)う気持(きも)ちの表(あらわ)れなのだと、今(いま)なら分(わ)かる。","zh":"现在，每当看到新来的打工者在敬语上出错，就会想起当时的自己。如今我明白了，敬语是珍视对方这份心意的体现。"}],"grammar":[["〜からと言(い)って","虽说……但（不能因此就……）","値段(ねだん)が安(やす)い[[からと言(い)って]]、質(しつ)が悪(わる)いとは限(かぎ)らない。","不能因为价格便宜，就说质量一定差。","忙(いそが)しい[[からと言(い)って]]、食事(しょくじ)を抜(ぬ)くのは良(よ)くない。","虽说很忙，也不该不吃饭。"],["〜訳(わけ)ではない","并不是……","肉(にく)が嫌(きら)いな[[訳(わけ)ではない]]が、毎日(まいにち)は食(た)べたくない。","并不是讨厌吃肉，只是不想每天都吃。","日本(にほん)に住(す)んで居(い)れば、誰(だれ)でも日本語(にほんご)が話(はな)せる[[訳(わけ)ではない]]。","并不是住在日本，谁都会说日语。"],["〜さえ","连……都","忙(いそが)しくて、昼御飯(ひるごはん)を食(た)べる時間(じかん)[[さえ]]無(な)い。","忙得连吃午饭的时间都没有。","子供(こども)で[[さえ]]知(し)って居(い)る事(こと)を、大人(おとな)が知(し)らないのは恥(は)ずかしい。","连小孩都知道的事，大人却不知道，真丢人。"],["〜て堪(たま)らない","……得受不了，非常……","試験(しけん)の結果(けっか)が気(き)に成(な)って[[堪(たま)らない]]。","特别在意考试的结果。","今日(きょう)は暑(あつ)くて[[堪(たま)らない]]。","今天热得受不了。"],["〜反面(はんめん)","另一方面……（同一事物的两面）","都会(とかい)の生活(せいかつ)は便利(べんり)な[[反面(はんめん)]]、物価(ぶっか)が高(たか)い。","城市生活很方便，但另一方面物价高。","彼(かれ)は仕事(しごと)には厳(きび)しい[[反面(はんめん)]]、家庭(かてい)では優(やさ)しい父親(ちちおや)だ。","他对工作很严格，但在家里是个温柔的父亲。"],["〜てからでないと","不先……就不能……","説明書(せつめいしょ)を読(よ)んで[[からでないと]]、この機械(きかい)は使(つか)えない。","不先看说明书，就用不了这台机器。","実物(じつぶつ)を見(み)て[[からでないと]]、買(か)うかどうか決(き)められない。","不先看到实物，就没法决定买不买。"],["〜うちに","趁……；在……的过程中","若(わか)い[[うちに]]、色々(いろいろ)な国(くに)へ行(い)って見(み)たい。","想趁年轻去各种国家看看。","話(はな)して居(い)る[[うちに]]、彼(かれ)の事(こと)が好(す)きに成(な)った。","聊着聊着就喜欢上他了。"],["〜ずにはいられない","忍不住……，不由得……","その映画(えいが)を見(み)て、泣(な)か[[ずにはいられなかった]]。","看了那部电影，忍不住哭了。","困(こま)って居(い)る人(ひと)を見(み)ると、助(たす)け[[ずにはいられない]]。","看到有困难的人，就忍不住要帮忙。"],["〜許(ばか)りか","不仅……而且……","彼(かれ)は英語(えいご)[[許(ばか)りか]]、フランス語(ご)も話(はな)せる。","他不仅会英语，还会说法语。","薬(くすり)を飲(の)んだが、治(なお)らない[[許(ばか)りか]]、更(さら)に悪(わる)く成(な)った。","吃了药，不但没好，反而更严重了。"],["〜にしては","作为……来说（却）","初(はじ)めて作(つく)った[[にしては]]、良(よ)く出来(でき)て居(い)る。","作为第一次做的来说，做得相当好。","彼(かれ)は小学生(しょうがくせい)[[にしては]]背(せ)が高(たか)い。","作为小学生，他个子算高的。"],["〜事(こと)に","令人……的是","驚(おどろ)いた[[事(こと)に]]、彼(かれ)は一人(ひとり)で全部(ぜんぶ)片付(かたづ)けて仕舞(しま)った。","令人吃惊的是，他一个人全都收拾完了。","残念(ざんねん)な[[事(こと)に]]、雨(あめ)で花火大会(はなびたいかい)は中止(ちゅうし)に成(な)った。","遗憾的是，烟花大会因为下雨取消了。"],["〜どころか","别说……，反而……","貯金(ちょきん)する[[どころか]]、借金(しゃっきん)が増(ふ)えて仕舞(しま)った。","别说存钱了，反而欠了更多债。","彼(かれ)は謝(あやま)る[[どころか]]、怒(おこ)り出(だ)した。","他不但不道歉，反而发起火来。"],["〜て仕方(しかた)が無(な)い","……得不得了","一人(ひとり)暮(ぐ)らしを始(はじ)めた頃(ころ)は、寂(さび)しくて[[仕方(しかた)が無(な)かった]]。","刚开始一个人生活时，寂寞得不得了。","明日(あした)の旅行(りょこう)が楽(たの)しみで[[仕方(しかた)が無(な)い]]。","特别期待明天的旅行。"],["〜につけ","每当……就……","この写真(しゃしん)を見(み)る[[につけ]]、学生(がくせい)時代(じだい)を思(おも)い出(だ)す。","每当看到这张照片，就会想起学生时代。","祖母(そぼ)の料理(りょうり)を食(た)べる[[につけ]]、故郷(ふるさと)が懐(なつ)かしく成(な)る。","每次吃奶奶做的菜，都会怀念故乡。"]],"vocab":[["使い熟す","つかいこなす","运用自如"],["召し上がる","めしあがる","吃，喝（尊敬语）"],["尊敬語","そんけいご","尊敬语"],["謙譲語","けんじょうご","自谦语"],["面倒見","めんどうみ","照顾人"],["付き合う","つきあう","陪伴，交往"],["身に付く","みにつく","掌握，学到手"],["常連","じょうれん","常客"],["褒める","ほめる","表扬，夸奖"],["年配","ねんぱい","年长"],["丁寧","ていねい","礼貌；仔细"],["苦手","にがて","不擅长"],["新人","しんじん","新人"],["表れ","あらわれ","体现，表现"]],"short":"敬語","lv":1,"sum":"在咖啡店打工的留学生，从说错敬语被提醒，到被客人夸奖的经历。"},
{"title":"初(はじ)めての富士登山(ふじとざん)","paras":[{"jp":"去年(きょねん)の夏(なつ)、友人(ゆうじん)三人(さんにん)と富士山(ふじさん)に登(のぼ)った。日本一(にほんいち)高(たか)い山(やま)だから、準備(じゅんび)は念入(ねんい)りにする[[に越(こ)した事(こと)はない]]と思(おも)い、一(いっ)箇(か)月(げつ)前(まえ)から毎朝(まいあさ)走(はし)って体力(たいりょく)を付(つ)けた。","zh":"去年夏天，我和三个朋友一起爬了富士山。因为是日本最高的山，我想准备得越充分越好，就从一个月前开始每天早上跑步锻炼体力。"},{"jp":"五合目(ごごうめ)でバスを降(お)りた[[途端(とたん)]]、空気(くうき)の冷(つめ)たさに驚(おどろ)いた。麓(ふもと)は三十度(さんじゅうど)を超(こ)える暑(あつ)さだったのに、ここでは上着(うわぎ)が必要(ひつよう)な程(ほど)だ。","zh":"在五合目一下巴士，就被冷空气吓了一跳。山脚明明是超过30度的高温，这里却冷到需要穿外套。"},{"jp":"登(のぼ)り始(はじ)めて暫(しばら)くは景色(けしき)を楽(たの)しむ余裕(よゆう)も有(あ)ったが、七合目(ななごうめ)を過(す)ぎた頃(ころ)から、空気(くうき)が薄(うす)い[[所為(せい)か]]、頭(あたま)が痛(いた)く成(な)って来(き)た。少(すこ)し歩(ある)いては休(やす)み、休(やす)んだ[[かと思(おも)うと]]又(また)歩(ある)き出(だ)す、その繰(く)り返(かえ)しだった。","zh":"刚开始的一段时间还有余裕欣赏风景，过了七合目以后，也许是空气稀薄的缘故，头开始疼起来。走一会儿就休息，刚休息了一下又接着走，就这样反反复复。"},{"jp":"八合目(はちごうめ)の山小屋(やまごや)で休(やす)んで居(い)る[[最中(さいちゅう)に]]、急(きゅう)に雨(あめ)が降(ふ)り出(だ)した。友人(ゆうじん)の一人(ひとり)は「もう無理(むり)だ」と言(い)い[[掛(か)けた]]が、皆(みんな)で励(はげ)まし合(あ)って、何(なん)とか頑張(がんば)った。","zh":"正在八合目的山间小屋休息时，突然下起雨来。一个朋友刚要说\"我不行了\"，大家互相鼓励，总算坚持了下来。"},{"jp":"夜中(よなか)に出発(しゅっぱつ)し、何度(なんど)も足(あし)を止(と)めた[[末(すえ)に]]、遂(つい)に山頂(さんちょう)に辿(たど)り着(つ)いた。雲(くも)の上(うえ)から昇(のぼ)る朝日(あさひ)は、言葉(ことば)では表現(ひょうげん)し[[様(よう)が無(な)い]]程(ほど)美(うつく)しかった。皆(みんな)、暫(しばら)く黙(だま)ってその光景(こうけい)を見詰(みつ)めて居(い)た。","zh":"半夜出发，几次停下脚步之后，终于到达了山顶。从云海上升起的朝阳美得无法用语言形容。大家都沉默着，凝视了那景色好一会儿。"},{"jp":"下山(げざん)は登(のぼ)り[[程(ほど)]]辛(つら)くないだろうと思(おも)って居(い)たが、大間違(おおまちが)いだった。三時間(さんじかん)も砂利道(じゃりみち)を下(くだ)り続(つづ)け、膝(ひざ)は震(ふる)えっ[[放(ぱな)し]]だった。道(みち)を間違(まちが)えて散々(さんざん)歩(ある)いた[[挙句(あげく)]]、元(もと)の場所(ばしょ)に戻(もど)って仕舞(しま)う一幕(ひとまく)も有(あ)った。","zh":"我原以为下山不像上山那么辛苦，结果大错特错。在砂石路上连续下了三个小时，膝盖一直在发抖。还发生了走错路、绕了半天最后又回到原地的插曲。"},{"jp":"麓(ふもと)に着(つ)いた時(とき)、体(からだ)は疲(つか)れ[[切(き)って]]居(い)たが、最後(さいご)迄(まで)歩(ある)き[[抜(ぬ)いた]]と言(い)う達成感(たっせいかん)で一杯(いっぱい)だった。「二度(にど)と登(のぼ)る[[物(もの)か]]」と言(い)って居(い)た友人(ゆうじん)も、今(いま)では「来年(らいねん)も行(い)こう」と言(い)って居(い)る。あの朝日(あさひ)は、一生(いっしょう)忘(わす)れ[[難(がた)い]]思(おも)い出(で)に成(な)った。","zh":"回到山脚时，身体已经筋疲力尽，心里却满是坚持走到最后的成就感。那个曾说\"再也不爬了\"的朋友，现在也说\"明年还去吧\"。那轮朝阳成了我一生难忘的回忆。"}],"grammar":[["〜に越(こ)した事(こと)はない","……最好不过","健康(けんこう)の為(ため)には、早寝(はやね)早起(はやお)き[[に越(こ)した事(こと)はない]]。","为了健康，早睡早起是最好的。","安(やす)い[[に越(こ)した事(こと)はない]]が、品質(ひんしつ)も大切(たいせつ)だ。","便宜当然最好，但质量也很重要。"],["〜た途端(とたん)","刚一……就……","家(いえ)を出(で)た[[途端(とたん)]]、雨(あめ)が降(ふ)り出(だ)した。","刚一出家门就下起雨来。","ベッドに横(よこ)に成(な)った[[途端(とたん)]]、眠(ねむ)って仕舞(しま)った。","一躺到床上就睡着了。"],["〜所為(せい)か","也许是因为……","年(とし)の[[所為(せい)か]]、最近(さいきん)疲(つか)れ易(やす)い。","也许是上了年纪，最近容易累。","寝不足(ねぶそく)の[[所為(せい)か]]、今日(きょう)は集中(しゅうちゅう)出来(でき)ない。","也许是睡眠不足，今天没法集中注意力。"],["〜かと思(おも)うと","刚一……马上就……","空(そら)が暗(くら)く成(な)った[[かと思(おも)うと]]、激(はげ)しい雨(あめ)が降(ふ)って来(き)た。","天刚一暗下来，就下起了大雨。","弟(おとうと)は帰(かえ)って来(き)た[[かと思(おも)うと]]、又(また)直(す)ぐに出掛(でか)けた。","弟弟刚回来，马上又出去了。"],["〜最中(さいちゅう)に","正在……的时候","会議(かいぎ)の[[最中(さいちゅう)に]]、携帯電話(けいたいでんわ)が鳴(な)った。","正开会时，手机响了。","食事(しょくじ)をして居(い)る[[最中(さいちゅう)に]]、地震(じしん)が起(お)きた。","正在吃饭的时候发生了地震。"],["〜掛(か)ける","刚要……；……到一半","読(よ)み[[掛(か)けた]]本(ほん)が机(つくえ)の上(うえ)に置(お)いて有(あ)る。","读了一半的书放在桌子上。","何(なに)か言(い)い[[掛(か)けて]]、彼(かれ)は黙(だま)って仕舞(しま)った。","他刚要说什么，又沉默了。"],["〜末(すえ)に","经过……最后","長(なが)い間(あいだ)悩(なや)んだ[[末(すえ)に]]、会社(かいしゃ)を辞(や)める事(こと)にした。","苦恼了很长时间，最后决定辞职。","話(はな)し合(あ)いの[[末(すえ)に]]、計画(けいかく)は中止(ちゅうし)に成(な)った。","经过商讨，计划最终取消了。"],["〜様(よう)が無(な)い","没法……，无从……","連絡先(れんらくさき)が分(わ)からないので、知(し)らせ[[様(よう)が無(な)い]]。","不知道联系方式，没法通知。","こんなに壊(こわ)れて居(い)ては、直(なお)し[[様(よう)が無(な)い]]。","坏成这样，没法修了。"],["〜程(ほど)〜ない","没有……那么……","今年(ことし)の冬(ふゆ)は去年(きょねん)[[程(ほど)]]寒(さむ)くない。","今年冬天没有去年那么冷。","試験(しけん)は思(おも)った[[程(ほど)]]難(むずか)しくなかった。","考试没有想象的那么难。"],["〜っ放(ぱな)し","一直……；……着不管","窓(まど)を開(あ)けっ[[放(ぱな)し]]にして出掛(でか)けて仕舞(しま)った。","窗户开着没关就出门了。","今日(きょう)は一日中(いちにちじゅう)立(た)ちっ[[放(ぱな)し]]で、足(あし)が痛(いた)い。","今天站了一整天，腿很疼。"],["〜挙句(あげく)","……到最后（多为不好的结果）","散々(さんざん)迷(まよ)った[[挙句(あげく)]]、何(なに)も買(か)わずに帰(かえ)った。","犹豫了半天，结果什么也没买就回来了。","彼(かれ)は遅刻(ちこく)を繰(く)り返(かえ)した[[挙句(あげく)]]、会社(かいしゃ)を首(くび)に成(な)った。","他反复迟到，最后被公司开除了。"],["〜切(き)る","……完；彻底……","一晩(ひとばん)で小説(しょうせつ)を読(よ)み[[切(き)った]]。","一个晚上就把小说读完了。","マラソンで四十二(よんじゅうに)キロを走(はし)り[[切(き)った]]。","跑完了马拉松全程42公里。"],["〜抜(ぬ)く","……到底，坚持……","苦(くる)しい練習(れんしゅう)に最後(さいご)迄(まで)耐(た)え[[抜(ぬ)いた]]。","艰苦的训练一直坚持到了最后。","何度(なんど)も考(かんが)え[[抜(ぬ)いて]]出(だ)した答(こた)えだ。","这是反复深思熟虑后得出的答案。"],["〜物(もの)か","才不……，怎么会……","あんな店(みせ)には二度(にど)と行(い)く[[物(もの)か]]。","那种店我再也不去了。","こんな所(ところ)で諦(あきら)める[[物(もの)か]]。","怎么能在这种地方放弃！"],["〜難(がた)い","难以……","彼(かれ)がそんな事(こと)をしたとは、信(しん)じ[[難(がた)い]]。","很难相信他会做那种事。","子供(こども)の頃(ころ)の思(おも)い出(で)は、忘(わす)れ[[難(がた)い]]物(もの)だ。","儿时的回忆是难以忘怀的。"]],"vocab":[["念入り","ねんいり","仔细，周到"],["体力","たいりょく","体力"],["上着","うわぎ","外套"],["余裕","よゆう","余裕，从容"],["薄い","うすい","稀薄；薄"],["繰り返し","くりかえし","反复"],["励まし合う","はげましあう","互相鼓励"],["山頂","さんちょう","山顶"],["辿り着く","たどりつく","好不容易到达"],["光景","こうけい","景象"],["砂利道","じゃりみち","砂石路"],["麓","ふもと","山脚"],["達成感","たっせいかん","成就感"],["一生","いっしょう","一生"]],"short":"富士登山","lv":1,"sum":"和朋友第一次爬富士山，从头疼、淋雨到看见山顶日出的游记。"},
{"title":"祖母(そぼ)からの手紙(てがみ)","paras":[{"jp":"拓也(たくや)へ。元気(げんき)にして居(い)ますか。東京(とうきょう)はもう寒(さむ)く成(な)ったでしょう。御(お)母(かあ)さんの話(はなし)では、毎日(まいにち)アルバイトと勉強(べんきょう)で忙(いそが)しくして居(い)る[[との事(こと)]]ですね。","zh":"拓也：你好吗？东京应该已经冷了吧。听你妈妈说，你每天又打工又学习，忙得很。"},{"jp":"貴方(あなた)が東京(とうきょう)へ行(い)ってから、もう一年(いちねん)に成(な)ります。駅(えき)で見送(みおく)った日(ひ)の事(こと)を思(おも)い出(だ)すと、今(いま)でも胸(むね)に込(こ)み上(あ)げて来(く)る[[物(もの)が有(あ)ります]]。小(ちい)さい頃(ころ)は泣(な)き虫(むし)だった[[くせに]]、あの日(ひ)は涙(なみだ)一(ひと)つ見(み)せずに、笑(わら)って手(て)を振(ふ)って居(い)ましたね。","zh":"你去东京已经一年了。一想起在车站送你的那天，至今心头还会涌起一股感情。你小时候明明是个爱哭鬼，那天却一滴眼泪也没掉，笑着向我挥手。"},{"jp":"一人(ひとり)で頑張(がんば)って居(い)る貴方(あなた)の事(こと)を思(おも)うと、心配(しんぱい)で[[成(な)らない]]のです。無理(むり)をし過(す)ぎると、体(からだ)を壊(こわ)し[[兼(か)ねません]]。若(わか)い時(とき)こそ、体(からだ)を大切(たいせつ)にする[[事(こと)です]]。","zh":"一想到你一个人在拼命，我就担心得不得了。太勉强自己，可能会把身体搞垮。正因为年轻，更要爱惜身体。"},{"jp":"先日(せんじつ)は誕生日(たんじょうび)のプレゼントを有難(ありがと)う。貴方(あなた)が初(はじ)めてのアルバイト代(だい)で選(えら)んで呉(く)れたと聞(き)いて、どれ程(ほど)嬉(うれ)しかった[[事(こと)か]]。毎日(まいにち)そのストールを巻(ま)いて散歩(さんぽ)に出掛(でか)けて居(い)ます。近所(きんじょ)の人(ひと)に褒(ほ)められると、孫(まご)の自慢(じまん)をし[[ないではいられません]]。","zh":"前几天谢谢你的生日礼物。听说是你用第一次打工的工资挑的，我不知有多高兴。我每天都围着那条披肩出去散步。邻居一夸，我就忍不住炫耀起孙子来。"},{"jp":"こちらは皆(みんな)元気(げんき)です。御(お)爺(じい)さんは相変(あいか)わらず畑仕事(はたけしごと)に夢中(むちゅう)で、雨(あめ)の日(ひ)も休(やす)む[[事(こと)なく]]畑(はたけ)に出(で)て居(い)ます。今年(ことし)は大根(だいこん)が良(よ)く出来(でき)た[[物(もの)だから]]、近所中(きんじょじゅう)に配(くば)って歩(ある)いて居(い)ます。","zh":"我们这边大家都很好。你爷爷还是一心扑在地里，下雨天也不休息，照样下地干活。今年萝卜长得特别好，他就挨家挨户分给邻居们。"},{"jp":"町(まち)は若(わか)い人(ひと)が減(へ)る[[一方(いっぽう)で]]、最近(さいきん)は都会(とかい)から移(うつ)り住(す)む家族(かぞく)も増(ふ)えて来(き)ました。寂(さび)しく[[ないこともない]]けれど、新(あたら)しい顔(かお)を見(み)るのは楽(たの)しい物(もの)です。","zh":"镇上的年轻人在减少，另一方面，最近从城市搬来的家庭也多了起来。也不是不觉得寂寞，但看到新面孔还是很开心的。"},{"jp":"正月(しょうがつ)には帰(かえ)って来(こ)られますか。若(も)し帰(かえ)って来(く)るなら、貴方(あなた)の好(す)きな栗御飯(くりごはん)を作(つく)って待(ま)って居(い)ます。電話(でんわ)では心配(しんぱい)を掛(か)ける[[まい]]と、何時(いつ)も「大丈夫(だいじょうぶ)」と言(い)う貴方(あなた)ですから、顔(かお)を見(み)る迄(まで)は安心(あんしん)出来(でき)ません。","zh":"过年能回来吗？如果回来，我做你最爱吃的栗子饭等你。你在电话里为了不让我担心，总是说\"没事\"，所以不亲眼见到你，我就放不下心。"},{"jp":"これから寒(さむ)さが厳(きび)しく成(な)ります。風邪(かぜ)を引(ひ)きません[[様(よう)に]]。祖母(そぼ)より。","zh":"天气会越来越冷，千万别感冒了。奶奶字。"}],"grammar":[["〜との事(こと)だ","据说……，（某人）说……（转述）","天気予報(てんきよほう)に依(よ)ると、明日(あした)は大雪(おおゆき)に成(な)る[[との事(こと)だ]]。","据天气预报说，明天会下大雪。","部長(ぶちょう)は今日(きょう)の会議(かいぎ)に遅(おく)れる[[との事(こと)です]]。","部长说今天的会议他会迟到。"],["〜物(もの)が有(あ)る","确实有……之处，令人……","彼(かれ)の演奏(えんそう)には、人(ひと)の心(こころ)を動(うご)かす[[物(もの)が有(あ)る]]。","他的演奏有一种打动人心的力量。","一人(ひとり)で外国(がいこく)に住(す)むのは、大変(たいへん)な[[物(もの)が有(あ)る]]。","一个人在国外生活，确实有它的不易。"],["〜くせに","明明……却……（责备）","知(し)って居(い)る[[くせに]]、教(おし)えて呉(く)れない。","明明知道，却不告诉我。","自分(じぶん)では何(なに)もしない[[くせに]]、文句(もんく)許(ばか)り言(い)う。","自己什么都不做，却光会抱怨。"],["〜て成(な)らない","……得不得了，总觉得……","故郷(ふるさと)の家族(かぞく)の事(こと)が気(き)に成(な)って[[成(な)らない]]。","非常惦记老家的家人。","彼(かれ)の話(はなし)は嘘(うそ)の様(よう)に思(おも)えて[[成(な)らない]]。","总觉得他的话像是假的。"],["〜兼(か)ねない","很可能会……（不好的结果）","そんな運転(うんてん)をしたら、事故(じこ)を起(お)こし[[兼(か)ねない]]。","那样开车，很可能会出事故。","彼(かれ)なら、約束(やくそく)を忘(わす)れ[[兼(か)ねない]]。","他的话，很可能会忘记约定。"],["〜事(こと)だ","应该……，最好……（忠告）","上手(じょうず)に成(な)りたければ、毎日(まいにち)練習(れんしゅう)する[[事(こと)だ]]。","想变得拿手，就应该每天练习。","分(わ)からない時(とき)は、遠慮(えんりょ)せずに聞(き)く[[事(こと)だ]]。","不懂的时候，最好不要客气，直接问。"],["〜事(こと)か","多么……啊","合格(ごうかく)の知(し)らせを聞(き)いて、どれ程(ほど)嬉(うれ)しかった[[事(こと)か]]。","听到合格的消息，不知有多高兴。","同(おな)じ事(こと)を何度(なんど)注意(ちゅうい)した[[事(こと)か]]。","同样的事不知提醒了多少遍。"],["〜ないではいられない","忍不住……","彼(かれ)の失礼(しつれい)な態度(たいど)には、一言(ひとこと)言(い)わ[[ないではいられなかった]]。","对他无礼的态度，我忍不住说了一句。","美味(おい)しそうなケーキを見(み)ると、買(か)わ[[ないではいられない]]。","看到好吃的蛋糕，就忍不住要买。"],["〜事(こと)なく","不……而……，没有……","彼(かれ)は一日(いちにち)も休(やす)む[[事(こと)なく]]、三年間(さんねんかん)働(はたら)き続(つづ)けた。","他一天也没休息，连续工作了三年。","迷(まよ)う[[事(こと)なく]]、自分(じぶん)の道(みち)を選(えら)んだ。","毫不犹豫地选择了自己的路。"],["〜物(もの)だから","因为……（辩解、说明理由）","道(みち)が混(こ)んで居(い)た[[物(もの)だから]]、遅(おく)れて仕舞(しま)いました。","因为路上堵车，所以迟到了。","余(あま)りに安(やす)かった[[物(もの)だから]]、三(みっ)つも買(か)って仕舞(しま)った。","因为实在太便宜，一下子买了三个。"],["〜一方(いっぽう)で","一方面……另一方面……","仕事(しごと)が忙(いそが)しい[[一方(いっぽう)で]]、趣味(しゅみ)の時間(じかん)も大切(たいせつ)にして居(い)る。","工作很忙，同时也很重视爱好的时间。","便利(べんり)な機械(きかい)が増(ふ)える[[一方(いっぽう)で]]、使(つか)い方(かた)が分(わ)からない人(ひと)も居(い)る。","方便的机器越来越多，另一方面也有人不会用。"],["〜ないこともない","也不是不……","少(すこ)し高(たか)いが、買(か)え[[ないこともない]]。","有点贵，但也不是买不起。","急(いそ)げば、間(ま)に合(あ)わ[[ないこともない]]。","赶一赶的话，也不是来不及。"],["〜まい","决不……；为了不……","二度(にど)と同(おな)じ失敗(しっぱい)はする[[まい]]と心(こころ)に決(き)めた。","下定决心，再也不犯同样的错误。","親(おや)に心配(しんぱい)を掛(か)ける[[まい]]と、病気(びょうき)の事(こと)は黙(だま)って居(い)た。","为了不让父母担心，生病的事一直没说。"],["〜様(よう)に","希望……；为了……","明日(あした)、晴(は)れます[[様(よう)に]]。","希望明天放晴。","忘(わす)れない[[様(よう)に]]、手帳(てちょう)にメモして置(お)いた。","为了不忘记，记在了记事本上。"]],"vocab":[["見送る","みおくる","送行"],["込み上げる","こみあげる","（感情）涌上来"],["泣き虫","なきむし","爱哭鬼"],["体を壊す","からだをこわす","搞垮身体"],["自慢","じまん","炫耀，自豪"],["孫","まご","孙子，孙女"],["相変わらず","あいかわらず","照旧，依然"],["畑仕事","はたけしごと","农活"],["夢中","むちゅう","热衷，入迷"],["配る","くばる","分发"],["移り住む","うつりすむ","迁居"],["遠慮","えんりょ","客气，顾虑"],["安心","あんしん","放心"],["栗御飯","くりごはん","栗子饭"]],"short":"祖母の手紙","lv":1,"sum":"奶奶写给在东京的孙子的一封信，练习书信体和表达心情的语法。"},
{"title":"日本(にほん)の四季(しき)と年中行事(ねんじゅうぎょうじ)","paras":[{"jp":"日本(にほん)には春夏秋冬(しゅんかしゅうとう)の四季(しき)が有(あ)り、季節(きせつ)の変化(へんか)[[と共(とも)に]]、様々(さまざま)な年中行事(ねんじゅうぎょうじ)が行(おこな)われる。","zh":"日本有春夏秋冬四季，随着季节的变化，会举行各种各样的传统节庆活动。"},{"jp":"日本(にほん)の春(はる)[[と言(い)えば]]、何(なん)と言(い)っても花見(はなみ)だろう。三月(さんがつ)の終(お)わりから四月(しがつ)の初(はじ)め[[に掛(か)けて]]、全国(ぜんこく)各地(かくち)で桜(さくら)が咲(さ)き、公園(こうえん)は花見(はなみ)をする人(ひと)で一杯(いっぱい)に成(な)る。","zh":"说起日本的春天，最有代表性的还是赏花吧。从三月底到四月初，全国各地樱花盛开，公园里挤满了赏花的人。"},{"jp":"夏(なつ)は祭(まつ)りの季節(きせつ)である。京都(きょうと)の祇園祭(ぎおんまつり)は七月(しちがつ)の一(いっ)箇(か)月(げつ)[[に亘(わた)って]]行(おこな)われ、千年(せんねん)以上(いじょう)の歴史(れきし)を持(も)つ。又(また)、各地(かくち)で開(ひら)かれる花火大会(はなびたいかい)には、浴衣姿(ゆかたすがた)の若者(わかもの)[[を中心(ちゅうしん)に]]大勢(おおぜい)の人(ひと)が集(あつ)まる。","zh":"夏天是祭典的季节。京都的祇园祭贯穿整个七月，已有一千多年的历史。各地举办的烟花大会，则聚集了以穿浴衣的年轻人为主的大批人群。"},{"jp":"秋(あき)は「食欲(しょくよく)の秋(あき)」「読書(どくしょ)の秋(あき)」等(など)と言(い)われる。秋(あき)の夜(よる)に月(つき)を眺(なが)める「月見(つきみ)」は、平安時代(へいあんじだい)に中国(ちゅうごく)から伝(つた)わって[[以来(いらい)]]、長(なが)く親(した)しまれて来(き)た。団子(だんご)や芒(すすき)を飾(かざ)り、収穫(しゅうかく)への感謝(かんしゃ)[[を込(こ)めて]]月(つき)を拝(おが)むのである。","zh":"秋天被称为\"食欲之秋\"\"读书之秋\"。秋夜赏月的\"月见\"，自平安时代从中国传来之后，长久以来深受人们喜爱。人们摆上团子和芒草，怀着对丰收的感激之情拜月。"},{"jp":"冬(ふゆ)の最大(さいだい)の行事(ぎょうじ)は正月(しょうがつ)だ。人間(にんげん)の煩悩(ぼんのう)は百八(ひゃくはち)有(あ)るとされる[[事(こと)から]]、大晦日(おおみそか)には寺(てら)の鐘(かね)が百八回(ひゃくはちかい)鳴(な)らされる。元日(がんじつ)には家族(かぞく)が揃(そろ)って御節料理(おせちりょうり)を食(た)べ、初詣(はつもうで)に出掛(でか)ける。散歩(さんぽ)[[がてら]]近所(きんじょ)の神社(じんじゃ)に参拝(さんぱい)する人(ひと)も多(おお)い。","zh":"冬天最大的节日是新年。据说人有108种烦恼，所以除夕夜寺院会敲钟108下。元旦这天，一家人团聚吃年菜，再去新年参拜。也有很多人散步时顺便去附近的神社参拜。"},{"jp":"最近(さいきん)では、ハロウィンやクリスマス[[と言(い)った]]海外(かいがい)の行事(ぎょうじ)も定着(ていちゃく)して来(き)た。生活(せいかつ)スタイルの変化(へんか)[[に伴(ともな)って]]、伝統的(でんとうてき)な行事(ぎょうじ)を家庭(かてい)で行(おこな)う事(こと)は少(すく)なく成(な)ったが、子供(こども)[[に限(かぎ)らず]]大人(おとな)も、季節(きせつ)の行事(ぎょうじ)を楽(たの)しむ気持(きも)ちは変(か)わらない。","zh":"最近，万圣节、圣诞节这类海外节日也扎下了根。随着生活方式的变化，在家里过传统节日的少了，但不只是孩子，大人享受节令活动的心情也没有改变。"},{"jp":"日本(にほん)を訪(おとず)れる[[際(さい)には]]、その季節(きせつ)ならではの行事(ぎょうじ)に参加(さんか)して見(み)ては如何(いかが)だろうか。","zh":"来日本的时候，不妨参加一下那个季节特有的节庆活动吧。"}],"grammar":[["〜と共(とも)に","随着……；和……一起","年(とし)を取(と)る[[と共(とも)に]]、記憶力(きおくりょく)が衰(おとろ)えて来(く)る。","随着年龄增长，记忆力会衰退。","家族(かぞく)[[と共(とも)に]]新年(しんねん)を迎(むか)えた。","和家人一起迎接了新年。"],["〜と言(い)えば","说起……，提到……","夏(なつ)[[と言(い)えば]]、矢張(やは)り西瓜(すいか)だ。","说到夏天，还得是西瓜。","北海道(ほっかいどう)[[と言(い)えば]]、雪(ゆき)と美味(おい)しい海鮮(かいせん)が有名(ゆうめい)だ。","说起北海道，雪和美味的海鲜很有名。"],["〜に掛(か)けて","从……到……（时间、地点的范围）","今夜(こんや)から明日(あした)の朝(あさ)[[に掛(か)けて]]、強(つよ)い雨(あめ)が降(ふ)るでしょう。","从今晚到明天早上会下大雨。","関東(かんとう)から東北(とうほく)[[に掛(か)けて]]、雪(ゆき)が降(ふ)って居(い)る。","从关东到东北一带都在下雪。"],["〜に亘(わた)って","在……范围内，长达……","会議(かいぎ)は五時間(ごじかん)[[に亘(わた)って]]続(つづ)いた。","会议持续了五个小时。","彼(かれ)は十年(じゅうねん)[[に亘(わた)って]]この研究(けんきゅう)を続(つづ)けて来(き)た。","他持续这项研究长达十年。"],["〜を中心(ちゅうしん)に","以……为中心","地球(ちきゅう)は太陽(たいよう)[[を中心(ちゅうしん)に]]回(まわ)って居(い)る。","地球围绕着太阳转。","この店(みせ)は若(わか)い女性(じょせい)[[を中心(ちゅうしん)に]]人気(にんき)が有(あ)る。","这家店主要受年轻女性欢迎。"],["〜て以来(いらい)","自从……以来","日本(にほん)に来(き)て[[以来(いらい)]]、一度(いちど)も国(くに)に帰(かえ)って居(い)ない。","自从来日本以后，一次也没回过国。","卒業(そつぎょう)[[以来(いらい)]]、彼(かれ)とは会(あ)って居(い)ない。","毕业以后就没见过他。"],["〜を込(こ)めて","满怀……，倾注……","母(はは)の日(ひ)に、感謝(かんしゃ)[[を込(こ)めて]]花(はな)を贈(おく)った。","母亲节那天，满怀感激地送了花。","心(こころ)[[を込(こ)めて]]作(つく)った料理(りょうり)は美味(おい)しい。","用心做的菜就是好吃。"],["〜事(こと)から","由于……，从……（判断、命名的根据）","この辺(あた)りは桜(さくら)が多(おお)い[[事(こと)から]]、「桜町(さくらまち)」と呼(よ)ばれて居(い)る。","这一带樱花多，所以被叫作\"樱町\"。","足跡(あしあと)が残(のこ)って居(い)た[[事(こと)から]]、犯人(はんにん)が分(わ)かった。","根据留下的脚印查出了犯人。"],["〜がてら","顺便……，借……之机","散歩(さんぽ)[[がてら]]、パンを買(か)いに行(い)った。","散步时顺便去买了面包。","駅(えき)迄(まで)友達(ともだち)を送(おく)り[[がてら]]、本屋(ほんや)に寄(よ)った。","送朋友去车站，顺便去了趟书店。"],["〜と言(い)った","……之类的，……等（列举）","京都(きょうと)や奈良(なら)[[と言(い)った]]古(ふる)い町(まち)には、外国人(がいこくじん)観光客(かんこうきゃく)が多(おお)い。","京都、奈良这样的古城，外国游客很多。","野菜(やさい)や果物(くだもの)[[と言(い)った]]食品(しょくひん)の値段(ねだん)が上(あ)がって居(い)る。","蔬菜、水果之类的食品价格在上涨。"],["〜に伴(ともな)って","随着……，伴随……","気温(きおん)の上昇(じょうしょう)[[に伴(ともな)って]]、冷房(れいぼう)の使用量(しようりょう)が増(ふ)えた。","随着气温上升，空调的使用量增加了。","会社(かいしゃ)の成長(せいちょう)[[に伴(ともな)って]]、社員(しゃいん)の数(かず)も増(ふ)えた。","随着公司的发展，员工人数也增加了。"],["〜に限(かぎ)らず","不仅限于……","この問題(もんだい)は日本(にほん)[[に限(かぎ)らず]]、多(おお)くの国(くに)が抱(かか)えて居(い)る。","这个问题不只是日本，很多国家都存在。","週末(しゅうまつ)[[に限(かぎ)らず]]、平日(へいじつ)も店(みせ)は混(こ)んで居(い)る。","不只是周末，平时店里也很挤。"],["〜際(さい)に","在……的时候（正式）","御(お)帰(かえ)りの[[際(さい)には]]、忘(わす)れ物(もの)に御(ご)注意(ちゅうい)下(くだ)さい。","离开时请注意不要遗忘物品。","引(ひ)っ越(こ)しの[[際(さい)に]]、古(ふる)い家具(かぐ)を処分(しょぶん)した。","搬家的时候处理掉了旧家具。"]],"vocab":[["年中行事","ねんじゅうぎょうじ","一年中的例行节庆"],["花見","はなみ","赏花"],["各地","かくち","各地"],["浴衣","ゆかた","夏季单和服"],["大勢","おおぜい","许多人"],["食欲","しょくよく","食欲"],["眺める","ながめる","眺望，凝视"],["収穫","しゅうかく","收获"],["拝む","おがむ","拜，合掌祈祷"],["大晦日","おおみそか","除夕"],["煩悩","ぼんのう","烦恼"],["初詣","はつもうで","新年第一次参拜"],["参拝","さんぱい","参拜"],["定着","ていちゃく","扎根，固定下来"]],"short":"四季と行事","lv":1,"sum":"按春夏秋冬介绍日本的传统节庆，赏花、祇园祭、赏月、新年参拜。"},
{"title":"早起(はやお)きは三文(さんもん)の徳(とく)","paras":[{"jp":"私(わたし)は昔(むかし)から夜型(よるがた)の人間(にんげん)で、夜中(よなか)の二時(にじ)、三時(さんじ)迄(まで)起(お)きて居(い)るのが当(あ)たり前(まえ)だった。その為(ため)、朝(あさ)は何時(いつ)も寝坊(ねぼう)[[気味(ぎみ)]]で、授業(じゅぎょう)に遅刻(ちこく)する事(こと)も少(すく)なくなかった。","zh":"我一直是个夜猫子，熬到半夜两三点是家常便饭。因此早上总有点睡过头，上课迟到也是常有的事。"},{"jp":"最近(さいきん)、何(なん)となく体(からだ)が怠(だる)く、風邪(かぜ)[[っぽい]]日(ひ)が続(つづ)いた。病院(びょういん)で相談(そうだん)すると、医者(いしゃ)は「若(わか)い[[割(わり)に]]、生活(せいかつ)のリズムが乱(みだ)れて居(い)ますね」と言(い)った。","zh":"最近总觉得身体乏力，好几天都像感冒了似的。去医院咨询，医生说：\"你年纪轻轻，生活节奏却这么乱啊。\""},{"jp":"医者(いしゃ)に勧(すす)められて、早起(はやお)きを始(はじ)める事(こと)にした。最初(さいしょ)は「早起(はやお)き出来(でき)る[[物(もの)なら]]、疾(と)っくにして居(い)る」と思(おも)った。然(しか)し、医者(いしゃ)の言葉(ことば)を聞(き)き流(なが)すのは、自分(じぶん)の体(からだ)に対(たい)して無責任(むせきにん)[[と言(い)う物(もの)だ]]。","zh":"在医生的建议下，我决定开始早起。一开始我想：\"要是能早起，我早就做了。\"可是，把医生的话当耳旁风，那就是对自己的身体不负责任。"},{"jp":"先(ま)ず、寝(ね)る一時間前(いちじかんまえ)にはスマホを見(み)ない事(こと)にした。今更(いまさら)夜更(よふ)かしを止(や)めた[[所(ところ)で]]、直(す)ぐには変(か)わらないだろうと思(おも)って居(い)たが、一週間(いっしゅうかん)程(ほど)で自然(しぜん)に目(め)が覚(さ)める様(よう)に成(な)った。","zh":"首先，我规定自己睡前一小时不看手机。我原以为事到如今才不熬夜，也不会马上有变化，没想到一周左右就能自然醒了。"},{"jp":"朝(あさ)の時間(じかん)が出来(でき)ると、朝食(ちょうしょく)をゆっくり食(た)べられる。散歩(さんぽ)の[[序(つい)でに]]、近所(きんじょ)のパン屋(や)で焼(や)き立(た)てのパンを買(か)うのが楽(たの)しみに成(な)った。以前(いぜん)は朝(あさ)慌(あわ)てて家(いえ)を出(で)て、タクシーに乗(の)る事(こと)も有(あ)ったが、今(いま)はタクシーを使(つか)わ[[ずに済(す)む]]。","zh":"早上有了时间，就能慢慢吃早饭了。散步时顺便去附近的面包店买刚出炉的面包，成了一件乐事。以前早上慌慌张张出门，有时还得打车，现在不用再打车了。"},{"jp":"夜型(よるがた)だった私(わたし)[[にしたら]]、これは大(おお)きな変化(へんか)だ。友人(ゆうじん)にも「最近(さいきん)、何(なん)だか楽(たの)し[[げ]]だね」と言(い)われる。","zh":"对曾经是夜猫子的我来说，这是很大的变化。朋友也说：\"你最近看起来挺开心的嘛。\""},{"jp":"勿論(もちろん)、早起(はやお)きが誰(だれ)にでも合(あ)うとは言(い)い[[兼(か)ねる]]。仕事(しごと)の都合(つごう)で夜(よる)働(はたら)く人(ひと)も居(い)るだろう。でも、自分(じぶん)[[なりに]]生活(せいかつ)のリズムを整(ととの)える事(こと)は出来(でき)る筈(はず)だ。毎日(まいにち)の小(ちい)さな工夫(くふう)[[次第(しだい)で]]、体(からだ)も心(こころ)も変(か)わって行(い)く。皆(みな)さんも、明日(あした)から少(すこ)し早(はや)く起(お)きて見(み)[[ようではないか]]。","zh":"当然，很难说早起适合每一个人。也有人因为工作要在夜里上班。但每个人都应该能按自己的方式调整生活节奏。凭着每天的小小用心，身体和心情都会慢慢改变。大家也从明天开始，试着早起一点吧。"}],"grammar":[["〜気味(ぎみ)","有点……，稍微有……的倾向","最近(さいきん)、少(すこ)し太(ふと)り[[気味(ぎみ)]]だ。","最近有点发胖。","仕事(しごと)が忙(いそが)しくて、疲(つか)れ[[気味(ぎみ)]]です。","工作很忙，有点疲劳。"],["〜っぽい","有……的感觉；容易……","彼(かれ)は怒(おこ)り[[っぽい]]性格(せいかく)だ。","他是容易发火的性格。","この服(ふく)は少(すこ)し子供(こども)[[っぽい]]。","这件衣服有点孩子气。"],["〜割(わり)に","与……相比（却），虽然……但","この店(みせ)は値段(ねだん)の[[割(わり)に]]量(りょう)が多(おお)い。","这家店相对价格来说分量很足。","彼(かれ)は良(よ)く食(た)べる[[割(わり)に]]太(ふと)らない。","他吃得挺多，却不胖。"],["〜物(もの)なら","如果能……的话；要是敢……就","出来(でき)る[[物(もの)なら]]、もう一度(いちど)学生(がくせい)時代(じだい)に戻(もど)りたい。","如果可以的话，真想再回到学生时代。","遅刻(ちこく)しよう[[物(もの)なら]]、先生(せんせい)に厳(きび)しく叱(しか)られる。","要是敢迟到，就会被老师狠狠批评。"],["〜と言(い)う物(もの)だ","这才叫……，就是……","困(こま)って居(い)る人(ひと)を助(たす)けるのが、友達(ともだち)[[と言(い)う物(もの)だ]]。","帮助有困难的人，这才叫朋友。","一度(いちど)の失敗(しっぱい)で諦(あきら)めるのは、早(はや)過(す)ぎる[[と言(い)う物(もの)だ]]。","失败一次就放弃，未免太早了。"],["〜た所(ところ)で","即使……也（没用）","今(いま)から急(いそ)いだ[[所(ところ)で]]、もう間(ま)に合(あ)わない。","现在再怎么赶也来不及了。","彼(かれ)に相談(そうだん)した[[所(ところ)で]]、何(なに)も変(か)わらないだろう。","就算找他商量，也什么都改变不了吧。"],["〜序(つい)でに","顺便……","買(か)い物(もの)の[[序(つい)でに]]、郵便局(ゆうびんきょく)に寄(よ)った。","买东西时顺便去了趟邮局。","出張(しゅっちょう)の[[序(つい)でに]]、友人(ゆうじん)に会(あ)って来(き)た。","出差时顺便见了朋友。"],["〜ずに済(す)む","不用……就解决了","友達(ともだち)が車(くるま)で送(おく)って呉(く)れたので、雨(あめ)に濡(ぬ)れ[[ずに済(す)んだ]]。","朋友开车送我，所以没淋到雨。","早(はや)く気付(きづ)いたので、大(おお)きな問題(もんだい)に成(な)ら[[ずに済(す)んだ]]。","因为发现得早，没有酿成大问题。"],["〜にしたら","对……来说，站在……的立场","子供(こども)[[にしたら]]、親(おや)の期待(きたい)は重(おも)い物(もの)だ。","对孩子来说，父母的期待是沉重的。","店(みせ)の人(ひと)[[にしたら]]、迷惑(めいわく)な客(きゃく)だっただろう。","对店员来说，那大概是个很麻烦的客人吧。"],["〜げ","好像……的样子","彼女(かのじょ)は何(なに)か言(い)いた[[げ]]な顔(かお)をして居(い)た。","她一副欲言又止的样子。","子供達(こどもたち)は楽(たの)し[[げ]]に遊(あそ)んで居(い)る。","孩子们玩得很开心的样子。"],["〜兼(か)ねる","难以……，不便……","その質問(しつもん)には、私(わたし)からは御(お)答(こた)え[[兼(か)ねます]]。","那个问题，我不便回答。","彼(かれ)の意見(いけん)には、賛成(さんせい)し[[兼(か)ねる]]。","很难赞成他的意见。"],["〜なりに","按……自己的方式，与……相应","子供(こども)は子供(こども)[[なりに]]、色々(いろいろ)考(かんが)えて居(い)る。","孩子也有孩子自己的想法。","自分(じぶん)[[なりに]]努力(どりょく)したが、結果(けっか)は駄目(だめ)だった。","我尽了自己的努力，结果还是不行。"],["〜次第(しだい)で","根据……，取决于……","天気(てんき)[[次第(しだい)で]]、明日(あした)の予定(よてい)を決(き)めます。","根据天气来决定明天的安排。","努力(どりょく)[[次第(しだい)で]]、誰(だれ)でも上達(じょうたつ)出来(でき)る。","只要努力，谁都能进步。"],["〜ようではないか","让我们……吧（号召）","皆(みんな)で力(ちから)を合(あ)わせて、この問題(もんだい)を解決(かいけつ)し[[ようではないか]]。","让我们齐心协力解决这个问题吧。","環境(かんきょう)の為(ため)に、出来(でき)る事(こと)から始(はじ)め[[ようではないか]]。","为了环境，让我们从力所能及的事做起吧。"]],"vocab":[["夜型","よるがた","夜猫子型"],["寝坊","ねぼう","睡懒觉，睡过头"],["怠い","だるい","乏力，倦怠"],["乱れる","みだれる","紊乱"],["勧める","すすめる","劝，建议"],["聞き流す","ききながす","当耳旁风"],["無責任","むせきにん","不负责任"],["夜更かし","よふかし","熬夜"],["目が覚める","めがさめる","醒来"],["焼き立て","やきたて","刚烤好"],["慌てる","あわてる","慌张"],["整える","ととのえる","调整，整理"],["工夫","くふう","想办法，下功夫"],["疾っくに","とっくに","早就"]],"short":"早起き","lv":1,"sum":"夜猫子决定改成早起，记录生活和身体的变化，带一点议论。"},
{"title":"引(ひ)っ越(こ)しの手続(てつづ)き","paras":[{"jp":"大学院(だいがくいん)への進学(しんがく)が決(き)まり、四年間(よねんかん)住(す)んだアパートを出(で)る事(こと)に成(な)った。引(ひ)っ越(こ)す[[からには]]、荷造(にづく)り[[に加(くわ)えて]]、役所(やくしょ)の手続(てつづ)きも済(す)ませなければ成(な)らない。","zh":"我考上了研究生，要搬出住了四年的公寓。既然要搬家，除了打包行李，还得把政府机关的手续都办完。"},{"jp":"最初(さいしょ)は「一日(いちにち)有(あ)れば終(お)わる[[に決(き)まって居(い)る]]」と高(たか)を括(くく)って居(い)た。然(しか)し調(しら)べて見(み)ると、転出届(てんしゅつとどけ)、電気(でんき)やガスの解約(かいやく)、郵便物(ゆうびんぶつ)の転送(てんそう)等(など)、遣(や)る事(こと)が山(やま)の様(よう)に有(あ)った。","zh":"一开始我小看了这件事，以为\"一天肯定能搞定\"。可是一查，迁出申报、水电燃气解约、邮件转寄等等，要办的事堆积如山。"},{"jp":"荷造(にづく)りも思(おも)った以上(いじょう)に大変(たいへん)だった。四年間(よねんかん)で物(もの)が[[次第(しだい)に]]増(ふ)えて居(い)たらしく、段(だん)ボール二十箱(にじゅっぱこ)でも足(た)りなかった。本(ほん)を詰(つ)めて居(い)る[[所(ところ)に]]大家(おおや)さんが訪(たず)ねて来(き)て、退去(たいきょ)の日(ひ)を確認(かくにん)された。","zh":"打包也比想象的辛苦。四年里东西好像在不知不觉中越积越多，二十个纸箱都不够装。正在装书的时候，房东来了，跟我确认了退房的日子。"},{"jp":"引(ひ)っ越(こ)しの前日(ぜんじつ)は、疲(つか)れて居(い)ても休(やす)んで[[は居(い)られなかった]]。夜遅(よるおそ)く迄(まで)掃除(そうじ)を続(つづ)け、危(あや)うく大切(たいせつ)な書類(しょるい)を捨(す)てて仕舞(しま)う[[所(ところ)だった]]。","zh":"搬家前一天，再累也不能休息。一直打扫到深夜，差点把重要的文件扔掉。"},{"jp":"当日(とうじつ)は、業者(ぎょうしゃ)の方(かた)が手際(てぎわ)良(よ)く荷物(にもつ)を運(はこ)んで呉(く)れた。忙(いそが)しい[[所(ところ)を]]手伝(てつだ)いに来(き)て呉(く)れた友人(ゆうじん)には、本当(ほんとう)に感謝(かんしゃ)して居(い)る。結局(けっきょく)、前(まえ)から行(い)きたかった近所(きんじょ)のラーメン屋(や)には、行(い)か[[ず仕舞(じま)い]]だった。","zh":"当天，搬家公司的人手脚麻利地把行李运走了。朋友在百忙之中来帮忙，我真的很感激。结果，一直想去的附近那家拉面店，到最后也没去成。"},{"jp":"新(あたら)しい町(まち)に着(つ)いたら、十四日(じゅうよっか)以内(いない)に転入届(てんにゅうとどけ)を出(だ)さなければ成(な)らない。区役所(くやくしょ)の窓口(まどぐち)は混(こ)んで居(い)たが、職員(しょくいん)の方(かた)が丁寧(ていねい)に説明(せつめい)して呉(く)れたので、慌(あわ)てる[[事(こと)はなかった]]。最近(さいきん)は窓口(まどぐち)[[に代(か)わって]]、オンラインで出来(でき)る手続(てつづ)きも増(ふ)えて居(い)るそうだ。","zh":"到了新的城市，必须在14天内提交迁入申报。区政府窗口人很多，但工作人员耐心地给我讲解，所以没什么好慌的。听说最近可以代替窗口、在网上办理的手续也越来越多了。"},{"jp":"一人(ひとり)で全(すべ)てを遣(や)り遂(と)げられる[[訳(わけ)が無(な)い]]と思(おも)って居(い)たが、周(まわ)りの人(ひと)に助(たす)けられて、何(なん)とか新生活(しんせいかつ)を始(はじ)められた。皆(みんな)の期待(きたい)[[に応(こた)えて]]、大学院(だいがくいん)では確(しっか)り研究(けんきゅう)に取(と)り組(く)もうと思(おも)う。","zh":"我原以为自己一个人不可能全部搞定，但在周围人的帮助下，总算开始了新生活。为了不辜负大家的期待，我打算在研究生院踏踏实实地做研究。"}],"grammar":[["〜からには","既然……就……","約束(やくそく)した[[からには]]、必(かなら)ず守(まも)らなければ成(な)らない。","既然约好了，就一定要遵守。","日本(にほん)に留学(りゅうがく)する[[からには]]、日本語(にほんご)を真剣(しんけん)に勉強(べんきょう)する積(つ)もりだ。","既然来日本留学，我就打算认真学日语。"],["〜に加(くわ)えて","加上……，除……之外还","雨(あめ)[[に加(くわ)えて]]、風(かぜ)も強(つよ)く成(な)って来(き)た。","不但下雨，风也大起来了。","彼(かれ)は英語(えいご)[[に加(くわ)えて]]、韓国語(かんこくご)も勉強(べんきょう)して居(い)る。","他除了英语，还在学韩语。"],["〜に決(き)まって居(い)る","肯定……，一定……","そんな高(たか)い物(もの)、買(か)えない[[に決(き)まって居(い)る]]。","那么贵的东西，肯定买不起。","練習(れんしゅう)しなければ、負(ま)ける[[に決(き)まって居(い)る]]。","不练习的话，肯定会输。"],["次第(しだい)に","逐渐，渐渐","薬(くすり)を飲(の)んだら、熱(ねつ)が[[次第(しだい)に]]下(さ)がって来(き)た。","吃了药以后，烧渐渐退了。","町(まち)の様子(ようす)は[[次第(しだい)に]]変(か)わって行(い)った。","城市的面貌逐渐改变了。"],["〜所(ところ)に","正当……的时候（发生了别的事）","出掛(でか)けようとして居(い)た[[所(ところ)に]]、電話(でんわ)が掛(か)かって来(き)た。","正要出门的时候，电话打来了。","皆(みんな)で彼(かれ)の噂(うわさ)をして居(い)る[[所(ところ)に]]、本人(ほんにん)が現(あらわ)れた。","大家正在议论他的时候，他本人出现了。"],["〜ては居(い)られない","不能再……了，没法……","試験(しけん)迄(まで)後(あと)一週間(いっしゅうかん)だ。遊(あそ)んで[[は居(い)られない]]。","离考试只剩一周了，不能再玩了。","子供(こども)が熱(ねつ)を出(だ)したと聞(き)いて、落(お)ち着(つ)いて[[は居(い)られなかった]]。","听说孩子发烧了，我坐立不安。"],["〜所(ところ)だった","差点就……","もう少(すこ)しで電車(でんしゃ)に乗(の)り遅(おく)れる[[所(ところ)だった]]。","差一点就没赶上电车。","君(きみ)が教(おし)えて呉(く)れなかったら、大変(たいへん)な事(こと)に成(な)る[[所(ところ)だった]]。","要不是你告诉我，事情就严重了。"],["〜所(ところ)を","在……的时候（却打扰、麻烦）","御(お)忙(いそが)しい[[所(ところ)を]]、有難(ありがと)う御座(ござ)います。","在您百忙之中，非常感谢。","寝(ね)て居(い)る[[所(ところ)を]]起(お)こされて、機嫌(きげん)が悪(わる)い。","正睡着被叫醒，心情很差。"],["〜ず仕舞(じま)い","最终没能……","忙(いそが)しくて、結局(けっきょく)その映画(えいが)は見(み)[[ず仕舞(じま)い]]だった。","太忙了，结果那部电影到最后也没看成。","彼女(かのじょ)の本当(ほんとう)の気持(きも)ちは、聞(き)け[[ず仕舞(じま)い]]に成(な)った。","她真正的心意，到最后也没能问出口。"],["〜事(こと)はない","不必……，用不着……","簡単(かんたん)な試験(しけん)だから、心配(しんぱい)する[[事(こと)はない]]。","是很简单的考试，不必担心。","態々(わざわざ)来(く)る[[事(こと)はない]]よ。電話(でんわ)で十分(じゅうぶん)だ。","用不着特地跑一趟，打个电话就够了。"],["〜に代(か)わって","代替……","社長(しゃちょう)[[に代(か)わって]]、副社長(ふくしゃちょう)が挨拶(あいさつ)した。","副社长代替社长致辞。","最近(さいきん)は現金(げんきん)[[に代(か)わって]]、カードで払(はら)う人(ひと)が増(ふ)えた。","最近用卡代替现金付款的人多了。"],["〜訳(わけ)が無(な)い","不可能……","あんなに練習(れんしゅう)したのだから、負(ま)ける[[訳(わけ)が無(な)い]]。","练了那么多，不可能输。","彼(かれ)がそんな嘘(うそ)を吐(つ)く[[訳(わけ)が無(な)い]]。","他不可能撒那种谎。"],["〜に応(こた)えて","响应……，不辜负……","御(お)客様(きゃくさま)の要望(ようぼう)[[に応(こた)えて]]、営業時間(えいぎょうじかん)を延(の)ばした。","应顾客的要求，延长了营业时间。","両親(りょうしん)の期待(きたい)[[に応(こた)えて]]、医者(いしゃ)に成(な)った。","不负父母的期望，当上了医生。"]],"vocab":[["荷造り","にづくり","打包行李"],["役所","やくしょ","政府机关"],["高を括る","たかをくくる","小看，轻视"],["転出届","てんしゅつとどけ","迁出申报"],["解約","かいやく","解约"],["転送","てんそう","转寄，转发"],["大家","おおや","房东"],["退去","たいきょ","退房，搬出"],["業者","ぎょうしゃ","业者，公司"],["手際","てぎわ","手法，本事"],["転入届","てんにゅうとどけ","迁入申报"],["窓口","まどぐち","窗口"],["遣り遂げる","やりとげる","做完，完成"],["取り組む","とりくむ","致力于"]],"short":"引っ越し","lv":1,"sum":"在日本搬家要办的各种手续，一边手忙脚乱一边学到的经验。"},
{"title":"コンビニと日本(にほん)の暮(く)らし","short":"コンビニ","lv":2,"sum":"从生活据点到人手不足，便利店背后折射出的日本社会。","paras":[{"jp":"日本(にほん)の街(まち)を歩(ある)いて居(い)ると、数百(すうひゃく)メートル毎(ごと)にコンビニが有(あ)る[[と言(い)っても過言(かごん)ではない]]。二十四時間(にじゅうよじかん)営業(えいぎょう)の店(みせ)がこれ程(ほど)多(おお)い国(くに)は、世界(せかい)でも珍(めずら)しい[[に違(ちが)いない]]。","zh":"走在日本街头，说每隔几百米就有一家便利店也不为过。24小时营业的店这么多的国家，在世界上也一定很少见。"},{"jp":"コンビニは、単(たん)に食品(しょくひん)や日用品(にちようひん)を売(う)る[[丈(だけ)でなく]]、公共(こうきょう)料金(りょうきん)の支払(しはら)いや荷物(にもつ)の受(う)け取(と)り、住民票(じゅうみんひょう)の発行(はっこう)[[に至(いた)る迄(まで)]]、様々(さまざま)なサービスを提供(ていきょう)して居(い)る。[[言(い)わば]]、地域(ちいき)の生活(せいかつ)を支(ささ)える拠点(きょてん)なのだ。","zh":"便利店不只是卖食品和日用品，从缴纳水电费、收取快递，一直到开具居民证明，提供各种各样的服务。可以说，它是支撑地区生活的据点。"},{"jp":"特(とく)に、高齢(こうれい)化(か)が進(すす)む[[に連(つ)れて]]、コンビニの役割(やくわり)は益々(ますます)大(おお)きく成(な)って居(い)る。近所(きんじょ)のスーパーが閉店(へいてん)した地域(ちいき)[[に於(お)いては]]、コンビニが唯一(ゆいいつ)の買(か)い物(もの)の場所(ばしょ)と言(い)う例(れい)も少(すく)なくない。","zh":"尤其是随着老龄化的加剧，便利店的作用越来越大。在附近超市已经关门的地区，便利店成了唯一能买东西的地方，这样的例子并不少。"},{"jp":"[[その一方(いっぽう)で]]、課題(かだい)も多(おお)い。深夜(しんや)営業(えいぎょう)[[を巡(めぐ)って]]は、人手(ひとで)不足(ぶそく)や店主(てんしゅ)の長時間(ちょうじかん)労働(ろうどう)が問題(もんだい)と成(な)り、二十四時間(にじゅうよじかん)営業(えいぎょう)を見直(みなお)す店(みせ)も出(で)て来(き)た。又(また)、売(う)れ残(のこ)った弁当(べんとう)が大量(たいりょう)に捨(す)てられる食品(しょくひん)ロスにも、批判(ひはん)の声(こえ)が上(あ)がって居(い)る。","zh":"另一方面，问题也不少。围绕深夜营业，人手不足和店主长时间劳动成了问题，也出现了重新考虑24小时营业的店。另外，卖剩的便当被大量丢弃的食物浪费问题，也招来了批评。"},{"jp":"便利(べんり)さを追求(ついきゅう)する[[余(あま)り]]、働(はたら)く人(ひと)が疲(つか)れ切(き)って仕舞(しま)う[[様(よう)では]]、本末転倒(ほんまつてんとう)だ。利用者(りようしゃ)[[としても]]、「何時(いつ)でも開(あ)いて居(い)て当然(とうぜん)」と言(い)う考(かんが)え方(かた)を改(あらた)める[[可(べ)きではないだろうか]]。","zh":"如果因为过分追求便利，让工作的人累垮，那就本末倒置了。作为使用者，我们是不是也应该改变\"随时开门是理所当然的\"这种想法呢？"},{"jp":"コンビニの未来(みらい)は、私(わたし)達(たち)一人(ひとり)一人(ひとり)の意識(いしき)[[次第(しだい)だ]]。","zh":"便利店的未来，取决于我们每一个人的意识。"}],"grammar":[["〜と言(い)っても過言(かごん)ではない","说……也不为过","この人(ひと)が居(い)なければ会社(かいしゃ)は無(な)かった[[と言(い)っても過言(かごん)ではない]]。","说没有这个人就没有这家公司，也不为过。","スマホは現代人(げんだいじん)の生活(せいかつ)に欠(か)かせない[[と言(い)っても過言(かごん)ではない]]。","说智能手机是现代人生活中不可缺少的东西，也不为过。"],["〜に違(ちが)いない","一定是……","電気(でんき)が点(つ)いて居(い)るから、彼(かれ)は家(いえ)に居(い)る[[に違(ちが)いない]]。","灯亮着，他一定在家。","あんなに練習(れんしゅう)したのだから、合格(ごうかく)する[[に違(ちが)いない]]。","练了那么多，一定会合格的。"],["〜丈(だけ)でなく","不仅……","彼女(かのじょ)は英語(えいご)[[丈(だけ)でなく]]、中国語(ちゅうごくご)も話(はな)せる。","她不仅会英语，还会说中文。","この映画(えいが)は子供(こども)[[丈(だけ)でなく]]、大人(おとな)も楽(たの)しめる。","这部电影不只孩子，大人也能看得很开心。"],["〜に至(いた)る迄(まで)","甚至到……，一直到……","この店(みせ)では、食器(しょっき)から家具(かぐ)[[に至(いた)る迄(まで)]]何(なん)でも揃(そろ)う。","这家店从餐具到家具，什么都买得到。","社長(しゃちょう)から新入(しんにゅう)社員(しゃいん)[[に至(いた)る迄(まで)]]、全員(ぜんいん)が会議(かいぎ)に参加(さんか)した。","从社长到新员工，全员都参加了会议。"],["言(い)わば","可以说，打个比方说","京都(きょうと)は、[[言(い)わば]]日本(にほん)文化(ぶんか)の故郷(ふるさと)だ。","京都可以说是日本文化的故乡。","彼(かれ)は私(わたし)に取(と)って、[[言(い)わば]]兄(あに)の様(よう)な存在(そんざい)だ。","他对我来说，可以说就像哥哥一样。"],["〜に連(つ)れて","随着……","年(とし)を取(と)る[[に連(つ)れて]]、体力(たいりょく)が落(お)ちて来(き)た。","随着年龄增长，体力下降了。","日本語(にほんご)が上達(じょうたつ)する[[に連(つ)れて]]、日本(にほん)での生活(せいかつ)が楽(たの)しく成(な)った。","随着日语进步，在日本的生活变得开心了。"],["〜に於(お)いては","在……方面；在……（场合）","当(とう)ホテル[[に於(お)いては]]、全室(ぜんしつ)禁煙(きんえん)と成(な)って居(お)ります。","本酒店所有客房均为禁烟房。","現代(げんだい)社会(しゃかい)[[に於(お)いては]]、情報(じょうほう)を選(えら)ぶ力(ちから)が求(もと)められる。","在现代社会，需要具备选择信息的能力。"],["その一方(いっぽう)で","另一方面","ネットは便利(べんり)だ。[[その一方(いっぽう)で]]、個人(こじん)情報(じょうほう)の流出(りゅうしゅつ)も心配(しんぱい)だ。","网络很方便。另一方面，个人信息泄露也令人担心。","都会(とかい)は仕事(しごと)が多(おお)い。[[その一方(いっぽう)で]]、家賃(やちん)が高(たか)い。","大城市工作机会多。但另一方面，房租也贵。"],["〜を巡(めぐ)って","围绕……","遺産(いさん)[[を巡(めぐ)って]]、兄弟(きょうだい)が争(あらそ)って居(い)る。","兄弟几个正为了遗产争执。","新(あたら)しい空港(くうこう)の建設(けんせつ)[[を巡(めぐ)って]]、住民(じゅうみん)の意見(いけん)が分(わ)かれた。","围绕新机场的建设，居民意见出现了分歧。"],["〜余(あま)り","过于……以至于","緊張(きんちょう)の[[余(あま)り]]、言(い)いたい事(こと)が言(い)えなかった。","太紧张了，想说的话没说出来。","子供(こども)を心配(しんぱい)する[[余(あま)り]]、何(なん)でも口(くち)を出(だ)して仕舞(しま)う。","因为太担心孩子，什么事都要插嘴。"],["〜様(よう)では","如果……的话（就不行）","こんな簡単(かんたん)な問題(もんだい)が解(と)けない[[様(よう)では]]、合格(ごうかく)は無理(むり)だ。","连这么简单的题都做不出来，是不可能合格的。","毎朝(まいあさ)遅刻(ちこく)する[[様(よう)では]]、信頼(しんらい)されない。","每天早上都迟到的话，是不会被信任的。"],["〜としても","作为……也；即使……也","親(おや)[[としても]]、子供(こども)の意見(いけん)を尊重(そんちょう)したい。","作为父母，我也想尊重孩子的意见。","今(いま)から急(いそ)いだ[[としても]]、終電(しゅうでん)には間(ま)に合(あ)わないだろう。","即使现在赶过去，大概也赶不上末班车了。"],["〜可(べ)きではないだろうか","难道不应该……吗","若者(わかもの)の声(こえ)を、もっと政治(せいじ)に反映(はんえい)させる[[可(べ)きではないだろうか]]。","难道不应该让年轻人的声音更多地反映到政治中吗？","便利(べんり)さよりも、安全(あんぜん)を優先(ゆうせん)す[[可(べ)きではないだろうか]]。","比起便利，难道不应该把安全放在第一位吗？"],["〜次第(しだい)だ","取决于……","合格(ごうかく)出来(でき)るかどうかは、これからの努力(どりょく)[[次第(しだい)だ]]。","能不能合格，取决于接下来的努力。","旅行(りょこう)に行(い)くかどうかは、天気(てんき)[[次第(しだい)だ]]。","去不去旅行要看天气。"]],"vocab":[["過言","かごん","言过其实"],["営業","えいぎょう","营业"],["公共料金","こうきょうりょうきん","水电煤气等公共费用"],["住民票","じゅうみんひょう","居民证明"],["拠点","きょてん","据点"],["高齢化","こうれいか","老龄化"],["唯一","ゆいいつ","唯一"],["人手不足","ひとでぶそく","人手不足"],["見直す","みなおす","重新审视"],["売れ残る","うれのこる","卖剩下"],["追求","ついきゅう","追求"],["本末転倒","ほんまつてんとう","本末倒置"],["改める","あらためる","改正，改变"],["意識","いしき","意识"]]},
{"title":"スマートフォンと睡眠(すいみん)","paras":[{"jp":"スマートフォンの普及(ふきゅう)に伴(ともな)い、寝(ね)る直前(ちょくぜん)迄(まで)画面(がめん)を見(み)る人(ひと)が増(ふ)え[[つつ有(あ)る]]。","zh":"随着智能手机的普及，直到睡前还在看屏幕的人正在增加。"},{"jp":"或(あ)る調査(ちょうさ)の結果(けっか)[[を元(もと)に]]考(かんが)えると、二十代(にじゅうだい)の約(やく)八割(はちわり)が、ベッドの中(なか)でスマホを使(つか)って居(い)る。ベッドの中(なか)でスマホを操作(そうさ)する時間(じかん)は、平均(へいきん)で三十分(さんじゅっぷん)以上(いじょう)にも成(な)る[[と言(い)う事(こと)だ]]。","zh":"根据某项调查结果来看，二十多岁的人中约有八成会在床上用手机。据说在床上操作手机的时间，平均达三十分钟以上。"},{"jp":"問題(もんだい)は、画面(がめん)から出(で)る光(ひかり)である。スマホの光(ひかり)は、脳(のう)に「今(いま)は昼(ひる)だ」と勘違(かんちが)いさせる[[恐(おそ)れが有(あ)る]]。その結果(けっか)、眠(ねむ)りを促(うなが)すホルモンが出(で)難(にく)く成(な)り、寝付(ねつ)きが悪(わる)く成(な)る[[上(うえ)に]]、眠(ねむ)りも浅(あさ)く成(な)ると言(い)われて居(い)る。","zh":"问题在于屏幕发出的光。手机的光可能会让大脑误以为\"现在是白天\"。结果，促进睡眠的激素难以分泌，不但难以入睡，睡眠也会变浅。"},{"jp":"「少(すこ)し丈(だけ)」の積(つ)もりでSNSを開(ひら)いても、次(つぎ)から次(つぎ)へと新(あたら)しい情報(じょうほう)が現(あらわ)れ、気付(きづ)けば一時間(いちじかん)も経(た)って居(い)た。そんな経験(けいけん)は誰(だれ)にでも有(あ)り[[得(う)る]]。丸(まる)で時間(じかん)が消(き)えて仕舞(しま)った[[かの様(よう)だ]]。","zh":"本想\"就看一会儿\"才打开社交软件，新信息却一条接一条冒出来，回过神来已经过去一个小时了。这样的经历谁都可能有过。时间就好像凭空消失了一样。"},{"jp":"睡眠不足(すいみんぶそく)は単(たん)なる疲(つか)れの問題(もんだい)[[に過(す)ぎない]]と考(かんが)える人(ひと)も居(い)るが、そうではない。集中力(しゅうちゅうりょく)の低下(ていか)や気分(きぶん)の落(お)ち込(こ)みに繋(つな)がる事(こと)も分(わ)かって来(き)た。睡眠時間(すいみんじかん)が毎日(まいにち)一時間(いちじかん)短(みじか)い[[とすると]]、一年(いちねん)で三百六十五時間(さんびゃくろくじゅうごじかん)、約(やく)十五日分(じゅうごにちぶん)の睡眠(すいみん)を失(うしな)う計算(けいさん)に成(な)る。","zh":"有人认为睡眠不足只不过是累一点而已，其实不然。研究已经发现，它还会导致注意力下降、情绪低落。假如每天少睡一个小时，一年就会失去365个小时，相当于约15天的睡眠。"},{"jp":"特(とく)に受験生(じゅけんせい)[[ともなると]]、夜遅(よるおそ)く迄(まで)勉強(べんきょう)した後(あと)、息抜(いきぬ)きにスマホを見(み)る事(こと)が多(おお)い。親(おや)の注意(ちゅうい)[[に反(はん)して]]、布団(ふとん)の中(なか)でこっそり使(つか)う子供(こども)も少(すく)なくない。","zh":"特别是到了考生阶段，深夜学习之后常会看看手机放松一下。不听父母劝告、躲在被窝里偷偷用手机的孩子也不少。"},{"jp":"子供(こども)[[に対(たい)して]]「スマホを止(や)めなさい」と言(い)う丈(だけ)では、問題(もんだい)は解決(かいけつ)しない。抑(そもそ)も親(おや)自身(じしん)が夜中(よなか)迄(まで)スマホを手放(てばな)さないのだから、大人(おとな)の態度(たいど)[[からして]]改(あらた)める必要(ひつよう)が有(あ)る。寝室(しんしつ)にスマホを持(も)ち込(こ)まない、寝(ね)る一時間前(いちじかんまえ)には電源(でんげん)を切(き)る等(など)、家族(かぞく)全員(ぜんいん)で取(と)り組(く)める良(よ)い方法(ほうほう)は[[無(な)い物(もの)か]]。","zh":"光对孩子说\"别玩手机了\"，问题是解决不了的。说到底，父母自己就半夜还手机不离手，首先就得从大人的态度改起。比如不把手机带进卧室、睡前一小时关机等等，难道就没有全家人能一起实践的好办法吗？"},{"jp":"良(よ)い睡眠(すいみん)は、健康(けんこう)な生活(せいかつ)の土台(どだい)だ。便利(べんり)な道具(どうぐ)に使(つか)われるのではなく、上手(じょうず)に使(つか)い熟(こな)したい物(もの)である。","zh":"良好的睡眠是健康生活的基础。我们不该被方便的工具所支配，而应该好好地驾驭它。"}],"grammar":[["〜つつ有(あ)る","正在……（逐渐变化）","地球(ちきゅう)の気温(きおん)は年々(ねんねん)上(あ)がり[[つつ有(あ)る]]。","地球的气温正在逐年上升。","怪我(けが)は順調(じゅんちょう)に回復(かいふく)し[[つつ有(あ)る]]。","伤势正在顺利恢复。"],["〜を元(もと)に","以……为基础、依据","実際(じっさい)の事件(じけん)[[を元(もと)に]]、小説(しょうせつ)を書(か)いた。","以真实事件为原型写了小说。","アンケートの結果(けっか)[[を元(もと)に]]、新(あたら)しい商品(しょうひん)を開発(かいはつ)した。","以问卷调查的结果为依据开发了新产品。"],["〜と言(い)う事(こと)だ","据说……（传闻）","ニュースに依(よ)ると、来月(らいげつ)から電気代(でんきだい)が上(あ)がる[[と言(い)う事(こと)だ]]。","据新闻报道，从下个月起电费要涨了。","田中(たなか)さんは来年(らいねん)結婚(けっこん)する[[と言(い)う事(こと)だ]]。","听说田中明年要结婚。"],["〜恐(おそ)れが有(あ)る","有……的危险，恐怕会……","台風(たいふう)の影響(えいきょう)で、川(かわ)が氾濫(はんらん)する[[恐(おそ)れが有(あ)る]]。","受台风影响，河水有泛滥的危险。","この儘(まま)では、会社(かいしゃ)が倒産(とうさん)する[[恐(おそ)れが有(あ)る]]。","照这样下去，公司恐怕会倒闭。"],["〜上(うえ)に","不仅……而且……","この部屋(へや)は広(ひろ)い[[上(うえ)に]]、駅(えき)からも近(ちか)い。","这个房间不仅宽敞，离车站也近。","道(みち)に迷(まよ)った[[上(うえ)に]]、雨(あめ)迄(まで)降(ふ)って来(き)た。","不但迷了路，还下起雨来了。"],["〜得(う)る","有可能……","地震(じしん)は何時(いつ)でも起(お)こり[[得(う)る]]。","地震随时都可能发生。","それは誰(だれ)にでも有(あ)り[[得(う)る]]失敗(しっぱい)だ。","那是谁都可能犯的错误。"],["〜かの様(よう)だ","好像……一样（实际并非如此）","彼(かれ)は何(なに)も知(し)らない[[かの様(よう)に]]振(ふ)る舞(ま)った。","他表现得好像什么都不知道。","今日(きょう)は暖(あたた)かくて、春(はる)が来(き)た[[かの様(よう)だ]]。","今天很暖和，好像春天来了一样。"],["〜に過(す)ぎない","只不过是……","それは噂(うわさ)[[に過(す)ぎない]]。","那只不过是传闻而已。","私(わたし)は一(いち)社員(しゃいん)[[に過(す)ぎない]]ので、決(き)める権限(けんげん)は無(な)い。","我只不过是个普通员工，没有决定权。"],["〜とすると","假如……的话","毎月(まいつき)三万円(さんまんえん)貯金(ちょきん)する[[とすると]]、一年(いちねん)で三十六万円(さんじゅうろくまんえん)に成(な)る。","假如每月存三万日元，一年就是三十六万日元。","彼(かれ)が犯人(はんにん)でない[[とすると]]、一体(いったい)誰(だれ)が遣(や)ったのだろう。","假如他不是犯人，那到底是谁干的呢？"],["〜ともなると","一旦到了……（的程度、阶段）","大学生(だいがくせい)[[ともなると]]、自分(じぶん)の事(こと)は自分(じぶん)で決(き)めなければ成(な)らない。","到了大学生的年纪，自己的事就得自己决定。","年末(ねんまつ)[[ともなると]]、どこの店(みせ)も混(こ)み合(あ)う。","一到年底，哪家店都很拥挤。"],["〜に反(はん)して","与……相反，违反……","予想(よそう)[[に反(はん)して]]、試験(しけん)は易(やさ)しかった。","与预想相反，考试很简单。","親(おや)の期待(きたい)[[に反(はん)して]]、彼(かれ)は大学(だいがく)を辞(や)めた。","他违背父母的期望，退学了。"],["〜に対(たい)して","对……；与……相对","先生(せんせい)[[に対(たい)して]]、そんな言(い)い方(かた)は失礼(しつれい)だ。","对老师那样说话很失礼。","兄(あに)が活発(かっぱつ)なの[[に対(たい)して]]、弟(おとうと)は大人(おとな)しい。","哥哥很活泼，弟弟却很文静。"],["〜からして","单从……来看就，首先……就","彼(かれ)は話(はな)し方(かた)[[からして]]、自信(じしん)が無(な)さそうだ。","单从他说话的样子来看，就好像没什么自信。","この店(みせ)は入口(いりぐち)[[からして]]高級(こうきゅう)な感(かん)じがする。","这家店光看门口就很高档。"],["〜無(な)い物(もの)か","难道没有……吗，能不能……呢（愿望）","毎日(まいにち)の通勤(つうきん)をもっと楽(らく)にする方法(ほうほう)は[[無(な)い物(もの)か]]。","难道没有让每天通勤更轻松的办法吗？","何(なん)とかして、彼女(かのじょ)を元気付(げんきづ)けられ[[ない物(もの)か]]。","能不能想办法让她振作起来呢？"]],"vocab":[["普及","ふきゅう","普及"],["直前","ちょくぜん","即将……之前"],["操作","そうさ","操作"],["勘違い","かんちがい","误会，误以为"],["促す","うながす","促进，催促"],["寝付き","ねつき","入睡"],["浅い","あさい","浅"],["気付く","きづく","察觉"],["落ち込み","おちこみ","低落，消沉"],["息抜き","いきぬき","放松，休息"],["布団","ふとん","被褥"],["手放す","てばなす","放手"],["抑も","そもそも","说到底，本来"],["土台","どだい","基础"]],"short":"スマホと睡眠","lv":2,"sum":"睡前玩手机为什么影响睡眠？结合调查结果说明问题并提出建议，偏说明文。"},
{"title":"食品(しょくひん)ロスを減(へ)らすには","paras":[{"jp":"未(ま)だ食(た)べられるのに捨(す)てられて仕舞(しま)う食品(しょくひん)を「食品(しょくひん)ロス」と言(い)う。日本(にほん)では、年間(ねんかん)約(やく)五百万(ごひゃくまん)トンもの食品(しょくひん)ロスが発生(はっせい)して居(い)る。これは、国民(こくみん)一人(ひとり)一人(ひとり)が毎日(まいにち)、御(お)茶碗(ちゃわん)一杯分(いっぱいぶん)の御飯(ごはん)を捨(す)てて居(い)るのと同(おな)じ量(りょう)だ。","zh":"明明还能吃却被扔掉的食物，叫作\"食品浪费\"。日本每年产生的食品浪费约有五百万吨，相当于每个国民每天都扔掉一碗米饭。"},{"jp":"食品(しょくひん)ロスは、家庭(かてい)[[は元(もと)より]]、スーパーやコンビニ、飲食店(いんしょくてん)等(など)、有(あ)らゆる場所(ばしょ)で生(う)まれて居(い)る。そして、この問題(もんだい)は環境(かんきょう)に悪影響(あくえいきょう)を与(あた)える[[のみならず]]、処理(しょり)に多額(たがく)の税金(ぜいきん)が使(つか)われると言(い)う点(てん)でも見過(みす)ごせない。","zh":"食品浪费不只发生在家庭，超市、便利店、餐馆等各种地方都会产生。这个问题不仅对环境造成不良影响，处理时还要花掉大量税金，这一点也不容忽视。"},{"jp":"店(みせ)が多(おお)くの食品(しょくひん)を捨(す)てるのは、消費者(しょうひしゃ)が少(すこ)しでも新(あたら)しい物(もの)を求(もと)めるからでもある。棚(たな)の奥(おく)から日付(ひづけ)の新(あたら)しい牛乳(ぎゅうにゅう)を取(と)る人(ひと)を見掛(みか)けた事(こと)が有(あ)るだろう。良(よ)くないと知(し)り[[ながらも]]、つい遣(や)って仕舞(しま)う人(ひと)は多(おお)い。","zh":"商店扔掉大量食品，也是因为消费者总想要更新鲜一点的东西。大家应该都见过从货架深处拿日期更新的牛奶的人吧。明知不好，却还是忍不住这么做的人很多。"},{"jp":"家庭(かてい)では、買(か)い物(もの)の前(まえ)に冷蔵庫(れいぞうこ)の中(なか)を確認(かくにん)し[[さえすれば]]、同(おな)じ物(もの)を二度(にど)買(か)う事(こと)は無(な)く成(な)る。又(また)、味(あじ)[[はともかく]]、残(のこ)り物(もの)を工夫(くふう)して別(べつ)の料理(りょうり)に作(つく)り変(か)えるのも一(ひと)つの方法(ほうほう)だ。","zh":"在家里，只要买东西前看一下冰箱，就不会重复买同样的东西。另外，先不说味道如何，花点心思把剩菜做成别的菜，也是一个办法。"},{"jp":"最近(さいきん)では、賞味期限(しょうみきげん)が近(ちか)い商品(しょうひん)を安(やす)く売(う)る店(みせ)や、子供食堂(こどもしょくどう)[[向(む)け]]に余(あま)った食品(しょくひん)を寄付(きふ)する企業(きぎょう)も増(ふ)えて来(き)た。賞味期限(しょうみきげん)は「美味(おい)しく食(た)べられる期限(きげん)」であり、過(す)ぎたら直(す)ぐに食(た)べられなく成(な)る[[と言(い)う物(もの)ではない]]。","zh":"最近，把临近赏味期限的商品便宜出售的商店，以及把多余食品捐给儿童食堂的企业也多了起来。赏味期限是\"能好吃地吃完的期限\"，并不是一过期就马上不能吃了。"},{"jp":"勿論(もちろん)、安全(あんぜん)[[を抜(ぬ)きにして]]食品(しょくひん)ロスの問題(もんだい)を語(かた)る事(こと)は出来(でき)ない。消費期限(しょうひきげん)の過(す)ぎた物(もの)を無理(むり)に食(た)べる必要(ひつよう)は無(な)い。小(ちい)さな工夫(くふう)である[[にせよ]]、一人(ひとり)一人(ひとり)が意識(いしき)を変(か)え[[つつ]]、出来(でき)る事(こと)を続(つづ)けて行(い)く事(こと)が大切(たいせつ)だ。","zh":"当然，抛开安全来谈食品浪费问题是不行的。过了消费期限的东西，没必要硬着头皮吃。即使只是小小的努力，每个人一边转变意识，一边坚持做力所能及的事，这才是最重要的。"},{"jp":"食(た)べ物(もの)を大切(たいせつ)にする事(こと)は、それを作(つく)った人(ひと)への感謝(かんしゃ)[[に他(ほか)ならない]]。豊(ゆた)かな時代(じだい)だ[[からこそ]]、「勿体無(もったいな)い」と言(い)う言葉(ことば)の意味(いみ)を、改(あらた)めて考(かんが)えて見(み)たい。","zh":"珍惜食物，正是对生产者的感谢。正因为生活在富足的时代，我们更应该重新思考\"可惜\"这个词的含义。"}],"grammar":[["〜は元(もと)より","……自不必说，……就更不用提","この店(みせ)は味(あじ)[[は元(もと)より]]、サービスも素晴(すば)らしい。","这家店味道自不必说，服务也很棒。","彼(かれ)は英語(えいご)[[は元(もと)より]]、中国語(ちゅうごくご)も話(はな)せる。","他英语自不用说，还会说中文。"],["〜のみならず","不仅……而且……（书面）","この問題(もんだい)は若者(わかもの)[[のみならず]]、高齢者(こうれいしゃ)にも関係(かんけい)が有(あ)る。","这个问题不仅关系到年轻人，也关系到老年人。","彼(かれ)は勉強(べんきょう)が出来(でき)る[[のみならず]]、スポーツも得意(とくい)だ。","他不仅学习好，还擅长运动。"],["〜ながらも","虽然……但是……","狭(せま)い[[ながらも]]、自分(じぶん)の家(いえ)を持(も)てて嬉(うれ)しい。","虽然小，但有了自己的房子很高兴。","彼(かれ)は貧(まず)しい[[ながらも]]、幸(しあわ)せな生活(せいかつ)を送(おく)って居(い)る。","他虽然贫穷，却过着幸福的生活。"],["〜さえ〜ば","只要……就……","住所(じゅうしょ)[[さえ分(わ)かれば]]、荷物(にもつ)を送(おく)れます。","只要知道地址，就能寄东西。","この薬(くすり)を飲(の)み[[さえすれば]]、直(す)ぐに治(なお)りますよ。","只要吃了这个药，马上就会好的。"],["〜はともかく","……暂且不论","値段(ねだん)[[はともかく]]、デザインは素晴(すば)らしい。","价格暂且不论，设计非常棒。","結果(けっか)[[はともかく]]、最後(さいご)迄(まで)頑張(がんば)った事(こと)が大切(たいせつ)だ。","结果如何暂且不论，坚持到最后才最重要。"],["〜向(む)け","面向……，以……为对象","これは子供(こども)[[向(む)け]]の番組(ばんぐみ)だ。","这是面向儿童的节目。","外国人(がいこくじん)[[向(む)け]]の日本語(にほんご)講座(こうざ)に申(もう)し込(こ)んだ。","报名参加了面向外国人的日语讲座。"],["〜と言(い)う物(もの)ではない","并不是……，未必……","値段(ねだん)が高(たか)ければ良(よ)い[[と言(い)う物(もの)ではない]]。","并不是价格越高就越好。","長(なが)く勉強(べんきょう)すれば成績(せいせき)が上(あ)がる[[と言(い)う物(もの)ではない]]。","并不是学得时间长，成绩就一定会提高。"],["〜を抜(ぬ)きにして","抛开……，去掉……","彼(かれ)の協力(きょうりょく)[[を抜(ぬ)きにして]]、この計画(けいかく)は成功(せいこう)しなかった。","没有他的协助，这个计划就不会成功。","冗談(じょうだん)[[を抜(ぬ)きにして]]、真面目(まじめ)に話(はな)し合(あ)おう。","不开玩笑了，认真谈谈吧。"],["〜にせよ","即使……也；无论……","理由(りゆう)が有(あ)った[[にせよ]]、約束(やくそく)を破(やぶ)るのは良(よ)くない。","即使有理由，违背约定也是不对的。","行(い)く[[にせよ]]行(い)かない[[にせよ]]、早(はや)めに連絡(れんらく)して下(くだ)さい。","不管去不去，请早点联系。"],["〜つつ","一边……一边；虽然……却","音楽(おんがく)を聞(き)き[[つつ]]、勉強(べんきょう)する。","一边听音乐一边学习。","体(からだ)に悪(わる)いと知(し)り[[つつ]]、煙草(たばこ)を止(や)められない。","明知对身体不好，却戒不掉烟。"],["〜に他(ほか)ならない","正是……，无非是……","今回(こんかい)の成功(せいこう)は、皆(みな)さんの努力(どりょく)の結果(けっか)[[に他(ほか)ならない]]。","这次的成功完全是大家努力的结果。","親(おや)が厳(きび)しいのは、子供(こども)を愛(あい)して居(い)るから[[に他(ほか)ならない]]。","父母严格，正是因为爱孩子。"],["〜からこそ","正因为……才……","好(す)きだ[[からこそ]]、厳(きび)しく言(い)うのだ。","正因为喜欢，才说得严厉。","失敗(しっぱい)した[[からこそ]]、学(まな)べた事(こと)も多(おお)い。","正因为失败过，才学到了很多东西。"]],"vocab":[["発生","はっせい","发生，产生"],["茶碗","ちゃわん","饭碗"],["有らゆる","あらゆる","所有的，一切"],["悪影響","あくえいきょう","不良影响"],["多額","たがく","巨额"],["見過ごす","みすごす","忽视，放过"],["消費者","しょうひしゃ","消费者"],["冷蔵庫","れいぞうこ","冰箱"],["残り物","のこりもの","剩菜，剩余的东西"],["賞味期限","しょうみきげん","赏味期限（最佳食用期）"],["寄付","きふ","捐赠"],["消費期限","しょうひきげん","消费期限（安全食用期）"],["勿体無い","もったいない","可惜，浪费"],["豊か","ゆたか","富足，丰富"]],"short":"食品ロス","lv":2,"sum":"日本每年扔掉大量还能吃的食物，从商店、家庭、个人几个角度讨论对策。"},
{"title":"外国人観光客(がいこくじんかんこうきゃく)と地域(ちいき)","paras":[{"jp":"ここ十年(じゅうねん)程(ほど)で、日本(にほん)を訪(おとず)れる外国人観光客(がいこくじんかんこうきゃく)は大幅(おおはば)に増(ふ)えた。円安(えんやす)の影響(えいきょう)も有(あ)り、今(いま)や観光(かんこう)は日本(にほん)経済(けいざい)を支(ささ)える産業(さんぎょう)の一(ひと)つ[[と言(い)うより]]、地方(ちほう)に取(と)っては欠(か)かせない柱(はしら)と成(な)って居(い)る。","zh":"近十年来，访日外国游客大幅增加。再加上日元贬值的影响，如今旅游业与其说是支撑日本经济的产业之一，不如说对地方而言已经成了不可或缺的支柱。"},{"jp":"観光客(かんこうきゃく)の増加(ぞうか)[[に関(かん)して]]は、地元(じもと)の住民(じゅうみん)の間(あいだ)でも意見(いけん)が分(わ)かれて居(い)る。店(みせ)の売(う)り上(あ)げが伸(の)びたと喜(よろこ)ぶ人(ひと)が居(い)る一方(いっぽう)、バスや電車(でんしゃ)が混雑(こんざつ)して生活(せいかつ)に支障(ししょう)が出(で)て居(い)ると訴(うった)える声(こえ)も少(すく)なくない。","zh":"关于游客增加这件事，当地居民之间也意见分歧。有人为店铺营业额增长而高兴，也有不少人抱怨公交、电车拥挤，影响了日常生活。"},{"jp":"京都(きょうと)では、人気(にんき)の観光地(かんこうち)が朝(あさ)から人(ひと)[[だらけ]]で、住民(じゅうみん)が買(か)い物(もの)に行(い)くのにも苦労(くろう)する程(ほど)だ。中(なか)には、私有地(しゆうち)に入(はい)ったり、周囲(しゅうい)の迷惑(めいわく)[[も構(かま)わず]]大声(おおごえ)で話(はな)したりする観光客(かんこうきゃく)も居(い)る。","zh":"在京都，热门景点从早上起就到处是人，当地居民连去买东西都很费劲。其中还有闯进私人土地、不顾周围人感受大声喧哗的游客。"},{"jp":"然(しか)し、彼(かれ)らも悪気(わるぎ)が有(あ)って遣(や)って居(い)る[[筈(はず)が無(な)い]]。文化(ぶんか)や習慣(しゅうかん)の違(ちが)いを知(し)らない丈(だけ)の場合(ばあい)が殆(ほとん)どだ。観光客(かんこうきゃく)を受(う)け入(い)れる[[以上(いじょう)は]]、地域(ちいき)の側(がわ)も、マナーを分(わ)かり易(やす)く伝(つた)える工夫(くふう)をす[[可(べ)きだ]]。","zh":"不过，他们不可能是故意这么做的。大多只是不了解文化和习惯上的差异。既然要接待游客，当地也应该想办法把礼仪规矩简明易懂地传达出去。"},{"jp":"例(たと)えば或(あ)る町(まち)では、多言語(たげんご)の案内板(あんないばん)や動画(どうが)[[を通(つう)じて]]、塵(ごみ)の捨(す)て方(かた)や写真(しゃしん)撮影(さつえい)のルールを紹介(しょうかい)して居(い)る。又(また)、安全(あんぜん)[[上(じょう)]]の理由(りゆう)から、一部(いちぶ)の道(みち)は夜間(やかん)の立(た)ち入(い)りが禁止(きんし)された。","zh":"例如，有个城镇通过多语言指示牌和视频，介绍扔垃圾的方法和拍照规则。另外，出于安全上的考虑，部分道路禁止夜间进入。"},{"jp":"観光客(かんこうきゃく)の数(かず)の問題(もんだい)[[は扨(さ)て置(お)き]]、大切(たいせつ)なのは、訪(おとず)れる人(ひと)と住(す)む人(ひと)が互(たが)いを尊重(そんちょう)する事(こと)だ。旅行者(りょこうしゃ)[[にしろ]]住民(じゅうみん)にしろ、同(おな)じ町(まち)を大切(たいせつ)に思(おも)う気持(きも)ちは変(か)わらない筈(はず)だ。","zh":"游客数量的问题暂且不论，重要的是来访者和居民相互尊重。无论是旅行者还是居民，珍惜同一座城市的心情应该是一样的。"},{"jp":"国籍(こくせき)が何(なん)[[であれ]]、旅(たび)の思(おも)い出(で)を良(よ)い物(もの)にしたいと願(ねが)う気持(きも)ちは同(おな)じだ。混雑(こんざつ)が更(さら)に酷(ひど)く成(な)ら[[ないうちに]]、国(くに)と地域(ちいき)が協力(きょうりょく)して対策(たいさく)を進(すす)める必要(ひつよう)が有(あ)る。来年(らいねん)の大型(おおがた)イベント[[に際(さい)して]]は、観光客(かんこうきゃく)の分散(ぶんさん)を図(はか)る新(あたら)しい仕組(しく)みも導入(どうにゅう)される予定(よてい)だ。","zh":"无论国籍是什么，希望旅行留下美好回忆的心情都是一样的。必须趁拥挤还没进一步恶化，由国家和地方合作推进对策。在明年举办大型活动之际，还计划引入分流游客的新机制。"}],"grammar":[["〜と言(い)うより","与其说……不如说……","今日(きょう)は暖(あたた)かい[[と言(い)うより]]、暑(あつ)い位(くらい)だ。","今天与其说暖和，不如说有点热了。","彼(かれ)は友達(ともだち)[[と言(い)うより]]、家族(かぞく)の様(よう)な存在(そんざい)だ。","他与其说是朋友，不如说更像家人。"],["〜に関(かん)して","关于……","この件(けん)[[に関(かん)して]]、何(なに)か質問(しつもん)は有(あ)りますか。","关于这件事，有什么问题吗？","日本(にほん)の歴史(れきし)[[に関(かん)して]]論文(ろんぶん)を書(か)いて居(い)る。","正在写关于日本历史的论文。"],["〜だらけ","满是……，全是……","子供達(こどもたち)は泥(どろ)[[だらけ]]に成(な)って遊(あそ)んで居(い)た。","孩子们玩得满身是泥。","彼(かれ)の作文(さくぶん)は間違(まちが)い[[だらけ]]だ。","他的作文错误百出。"],["〜も構(かま)わず","不顾……，不在乎……","彼女(かのじょ)は人目(ひとめ)[[も構(かま)わず]]泣(な)き出(だ)した。","她不顾旁人的目光哭了起来。","雨(あめ)に濡(ぬ)れるの[[も構(かま)わず]]、子供達(こどもたち)は外(そと)で遊(あそ)んで居(い)る。","孩子们不顾淋雨，在外面玩。"],["〜筈(はず)が無(な)い","不可能……","真面目(まじめ)な彼(かれ)が、約束(やくそく)を忘(わす)れる[[筈(はず)が無(な)い]]。","认真的他不可能忘记约定。","こんな難(むずか)しい問題(もんだい)、子供(こども)に解(と)ける[[筈(はず)が無(な)い]]。","这么难的题，孩子不可能解得出来。"],["〜以上(いじょう)は","既然……就……","引(ひ)き受(う)けた[[以上(いじょう)は]]、最後(さいご)迄(まで)責任(せきにん)を持(も)つ。","既然接下了，就负责到底。","試合(しあい)に出(で)る[[以上(いじょう)は]]、勝(か)ちたい。","既然要上场比赛，就想赢。"],["〜可(べ)きだ","应该……","自分(じぶん)の間違(まちが)いは、素直(すなお)に認(みと)める[[可(べ)きだ]]。","自己的错误应该坦率承认。","若(わか)いうちに、色々(いろいろ)な経験(けいけん)をす[[可(べ)きだ]]。","应该趁年轻多积累各种经验。"],["〜を通(つう)じて","通过……；在整个……期间","友人(ゆうじん)[[を通(つう)じて]]、彼女(かのじょ)と知(し)り合(あ)った。","通过朋友认识了她。","この地域(ちいき)は一年(いちねん)[[を通(つう)じて]]暖(あたた)かい。","这个地区一年到头都很暖和。"],["〜上(じょう)","在……上，从……方面来看","健康(けんこう)[[上(じょう)]]の理由(りゆう)で、会社(かいしゃ)を辞(や)めた。","因为健康上的原因辞职了。","この話(はなし)は、法律(ほうりつ)[[上(じょう)]]問題(もんだい)が有(あ)る。","这件事在法律上有问题。"],["〜は扨(さ)て置(お)き","……暂且不提","冗談(じょうだん)[[は扨(さ)て置(お)き]]、本題(ほんだい)に入(はい)りましょう。","玩笑先放一边，进入正题吧。","費用(ひよう)の事(こと)[[は扨(さ)て置(お)き]]、先(ま)ず計画(けいかく)を立(た)てよう。","费用的事暂且不提，先订计划吧。"],["〜にしろ〜にしろ","无论……还是……","行(い)く[[にしろ]]行(い)かない[[にしろ]]、返事(へんじ)を下(くだ)さい。","不管去不去，请给个答复。","冗談(じょうだん)だった[[にしろ]]、言(い)って良(よ)い事(こと)と悪(わる)い事(こと)が有(あ)る。","即使是开玩笑，话也有能说和不能说的。"],["〜であれ","无论……都","理由(りゆう)が何(なん)[[であれ]]、暴力(ぼうりょく)は許(ゆる)されない。","不管理由是什么，暴力都不能被原谅。","どんな仕事(しごと)[[であれ]]、真剣(しんけん)に取(と)り組(く)む可(べ)きだ。","无论什么工作，都应该认真对待。"],["〜ないうちに","趁还没……","雨(あめ)が降(ふ)ら[[ないうちに]]、帰(かえ)りましょう。","趁还没下雨，回去吧。","冷(さ)め[[ないうちに]]、召(め)し上(あ)がって下(くだ)さい。","请趁热吃。"],["〜に際(さい)して","在……之际","入学(にゅうがく)[[に際(さい)して]]、必要(ひつよう)な書類(しょるい)を提出(ていしゅつ)して下(くだ)さい。","入学时请提交所需材料。","海外旅行(かいがいりょこう)[[に際(さい)して]]、保険(ほけん)に加入(かにゅう)した。","出国旅行之际买了保险。"]],"vocab":[["大幅","おおはば","大幅度"],["円安","えんやす","日元贬值"],["柱","はしら","支柱"],["地元","じもと","当地"],["混雑","こんざつ","拥挤"],["支障","ししょう","障碍，妨碍"],["訴える","うったえる","申诉，诉说"],["私有地","しゆうち","私人土地"],["悪気","わるぎ","恶意"],["受け入れる","うけいれる","接受，接纳"],["多言語","たげんご","多语言"],["撮影","さつえい","拍摄"],["尊重","そんちょう","尊重"],["分散","ぶんさん","分散"]],"short":"外国人観光客","lv":2,"sum":"访日游客大幅增加带来的好处和烦恼，以及当地居民与游客如何共处。"},
{"title":"地方移住(ちほういじゅう)と言(い)う選択(せんたく)","paras":[{"jp":"東京(とうきょう)で十年(じゅうねん)働(はたら)いた山本(やまもと)さんは、三年前(さんねんまえ)に長野県(ながのけん)の小(ちい)さな村(むら)に移住(いじゅう)した。切(き)っ掛(か)けは、毎日(まいにち)の満員電車(まんいんでんしゃ)と長時間労働(ちょうじかんろうどう)に疲(つか)れ果(は)てた事(こと)だった。「この儘(まま)では、自分(じぶん)の時間(じかん)を楽(たの)しむ[[どころではない]]と思(おも)ったんです」と山本(やまもと)さんは振(ふ)り返(かえ)る。","zh":"在东京工作了十年的山本先生，三年前移居到了长野县的一个小村子。起因是他被每天的满员电车和长时间工作弄得筋疲力尽。山本先生回忆说：\"那时我觉得照这样下去，根本谈不上享受自己的时间。\""},{"jp":"移住(いじゅう)を決(き)めた当初(とうしょ)、家族(かぞく)は反対(はんたい)した。都会(とかい)育(そだ)ちの妻(つま)[[から見(み)ると]]、田舎(いなか)暮(ぐ)らしは不便(ふべん)その物(もの)だったのだろう。然(しか)し山本(やまもと)さんの決意(けつい)は固(かた)く、「借金(しゃっきん)をして[[でも]]、新(あたら)しい生活(せいかつ)を始(はじ)めたい」と家族(かぞく)を説得(せっとく)した。","zh":"刚决定移居时，家人表示反对。在城里长大的妻子看来，乡下生活大概就是不方便的代名词吧。但山本先生决心很坚定，他说服家人：\"就算借钱，我也想开始新的生活。\""},{"jp":"村(むら)には、空(あ)き家(や)を安(やす)く借(か)りられる制度(せいど)が有(あ)った。五年(ごねん)以上(いじょう)住(す)む事(こと)[[を前提(ぜんてい)に]]、家賃(やちん)の一部(いちぶ)を村(むら)が負担(ふたん)して呉(く)れるのだ。山本(やまもと)さんは元々(もともと)パソコン[[に掛(か)けては]]詳(くわ)しかったので、東京(とうきょう)の会社(かいしゃ)の仕事(しごと)をリモートで続(つづ)ける事(こと)にした。","zh":"村里有一项可以低价租用空房的制度。以居住五年以上为前提，村里会负担一部分房租。山本先生原本就精通电脑，于是决定远程继续做东京公司的工作。"},{"jp":"実際(じっさい)に暮(く)らして見(み)ると、不便(ふべん)な事(こと)も多(おお)かった。冬(ふゆ)は雪(ゆき)が深(ふか)く、一番(いちばん)近(ちか)いスーパー迄(まで)車(くるま)で三十分(さんじゅっぷん)掛(か)かる。都会(とかい)の便利(べんり)さに慣(な)れて居(い)た[[許(ばか)りに]]、最初(さいしょ)の冬(ふゆ)は食料(しょくりょう)の買(か)い置(お)きを忘(わす)れて困(こま)った事(こと)も有(あ)ったと言(い)う。","zh":"实际住下来，不方便的地方也很多。冬天积雪很深，开车到最近的超市也要三十分钟。就因为习惯了城市的便利，第一个冬天还曾因忘了囤粮而犯愁。"},{"jp":"それでも山本(やまもと)さんは、「野菜(やさい)は採(と)れ立(た)てを食(た)べる[[に限(かぎ)る]]」と笑(わら)う。今(いま)では近所(きんじょ)の農家(のうか)から畑(はたけ)を借(か)りて、家族(かぞく)で野菜(やさい)を育(そだ)てて居(い)る。山(やま)に囲(かこ)まれて居(い)る[[所(ところ)から]]、この村(むら)の水(みず)は特(とく)に美味(おい)しいと評判(ひょうばん)だそうだ。","zh":"尽管如此，山本先生还是笑着说：\"蔬菜还得吃刚摘的。\"现在他从附近农户那里租了块地，和家人一起种菜。据说因为四面环山，这个村子的水以特别好喝而闻名。"},{"jp":"最初(さいしょ)は反対(はんたい)して居(い)た妻(つま)も、今(いま)では村(むら)の料理教室(りょうりきょうしつ)の講師(こうし)[[として]]活躍(かつやく)して居(い)る。元々(もともと)レストランで働(はたら)いて居(い)た[[丈(だけ)あって]]、彼女(かのじょ)の料理(りょうり)は村人(むらびと)にも大人気(だいにんき)だ。","zh":"当初反对的妻子，现在也作为村里料理教室的讲师大显身手。不愧是在餐厅工作过的人，她做的菜在村民中也大受欢迎。"},{"jp":"勿論(もちろん)、誰(だれ)もが地方移住(ちほういじゅう)に向(む)いて居(い)る訳(わけ)ではない。若(も)し自分(じぶん)が移住(いじゅう)する[[としたら]]、仕事(しごと)や医療(いりょう)、子供(こども)の教育(きょういく)に就(つ)いて良(よ)く調(しら)べて置(お)く必要(ひつよう)が有(あ)るだろう。","zh":"当然，并不是每个人都适合移居地方。如果自己要移居的话，就有必要事先好好调查工作、医疗和孩子的教育等问题。"},{"jp":"「真面目(まじめ)な山本(やまもと)さんの[[事(こと)だから]]、必(かなら)ず上手(うま)く行(い)くと思(おも)って居(い)ました」と村長(そんちょう)は言(い)う。三年(さんねん)で村(むら)に溶(と)け込(こ)んだのは、流石(さすが)努力家(どりょくか)の彼(かれ)[[丈(だけ)の事(こと)は有(あ)る]]。「健康(けんこう)な[[限(かぎ)り]]、ここで暮(く)らし続(つづ)けたい」と語(かた)る山本(やまもと)さんの顔(かお)は、東京(とうきょう)に居(い)た頃(ころ)よりずっと明(あか)るかった。","zh":"村长说：\"认真的山本先生，我就知道他一定会顺利的。\"三年就融入了村子，真不愧是个肯努力的人。山本先生说：\"只要身体健康，我想一直在这里生活下去。\"他的脸比在东京时开朗多了。"}],"grammar":[["〜どころではない","哪里顾得上……，根本谈不上……","仕事(しごと)が忙(いそが)しくて、旅行(りょこう)[[どころではない]]。","工作太忙，哪里顾得上旅行。","熱(ねつ)が有(あ)って、勉強(べんきょう)する[[どころではなかった]]。","发烧了，根本没法学习。"],["〜から見(み)ると","从……来看，在……看来","子供(こども)[[から見(み)ると]]、大人(おとな)の世界(せかい)は不思議(ふしぎ)な物(もの)だ。","在孩子看来，大人的世界很不可思议。","外国人(がいこくじん)[[から見(み)ると]]、日本(にほん)の習慣(しゅうかん)は珍(めずら)しいらしい。","在外国人看来，日本的习惯好像很新奇。"],["〜てでも","就算……也要……","徹夜(てつや)して[[でも]]、明日(あした)迄(まで)にこの仕事(しごと)を終(お)わらせる。","就算熬夜，也要在明天之前把这份工作做完。","どんな手段(しゅだん)を使(つか)って[[でも]]、彼(かれ)を助(たす)けたい。","不管用什么办法，都想救他。"],["〜を前提(ぜんてい)に","以……为前提","結婚(けっこん)[[を前提(ぜんてい)に]]、付(つ)き合(あ)って下(くだ)さい。","请以结婚为前提和我交往。","この計画(けいかく)は、予算(よさん)が通(とお)る事(こと)[[を前提(ぜんてい)に]]進(すす)めて居(い)る。","这个计划是以预算获批为前提推进的。"],["〜に掛(か)けては","在……方面（最拿手）","料理(りょうり)[[に掛(か)けては]]、彼(かれ)の右(みぎ)に出(で)る者(もの)は居(い)ない。","论做菜，没有人比得上他。","足(あし)の速(はや)さ[[に掛(か)けては]]、誰(だれ)にも負(ま)けない。","论跑得快，我不输给任何人。"],["〜許(ばか)りに","就因为……（导致不好的结果）","一言(ひとこと)余計(よけい)な事(こと)を言(い)った[[許(ばか)りに]]、彼女(かのじょ)を怒(おこ)らせて仕舞(しま)った。","就因为多说了一句，惹她生气了。","地図(ちず)を持(も)って行(い)かなかった[[許(ばか)りに]]、道(みち)に迷(まよ)った。","就因为没带地图，迷路了。"],["〜に限(かぎ)る","……最好","疲(つか)れた時(とき)は、寝(ね)る[[に限(かぎ)る]]。","累的时候，最好就是睡觉。","夏(なつ)はビール[[に限(かぎ)る]]。","夏天就得喝啤酒。"],["〜所(ところ)から","从……来看，因为……","駅(えき)に近(ちか)い[[所(ところ)から]]、この辺(あた)りは家賃(やちん)が高(たか)い。","因为离车站近，这一带房租很贵。","形(かたち)が富士山(ふじさん)に似(に)て居(い)る[[所(ところ)から]]、「〜富士(ふじ)」と呼(よ)ばれる山(やま)は多(おお)い。","因为形状像富士山，被称作\"某某富士\"的山很多。"],["〜として","作为……","彼(かれ)は通訳(つうやく)[[として]]会議(かいぎ)に参加(さんか)した。","他作为翻译参加了会议。","この寺(てら)は世界遺産(せかいいさん)[[として]]登録(とうろく)されて居(い)る。","这座寺庙被登录为世界遗产。"],["〜丈(だけ)あって","不愧是……，正因为……","十年(じゅうねん)も日本(にほん)に住(す)んで居(い)る[[丈(だけ)あって]]、彼(かれ)の日本語(にほんご)は完璧(かんぺき)だ。","不愧在日本住了十年，他的日语非常完美。","高(たか)かった[[丈(だけ)あって]]、この鞄(かばん)は丈夫(じょうぶ)だ。","不愧是贵的，这个包很结实。"],["〜としたら","如果……的话","若(も)し宝(たから)くじが当(あ)たった[[としたら]]、何(なに)を買(か)いますか。","如果中了彩票，你会买什么？","明日(あした)晴(は)れた[[としたら]]、海(うみ)へ行(い)こう。","如果明天晴了，就去海边吧。"],["〜事(こと)だから","因为是……（所以一定会）","時間(じかん)に厳(きび)しい彼(かれ)の[[事(こと)だから]]、もう着(つ)いて居(い)るだろう。","他那么守时，应该已经到了吧。","優(やさ)しい母(はは)の[[事(こと)だから]]、必(かなら)ず許(ゆる)して呉(く)れる。","妈妈那么温柔，一定会原谅我的。"],["〜丈(だけ)の事(こと)は有(あ)る","不愧是……，没白……","一流(いちりゅう)のホテル[[丈(だけ)の事(こと)は有(あ)って]]、サービスが素晴(すば)らしい。","不愧是一流酒店，服务非常好。","毎日(まいにち)練習(れんしゅう)して居(い)た[[丈(だけ)の事(こと)は有(あ)る]]。見事(みごと)な演奏(えんそう)だった。","每天练习果然没白练，演奏得真精彩。"],["〜限(かぎ)り","只要……；在……范围内","体(からだ)が動(うご)く[[限(かぎ)り]]、働(はたら)き続(つづ)けたい。","只要身体还能动，就想一直工作下去。","私(わたし)の知(し)って居(い)る[[限(かぎ)り]]、彼(かれ)は嘘(うそ)を吐(つ)かない人(ひと)だ。","就我所知，他是个不撒谎的人。"]],"vocab":[["移住","いじゅう","移居"],["疲れ果てる","つかれはてる","筋疲力尽"],["振り返る","ふりかえる","回顾"],["当初","とうしょ","当初"],["決意","けつい","决心"],["説得","せっとく","说服"],["空き家","あきや","空房子"],["負担","ふたん","负担"],["買い置き","かいおき","囤货"],["評判","ひょうばん","名声，口碑"],["講師","こうし","讲师"],["活躍","かつやく","活跃，大显身手"],["溶け込む","とけこむ","融入"],["流石","さすが","不愧，果然"]],"short":"地方移住","lv":2,"sum":"一位上班族从东京搬到长野的小村子，三年来的辛苦与收获。"},
{"title":"読書離(どくしょばな)れは本当(ほんとう)か","paras":[{"jp":"「若者(わかもの)の読書離(どくしょばな)れ」[[と言(い)うと]]、本(ほん)を全(まった)く読(よ)まない若者(わかもの)の姿(すがた)を思(おも)い浮(う)かべる人(ひと)が多(おお)いだろう。確(たし)かに、一(いっ)箇(か)月(げつ)に一冊(いっさつ)も本(ほん)を読(よ)まない大学生(だいがくせい)は半数(はんすう)を超(こ)えると言(い)う調査(ちょうさ)も有(あ)る。","zh":"一说起\"年轻人远离读书\"，很多人脑海里会浮现出完全不看书的年轻人的样子吧。确实，也有调查显示，一个月连一本书都不读的大学生超过了半数。"},{"jp":"中(なか)には教科書(きょうかしょ)[[すら]]読(よ)まない学生(がくせい)も居(い)ると、或(あ)る大学(だいがく)の教授(きょうじゅ)は嘆(なげ)く。授業(じゅぎょう)のレポートも、インターネットで調(しら)べた情報(じょうほう)を纏(まと)めた丈(だけ)の物(もの)が目立(めだ)つと言(い)う。","zh":"某大学的一位教授感叹说，有的学生甚至连教科书都不读。课堂报告也大多只是把网上查到的信息汇总一下而已。"},{"jp":"然(しか)し、読書離(どくしょばな)れが叫(さけ)ばれて居(い)る[[にも拘(かか)わらず]]、若者(わかもの)が文字(もじ)を読(よ)む量(りょう)は昔(むかし)より増(ふ)えて居(い)ると言(い)う見方(みかた)も有(あ)る。SNSやネットの記事(きじ)、電子書籍(でんししょせき)等(など)、スマホ[[を通(つう)じて]]毎日(まいにち)大量(たいりょう)の文章(ぶんしょう)に触(ふ)れて居(い)るからだ。","zh":"然而，尽管人们都在说远离读书，也有观点认为，年轻人阅读文字的量比过去还要多。因为他们每天都通过手机接触社交媒体、网络文章、电子书等大量文字。"},{"jp":"本屋(ほんや)の店員(てんいん)に聞(き)くと、若(わか)い人(ひと)[[向(む)き]]の小説(しょうせつ)や漫画(まんが)は、今(いま)でも良(よ)く売(う)れて居(い)るそうだ。人気(にんき)作家(さっか)の新刊(しんかん)が出(で)ると、発売日(はつばいび)の朝(あさ)、店(みせ)が開(ひら)く[[か開(ひら)かないかのうちに]]行列(ぎょうれつ)が出来(でき)る事(こと)も有(あ)る。","zh":"问了书店店员，据说适合年轻人的小说和漫画现在依然很畅销。人气作家的新书一出，发售日早上书店刚一开门，就会排起长队。"},{"jp":"但(ただ)し、長(なが)い文章(ぶんしょう)をじっくり読(よ)む力(ちから)が弱(よわ)く成(な)って居(い)ると指摘(してき)する専門家(せんもんか)も居(い)る。短(みじか)い文章(ぶんしょう)許(ばか)り読(よ)んで居(い)ると、難(むずか)しい本(ほん)を一冊(いっさつ)読(よ)み切(き)る何(なん)て出来(でき)[[っこない]]と感(かん)じて仕舞(しま)うのだ。","zh":"不过，也有专家指出，静下心来读长篇文章的能力正在减弱。总读短文的话，就会觉得自己根本不可能读完一整本难懂的书。"},{"jp":"私(わたし)自身(じしん)、忙(いそが)しい時(とき)[[に限(かぎ)って]]本(ほん)を読(よ)みたく成(な)る物(もの)だが、スマホを手(て)に取(と)ると、何時(いつ)の間(ま)にか動画(どうが)を見(み)て居(い)る。時間(じかん)が作(つく)れ[[ないことはない]]のだから、言(い)い訳(わけ)は出来(でき)ない。","zh":"我自己也是，偏偏在忙的时候想看书，可一拿起手机，不知不觉就在看视频了。时间也不是挤不出来，所以没法找借口。"},{"jp":"読書(どくしょ)の良(よ)さは、一冊(いっさつ)の本(ほん)と向(む)き合(あ)い、自分(じぶん)で考(かんが)える時間(じかん)を持(も)てる事(こと)だ。一日(いちにち)十分(じゅっぷん)[[位(くらい)]]なら、誰(だれ)でも本(ほん)を読(よ)む時間(じかん)は作(つく)れる筈(はず)だ。私(わたし)は読(よ)むのが遅(おそ)い[[物(もの)で]]、一冊(いっさつ)に一週間(いっしゅうかん)は掛(か)かるが、それも又(また)楽(たの)しい。仕事(しごと)[[やら]]家事(かじ)やらで忙(いそが)しい毎日(まいにち)だからこそ、紙(かみ)の本(ほん)を開(ひら)く時間(じかん)を大切(たいせつ)にしたい。","zh":"读书的好处，在于能面对一本书，拥有自己思考的时间。一天十分钟左右的话，谁都能挤出读书的时间。我读得慢，一本书要花上一周，但这也是一种乐趣。正因为每天被工作、家务等忙得团团转，我更想珍惜翻开纸质书的时间。"}],"grammar":[["〜と言(い)うと","一说起……；你说的……是指","日本料理(にほんりょうり)[[と言(い)うと]]、寿司(すし)や天麩羅(てんぷら)を思(おも)い浮(う)かべる人(ひと)が多(おお)い。","一说起日本料理，很多人会想到寿司和天妇罗。","「来週(らいしゅう)の会議(かいぎ)」[[と言(い)うと]]、何曜日(なんようび)の事(こと)ですか。","你说的\"下周的会议\"，是指星期几？"],["〜すら","连……都（书面）","疲(つか)れ過(す)ぎて、立(た)つ事(こと)[[すら]]出来(でき)なかった。","累得连站都站不起来。","彼(かれ)は自分(じぶん)の名前(なまえ)[[すら]]漢字(かんじ)で書(か)けない。","他连自己的名字都不会用汉字写。"],["〜にも拘(かか)わらず","尽管……却……","雨(あめ)[[にも拘(かか)わらず]]、大勢(おおぜい)の人(ひと)が集(あつ)まった。","尽管下着雨，还是来了很多人。","彼(かれ)は熱(ねつ)が有(あ)る[[にも拘(かか)わらず]]、会社(かいしゃ)に来(き)た。","他尽管发着烧，还是来了公司。"],["〜を通(つう)じて","通过……","インターネット[[を通(つう)じて]]、世界中(せかいじゅう)の人(ひと)と話(はな)せる。","通过互联网，可以和世界各地的人交谈。","留学(りゅうがく)[[を通(つう)じて]]、多(おお)くの事(こと)を学(まな)んだ。","通过留学学到了很多东西。"],["〜向(む)き","适合……","この料理(りょうり)は辛(から)くないので、子供(こども)[[向(む)き]]だ。","这道菜不辣，适合孩子吃。","この仕事(しごと)は、人(ひと)と話(はな)すのが好(す)きな人(ひと)[[向(む)き]]だ。","这份工作适合喜欢和人打交道的人。"],["〜か〜ないかのうちに","刚一……就……","ベルが鳴(な)る[[か鳴(な)らないかのうちに]]、学生達(がくせいたち)は教室(きょうしつ)を飛(と)び出(だ)した。","铃声刚一响，学生们就冲出了教室。","彼(かれ)は布団(ふとん)に入(はい)る[[か入(はい)らないかのうちに]]、眠(ねむ)って仕舞(しま)った。","他刚钻进被窝就睡着了。"],["〜っこない","根本不可能……（口语）","こんな量(りょう)の仕事(しごと)、一日(いちにち)で終(お)わり[[っこない]]。","这么多工作，一天根本做不完。","宝(たから)くじ何(なん)て、当(あ)たり[[っこない]]よ。","彩票什么的，根本不可能中。"],["〜に限(かぎ)って","偏偏……；唯独……","急(いそ)いで居(い)る時(とき)[[に限(かぎ)って]]、電車(でんしゃ)が遅(おく)れる。","偏偏在着急的时候，电车晚点。","内(うち)の子(こ)[[に限(かぎ)って]]、そんな事(こと)をする筈(はず)が無(な)い。","唯独我家孩子，不可能做那种事。"],["〜ないことはない","也不是不……","辛(から)い物(もの)も、食(た)べられ[[ないことはない]]。","辣的东西也不是不能吃。","一人(ひとり)で行(い)け[[ないことはない]]が、誰(だれ)かと一緒(いっしょ)の方(ほう)が安心(あんしん)だ。","也不是不能一个人去，但和别人一起更放心。"],["〜位(くらい)","至少……，……左右；……那样的程度","自分(じぶん)の部屋(へや)[[位(くらい)]]、自分(じぶん)で掃除(そうじ)しなさい。","至少自己的房间要自己打扫。","挨拶(あいさつ)[[位(くらい)]]は、日本語(にほんご)で出来(でき)る様(よう)に成(な)りたい。","至少打招呼，想能用日语说。"],["〜物(もの)で","因为……（解释原因，口语）","子供(こども)が熱(ねつ)を出(だ)した[[物(もの)で]]、今日(きょう)は休(やす)ませて下(くだ)さい。","因为孩子发烧了，今天请让我休息。","慣(な)れない[[物(もの)で]]、時間(じかん)が掛(か)かって仕舞(しま)いました。","因为不熟悉，花了不少时间。"],["〜やら〜やら","又……又……（列举）","引(ひ)っ越(こ)しの準備(じゅんび)[[やら]]手続(てつづ)き[[やら]]で、目(め)が回(まわ)る程(ほど)忙(いそが)しい。","又是准备搬家又是办手续，忙得团团转。","嬉(うれ)しい[[やら]]恥(は)ずかしい[[やら]]で、言葉(ことば)が出(で)なかった。","又高兴又害羞，说不出话来。"]],"vocab":[["読書離れ","どくしょばなれ","远离读书"],["思い浮かべる","おもいうかべる","想起，浮现"],["半数","はんすう","半数"],["嘆く","なげく","叹息，感叹"],["纏める","まとめる","汇总，整理"],["目立つ","めだつ","显眼"],["叫ぶ","さけぶ","呼喊，大声疾呼"],["触れる","ふれる","接触"],["新刊","しんかん","新书"],["行列","ぎょうれつ","队伍，排队"],["指摘","してき","指出"],["向き合う","むきあう","面对"],["言い訳","いいわけ","借口"],["家事","かじ","家务"]],"short":"読書離れ","lv":2,"sum":"\"年轻人不读书\"是真的吗？从调查、书店和自己的经历来看读书的变化。"},
{"title":"ペットと暮(く)らす責任(せきにん)","paras":[{"jp":"日本(にほん)では、犬(いぬ)や猫(ねこ)を飼(か)って居(い)る世帯(せたい)は全体(ぜんたい)の三割(さんわり)近(ちか)くに上(のぼ)る。一人(ひとり)暮(ぐ)らしの増加(ぞうか)[[に伴(ともな)って]]、ペットを「家族(かぞく)の一員(いちいん)」と考(かんが)える人(ひと)も増(ふ)えて来(き)た。","zh":"在日本，养狗或养猫的家庭接近总数的三成。随着独居人数的增加，把宠物当作\"家庭一员\"的人也多了起来。"},{"jp":"然(しか)し、ペットを飼(か)う[[からには]]、最後(さいご)迄(まで)責任(せきにん)を持(も)たなければ成(な)らない。犬(いぬ)の寿命(じゅみょう)は十五年(じゅうごねん)前後(ぜんご)で、猫(ねこ)は二十年(にじゅうねん)近(ちか)く生(い)きる事(こと)も有(あ)る。可愛(かわい)い[[からと言(い)って]]、軽(かる)い気持(きも)ちで飼(か)い始(はじ)める[[可(べ)きではない]]。","zh":"但是，既然养了宠物，就必须负责到最后。狗的寿命在十五年左右，猫有时能活将近二十年。不能因为可爱，就抱着随便的心态开始养。"},{"jp":"実際(じっさい)、引(ひ)っ越(こ)しや飼(か)い主(ぬし)の高齢化(こうれいか)等(など)を理由(りゆう)に、ペットを手放(てばな)す人(ひと)は後(あと)を絶(た)たない。飼(か)い主(ぬし)の勝手(かって)な都合(つごう)で捨(す)てられる動物(どうぶつ)が居(い)る[[一方(いっぽう)で]]、保護施設(ほごしせつ)はどこも満員(まんいん)の状態(じょうたい)だ。","zh":"实际上，以搬家、主人年老等为理由放弃宠物的人接连不断。一边是因主人自私的理由被抛弃的动物，另一边是各地的收容机构都已满员。"},{"jp":"飼(か)う前(まえ)には、住(す)まいがペット可(か)かどうか[[は元(もと)より]]、毎月(まいつき)の餌代(えさだい)や病院代(びょういんだい)も確認(かくにん)して置(お)く必要(ひつよう)が有(あ)る。病気(びょうき)に成(な)れば、治療費(ちりょうひ)が数十万円(すうじゅうまんえん)に成(な)る事(こと)も珍(めずら)しくない。実際(じっさい)に一緒(いっしょ)に暮(く)らして見(み)[[ないことには]]、どれ程(ほど)御(お)金(かね)と時間(じかん)が掛(か)かるのか分(わ)からない物(もの)だ。","zh":"养之前，住处能不能养宠物自不必说，每月的饲料费、看病费也得事先确认。一旦生病，治疗费达到几十万日元也不稀奇。不真正一起生活，就不知道要花多少钱和时间。"},{"jp":"又(また)、ペットは飼(か)い主(ぬし)の生活(せいかつ)リズム[[に応(おう)じて]]健康状態(けんこうじょうたい)も変(か)わる。散歩(さんぽ)を怠(おこた)ると、犬(いぬ)はストレスで無駄吠(むだぼ)えをする様(よう)に成(な)り、近所(きんじょ)とのトラブルに成(な)り[[兼(か)ねない]]。","zh":"另外，宠物的健康状况也会随主人的生活节奏而变化。如果偷懒不遛狗，狗会因为压力而乱叫，可能会和邻居闹出矛盾。"},{"jp":"最近(さいきん)では、ペットと一緒(いっしょ)に泊(と)まれるホテルや、ペット[[向(む)け]]の保険(ほけん)も増(ふ)えて居(い)る。こうしたサービスを上手(じょうず)に利用(りよう)した[[上(うえ)で]]、自分(じぶん)の生活(せいかつ)に無理(むり)が無(な)いかを考(かんが)える事(こと)が大切(たいせつ)だ。","zh":"最近，能和宠物一起入住的酒店以及面向宠物的保险也在增加。在好好利用这些服务的基础上，考虑自己的生活是否勉强，这一点很重要。"},{"jp":"私(わたし)自身(じしん)、猫(ねこ)を飼(か)っ[[て初(はじ)めて]]、命(いのち)を預(あず)かる事(こと)の重(おも)さを知(し)った。言葉(ことば)が通(つう)じない[[丈(だけ)に]]、小(ちい)さな変化(へんか)を見逃(みのが)さない様(よう)に気(き)を付(つ)けて居(い)る。ペットとの暮(く)らしが幸(しあわ)せな物(もの)に成(な)るかどうかは、飼(か)い主(ぬし)の心構(こころがま)え[[次第(しだい)だ]]。","zh":"我自己也是养了猫之后，才知道照顾一条生命的分量有多重。正因为语言不通，我一直留心不放过它细小的变化。和宠物的生活能否幸福，取决于主人的心态。"}],"grammar":[["〜に伴(ともな)って","随着……","人口(じんこう)の増加(ぞうか)[[に伴(ともな)って]]、住宅(じゅうた
